[module]
id = "courrier"
nom = "Courrier"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Boîtes, IMAP, brouillons, mandats d'envoi, médias."
confiance = "interne"
famille = "gestion"
requiert = ["droits"]

[[droits]]
id = "gerer"
libelle = "Gérer les mandats et les boîtes d'autres comptes"
sensible = true

[[reglages]]
id = "courrier_passe_s"
libelle = "Fréquence de la passe courrier (secondes)"
type = "entier"
defaut = 300
portee = "global"
minimum = 60

[[reglages]]
id = "courrier_corps_max"
libelle = "Taille maximale des corps conservés (octets)"
type = "entier"
defaut = 60000
portee = "global"

[[objets]]
type = "mail"
libelle = "Un courrier électronique"

[[objets]]
type = "mandat"
libelle = "Un mandat d'envoi de masse"

[[objets]]
type = "contact"
libelle = "Un contact du carnet d'adresses"

[evenements]
emet = [
  "mail.boite_enregistree",
  "mail.nouveau", 
  "mail.envoye", 
  "mandat.cree", 
  "mandat.envoye"
]
ecoute = []

[[moteurs]]
id = "passe_courrier"
libelle = "Synchronisation de la boîte IMAP et récupération des corps"
mode = "periodique"
toutes_les_s = 300
duree_max_s = 60

[[moteurs]]
id = "messages_tick"
libelle = "Envoi des brouillons programmés"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 30

[[moteurs]]
id = "mandat_tick"
libelle = "Exécution des mandats d'envoi de masse"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 120

[[capacites]]
id = "etat"
libelle = "État de la boîte mail (compteurs, dossiers)"
risque = "lecture"

[[capacites]]
id = "enregistrer"
libelle = "Enregistrer les identifiants IMAP/SMTP"
risque = "eleve"
perimetre = ["le coffre du compte"]
preuve = "relire que les identifiants sont au coffre"
retour = "supprimer les identifiants du coffre"
paliers = ["auto"]
qui = ["humain", "compte"]
masque = ["pwd", "smtp_pwd"]

[[capacites]]
id = "detacher"
libelle = "Détacher la boîte mail du coffre"
risque = "eleve"
perimetre = ["le coffre du compte"]
preuve = "vérifier l'absence dans le coffre"
retour = "restaurer les identifiants"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "dossiers"
libelle = "Lister les dossiers IMAP"
risque = "lecture"

[[capacites]]
id = "rechercher"
libelle = "Rechercher des courriers dans un dossier"
risque = "lecture"

[[capacites]]
id = "marquer"
libelle = "Marquer des courriers (lu, suivi, etc.)"
risque = "faible"
perimetre = ["les drapeaux IMAP et le cache local"]
preuve = "relire l'état IMAP"
retour = "inverser le drapeau"
paliers = ["auto"]
qui = ["humain", "compte", "cassandra"]

[[capacites]]
id = "supprimer"
libelle = "Supprimer ou archiver des courriers"
risque = "moyen"
perimetre = ["le dossier IMAP et le cache local"]
preuve = "vérifier le déplacement vers la corbeille"
retour = "restaurer depuis la corbeille"
paliers = ["raconter", "maitre"]
qui = ["humain", "compte", "cassandra"]

[permissions]
stockage = true
droits = true
introspection = true
