[module]
id = "memoire"
nom = "Mémoire"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Mémoires, graphe de connaissances, chaîne d'intégrité, leçons."
confiance = "interne"
famille = "gestion"
requiert = ["droits", "comptes"]

[[droits]]
id = "ecrire"
libelle = "Écrire dans la mémoire"
defaut = true

[[droits]]
id = "gerer"
libelle = "Gérer les mémoires des autres comptes et de l'instance"
sensible = true

[[objets]]
type = "memoire"
libelle = "Un fait mémorisé"
[[objets]]
type = "doute"
libelle = "Un doute mémoriel"
[[objets]]
type = "rappel"
libelle = "Un rappel conditionnel"
[[objets]]
type = "episode"
libelle = "Un épisode de conversation"
[[objets]]
type = "postmortem"
libelle = "Un post-mortem d'incident"

[evenements]
emet = ["memoire.ecrite", "memoire.expiree", "memoire.oubliee", "memoire.restauree", "memoire.doute_resolu"]
ecoute = ["constat.ouvert"]

[[moteurs]]
id = "chaine_veille"
libelle = "Veille sur la chaîne d'intégrité"
mode = "periodique"
toutes_les_s = 3600
duree_max_s = 60

[[moteurs]]
id = "rappels_evaluer"
libelle = "Évalue les rappels sur les métriques"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 30

[[moteurs]]
id = "episodes_fermer"
libelle = "Ferme les épisodes échus"
mode = "periodique"
toutes_les_s = 900
duree_max_s = 30

[[capacites]]
id = "lister"
libelle = "Lister les mémoires actives"
risque = "lecture"

[[capacites]]
id = "rappeler"
libelle = "Rappeler les mémoires pertinentes pour une question"
risque = "lecture"

[[capacites]]
id = "ecrire"
libelle = "Écrire ou mettre à jour un fait"
risque = "moyen"
droit = "ecrire"
perimetre = ["la table memoires, insertion ou mise à jour, et memoire_journal"]
preuve = "relire la mémoire active"
retour = "désactiver la mémoire ajoutée ou restaurer l'ancienne version"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "expirer"
libelle = "Expirer un fait"
risque = "faible"
droit = "ecrire"
perimetre = ["la table memoires : change le statut à expire"]
preuve = "relire le statut de la mémoire"
retour = "remettre le statut à actif"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "oublier"
libelle = "Oublier un fait (identique à expirer avec raison)"
risque = "faible"
droit = "ecrire"
perimetre = ["la table memoires : change le statut à expire"]
preuve = "relire le statut de la mémoire"
retour = "remettre le statut à actif"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "restaurer"
libelle = "Restaurer un fait expiré"
risque = "faible"
droit = "ecrire"
perimetre = ["la table memoires : change le statut à actif"]
preuve = "relire le statut de la mémoire"
retour = "remettre le statut à expire"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "postmortem_save"
libelle = "Enregistrer un brouillon de post-mortem"
risque = "moyen"
droit = "ecrire"
perimetre = ["la table postmortems : insertion"]
preuve = "relire le post-mortem inséré"
retour = "supprimer le post-mortem inséré"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[permissions]
stockage = true
droits = true
introspection = true
