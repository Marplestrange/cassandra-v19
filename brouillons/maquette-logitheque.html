<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Maquette Logithèque</title>
<style>
:root{
  --bg:#eef3f2;--surface:rgba(255,255,255,.72);--solid:#fff;--line:rgba(15,40,38,.11);--line2:rgba(15,40,38,.2);
  --txt:#14302d;--strong:#0b211f;--soft:#4b6663;--faint:#7d9390;
  --accent:#0f766e;--on-accent:#fff;--ok:#0e7a55;--warn:#a35f00;--danger:#b3261e;--info:#2456a6;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 8px 28px -14px rgba(15,60,56,.28);
  --mono:ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1816;--surface:rgba(24,44,41,.7);--solid:#16302c;--line:rgba(190,240,230,.12);--line2:rgba(190,240,230,.24);
  --txt:#d6ebe7;--strong:#f0fbf8;--soft:#9cbab5;--faint:#6f8f8a;--accent:#2dd4bf;--on-accent:#04201c;--ok:#4ade80;--warn:#f5b042;--danger:#ff7b72;--info:#7db4ff;
  --shadow:0 8px 28px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1816;--surface:rgba(24,44,41,.7);--solid:#16302c;--line:rgba(190,240,230,.12);--line2:rgba(190,240,230,.24);
  --txt:#d6ebe7;--strong:#f0fbf8;--soft:#9cbab5;--faint:#6f8f8a;--accent:#2dd4bf;--on-accent:#04201c;--ok:#4ade80;--warn:#f5b042;--danger:#ff7b72;--info:#7db4ff;
  --shadow:0 8px 28px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 'Inter',system-ui,sans-serif;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;padding-top:18px}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
/* ── rail ── */
.rail{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:860px){.rail{position:static;max-height:none}.rail nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}.rail nav .sep{display:none}.rail .id{display:none}}
.marque{display:flex;gap:10px;align-items:center;padding:4px 6px}
.marque .logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.marque .logo svg{width:22px;height:22px}
.marque b{font:700 17px/1.1 'Inter',sans-serif;color:var(--strong);display:block}.marque small{color:var(--faint);font-size:11.5px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail .sep{font:600 10.5px/1 'Inter',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:12px 10px 4px}
.nv{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--soft);font-weight:550;white-space:nowrap}
.nv:hover{background:color-mix(in srgb,var(--accent) 8%,transparent);color:var(--txt)}
.nv.on{background:var(--solid);color:var(--accent);box-shadow:var(--shadow)}
.nv svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nv .n{margin-left:auto;font:600 11px var(--mono);background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-radius:999px;padding:1px 7px}
.nv .n.dg{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.rail .id{font-size:11.5px;color:var(--faint);padding:8px 10px;border-top:1px solid var(--line)}
/* ── page ── */
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.top .t{flex:1 1 260px;min-width:0}
.top h1{font:650 25px/1.15 'Inter',sans-serif;color:var(--strong);text-wrap:balance}
.top p{color:var(--soft);margin-top:3px;max-width:68ch}
.recherche{flex:1 1 240px;max-width:340px;display:flex;gap:8px;align-items:center;background:var(--solid);border:1px solid var(--line2);border-radius:11px;padding:0 10px;color:var(--faint)}
.recherche svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.recherche input{flex:1;min-width:0;border:0;background:transparent;color:var(--txt);padding:9px 0;font:14px 'Inter',sans-serif;outline:0}
.recherche kbd{font:600 10.5px var(--mono);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.btn{border:1px solid var(--line2);background:var(--solid);color:var(--txt);border-radius:10px;padding:7px 14px;font:600 13px 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}.btn.pri:hover:not([disabled]){color:var(--on-accent);filter:brightness(1.08)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.mini{padding:4px 10px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.carte{background:var(--surface);backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.carte.clic{cursor:pointer;transition:border-color .12s}.carte.clic:hover{border-color:var(--accent)}
.carte h3{font:650 15px/1.25 'Inter',sans-serif;color:var(--strong)}
.carte h4{font:650 13.5px 'Inter',sans-serif;color:var(--strong)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.note{font-size:12.5px;color:var(--soft)}.mono{font-family:var(--mono)}.faint{color:var(--faint)}
.p{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 8px;font:600 11px/1.2 'Inter',sans-serif;background:color-mix(in srgb,var(--soft) 10%,transparent);color:var(--soft);white-space:nowrap}
.p svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}.p.al{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.p.dg{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}.p.ac{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.p.in{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}.p.vi{background:var(--strong);color:var(--bg)}
.nouveau{font:700 9.5px/1 'Inter',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);border-radius:5px;padding:3px 5px;vertical-align:2px;margin-left:6px}
.conception{display:none;font-size:12.5px;color:var(--info);background:color-mix(in srgb,var(--info) 9%,transparent);border-left:3px solid var(--info);border-radius:4px 10px 10px 4px;padding:8px 12px}
body.annot .conception{display:block}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.stat:hover{border-color:var(--accent)}.stat b{font:650 26px/1.1 var(--mono);color:var(--strong)}.stat span{font-size:12.5px;color:var(--soft)}
.stat.al b{color:var(--warn)}.stat.dg b{color:var(--danger)}.stat.ok b{color:var(--ok)}
/* listes */
.liste{display:flex;flex-direction:column}.liste>.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}.liste>.li:first-child{border-top:0}
.li .sp{flex:1;min-width:180px}.li .sp b{color:var(--strong)}.li .sp .note{display:block}
.ico{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.off{background:var(--line);color:var(--faint)}.ico.sm{width:30px;height:30px;border-radius:9px}.ico.sm svg{width:16px;height:16px}
.ico.dg{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}.ico.al{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.sw{position:relative;width:38px;height:22px;flex:none;border-radius:999px;border:0;background:var(--line2);cursor:pointer;transition:background .15s;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(16px)}.sw[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:600 12.5px 'Inter',sans-serif;color:var(--soft);cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}.chip span{opacity:.65;margin-left:3px}
.barre{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--solid)}
.seg button{border:0;background:transparent;padding:6px 12px;font:600 12.5px 'Inter',sans-serif;color:var(--soft);cursor:pointer}.seg button.on{background:var(--accent);color:var(--on-accent)}
.mod .l1{display:flex;gap:11px;align-items:center}.mod .l1 .sp{flex:1;min-width:0}.mod h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod .desc{font-size:12.5px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mod .pied{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:9px;border-top:1px solid var(--line)}
.mod.off{opacity:.82}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar.al i{background:var(--warn)}.bar.dg i{background:var(--danger)}
.alerte{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:10px 14px;background:var(--surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alerte.dg{border-left-color:var(--danger)}.alerte.al{border-left-color:var(--warn)}.alerte.ok{border-left-color:var(--ok)}.alerte.in{border-left-color:var(--info)}
.alerte .sp{flex:1;min-width:220px}.alerte b{color:var(--strong)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font:600 11px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}.tw{overflow-x:auto}
.cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font:700 12px var(--mono)}.cell.o{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.cell.v{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}.cell.z{color:var(--faint)}
.champ{display:flex;flex-direction:column;gap:5px}.champ label{font:600 12px 'Inter',sans-serif;color:var(--soft)}
.champ input,.champ select,.champ textarea{border:1px solid var(--line2);background:var(--solid);color:var(--txt);border-radius:10px;padding:8px 11px;font:14px 'Inter',sans-serif;min-width:0;width:100%}
.champ input:focus,.champ select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:1px}
.reglage{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.reglage:first-child{border-top:0}.reglage .sp{flex:1;min-width:0}.reglage .sp b{color:var(--strong);display:block}
.radio{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.radio.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.radio i{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);margin-top:3px}.radio.on i{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.radio.dgr.on{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
.tl{position:relative;padding-left:20px;display:flex;flex-direction:column;gap:12px}.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative}.tl .ev::before{content:'';position:absolute;left:-19px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl .ev.dg::before{background:var(--danger)}.tl .ev.al::before{background:var(--warn)}
pre{margin:0;background:color-mix(in srgb,var(--strong) 6%,transparent);border-radius:10px;padding:11px 13px;font:12px/1.55 var(--mono);overflow-x:auto;color:var(--txt)}
.heros{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.hero{border-radius:18px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;gap:8px;min-height:140px;position:relative;overflow:hidden}
.hero h3{font:700 20px/1.2 'Inter',sans-serif;color:#fff;text-wrap:balance}.hero p{opacity:.9;max-width:46ch;font-size:13px}.hero .btn{align-self:flex-start;margin-top:auto;border-color:transparent;color:#0b211f;background:#fff}
.hero.h1{background:linear-gradient(135deg,#0f766e,#14532d)}.hero.h2{background:linear-gradient(135deg,#1e3a8a,#0f766e)}
.hero svg.fond{position:absolute;right:-14px;bottom:-18px;width:150px;height:150px;fill:none;stroke:rgba(255,255,255,.16);stroke-width:1.4}
/* tiroir + modale */
.voile{position:fixed;inset:0;background:rgba(5,20,18,.42);backdrop-filter:blur(3px);z-index:50;display:none}
.voile.on{display:block}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line2);z-index:51;display:none;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
.tiroir.on{display:flex}
.tiroir .tete{padding:18px 20px 0;display:flex;flex-direction:column;gap:12px}
.tiroir .corps{padding:16px 20px 24px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.onglets{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}.onglets button{border:0;background:transparent;padding:9px 12px;font:600 13px 'Inter',sans-serif;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.onglets button.on{color:var(--accent);border-bottom-color:var(--accent)}
.modale{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--bg);border:1px solid var(--line2);border-radius:18px;z-index:52;display:none;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);padding:20px;flex-direction:column;gap:14px}
.modale.on{display:flex}
.etapes{display:flex;gap:6px}.etapes i{flex:1;height:4px;border-radius:99px;background:var(--line)}.etapes i.on{background:var(--accent)}
.liste .li.lib{font:600 10.5px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.lib{font:600 10.5px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:var(--bg);border:1px solid var(--line2);border-radius:16px;z-index:60;display:none;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.pal.on{display:block}.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font:15px 'Inter',sans-serif;color:var(--txt);outline:0}
.pal .r{padding:8px 10px;display:flex;flex-direction:column}.pal .r button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center}.pal .r button:hover,.pal .r button:first-child{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pal small{margin-left:auto;color:var(--faint)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--strong);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:70;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.impact{position:sticky;bottom:12px;background:var(--strong);color:var(--bg);border-radius:14px;padding:11px 16px;display:none;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 14px 40px -12px rgba(0,0,0,.5);z-index:20}
.impact.on{display:flex}.impact .sp{flex:1;min-width:200px}.impact .btn{border-color:transparent}
.graphe{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center}.noeud{border:1px solid var(--line2);background:var(--solid);border-radius:9px;padding:4px 10px;font:600 12px var(--mono)}.noeud.v{border-color:var(--danger);color:var(--danger)}.fl{color:var(--faint)}
.pourquoi{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;color:var(--info);margin-top:2px}.pourquoi svg{width:13px;height:13px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.simul{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px dashed var(--line2);border-radius:12px;font-size:11.5px;color:var(--faint)}
.simul label{font:600 10.5px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase}.simul select{border:1px solid var(--line2);background:var(--solid);color:var(--txt);border-radius:8px;padding:5px 8px;font:12px 'Inter',sans-serif;width:100%}
@media(max-width:860px){.simul{display:none}}
.travail .bar{margin-top:6px}.etapes-l{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:12.5px;color:var(--soft)}.etapes-l .ok{color:var(--ok)}.etapes-l .now{color:var(--strong);font-weight:600}
.accueil{display:flex;flex-direction:column;gap:14px;align-items:flex-start;padding:22px}.accueil h2{font:700 24px/1.2 'Inter',sans-serif;color:var(--strong);margin:0;text-wrap:balance}
.cap{aspect-ratio:16/10;border:1px dashed var(--line2);border-radius:12px;display:grid;place-items:center;color:var(--faint);font-size:12px;background:color-mix(in srgb,var(--soft) 5%,transparent);text-align:center;padding:8px}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.vide-etat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 10px;text-align:center;color:var(--strong)}.vide-etat svg{width:30px;height:30px;fill:none;stroke:var(--ok);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.courriel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--solid);display:flex;flex-direction:column;gap:2px;font-size:13px}
.choix{text-align:left;cursor:pointer;position:relative;font:inherit;color:inherit;gap:6px}.choix .coche{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent}
.choix .coche svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.choix.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.choix.on .coche{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.choix:hover{border-color:var(--accent)}
.reine{border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.demande{display:flex;gap:8px}.demande input{flex:1;min-width:0;border:1px solid var(--line2);background:var(--solid);color:var(--txt);border-radius:11px;padding:10px 13px;font:14px 'Inter',sans-serif}

/* ───────── utilitaires ───────── */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
const pill=(t,c='',i='')=>`<span class="p ${c}">${i?ic(i):''}${esc(t)}</span>`;
const niveau=m=>m.revoque?pill('Révoqué','dg','warn'):m.src==='officiel'?pill('Officiel','ok','shield'):m.niv==='verifie'?pill('Éditeur vérifié · '+m.ed,'ac','shield'):pill('Clé de l’administrateur','');
const permRes=p=>[['Réseau',p.res],['Écritures',p.ecr],['Privilèges',p.priv]].map(([n,v])=>`<span class="p ${v>=3?'al':''}">${n} ${v}</span>`).join('');
const conc=t=>`<div class="conception"><b>Conception.</b> ${t}</div>`;
const tete=(t,d,act='')=>`<div class="top"><div class="t"><h1>${t}</h1><p>${d}</p></div>${act}</div>`;
const imp_=m=>`<span class="faint" style="font:600 11px 'Inter',sans-serif">${IMP[m.imp][0]}</span>`;

function filtres(){return M.filter(m=>(S.sim!=='neuve'||m.imp==='vital')&&(S.fam==='toutes'||m.fam===S.fam)&&(S.etat==='tous'||(S.etat==='actif'&&m.on)||(S.etat==='inactif'&&!m.on)||(S.etat==='maj'&&m.maj)||(S.etat==='alerte'&&(m.revoque||m.err>1)))&&(S.imp==='toutes'||m.imp===S.imp)&&(!S.q||(m.nom+m.id+m.desc).toLowerCase().includes(S.q.toLowerCase())))}

/* ───────── cartes ───────── */
function carteMod(m){
  const att=S.att[m.id]!==undefined,etat=att?S.att[m.id]:m.on;
  return `<div class="carte mod clic ${etat?'':'off'}" data-ouvrir="${m.id}" style="${att?'border-color:var(--warn)':''}">
   <div class="l1"><div class="ico ${etat?'':'off'}">${ic(m.ic)}</div><div class="sp"><h3>${esc(m.nom)}</h3><div class="mono note">${m.id} · v${m.v}</div></div>
   ${S.avance?`<button class="sw ${etat?'on':''}" data-bascule="${m.id}" ${m.imp==='vital'?'disabled title="Vital : ne se désactive pas"':''} aria-label="Activer ${esc(m.nom)}"></button>`:pill(etat?'actif':'inactif',etat?'ok':'')}</div>
   <div class="desc">${esc(m.desc)}</div>
   <div class="pied">${niveau(m)}${imp_(m)}${m.verrou?pill('verrouillé','','lock'):''}${m.maj?pill('MAJ '+m.maj,'in','maj'):''}${m.err>1&&etat?pill(m.err+' erreurs','dg'):''}${att?pill('en attente','al'):''}</div></div>`;
}
function ligneMod(m){
  const att=S.att[m.id]!==undefined,etat=att?S.att[m.id]:m.on;
  return `<div class="li" data-ouvrir="${m.id}" style="cursor:pointer"><div class="ico sm ${etat?'':'off'}">${ic(m.ic)}</div><div class="sp"><b>${esc(m.nom)}</b><span class="note">${esc(m.desc)}</span></div>${niveau(m)}${imp_(m)}<span class="mono note">v${m.v}</span>${S.avance?`<button class="sw ${etat?'on':''}" data-bascule="${m.id}" ${m.imp==='vital'?'disabled':''}></button>`:pill(etat?'actif':'inactif',etat?'ok':'')}</div>`;
}

vue(){

  const act=M.filter(m=>m.on).length,maj=M.filter(m=>m.maj).length,err=M.reduce((a,m)=>a+m.err,0);
  const NIV={observer:['Observer','Je regarde et je te raconte ce que je ferais. Je ne touche à rien.'],entretien:['Entretien','Je retire ce qui est révoqué, je prends les mises à jour sans permission en plus, je mets en pause ce qui échoue.'],reine:['Reine','Je gère tout : j’ajoute, je mets à jour, je retire, j’active. Tu n’as rien à faire.']};

   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="passe">Lancer une passe</button><button class="btn ${S.gel?'pri':''}" data-act="gel">${S.gel?'Reprendre':'Mettre en pause'}</button></div></div>
   <div class="demande"><input id="dem" placeholder="Demander à Cassandra : « installe Sentinelle du disque », « qu’est-ce qui ne va pas ? »…" aria-label="Demander à Cassandra"><button class="btn pri" data-act="demande">Demander</button></div>
   <div class="chips"><button class="chip" data-sug="Installe le pare-feu CrowdSec">Installe le pare-feu CrowdSec</button><button class="chip" data-sug="Qu’est-ce qui consomme le plus ?">Qu’est-ce qui consomme le plus ?</button><button class="chip" data-sug="Mets tout à jour">Mets tout à jour</button></div></div>`+
  `<div class="stats"><div class="stat ok" data-go="inst"><b>${act}/${M.length}</b><span>modules actifs</span></div><div class="stat" data-go="maj"><b>${maj}</b><span>mises à jour en attente</span></div><div class="stat ${err>5?'al':'ok'}" data-go="sante"><b>${err}</b><span>erreurs sur 24 h</span></div><div class="stat" data-go="src"><b>59 j</b><span>validité de l’index officiel</span></div></div>`+
  `<div class="carte"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h3>Ce que Cassandra a fait</h3><span class="note">Chaque ligne se défait en un clic. Rien n’est effacé pour de bon : un module retiré reste 30 jours en corbeille.</span></div>
   <div class="liste">${ACTES.slice(0,4).map((a,i)=>recitLi(a,i)).join('')}</div><button class="btn mini" data-go="jour" style="align-self:flex-start">Voir tout le journal</button></div>`+
  `<div class="g2"><div class="carte"><h3>Jusqu’où Cassandra va seule</h3><div style="display:flex;flex-direction:column;gap:8px">${Object.entries(NIV).map(([k,v])=>`<div class="radio ${S.auto===k?'on':''}" data-auto="${k}"><i></i><div><b style="color:var(--strong)">${v[0]}${k==='reine'?' <span class="p ok">actuel par défaut</span>':''}</b><span class="note" style="display:block">${v[1]}</span></div></div>`).join('')}</div><p class="note">Quel que soit le niveau : elle n’installe que le registre officiel et les éditeurs vérifiés, jamais un module révoqué, jamais un module vital désactivé.</p><p class="note">Ce niveau est un <b>plafond</b> que tu fixes. L’autonomie qu’elle gagne geste par geste, par les preuves, se suit dans <a href="#" data-act="evolution" style="color:var(--accent);font-weight:600">Évolution › Autonomie</a>.</p></div>
   <div class="carte"><h3>Ce que je n’ai pas fait seule, et pourquoi</h3><div class="liste"><div class="li"><div class="sp"><b>Billetterie 0.5.0</b><span class="note">Éditeur vérifié (lagrange) : + réseau : api.stripe.com. Je ne prends jamais seule plus de permissions chez un tiers. Dis-le-moi si tu veux qu'elle passe.</span></div><button class="btn mini" data-sug="Mets Billetterie à jour">Le lui demander</button></div></div>
   <p class="note">Ce n’est pas une file d’attente : je continue sans ton accord. Cette liste dit seulement ce que ma règle m’a fait laisser de côté.</p></div></div>`;

inst(){
  const l=filtres(),n=k=>M.filter(m=>k(m)).length;
  const fams=Object.entries(FAM).filter(([k])=>M.some(m=>m.fam===k));
  return tete('Installés','Tout ce qui tourne sur cette instance, avec ce qui s’arrête si tu le coupes.',`<div class="seg"><button class="${S.vue==='grille'?'on':''}" data-vue="grille">Cartes</button><button class="${S.vue==='liste'?'on':''}" data-vue="liste">Liste</button></div><button class="btn ${S.avance?'pri':''}" data-act="avance" title="Affiche les interrupteurs et les boutons de retrait. Cassandra sait tout ce que tu fais.">Mode avancé : ${S.avance?'oui':'non'}</button>`)+
  conc('Reprend la page « Modules et applications » actuelle. Nouveau : <b>rangés par famille</b> (sections repliables), vue liste dense, filtre « en alerte », impact des changements affiché dans une barre flottante avant d’appliquer.')+
  `<div class="barre"><div class="recherche" style="flex:1 1 260px;max-width:none">${ic('eye')}<input id="q" placeholder="Rechercher parmi les modules installés…" value="${esc(S.q)}"></div>
   <select class="sel" data-sel="fam" aria-label="Famille"><option value="toutes">Toutes les familles</option>${fams.map(([k,v])=>`<option value="${k}" ${S.fam===k?'selected':''}>${v}</option>`).join('')}</select>
   <select class="sel" data-sel="imp" aria-label="Importance">${[['toutes','Toutes les importances'],['vital','Vital'],['important','Important'],['optionnel','Optionnel']].map(c=>`<option value="${c[0]}" ${S.imp===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
   ${(S.fam!=='toutes'||S.imp!=='toutes'||S.etat!=='tous'||S.q)?'<button class="btn mini" data-reset>Réinitialiser</button>':''}</div>
  <div class="seg segetat">${[['tous','Tous',M.length],['actif','Actifs',n(m=>m.on)],['inactif','Inactifs',n(m=>!m.on)],['maj','À mettre à jour',n(m=>m.maj)],['alerte','En alerte',n(m=>m.revoque||m.err>1)]].map(c=>`<button class="${S.etat===c[0]?'on':''}" data-etat="${c[0]}">${c[1]} <span class="cnt">${c[2]}</span></button>`).join('')}</div>`+
  (l.length?Object.entries(FAM).filter(([k])=>l.some(m=>m.fam===k)).map(([k,v])=>{const g=l.filter(m=>m.fam===k),ouv=!S.rep.has(k);return `<section class="rub"><button class="rub-t" data-rep="${k}" aria-expanded="${ouv}"><span class="ico sm">${ic(FIC[k])}</span><h3>${v}</h3><span class="p">${g.length}</span><span class="note">${g.filter(m=>m.on).length} actif(s)</span><svg class="chev ${ouv?'':'ferme'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>${ouv?(S.vue==='grille'?`<div class="grille">${g.map(carteMod).join('')}</div>`:`<div class="carte"><div class="liste">${g.map(ligneMod).join('')}</div></div>`):''}</section>`}).join(''):`<div class="carte note" style="text-align:center;padding:30px">Aucun module ne correspond.</div>`)+
  `<div class="impact" id="impact"></div>`;
},
mes(){
  const l=M.filter(m=>m.usr&&m.on);
  return tete('Mes applications','Les applications que Cassandra a mises à ta disposition. Tu choisis celles qui apparaissent dans ton menu.')+
  conc('<b>Vue d’un compte non administrateur.</b> Il ne voit ni modules, ni registre, ni permissions : seulement ses applications. Pas de gestion, donc rien à casser. Il ne valide rien : s’il lui manque quelque chose, il le dit à Cassandra, qui décide.')+
  `<div class="grille">${l.map(m=>`<div class="carte mod"><div class="l1"><div class="ico">${ic(m.ic)}</div><div class="sp"><h3>${esc(m.nom)}</h3></div></div><div class="desc">${esc(m.desc)}</div><div class="pied"><button class="btn mini pri">Ouvrir</button><label class="note" style="margin-left:auto;display:flex;gap:8px;align-items:center">Dans mon menu <button class="sw ${S.menu.has(m.id)?'on':''}" data-menu="${m.id}" aria-label="Dans mon menu"></button></label></div></div>`).join('')}</div>
  <div class="carte"><h3>Il te manque quelque chose ?</h3><p class="note">Dis-le à Cassandra, avec tes mots. Elle décide et te répond : tu n’as rien à valider.</p><div class="demande"><input id="dem" placeholder="« Je voudrais gérer mes factures »" aria-label="Demander une application à Cassandra"><button class="btn pri" data-act="demande">Demander</button></div></div>`;
},
maj(){
  const l=S.sim==='vide'||S.sim==='neuve'?[]:M.filter(m=>m.maj);
  const prise=m=>!(m.majPerm&&m.majPerm.length);
  return tete('Mises à jour','Cassandra prend seule celles que sa règle permet, dans ta fenêtre de maintenance. Tu vois ce qui vient, et ce qu’elle laisse de côté.',`<button class="btn" data-act="passe">Lancer une passe maintenant</button>`)+
  conc('<b>Réaligné sur l’autonomie.</b> Plus de « Tout mettre à jour » ni de « Accepter » : ce n’est pas à l’utilisateur de valider. La page dit ce que Cassandra va faire, quand, et pourquoi elle laisse certaines de côté. L’utilisateur garde la voie parallèle : « Maintenant » ou « Pas cette version ».')+
  `<div class="carte"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h3>Ce qui vient</h3><span class="note">Prochaine passe : cette nuit, ${FENETRES[S.fenetre]}.</span></div>${l.length?'':`<div class="vide-etat">${ic('check')}<b>Tout est à jour.</b><span class="note">Dernière vérification il y a 2 h. Prochaine passe cette nuit, ${FENETRES[S.fenetre]}.</span></div>`}<div class="liste">${l.map(m=>prise(m)?`<div class="li"><div class="ico sm">${ic(m.ic)}</div><div class="sp"><b>${m.nom}</b> <span class="mono note">${m.v} → ${m.maj}</span><span class="note">Cassandra la prend cette nuit.</span><span class="pourquoi">${ic('eye')}Sans permission en plus, source ${m.src==='officiel'?'officielle':'éditeur vérifié ('+m.ed+')'}. Surveillée 15 minutes, remise en arrière toute seule si elle tourne mal.</span></div>${pill('cette nuit','ok','check')}<button class="btn mini" data-act="maj1" data-id="${m.id}">Maintenant</button><button class="btn mini" data-act="pascette" data-id="${m.id}">Pas cette version</button></div>`:`<div class="li"><div class="ico sm al">${ic(m.ic)}</div><div class="sp"><b>${m.nom}</b> <span class="mono note">${m.v} → ${m.maj}</span><span class="note">Laissée de côté, ce n’est pas une attente.</span><span class="pourquoi">${ic('eye')}Éditeur vérifié (${m.ed}) : ${m.majPerm.join(', ')}. Je ne prends jamais seule plus de permissions chez un tiers, à aucun niveau.</span></div>${pill('laissée de côté','al','eye')}<button class="btn mini" data-sug="Mets ${esc(m.nom)} à jour">Le lui demander</button></div>`).join('')}</div></div>`+
  `<div class="g2"><div class="carte"><h3>Quand</h3>
    <div class="reglage"><div class="sp"><b>Fenêtre de maintenance</b><span class="note">Cassandra n’applique rien en dehors.</span></div><select class="sel" data-sel="fenetre">${FENETRES.map((f,i)=>`<option value="${i}" ${S.fenetre===i?'selected':''}>${f}</option>`).join('')}</select></div>
    <div class="reglage"><div class="sp"><b>Une urgence passe tout de suite</b><span class="note">Un module révoqué est retiré sans attendre la fenêtre.</span></div><button class="sw on" data-sw></button></div></div>
  <div class="carte"><h3>Filet de sécurité</h3><p class="note">Après chaque mise à jour, la santé du module est surveillée 15 minutes. Si les erreurs montent, la version précédente est remise <b>toute seule</b>, et la version fautive n’est jamais reprise.</p>
    <div class="reglage"><div class="sp"><b>Versions épinglées</b><span class="note">Un module épinglé n’est jamais mis à jour. Aujourd’hui : <span class="mono">sentinelle</span>.</span></div><button class="btn mini">Gérer</button></div>
    <div class="reglage"><div class="sp"><b>Canal</b><span class="note">stable (défaut) · bêta pour les modules qui en publient</span></div><div class="seg"><button class="on">stable</button><button>bêta</button></div></div></div></div>`;
},
shop(){
  const conf=m=>m.niv==='officiel'||m.src==='officiel'?'officiel':'verifie';
  const l=BOUT.filter(m=>(S.boutFam==='toutes'||m.fam===S.boutFam)&&(S.bconf==='toutes'||conf(m)===S.bconf)&&(S.betat==='tous'||(S.betat==='installe')===!!byId(m.id))&&(!S.q||(m.nom+m.id+m.desc).toLowerCase().includes(S.q.toLowerCase())));
  if(S.btri==='nom')l.sort((a,b)=>a.nom.localeCompare(b.nom));else if(S.btri==='perm')l.sort((a,b)=>(a.perm.res+a.perm.ecr+a.perm.priv)-(b.perm.res+b.perm.ecr+b.perm.priv));
  const nb=k=>BOUT.filter(m=>k==='tous'||((k==='installe')===!!byId(m.id))).length;
  const fil=S.boutFam!=='toutes'||S.bconf!=='toutes'||S.betat!=='tous'||S.q;
  return tete('Boutique','Les modules du registre officiel et de tes autres sources, vérifiés avant d’être proposés.',`<button class="btn" data-act="depot">Déposer une archive</button>`)+
  conc('Reprend l’onglet « Registre » de l’App Store actuel. La page « Déposer une archive » devient un bouton secondaire ; l’installation se fait en <b>3 étapes</b> (examen, consentement, activation) dans une modale, depuis n’importe où.')+
  `<div class="heros"><div class="hero h1"><svg class="fond" viewBox="0 0 24 24">${I.shield}</svg><span class="p" style="background:rgba(255,255,255,.2);color:#fff;align-self:flex-start">Mis en avant</span><h3>Pare-feu CrowdSec</h3><p>Les décisions CrowdSec appliquées au pare-feu réel de la machine. Officiel.</p><button class="btn" data-inst="crowd">Installer</button></div>
  <div class="hero h2"><svg class="fond" viewBox="0 0 24 24">${I.box}</svg><span class="p" style="background:rgba(255,255,255,.2);color:#fff;align-self:flex-start">Ensemble</span><h3>Hébergeur complet</h3><p>Sites, DNS, certificats, sauvegardes et supervision, installés ensemble.</p><button class="btn" data-ens="hebergeur">Voir l’ensemble</button></div></div>
  <div class="barre"><div class="recherche" style="flex:1 1 260px;max-width:none">${ic('eye')}<input id="q" placeholder="Rechercher dans toutes les sources…" value="${esc(S.q)}"></div>
   <select class="sel" data-sel="boutFam" aria-label="Section"><option value="toutes">Toutes les sections</option>${Object.entries(FAM).map(([k,v])=>`<option value="${k}" ${S.boutFam===k?'selected':''}>${v}</option>`).join('')}</select>
   <select class="sel" data-sel="bconf" aria-label="Confiance">${[['toutes','Toutes les confiances'],['officiel','Officiel'],['verifie','Éditeur vérifié']].map(c=>`<option value="${c[0]}" ${S.bconf===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
   <select class="sel" data-sel="btri" aria-label="Trier">${[['pert','Trier : pertinence'],['nom','Trier : nom'],['perm','Trier : moins de permissions']].map(c=>`<option value="${c[0]}" ${S.btri===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
   ${fil?'<button class="btn mini" data-reset>Réinitialiser</button>':''}</div>
  <div class="seg segetat">${[['tous','Tous'],['nouveau','Nouveaux'],['installe','Installés']].map(c=>`<button class="${S.betat===c[0]?'on':''}" data-betat="${c[0]}">${c[1]} <span class="cnt">${c[0]==='tous'?nb('tous'):c[0]==='installe'?nb('installe'):BOUT.length-nb('installe')}</span></button>`).join('')}</div>`+

  (l.length?'':`<div class="carte vide-etat"><b>Aucun module ne correspond.</b><span class="note">Je peux le chercher ailleurs ou te dire s’il existe.</span><button class="btn mini pri" data-sug="Cherche un module : ${esc(S.q||'…')}">Demander à Cassandra de le chercher</button></div>`)+
  Object.entries(FAM).filter(([k])=>l.some(m=>m.fam===k)).map(([k,v])=>`<section class="rub"><div class="rub-t" style="cursor:default"><span class="ico sm">${ic(FIC[k])}</span><h3>${v}</h3><span class="p">${l.filter(m=>m.fam===k).length}</span></div><div class="grille">${l.filter(m=>m.fam===k).map(m=>{const inst=byId(m.id);return `<div class="carte mod clic" data-fiche="${m.id}"><div class="l1"><div class="ico">${ic(m.ic)}</div><div class="sp"><h3>${esc(m.nom)}</h3><div class="mono note">${m.id} · v${m.v}</div></div>${inst?pill('Installé','','check'):pill('Nouveau','ok')}</div><div class="desc">${esc(m.desc)}</div><div class="pied">${m.niv==='officiel'||m.src==='officiel'?pill('Officiel','ok','shield'):pill('Éditeur vérifié · '+m.ed,'ac','shield')}${permRes(m.perm)}<button class="btn mini pri" style="margin-left:auto" data-inst="${m.id}" ${inst||S.sim==='muet'?'disabled':''}>${inst?'Installé':'Installer'}</button></div></div>`}).join('')}</div></section>`).join('')+
  `<div class="carte"><h3>Ensembles</h3><div class="g2">${ENS.map(e=>`<div class="carte" style="box-shadow:none"><h4>${e.nom}</h4><p class="note">${e.d}</p><div class="chips">${e.mods.map(x=>`<span class="p">${x}</span>`).join('')}</div><button class="btn mini" data-ens="${e.id}" style="align-self:flex-start">Voir l’impact</button></div>`).join('')}</div></div>`+
  `<div class="carte" style="border-style:dashed"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="sp" style="flex:1;min-width:220px"><b style="color:var(--strong)">Tu as une archive .cmod ?</b><span class="note" style="display:block">Dépose-la ici : elle est examinée en quarantaine, rien ne s’installe avant ton accord.</span></div><button class="btn" data-act="depot">Déposer une archive</button></div></div>`;
},
src(){
  return tete('Sources','D’où viennent les modules : le registre officiel (fixe), tes autres registres, tes dossiers.',`<button class="btn pri" data-act="addsrc">+ Ajouter une source</button>`)+
  conc('Tout ce que contenait « Autre registre » et le réglage <span class="mono">modules.registre_url</span> est ici, avec en plus : plusieurs registres, priorité, test de connexion, clé de confiance propre à chaque source, dossier surveillé et miroir hors ligne.')+
  `<div class="carte" style="border-color:color-mix(in srgb,var(--ok) 35%,transparent)"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="ico">${ic('shield')}</div><div class="sp" style="flex:1;min-width:220px"><h3>Registre officiel de Cassandra ${pill('verrouillé','ok','lock')}</h3><div class="mono note">https://marplestrange.github.io/cassandra-registre/index.json</div></div><button class="btn mini" data-act="tester">Tester</button></div>
   <div class="g2" style="margin-top:4px"><div><div class="lib">Signature</div><div>Clé racine « principale » <span class="faint">(2 clés embarquées : principale, secours)</span></div></div><div><div class="lib">Fraîcheur de l’index</div><div>Émis le 26/10/2026 · valable jusqu’au 25/12/2026 <span class="p ok">59 j</span></div></div><div><div class="lib">Contenu</div><div>1 module · 0 éditeur vérifié · 1 révocation</div></div><div><div class="lib">Renouvellement</div><div>Automatique, tous les jours à 10:00 <span class="p ok" >actif</span></div></div></div>
   <p class="note">Intégré à l’application : il ne se retire pas et ne se modifie pas. C’est le seul dont la signature donne le niveau « Officiel ».</p></div>`+
  `<div class="carte"><h3>Autres registres</h3><div class="note">Un registre tiers est toujours affiché <b>non officiel</b>. Chaque archive y est examinée comme une archive déposée.</div><div class="liste">${SRC.map(s=>`<div class="li"><div class="ico sm ${s.on?'':'off'}">${ic('globe')}</div><div class="sp"><b>${s.nom}</b><span class="note mono">${s.url}</span><span class="note">${s.cle}</span></div>${s.ok?pill(s.mods+' modules','ok'):pill('injoignable','dg','warn')}<span class="p">priorité ${s.prio}</span><button class="btn mini" data-act="tester">Tester</button><button class="btn mini">Modifier</button><button class="sw ${s.on?'on':''}" data-sw></button></div>`).join('')}</div></div>`+
  `<div class="g2"><div class="carte"><h3>Éditeurs vérifiés ${pill('par le registre officiel','ac','shield')}</h3><div class="liste">
     <div class="li"><div class="ico sm">${ic('users')}</div><div class="sp"><b>acme</b><span class="note">2 modules · clé ed_acme</span></div><span class="p ok">vérifié</span></div>
     <div class="li"><div class="ico sm">${ic('users')}</div><div class="sp"><b>lagrange</b><span class="note">1 module · clé ed_lagrange</span></div><span class="p ok">vérifié</span></div></div><p class="note">La liste vient de l’index signé : tu ne peux pas en ajouter ici, seulement la lire.</p></div>
   <div class="carte"><h3>Dossier surveillé</h3><p class="note">Un dossier de ton disque où tu déposes des archives .cmod ; elles apparaissent dans la boutique comme « locales ».</p><div class="champ"><label>Chemin</label><input value="/var/cassandra/depot-modules" class="mono"></div><div class="reglage"><div class="sp"><b>Surveiller</b></div><button class="sw on" data-sw></button></div></div></div>`+
  `<div class="carte"><h3>Miroir hors ligne ${pill('nouveau','in')}</h3><p class="note">Pour une machine sans accès à Internet : importe un paquet (index signé + archives) apporté sur une clé USB. La signature est vérifiée comme d’habitude ; seule la fraîcheur de l’index est tolérée plus longtemps.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Importer un paquet…</button><button class="btn">Exporter un miroir de mes modules</button></div></div>`;
},
sec(){
  return tete('Sécurité et confiance','Qui peut installer quoi, ce que chaque module a le droit de faire, et ce qui a été révoqué.')+
  conc('Aujourd’hui la politique est un simple réglage et les permissions sont visibles seulement à l’installation. Ici elles sont <b>toutes dans une matrice</b>, relisibles à tout moment.')+
  `<div class="alerte dg"><div class="ico sm dg">${ic('warn')}</div><div class="sp"><b>1 module installé est révoqué par le registre.</b><span class="note"> Vieux flux RSS : faille connue. Il continue de tourner tant que tu ne le désinstalles pas.</span></div><button class="btn mini dng" data-ouvrir="vieux-flux">Traiter</button></div>`+
  `<div class="carte"><h3>Ce que Cassandra se refuse, quel que soit son niveau</h3><div class="liste"><div class="li"><div class="ico sm">${ic('shield')}</div><div class="sp"><b>Installer ce qui n’est pas signé</b><span class="note">Seuls le registre officiel et les éditeurs vérifiés comptent pour elle.</span></div></div><div class="li"><div class="ico sm">${ic('warn')}</div><div class="sp"><b>Installer ou garder un module révoqué</b><span class="note">Elle le retire, il reste 30 jours en corbeille.</span></div></div><div class="li"><div class="ico sm">${ic('lock')}</div><div class="sp"><b>Désactiver un module vital</b><span class="note">Droits, Passerelle… le noyau le refuse de toute façon.</span></div></div><div class="li"><div class="ico sm">${ic('key')}</div><div class="sp"><b>Prendre seule plus de permissions chez un tiers</b><span class="note">Une mise à jour d’un éditeur vérifié qui demande plus reste à l’écart, et elle te le dit.</span></div></div><div class="li"><div class="ico sm">${ic('disk')}</div><div class="sp"><b>Effacer des données pour de bon</b><span class="note">Purger les données d’un module reste un geste de l’utilisateur.</span></div></div></div></div>
  <div class="carte"><h3>Politique de confiance</h3><div style="display:flex;flex-direction:column;gap:8px">
   ${[['signes','Paquets signés seulement','Racine Cassandra, éditeur vérifié, ou clé que tu as posée. Recommandé.',''],['signesloc','Signés + ceux que je dépose moi-même','Les archives déposées à la main sont acceptées après examen.',''],['tous','Tout accepter','Archives non signées comprises. Réservé à un module que tu écris toi-même.','dgr']].map(r=>`<div class="radio ${r[3]} ${S.pol===r[0]?'on':''}" data-pol="${r[0]}"><i></i><div><b style="color:var(--strong)">${r[1]}</b><span class="note" style="display:block">${r[2]}</span></div></div>`).join('')}</div></div>`+
  `<div class="carte"><h3>Matrice des permissions</h3><p class="note">Déclaratives aujourd’hui (le module tourne dans Cassandra) ; elles deviendront contraignantes avec la cage par provenance.</p><div class="tw"><table><thead><tr><th>Module</th><th>Niveau</th><th>Réseau</th><th>Écritures</th><th>Privilèges</th><th></th></tr></thead><tbody>${M.map(m=>`<tr><td><b style="color:var(--strong)">${m.nom}</b></td><td>${niveau(m)}</td>${['res','ecr','priv'].map(k=>`<td><span class="cell ${m.perm[k]>=3?'v':m.perm[k]?'o':'z'}">${m.perm[k]}</span></td>`).join('')}<td><button class="btn mini" data-ouvrir="${m.id}" data-onglet="perm">Détail</button></td></tr>`).join('')}</tbody></table></div></div>`+
  `<div class="g2"><div class="carte"><h3>Clés de l’administrateur</h3><p class="note">Les clés publiques que tu as posées : une archive signée par l’une d’elles est « Clé de l’administrateur ».</p><div class="liste"><div class="li"><div class="ico sm">${ic('key')}</div><div class="sp"><b>cle-admin-2026</b><span class="note mono">ed25519 · SHA256:7f3a…c91e</span></div><button class="btn mini dng">Retirer</button></div></div><button class="btn" style="align-self:flex-start">+ Poser une clé publique</button><p class="note">Les noms « cassandra-… » et « ed_… » sont réservés : ils ne peuvent pas se faire passer pour l’officiel.</p></div>
  <div class="carte"><h3>Révocations</h3><div class="liste"><div class="li"><div class="sp"><b>vieux-flux &lt; 1.0</b><span class="note">faille connue : lecture de fichiers hors de son dossier</span></div><span class="p dg">installé</span></div></div><div class="reglage"><div class="sp"><b>Me prévenir dès qu’un module installé est révoqué</b><span class="note">Notification dans le centre de notifications.</span></div><button class="sw on" data-sw></button></div></div></div>`+
  `<div class="carte"><h3>Quarantaine ${pill('archives examinées, non installées','')}</h3><p class="note">Les archives déposées ou téléchargées attendent ici ton accord. Elles sont vidées après 7 jours.</p><div class="liste"><div class="li"><div class="ico sm">${ic('box')}</div><div class="sp"><b>compta-0.2.0.cmod</b><span class="note">examinée il y a 2 h · éditeur vérifié lagrange</span></div><button class="btn mini">Reprendre</button><button class="btn mini dng">Abandonner</button></div></div></div>`;
},
sante(){
  const suivi=M.some(m=>m.on&&m.err>1);
  return tete('Santé','Chaque module est sondé : erreurs, lenteur, mémoire. Cassandra suit et agit ; une panne n’arrête pas Cassandra.',`<button class="btn" data-act="blanc">Test de démarrage à blanc</button>`)+
  conc('<b>Réaligné.</b> Les boutons « Pause » ne sont plus offerts par défaut : Cassandra met seule en pause ce qui échoue et le dit. Ils apparaissent dans le « Mode avancé ». Le mode sans échec est rangé sous « Outils de secours ».')+
  (suivi?`<div class="alerte al"><div class="ico sm al">${ic('eye')}</div><div class="sp"><b>Courrier a 2 erreurs en 24 h.</b> <span class="note">Cassandra le suit. S’il échoue en boucle, elle le met en pause et te le dit.</span></div></div>`:'')+
  `<div class="carte"><div class="tw"><table><thead><tr><th>Module</th><th>État</th><th>Erreurs 24 h</th><th>Latence</th><th>Mémoire</th><th>Dernier démarrage</th><th></th></tr></thead><tbody>${M.map(m=>{const bad=m.err>1;return `<tr><td><b style="color:var(--strong)">${m.nom}</b></td><td>${!m.on?pill('inactif'):bad?pill('à surveiller','al','eye'):pill('sain','ok','check')}</td><td class="mono">${m.err}</td><td class="mono">${m.on?m.ms+' ms':'—'}</td><td class="mono">${m.on?m.ram+' Mo':'—'}</td><td class="note">${m.on?'il y a 3 j':'—'}</td><td>${m.on&&m.imp!=='vital'?(S.avance?`<button class="btn mini" data-act="pause" data-id="${m.id}">Pause</button>`:'<span class="note">suivi</span>'):''}</td></tr>`}).join('')}</tbody></table></div></div>`+
  `<div class="g2"><div class="carte"><h3>Ce que Cassandra fait seule</h3><div class="reglage"><div class="sp"><b>Mettre en pause un module qui plante en boucle</b><span class="note">Après 5 plantages en 10 minutes. Le geste se défait en un clic.</span></div><button class="sw on" data-sw></button></div><div class="reglage"><div class="sp"><b>Limite de mémoire par module</b><span class="note">Me prévenir au-delà de</span></div><select class="sel"><option>256 Mo</option><option>512 Mo</option><option>Aucune</option></select></div></div>
  <details class="carte"><summary style="cursor:pointer;font:650 15px 'Inter',sans-serif;color:var(--strong)">Outils de secours</summary><p class="note" style="margin-top:8px">À n’utiliser que si Cassandra elle-même ne répond plus : elle sait tout ce que tu fais ici.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="restaure">Créer un point de restauration</button><button class="btn dng" data-act="sansechec">Redémarrer en mode sans échec</button></div><p class="note">Hors interface : <span class="mono">python CN_main.py demarrer --sans-extensions</span></p></details></div>`;
},
jour(){
  const f=S.jfil,l=(S.sim==='neuve'?[]:ACTES).map((a,i)=>[a,i]).filter(([a])=>f==='tout'||a.t===f);
  return tete('Journal et versions','Tout ce qui est arrivé aux modules, qui l’a fait, pourquoi, et tout ce qu’on peut remettre comme avant.',`<button class="btn">Exporter le journal</button>`)+
  conc('<b>Réaligné.</b> Le journal et le récit de la Vue d’ensemble sont <b>la même chose</b> (une seule source) : ici, en entier et filtrable. Chaque ligne dit qui, pourquoi, et porte son « Défaire ».')+
  `<div class="g2"><div class="carte"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>Récit</h3><div class="seg segetat" style="margin-left:auto">${[['tout','Tout'],['auto','Cassandra'],['humain','Utilisateurs'],['ecarte','Laissés de côté']].map(c=>`<button class="${f===c[0]?'on':''}" data-jfil="${c[0]}">${c[1]}</button>`).join('')}</div></div><div class="liste">${l.length?l.map(([a,i])=>recitLi(a,i)).join(''):'<div class="vide-etat"><b>Rien pour l’instant.</b><span class="note">Ce que Cassandra fait ou laisse de côté apparaîtra ici.</span></div>'}</div></div>
  <div style="display:flex;flex-direction:column;gap:12px"><div class="carte"><h3>Versions restaurables</h3><div class="liste"><div class="li"><div class="sp"><b>Zones DNS</b><span class="note mono">0.9.0 · remplacée hier 21:04</span></div><button class="btn mini" data-act="retour">Remettre</button></div><div class="li"><div class="sp"><b>Courrier</b><span class="note mono">1.3.1 · remplacée le 18/10</span></div><button class="btn mini" data-act="retour">Remettre</button></div></div></div>
  <div class="carte"><h3>Corbeille</h3><p class="note">Un module retiré est gardé 30 jours, avec ses réglages. Rien n’est effacé pour de bon sans toi.</p><div class="liste"><div class="li"><div class="sp"><b>Vieux flux RSS</b><span class="note">retiré par Cassandra il y a 12 min (révoqué)</span></div><button class="btn mini">Restaurer</button></div><div class="li"><div class="sp"><b>Annuaire LDAP</b><span class="note">désinstallé il y a 9 jours</span></div><button class="btn mini">Restaurer</button>${S.avance?'<button class="btn mini dng">Vider</button>':''}</div></div></div>
  <div class="carte"><h3>Profil de modules ${pill('nouveau','in')}</h3><p class="note">Un fichier qui décrit quels modules, quelles versions et quels réglages (sans secrets).</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Exporter mon profil</button><button class="btn">Importer un profil…</button></div></div></div></div>`;
},
dev(){
  return tete('Développeur','Créer, tester et publier un module.',`<button class="btn pri" data-act="nouveau">+ Nouveau module</button>`)+
  conc('Regroupe le générateur de squelette (<span class="mono">CN_nouveau</span>), la validation de manifeste et la publication. Nouveau : <b>mode développement</b> avec dossier surveillé et rechargement à chaud.')+
  `<div class="g2"><div class="carte"><h3>Mode développement</h3><div class="reglage"><div class="sp"><b>Charger un module depuis un dossier</b><span class="note">Pas d’archive, pas de signature : réservé à la politique « tout accepter » du module.</span></div><button class="sw" data-sw></button></div><div class="champ"><label>Dossier</label><input class="mono" value="~/dev/mon-module"></div><div class="reglage"><div class="sp"><b>Rechargement à chaud</b><span class="note">Le module est rechargé quand un fichier change.</span></div><button class="sw on" data-sw></button></div></div>
  <div class="carte"><h3>Valider un manifeste</h3><div class="liste"><div class="li"><div class="sp"><b>id, nom, version</b></div>${pill('ok','ok','check')}</div><div class="li"><div class="sp"><b>importance déclarée</b></div>${pill('ok','ok','check')}</div><div class="li"><div class="sp"><b>dépendances versionnées</b></div>${pill('droits ≥ 0.2','ok','check')}</div><div class="li"><div class="sp"><b>icône (tracé SVG)</b></div>${pill('invalide','dg','warn')}</div></div><button class="btn" style="align-self:flex-start">Choisir un manifeste…</button></div></div>`+
  `<div class="g2"><div class="carte"><h3>Publier</h3><p class="note">1. Construis l’archive. 2. Signe-la avec ta clé d’éditeur. 3. Propose-la au registre officiel (demande d’ajout), ou publie-la sur ton propre registre.</p><pre>python outils/cmod.py construire mon-module/
python outils/cmod.py signer --cle ed_moi.pem mon-module-0.1.0.cmod</pre><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Construire l’archive</button><button class="btn">Signer…</button><button class="btn">Proposer au registre</button></div></div>
  <div class="carte"><h3>Points d’extension</h3><p class="note">Les endroits où un module peut en brancher un autre.</p><div class="liste"><div class="li"><div class="sp"><b class="mono">menus.entrees</b><span class="note">3 contributions</span></div></div><div class="li"><div class="sp"><b class="mono">supervision.sondes</b><span class="note">2 contributions</span></div></div><div class="li"><div class="sp"><b class="mono">courrier.regles</b><span class="note">0 contribution</span></div></div></div></div></div>`;
},
console(){
  const cm=byId(S.cmod)||{id:'modules',nom:'Logithèque',v:'0.1.0',ic:'inst',imp:'vital',fam:'socle',desc:'Ce qui est installé, actif ou à installer, ce qui dépend de quoi, et le geste d’activer ou de désactiver.',req:['droits']};
  const T=[['apercu','Aperçu'],['lectures','Lectures',6],['gestes','Gestes',8],['reglages','Réglages',2]];
  const L=[['lister','Le catalogue des modules : état, version, famille, dépendances.'],['fiche','La fiche d’un module, capacité par capacité.'],['versions','Les versions restaurables et ce qui s’est passé.'],['sante','Santé : exécutions, échecs, verdict.'],['contributions','Ce que les modules branchent aux points d’extension.'],['registre','Le registre officiel et, s’il y en a un, l’autre registre.']];
  const G=[['activer','Activer un module et ses dépendances, à chaud.','e','preuve · retour · trace'],['desactiver','Désactiver un module ; ses données restent.','e','preuve · retour · trace'],['examiner','Examiner une archive .cmod sans rien installer.','l','trace'],['installer','Installer une archive examinée, avec ton consentement.','e','preuve · retour · trace'],['retour_arriere','Remettre une version sauvegardée.','e','preuve · retour · trace'],['desinstaller','Désinstaller un module installé par archive.','d','preuve · retour · trace'],['abandonner','Abandonner une archive examinée.','e','trace'],['telecharger','Télécharger un module d’un registre, puis l’examiner.','e','trace']];
  const RL={l:'sans effet durable',e:'modifie',d:'supprime'};
  let c='';
  if(S.ct==='apercu')c=`<div class="g2"><div class="carte"><h4>Ce qu’il fait</h4><p class="note">La gestion des modules : ce qui est installé, actif ou à installer, ce qui dépend de quoi, et le geste d’activer ou de désactiver. Le noyau fait le travail ; ce module en fait des capacités avec droits, preuve, retour et trace.</p></div><div class="carte"><h4>En chiffres</h4><div class="kv"><span><b>Modules</b>11</span><span><b>Actifs</b>10</span><span><b>Gestes ce mois</b>23</span></div><div class="alerte ok" style="padding:7px 12px"><div class="sp"><b>Sain.</b> <span class="note">aucune erreur sur 24 h</span></div></div></div></div><div class="carte" style="flex-direction:row;gap:12px;align-items:center;flex-wrap:wrap"><div class="ico">${ic('inst')}</div><div class="sp" style="flex:1;min-width:200px"><b style="color:var(--strong)">Pour installer, parcourir ou gérer les sources, utilise la Logithèque.</b><span class="note" style="display:block">Cette console sert à voir ce que le module sait faire et à le régler.</span></div><button class="btn pri" data-go="inst">Ouvrir la Logithèque</button></div>`;
  else if(S.ct==='lectures')c=`<div class="carte"><p class="note">Des lectures : elles ne changent rien. « Essayer » montre ce qu’elles rendent.</p>${L.map(l=>`<div class="geste"><div><div class="nm">${l[0]}</div><div class="note">${l[1]}</div></div><button class="btn mini" data-essai="${l[0]}">Essayer</button><div class="sortie" id="out-${l[0]}"></div></div>`).join('')}</div>`;
  else if(S.ct==='gestes')c=`<div class="carte"><p class="note">Des gestes : ils changent quelque chose. Les plus lourds demandent confirmation, et chacun laisse une trace.</p>${G.map(g=>`<div class="geste"><div><div class="nm">${g[0]}<span class="risque ${g[2]}">${RL[g[2]]}</span></div><div class="note">${g[1]}</div><div class="garanties">${g[3].split(' · ').map(x=>`<span class="chipmini">${x}</span>`).join('')}</div></div><button class="btn mini ${g[2]==='d'?'dng':''}" data-geste="${g[0]}">Lancer…</button></div>`).join('')}</div>`;
  else c=`<div class="carte"><div class="lib">Confiance</div>
    <div class="rg"><div><h4>Quels paquets s’installent</h4><p class="aide">Seuls les paquets signés, ou tout ce qu’on dépose ?</p><button class="plus" data-plus>En savoir plus</button><p class="aide" hidden>« Signés » : par un éditeur dont tu as posé la clé. « Tous » : un paquet non signé est permis, à tes risques : un module installé tourne dans Cassandra, avec ses droits.</p><div class="cle">modules.politique_confiance</div></div>
      <div class="ctl"><div class="seg" style="width:100%"><button class="${S.pol2==='signes'?'on':''}" data-p2="signes" style="flex:1">Signés</button><button class="${S.pol2==='tous'?'on':''}" data-p2="tous" style="flex:1">Tous</button></div>${S.pol2==='tous'?'<div class="alerte dg" style="padding:7px 11px"><div class="sp note"><b>À tes risques.</b> Une archive non signée sera acceptée.</div></div>':''}<div class="etat">${S.pol2==='signes'?'<span>Valeur par défaut</span>':'<span><i class="modif"></i>modifié</span><button data-p2="signes">'+ic('maj')+'Rétablir</button>'}<button data-histo>${ic('jour')}Historique</button></div>${S.hist?'<div class="histo"><div><b>Aujourd’hui 14:12</b> · signés → tous <span class="faint">par admin</span></div><div><b>20/10 09:30</b> · tous → signés <span class="faint">par admin</span></div></div>':''}</div></div></div>
  <div class="carte"><div class="lib">Sources</div>
    <div class="rg"><div><h4>Un autre registre</h4><p class="aide">Ajoute le magasin d’un tiers. Il restera toujours non officiel.</p><button class="plus" data-plus>En savoir plus</button><p class="aide" hidden>Le registre officiel est intégré à l’application : il n’est pas un réglage et ne se retire pas. Un second registre s’affiche comme non officiel : son index n’est pas signé par la racine de Cassandra, chaque archive y reste examinée de la même façon.</p><div class="cle">modules.registre_url</div></div>
      <div class="ctl"><input class="champtxt" placeholder="https://…/index.json"><div class="etat"><span>Vide : aucun autre registre</span><button data-act="tester">${ic('check')}Tester</button></div><div class="note">Plusieurs registres, priorités et clés se gèrent dans <a href="#" data-go="src" style="color:var(--accent);font-weight:600">Logithèque › Sources</a>.</div></div></div></div>
  <p class="note" style="display:flex;gap:6px;align-items:center">${ic('check')} Chaque réglage s’enregistre dès que tu le quittes. Rien à valider.</p>`;
  return `<button class="btn mini" data-ouvrir="${cm.id}" style="align-self:flex-start">← Retour à ${esc(cm.nom)}</button>`+tete('Console de '+esc(cm.nom),'Ce que ce module sait faire, ce qu’il lit, ce qu’il change, comment le régler.')+
   conc('<b>Gabarit commun à tous les modules.</b> On y arrive depuis un module (tiroir › Réglages › « Réglages et capacités »), pas depuis le menu. Il remplace la console actuelle (celle de la capture). En-tête allégé : 3 pastilles au lieu de 6, méta en ligne discrète. Onglets avec compteurs. Aide longue repliée (« En savoir plus »). Contrôle adapté à la valeur (choix segmenté au lieu d’une liste). État parlant : « modifié » + « Rétablir » seulement si la valeur a changé ; historique en pop-over ; clé technique en petit. Lectures et gestes montrent leur risque et leurs garanties.')+
   `<div class="carte" style="gap:14px"><div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><div class="ico" style="width:48px;height:48px;border-radius:14px">${ic(cm.ic)}</div><div style="flex:1;min-width:220px"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h2 style="font:700 22px 'Inter',sans-serif;color:var(--strong);margin:0">${esc(cm.nom)}</h2><span class="mono note">${cm.id} · v${cm.v}</span></div><p class="note" style="margin-top:3px;max-width:70ch">${esc(cm.desc)}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-ouvrir="${cm.id}">Voir le module</button></div></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${pill(cm.on===false?'inactif':'actif',cm.on===false?'':'ok')}${pill(IMP[cm.imp][0],IMP[cm.imp][1])}${pill(cm.src==='officiel'||cm.id==='modules'?'Interne au noyau':'Module installé','')}<span class="chipmini">${FAM[cm.fam]}</span></div>
   <div class="kv"><span><b>Requiert</b>${(cm.req||[]).map(x=>`<span class="chipmini lien" data-ouvrir="${x}">${x}</span>`).join(' ')||'aucun'}</span><span><b>API</b>1</span><span><b>Utilisable par</b>l’utilisateur, Cassandra</span></div></div>
   <div class="onglets">${T.map(t=>`<button class="${S.ct===t[0]?'on':''}" data-ct="${t[0]}">${t[1]}${t[2]?` <span class="p" style="margin-left:4px">${t[2]}</span>`:''}</button>`).join('')}</div>`+c;
},
reg(){
  const sw=(t,d,on=true)=>`<div class="reglage"><div class="sp"><b>${t}</b><span class="note">${d}</span></div><button class="sw ${on?'on':''}" data-sw></button></div>`;
  return tete('Réglages','Le comportement général du gestionnaire.')+
  conc('Reprend les réglages du module (<span class="mono">politique_confiance</span>, <span class="mono">registre_url</span>) et y met tout ce qui était absent.')+
  `<div class="g2"><div class="carte"><h3>Installation</h3>${sw('Toujours demander mon accord','Aucune installation silencieuse, même pour un module officiel.')}${sw('Activer aussitôt après l’installation','Décoché : le module reste installé mais inactif.')}${sw('Examiner les dépendances manquantes','Proposer d’installer ce qu’il faut avec le module.')}</div>
  <div class="carte"><h3>Comment Cassandra te prévient</h3><div style="display:flex;flex-direction:column;gap:8px">${[['silence','Silencieux','Rien, sauf un vrai problème (module retiré parce que révoqué, remise en arrière).'],['resume','Un résumé par jour','Chaque matin à 08:00 : ce que j’ai fait, ce que j’ai laissé de côté. Les urgences, tout de suite. Recommandé.'],['direct','Tout en direct','Une notification à chaque geste. Beaucoup de bruit.']].map(([k,t,d])=>`<div class="radio ${S.notif===k?'on':''}" data-notif="${k}"><i></i><div><b style="color:var(--strong)">${t}</b><span class="note" style="display:block">${d}</span></div></div>`).join('')}</div></div></div>
  <div class="carte"><h3>Qui reçoit quoi, par où</h3><p class="note">Le centre de notifications de Cassandra reçoit tout ; ici tu choisis ce qui sort aussi par courriel ou Telegram.</p><div class="tw"><table><thead><tr><th>Événement</th><th>Cloche</th><th>Courriel</th><th>Telegram</th></tr></thead><tbody>
   ${[['Un module révoqué retiré, une mise à jour remise en arrière (urgence)',1,1,1],['Un module qui échoue en boucle, mis en pause',1,0,1],['Ce que j’ai laissé de côté (permissions en plus chez un tiers)',1,0,0],['Le résumé du jour',0,1,0],['Registre muet depuis plus de 24 h, index bientôt périmé',1,1,0]].map(r=>`<tr><td>${r[0]}</td>${[1,2,3].map(i=>`<td><button class="sw ${r[i]?'on':''}" data-sw aria-label="activer"></button></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="g2"><div class="carte"><div class="lib">Aperçu · le résumé du jour (courriel)</div><div class="courriel"><div class="note">De : Cassandra · Lundi 08:00</div><b style="color:var(--strong)">Cette nuit : tout va bien</b><p style="margin:6px 0">J’ai mis à jour <b>Zones DNS</b> (0.9.0 → 0.9.1), surveillée 15 minutes, saine. J’ai laissé de côté <b>Billetterie 0.5.0</b> : elle demande + réseau chez un éditeur tiers.</p><div class="note">Tout se défait en un clic depuis la Logithèque.</div></div></div>
  <div class="carte"><div class="lib">Aperçu · une urgence (notification)</div><div class="alerte dg" style="background:var(--solid)"><div class="ico sm dg">${ic('warn')}</div><div class="sp"><b>J’ai remis Courrier 1.3.1</b><span class="note"> La mise à jour 1.3.2 faisait échouer l’envoi. Tout fonctionne de nouveau. Je ne reprendrai pas cette version.</span></div></div></div></div>
  <div class="g2"><div class="carte"><h3>Réseau</h3><div class="champ"><label>Relire le registre officiel toutes les</label><select><option>6 heures</option><option>24 heures</option></select></div><div class="champ"><label>Proxy sortant (optionnel)</label><input class="mono" placeholder="http://proxy.local:3128"></div><div class="champ"><label>Taille maximale d’une archive</label><select><option>32 Mo</option><option>128 Mo</option></select></div></div>
  <div class="carte"><h3>Confidentialité</h3>${sw('Aucune télémétrie','Cassandra n’envoie rien sur ce que tu installes. Le registre est une page statique.')}${sw('Mémoriser les modules vus','Pour proposer « nouveau depuis ta dernière visite ».',false)}</div></div>
  <div class="carte"><h3>Nom des familles</h3><p class="note">Une famille est une étiquette de rangement, pas un module. Les modules tiers peuvent en apporter une avec leur propre icône ; ici tu peux les renommer pour cette instance.</p><div class="chips">${Object.values(FAM).map(f=>`<span class="p ac">${f}</span>`).join('')}<button class="btn mini">Renommer…</button></div></div>`;
}
};

/* ───────── rendu ───────── */
function accueil(){
  return tete('Bienvenue','Cette instance vient d’être installée. Cassandra a déjà mis en place les modules vitaux.')+
  conc('<b>Premier lancement.</b> Une instance neuve ne montre pas une page vide : elle propose un point de départ, ou laisse Cassandra décider. Aucune action n’est obligatoire.')+
  `<div class="carte accueil"><h2>Que veux-tu faire de cette instance ?</h2><p class="note" style="max-width:60ch">Choisis un ou plusieurs points de départ (ils se cumulent), ou dis-moi simplement ce que tu veux. Rien n’est définitif : je peux tout ajouter, retirer ou défaire plus tard.</p>
   <div class="carte" style="width:100%;flex-direction:row;gap:12px;align-items:center;box-shadow:none"><div class="ico sm">${ic('check')}</div><div><b style="color:var(--strong)">Déjà en place</b> <span class="note">Droits et Passerelle (les modules vitaux) : ils tiennent Cassandra debout, rien à choisir.</span></div></div>
   <div class="g2" style="width:100%">${ENS.filter(e=>e.id!=='minimal').map(e=>`<button class="carte choix ${S.choix.has(e.id)?'on':''}" data-ensch="${e.id}" aria-pressed="${S.choix.has(e.id)}"><span class="coche">${ic('check')}</span><h4>${e.nom}</h4><span class="note">${e.d}</span><span class="chips">${e.mods.map(x=>`<span class="p">${x}</span>`).join('')}</span></button>`).join('')}
    <button class="carte choix ${S.choix.size===ENS.length-1?'on':''}" data-ensch="tout" aria-pressed="${S.choix.size===ENS.length-1}"><span class="coche">${ic('check')}</span><h4>Tout installer</h4><span class="note">Les ensembles ci-dessus, bureau compris. Les modules en commun ne sont installés qu’une fois.</span></button></div>
   ${(()=>{const ids=[...new Set([...S.choix].flatMap(k=>ENS.find(e=>e.id===k).mods))];const vit=['droits','noyau-api'];const nouveaux=ids.filter(x=>!vit.includes(x));return S.choix.size?`<div class="alerte in" style="width:100%"><div class="sp"><b>${S.choix.size} ensemble${S.choix.size>1?'s':''} choisi${S.choix.size>1?'s':''} · ${nouveaux.length} module${nouveaux.length>1?'s':''} à installer</b><span class="note"> (les modules vitaux sont déjà là). Impact calculé : aucune dépendance cassée${nouveaux.length>6?', environ 400 Mo de mémoire au repos':''}. Tout se défait ensuite.</span></div><button class="btn pri" data-act="miseenplace">Mettre en place</button></div>`:'<p class="note">Coche un ou plusieurs ensembles : ils se cumulent.</p>'})()}
   <div class="demande" style="width:100%"><input id="dem" placeholder="Ou dis-moi : « je veux héberger mes sites et gérer mon courrier »" aria-label="Dire à Cassandra ce qu’on veut"><button class="btn pri" data-act="demande">Dire</button></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="demande">Laisse Cassandra décider</button><button class="btn" data-go="shop">Voir la boutique</button><button class="btn" data-act="plustard">Plus tard</button></div></div>
  <div class="carte"><h3>Jusqu’où Cassandra va seule</h3><p class="note">Tu pourras le changer à tout moment.</p><div style="display:flex;flex-direction:column;gap:8px">${[['observer','Observer','Je regarde et je raconte. Je ne touche à rien.'],['entretien','Entretien','Je retire ce qui est révoqué, je prends les mises à jour sans permission en plus, je mets en pause ce qui échoue.'],['reine','Reine','Je gère tout. Tu n’as rien à faire.']].map(([k,t,d])=>`<div class="radio ${S.auto===k?'on':''}" data-auto="${k}"><i></i><div><b style="color:var(--strong)">${t}${k==='reine'?' <span class="p ok">recommandé</span>':''}</b><span class="note" style="display:block">${d}</span></div></div>`).join('')}</div></div>`;
}
function banAvance(){return S.avance?`<div class="alerte al avance" role="status"><div class="ico sm al">${ic('warn')}</div><div class="sp"><b>Mode avancé.</b> <span class="note">Tu as les vrais boutons (interrupteurs, retrait). Cassandra voit tout ce que tu fais, et chaque geste se défait.</span></div><button class="btn mini" data-act="avance">Quitter</button></div>`:''}
function banniere(){
  if(S.sim==='travail')return `<div class="alerte in travail"><div class="ico sm">${ic('maj')}</div><div class="sp"><b>Cassandra travaille.</b> J’applique Agenda CalDAV 1.0.4 : étape 2 sur 3 (installation).<div class="bar"><i style="width:62%"></i></div></div><button class="btn mini" data-act="gel">Mettre en pause</button></div>`;
  if(S.sim==='muet')return `<div class="alerte al"><div class="ico sm al">${ic('globe')}</div><div class="sp"><b>Le registre officiel ne répond pas depuis 3 h.</b> <span class="note">Rien n’est cassé : ce qui est installé tourne normalement. Je réessaie toutes les 30 minutes. La boutique montre sa dernière lecture (hier 10:00).</span></div><button class="btn mini" data-act="tester">Réessayer maintenant</button></div>`;
  return '';
}
function etatc(){const e=$('#etatc');if(!e)return;e.className='etatc'+(S.gel?' gel':'');e.innerHTML=`<i class="pt"></i><span>Cassandra · <b>${S.gel?'en pause':{observer:'observe',entretien:'entretient',reine:'gère tout'}[S.auto]}</b>${S.avance?' · <span class="p al">avancé</span>':''}</span><button data-act="gel">${S.gel?'Reprendre':'Pause'}</button>`}
function mobile(){
  const m=$('#mtop'),b=$('#bas'),f=$('#feuille');
  m.className='mtop'+(S.gel?' gel':'');m.innerHTML=`<b>Logithèque</b><span class="st"><i class="pt"></i>${S.gel?'en pause':{observer:'observe',entretien:'entretient',reine:'gère tout'}[S.auto]}</span><button class="btn mini" data-act="gel">${S.gel?'Reprendre':'Pause'}</button>`;
  if(S.role==='user'){b.style.display='none';f.classList.remove('on');return}
  b.style.display='';
  const P=[['vue','vue','Vue'],['inst','inst','Installés'],['shop','shop','Boutique'],['maj','maj','Màj']];
  const n=k=>(SECS.find(x=>x[0]===k)||[])[3];
  b.innerHTML=P.map(([k,i,l])=>{const c=n(k)?n(k)():0;return `<button class="${S.sec===k?'on':''}" data-go="${k}">${ic(i)}<span>${l}</span>${k==='maj'&&c?`<span class="n">${c}</span>`:''}</button>`}).join('')+`<button class="${S.sheet?'on':''}" data-plus-sheet>${ic('reg')}<span>Plus</span></button>`;
  f.className='feuille'+(S.sheet?' on':'');
  f.innerHTML=SECS.filter(x=>x[0]!=='sep'&&!['vue','inst','shop','maj'].includes(x[0])).map(x=>`<button class="nv ${S.sec===x[0]?'on':''}" data-go="${x[0]}">${ic(x[1])}<span>${x[2]}</span></button>`).join('');
}
function nav(){etatc();mobile();
  if(S.role==='user'){$('#nav').innerHTML=`<div class="sep">Moi</div><button class="nv on" data-go="mes">${ic('inst')}<span>Mes applications</span></button>`;return}
  $('#nav').innerHTML=SECS.map(s=>{if(s[0]==='sep')return `<div class="sep">${s[1]}</div>`;const n=s[3]?s[3]():0;return `<button class="nv ${S.sec===s[0]?'on':''}" data-go="${s[0]}">${ic(s[1])}<span>${s[2]}</span>${n?`<span class="n ${s[4]||''}">${n}</span>`:''}</button>`}).join('');
}
function rendre(){
  nav();
  const p=$('#page');p.innerHTML=(S.role==='admin'?banAvance():'')+(S.role==='admin'&&['vue','inst','maj','shop','src'].includes(S.sec)?banniere():'')+PAGES[S.role==='user'?'mes':S.sec]();
  const q=$('#q');if(q){q.addEventListener('input',()=>{S.q=q.value;rendre();const n=$('#q');n.focus();n.setSelectionRange(99,99)})}
  majImpact();a11y();
}
function majImpact(){
  const e=$('#impact');if(!e)return;
  const ch=Object.entries(S.att);if(!ch.length){e.classList.remove('on');return}
  const off=ch.filter(([id,v])=>!v).map(([id])=>id);
  const casse=new Set();const rec=x=>requisPar(x).forEach(m=>{if(m.on&&!off.includes(m.id)&&!casse.has(m.id)){casse.add(m.id);rec(m.id)}});off.forEach(rec);
  e.classList.add('on');
  e.innerHTML=`<div class="sp"><b>${ch.length} changement(s) en attente.</b> ${casse.size?`Cela arrêterait aussi : ${[...casse].map(id=>byId(id).nom).join(', ')}.`:'Aucun autre module n’en dépend.'}</div><button class="btn" data-act="annule">Annuler</button><button class="btn pri" data-act="applique">Appliquer</button>`;
}
function go(s){if(S.sec!==s)S.q='';S.sec=s;rendre();window.scrollTo({top:0,behavior:'smooth'})}

/* tiroir */
const ONG=[['apercu','Aperçu'],['dep','Dépendances'],['perm','Permissions'],['regl','Réglages'],['sante','Santé'],['versions','Versions']];
function ouvrir(id,onglet){
  const m=byId(id);if(!m)return;S.tiroir=id;S.onglet=onglet||'apercu';const t=$('#tiroir');
