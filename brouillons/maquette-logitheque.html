  if(etape===1)c=`${st}<h2 style="font:650 19px 'Inter',sans-serif;color:var(--strong)">Examen de ${m.nom}</h2><div class="g2"><div><div class="lib">Signature</div>${m.niv==='officiel'?pill('Officiel · principale','ok','shield'):pill('Éditeur vérifié · '+m.ed,'ac','shield')}</div><div><div class="lib">Taille</div>${m.taille}</div></div><div class="liste"><div class="li lib">Ce qu’il demande</div><div class="li"><div class="sp"><b>Réseau</b><span class="note mono">${m.perm.res?'api.exemple.org':'aucun'}</span></div></div><div class="li"><div class="sp"><b>Écritures</b><span class="note mono">${m.perm.ecr?'donnees/'+m.id:'aucune'}</span></div></div><div class="li"><div class="sp"><b>Privilèges</b><span class="note mono">${m.perm.priv?'installer':'aucun'}</span></div></div></div><p class="note">Dépendances : toutes présentes (droits).</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-fermer>Abandonner</button><button class="btn pri" data-et="2" data-id="${id}">Continuer</button></div>`;
  else if(etape===2)c=`${st}<h2 style="font:650 19px 'Inter',sans-serif;color:var(--strong)">Ton accord</h2><label class="radio on" style="cursor:default"><input type="checkbox" id="cs" style="margin-top:3px"><span>Je comprends que ce module <b>s’exécutera dans Cassandra</b> avec les permissions ci-dessus, et je choisis de l’installer.</span></label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-et="1" data-id="${id}">Retour</button><button class="btn pri" id="cs-ok" data-et="3" data-id="${id}" disabled>Installer</button></div>`;
  else c=`${st}<h2 style="font:650 19px 'Inter',sans-serif;color:var(--strong)">${m.nom} est installé</h2><p class="note">Il est déposé mais <b>inactif</b> : rien de lui ne tourne tant que tu ne l’as pas activé.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-fermer>Plus tard</button><button class="btn pri" data-fermer data-toast="${m.nom} activé">Activer ${m.nom}</button></div>`;
  M_.innerHTML=c;M_.classList.add('on');$('#voile').classList.add('on');dedans(M_);
  const cs=$('#cs');if(cs)cs.addEventListener('change',()=>$('#cs-ok').disabled=!cs.checked);
}
function modale(titre,corps,ok='Valider',toastT){const M_=$('#modale');M_.innerHTML=`<h2 style="font:650 19px 'Inter',sans-serif;color:var(--strong)">${titre}</h2>${corps}<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-fermer>Annuler</button><button class="btn pri" data-fermer data-toast="${toastT||ok}">${ok}</button></div>`;M_.classList.add('on');$('#voile').classList.add('on');dedans(M_)}

/* ───────── événements ───────── */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-ouvrir],[data-fiche],.radio,.stat,[data-go]');if(!t)return;
  if(t.dataset.bascule){e.stopPropagation();const m=byId(t.dataset.bascule);if(m.imp==='vital')return;const cur=S.att[m.id]!==undefined?S.att[m.id]:m.on;const nv=!cur;if(nv===m.on)delete S.att[m.id];else S.att[m.id]=nv;if($('#tiroir').classList.contains('on')){fermer();}rendre();return}
  if(t.hasAttribute('data-sw')){t.classList.toggle('on');return}
  if(t.dataset.fermer!==undefined){if(t.dataset.toast)toast(t.dataset.toast);fermer();return}
  if(t.hasAttribute('data-plus-sheet')){S.sheet=!S.sheet;mobile();return}
  if(t.dataset.go){S.sheet=false;fermer();go(t.dataset.go);return}
  if(t.dataset.ouvrir){ouvrir(t.dataset.ouvrir,t.dataset.onglet);return}
  if(t.dataset.ong){ouvrir(S.tiroir,t.dataset.ong);return}
  if(t.dataset.fiche){ficheBout(t.dataset.fiche);return}
  if(t.dataset.inst){e.stopPropagation();ficheBout(t.dataset.inst);return}
  if(t.dataset.instDirect){fermer();modInstall(t.dataset.instDirect,1);return}
  if(t.dataset.et){modInstall(t.dataset.id,+t.dataset.et);return}
  if(t.dataset.vue){S.vue=t.dataset.vue;rendre();return}
  if(t.dataset.betat){S.betat=t.dataset.betat;rendre();return}
  if(t.dataset.menu){const k=t.dataset.menu;S.menu.has(k)?S.menu.delete(k):S.menu.add(k);rendre();toast(S.menu.has(k)?'Ajoutée à ton menu.':'Retirée de ton menu.');return}
  if(t.dataset.fong){ficheBout(S.fiche,t.dataset.fong);return}
  if(t.dataset.notif){S.notif=t.dataset.notif;rendre();toast('Notifications : '+t.textContent.trim().split('\n')[0]);return}
  if(t.dataset.ensch){const k=t.dataset.ensch;if(k==='tout'){S.choix=S.choix.size===ENS.length-1?new Set():new Set(ENS.filter(e=>e.id!=='minimal').map(e=>e.id))}else{S.choix.has(k)?S.choix.delete(k):S.choix.add(k)}rendre();return}
  if(t.dataset.console){S.cmod=t.dataset.console;S.ct='apercu';fermer();go('console');return}
  if(t.dataset.verrou){const m=byId(t.dataset.verrou);m.verrou=!m.verrou;fermer();rendre();ouvrir(m.id);toast(m.verrou?m.nom+' : Cassandra n’y touchera plus.':m.nom+' : Cassandra peut de nouveau s’en occuper.');return}
  if(t.dataset.jfil){S.jfil=t.dataset.jfil;rendre();return}
  if(t.dataset.auto){S.auto=t.dataset.auto;rendre();toast('Autonomie : '+t.dataset.auto);return}
  if(t.dataset.defaire!==undefined){const a=ACTES[+t.dataset.defaire];toast(a.inv+' : fait. Cassandra en prend note.');a.inv='';rendre();return}
  if(t.dataset.sug){convOuvrir(t.dataset.sug);return}
  if(t.dataset.undo){const f=UNDO[t.dataset.undo];if(f){f();delete UNDO[t.dataset.undo];CONV.fil.push({r:'c',h:'C’est défait. Je l’ai noté.'});convRendre()}return}
  if(t.dataset.etat){S.etat=t.dataset.etat;rendre();return}
  if(t.dataset.imp){S.imp=t.dataset.imp;rendre();return}
  if(t.dataset.fam){S.fam=t.dataset.fam;rendre();return}
  if(t.dataset.bfam){S.boutFam=t.dataset.bfam;rendre();return}
  if(t.hasAttribute('data-reset')){S.fam='toutes';S.imp='toutes';S.etat='tous';S.q='';S.boutFam='toutes';S.bconf='toutes';S.betat='tous';rendre();return}
  if(t.dataset.rep){const k=t.dataset.rep;S.rep.has(k)?S.rep.delete(k):S.rep.add(k);rendre();return}
  if(t.dataset.ct){S.ct=t.dataset.ct;rendre();return}
  if(t.dataset.p2){S.pol2=t.dataset.p2;rendre();toast('Enregistré');return}
  if(t.hasAttribute('data-histo')){S.hist=!S.hist;rendre();return}
  if(t.hasAttribute('data-plus')){const a=t.nextElementSibling;a.hidden=!a.hidden;t.textContent=a.hidden?'En savoir plus':'Réduire';return}
  if(t.dataset.essai){const o=$('#out-'+t.dataset.essai);o.innerHTML=o.innerHTML?'':'<pre>{ "modules": 11, "actifs": 10, "verdict": "sain" }</pre>';return}
  if(t.dataset.geste){modale('Lancer « '+t.dataset.geste+' » ?','<p class="note">Ce geste laisse une trace et, s’il modifie quelque chose, peut être défait.</p>','Lancer','Geste lancé');return}
  if(t.dataset.pol){S.pol=t.dataset.pol;rendre();toast('Politique : '+t.textContent.trim().split('\n')[0]);return}
  if(t.dataset.ens){const en=ENS.find(x=>x.id===t.dataset.ens);const mm=en.mods.map(id=>byId(id)||BOUT.find(b=>b.id===id));modale('Ensemble « '+en.nom+' »',`<p class="note">${en.d}</p><div class="liste">${mm.map(x=>`<div class="li"><div class="ico sm">${ic(x.ic)}</div><div class="sp"><b>${x.nom}</b><span class="note">${byId(x.id)&&byId(x.id).on?'déjà installé et actif':byId(x.id)?'installé, inactif':'à installer'}</span></div></div>`).join('')}</div><p class="note">Impact calculé : aucune dépendance cassée, 2 nouvelles permissions réseau (api.exemple.org).</p>`,'Installer les manquants','Ensemble installé');return}
  if(t.dataset.act){const a=t.dataset.act;
    if(a==='avance'){S.avance=!S.avance;if(S.avance)toast('Mode avancé : tes gestes sont connus de Cassandra, et chacun se défait.');rendre()}
    else if(a==='pascette'){toast('Cette version est écartée : Cassandra n’y reviendra pas.')}
    else if(a==='miseenplace'){toast('Cassandra met en place '+S.choix.size+' ensemble(s) : elle te dit quand c’est prêt.');S.choix=new Set();S.sim='normal';$('#sim').value='normal';rendre()}
    else if(a==='plustard'){S.sim='normal';$('#sim').value='normal';rendre();toast('Quand tu veux : tout reste possible.')}
    else if(a==='demandeinst'){const b=BOUT.find(x=>x.id===S.fiche);installeDemande(b);fermer()}
    else if(a==='evolution')toast('Ouvre Évolution › Autonomie (module à part : les paliers gagnés par les preuves).')
    else if(a==='gel'){S.gel=!S.gel;rendre();toast(S.gel?'Cassandra est en pause : elle observe, elle n’agit plus.':'Cassandra reprend.')}
    else if(a==='passe')toast('Passe lancée : rien à faire pour l’instant.')
    else if(a==='demande'){const d=$('#dem');if(d&&d.value.trim()){const v=d.value.trim();d.value='';convOuvrir(v)}else convOuvrir('')}
    else if(a==='annule'){S.att={};rendre()}
    else if(a==='applique'){Object.entries(S.att).forEach(([id,v])=>byId(id).on=v);S.att={};rendre();toast('Changements appliqués')}
    else if(a==='majok'||a==='maj1'){toast('Mise à jour appliquée, santé surveillée 15 min')}
    else if(a==='addsrc')modale('Ajouter une source',`<div class="champ"><label>Nom</label><input placeholder="Registre interne"></div><div class="champ"><label>Adresse de l’index</label><input class="mono" placeholder="https://…/index.json"></div><div class="champ"><label>Clé publique de signature (optionnel)</label><textarea rows="3" class="mono" placeholder="-----BEGIN PUBLIC KEY-----"></textarea></div><div class="alerte al"><div class="sp"><b>Toujours non officiel.</b> <span class="note">Cette source ne peut jamais donner le niveau « Officiel » ; ses archives sont examinées une à une.</span></div></div>`,'Tester puis ajouter','Source ajoutée');
    else if(a==='tester')toast('Source joignable · index valide · signature vérifiée');
    else if(a==='nouveau')modale('Nouveau module',`<div class="champ"><label>Identifiant</label><input class="mono" placeholder="mon-module"></div><div class="champ"><label>Nom</label><input placeholder="Mon module"></div><div class="champ"><label>Famille</label><select>${Object.values(FAM).map(f=>`<option>${f}</option>`).join('')}<option>Nouvelle famille…</option></select></div><div class="champ"><label>Importance</label><select><option>optionnel</option><option>important</option><option>vital</option></select></div><pre>mon-module/\n  CN_manifeste.toml\n  CN_module.py\n  tests/</pre>`,'Créer le squelette','Squelette créé');
    else if(a==='depot')modale('Déposer une archive',`<div class="carte" style="border-style:dashed;align-items:center;padding:28px"><b style="color:var(--strong)">Glisse un fichier .cmod ici</b><span class="note">32 Mo au plus. Examiné en quarantaine : rien ne s’installe avant ton accord.</span></div>`,'Choisir un fichier','');
    else if(a==='sansechec')modale('Redémarrer en mode sans échec ?',`<p class="note">Cassandra redémarre avec <b>seulement les modules vitaux</b> (Droits, Passerelle). Les autres reviennent au redémarrage normal.</p>`,'Redémarrer','Redémarrage en mode sans échec…');
    else if(a==='blanc')toast('Test à blanc : 12 modules démarrent, 0 échec simulé');
    else if(a==='restaure')toast('Point de restauration créé');
    else if(a==='retour')toast('Version précédente remise');
    else if(a==='pause')toast('Module mis en pause');
    else toast('Fait');
    return}
  if(t.dataset.desinst){const m=byId(t.dataset.desinst);const rec=requisPar(m.id).filter(x=>x.on);modale('Désinstaller '+m.nom+' ?',`<p class="note">${rec.length?'Cela arrêterait aussi : <b>'+rec.map(x=>x.nom).join(', ')+'</b>. ':''}Il est gardé 30 jours dans la corbeille avec ses réglages.</p>`,'Désinstaller','Désinstallé (corbeille 30 j)');return}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.sel;if(k){S[k]=k==='fenetre'?+e.target.value:e.target.value;rendre()}});
$('#voile').addEventListener('click',fermer);
/* palette */
const CMD=()=>[...SECS.filter(s=>s[0]!=='sep').map(s=>({t:'Aller à '+s[2],k:'section',f:()=>go(s[0])})),...M.map(m=>({t:m.nom,k:'module',f:()=>ouvrir(m.id)})),{t:'Mettre à jour tout ce qui est sûr',k:'action',f:()=>toast('Mise à jour appliquée')},{t:'Redémarrer en mode sans échec',k:'action',f:()=>go('sante')},{t:'Ajouter une source',k:'action',f:()=>{go('src')}}];
function pal(){const p=$('#pal');p.classList.add('on');$('#voile').classList.add('on');const q=$('#pal-q');q.value='';q.focus();palR()}
function palR(){const q=$('#pal-q').value.toLowerCase();const r=CMD().filter(c=>c.t.toLowerCase().includes(q)).slice(0,8);$('#pal-r').innerHTML=r.map((c,i)=>`<button data-p="${i}">${esc(c.t)}<small>${c.k}</small></button>`).join('')||'<div class="note" style="padding:10px">Rien ne correspond.</div>';$$('#pal-r button').forEach((b,i)=>b.onclick=ev=>{ev.stopPropagation();fermer();r[i].f()})}
$('#pal-q').addEventListener('input',palR);
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='dem'){e.preventDefault();const v=e.target.value.trim();e.target.value='';convOuvrir(v);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();retourFocus=document.activeElement;pal();return}
  if(e.key==='Escape'){fermer();return}
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.tagName!=='BUTTON'&&t.tagName!=='INPUT'&&t.tagName!=='SELECT'&&t.tagName!=='TEXTAREA'&&(t.getAttribute('role')==='button'||t.getAttribute('role')==='radio')){e.preventDefault();t.click();return}
  if(e.key==='Tab'){const ouvert=['#tiroir','#modale','#pal'].map(k=>$(k)).find(x=>x.classList.contains('on'));if(!ouvert)return;
    const f=[...ouvert.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex="0"]')].filter(x=>x.offsetParent!==null);if(!f.length)return;
    const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
document.body.classList.add('annot');
$('#sim').addEventListener('change',e=>{S.sim=e.target.value;if(S.sim==='travail'||S.sim==='muet'||S.sim==='neuve'||S.sim==='vide')go(S.sim==='neuve'?'vue':S.sec);rendre()});
$('#role').addEventListener('change',e=>{S.role=e.target.value;S.sec=S.role==='user'?'mes':'vue';rendre()});
$('#annot').addEventListener('click',e=>{const on=document.body.classList.toggle('annot');e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent='Annotations de conception : '+(on?'oui':'non')});
rendre();
</script>
