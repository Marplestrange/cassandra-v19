# Les sections du noyau : la déclaration (en données) des rubriques où se rangent les modules.
# Une section n'est pas une entrée de menu : c'est une rubrique de rangement (page Modules, boutique).
# Un module peut en apporter de nouvelles avec [[sections]] dans son manifeste ; il ne peut pas redéfinir celles-ci.
# icone : une clé d'icône de l'interface ; ordre : 1 à 899 (plus petit = plus haut dans la page).

