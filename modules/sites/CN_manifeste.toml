# RÔLE       : Les sites web que Cassandra suit : ceux d'un compte (déclarés, attribués, ou inscrits dans sa fiche de compte), ceux du panneau qui appartiennent au compte du panneau lié à ce compte. Une sonde chronomètre chaque site (code, durée, certificat) et en garde l'historique ; une panne, un retour, une lenteur, un certificat court font des constats. Chaque compte ne voit que ses sites ; l'administrateur voit l'état de tous, jamais le contenu. Demande d'adossement au panneau, accord limité dans le temps donné par le propriétaire, liens vers projets et contacts, journal des gestes.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.4.0 empreinte=fceb23 ▼▼▼
[module]
id = "sites"
nom = "Sites"
version = "0.4.0"
noyau_min = "0.1.0"
description = "Les sites web que Cassandra suit : ceux d'un compte (déclarés, attribués, ou inscrits dans sa fiche de compte), ceux du panneau qui appartiennent au compte du panneau lié à ce compte. Une sonde chronomètre chaque site (code, durée, certificat) et en garde l'historique ; une panne, un retour, une lenteur, un certificat court font des constats. Chaque compte ne voit que ses sites ; l'administrateur voit l'état de tous, jamais le contenu. Demande d'adossement au panneau, accord limité dans le temps donné par le propriétaire, liens vers projets et contacts, journal des gestes."
confiance = "interne"
famille = "hebergement"
groupe = "parc"
proprietaire = "cassandra"
importance = "important"
sans = "Plus de suivi des sites web : leur disponibilité et leurs certificats ne sont plus surveillés."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[droits]]
id = "administrer"
libelle = "Administrer les sites de tous : attribuer, transférer, rattacher un compte du panneau, répondre aux demandes d'adossement"
sensible = true

[[objets]]
type = "site"
libelle = "Un site web suivi par Cassandra"

[[reglages]]
id = "lent_ms"
libelle = "Temps de réponse au-delà duquel un site est dit lent, en millisecondes"
type = "entier"
defaut = 3000
minimum = 500
maximum = 60000
portee = "societe"

[[reglages]]
id = "delai_sonde_s"
libelle = "Délai d'attente d'une requête de la sonde, en secondes"
type = "entier"
defaut = 8
minimum = 2
maximum = 60
portee = "societe"

[[reglages]]
id = "echecs_avant_panne"
libelle = "Nombre de mesures ratées de suite avant de dire un site en panne (1 : dès la première)"
type = "entier"
defaut = 2
minimum = 1
maximum = 5
portee = "societe"

[[reglages]]
id = "proteges_en_ligne"
libelle = "Tenir pour en ligne un site qui répond 401 ou 403 (site protégé par un mot de passe)"
type = "booleen"
defaut = false
portee = "societe"

[[reglages]]
id = "sonde_interne"
libelle = "Laisser la sonde interroger des adresses internes (réseau privé, boucle locale) : à n'ouvrir que si des sites suivis y vivent vraiment"
type = "booleen"
defaut = false

[[reglages]]
id = "retention_j"
libelle = "Durée de garde des mesures, en jours"
type = "entier"
defaut = 90
minimum = 7
maximum = 730
portee = "societe"

[[reglages]]
id = "ssl_court_j"
libelle = "Jours restants sous lesquels le certificat d'un site est signalé — seulement si le module Certificats est absent : sinon c'est son seuil qui fait foi"
type = "entier"
defaut = 21
minimum = 3
maximum = 90
portee = "societe"

[[reglages]]
id = "objectif_pct"
libelle = "Objectif de disponibilité par défaut, en pourcentage (de 90 à 100 ; chaque site peut avoir le sien)"
type = "texte"
defaut = "99.9"
portee = "societe"

[[reglages]]
id = "preuve_exigee"
libelle = "Exiger une preuve de propriété (un enregistrement DNS ou un fichier) de qui déclare un site hors du panneau"
type = "booleen"
defaut = true
portee = "societe"

[evenements]
emet = ["site.panne", "site.retour", "site.declare", "site.retire", "site.attribue", "site.transfere", "site.demande", "site.adossement", "site.accord", "site.societe"]

[[moteurs]]
id = "sonde"
libelle = "Sonde chaque site (code, durée ; le certificat est recopié du module Certificats, ou lu ici s'il est absent), consigne les pannes et les retours, purge les vieilles mesures"
mode = "periodique"
toutes_les_s = 300
duree_max_s = 280

[[detecteurs]]
id = "panne"
libelle = "Un site ne répond plus"
frequence_s = 60

[[detecteurs]]
id = "panne_proprietaire"
libelle = "Le site d'un compte ne répond plus : son propriétaire est prévenu, pas seulement les administrateurs"
frequence_s = 60

[[detecteurs]]
id = "lenteur"
libelle = "Un site répond, mais trop lentement"
frequence_s = 300

[[detecteurs]]
id = "certificat_court"
libelle = "Le certificat d'un site arrive à échéance (muet quand le module Certificats est là : c'est lui qui alerte)"
frequence_s = 900

[[detecteurs]]
id = "adossement_demande"
libelle = "Un compte demande qu'un de ses sites passe au panneau"
frequence_s = 300

# ------------------------------------------------------------------ lectures (chaque compte voit les siens ; l'administrateur, l'état de tous)
[[capacites]]
id = "vue"
libelle = "Les sites de la portée de ce compte, avec leur état, leur certificat, leur disponibilité, et ce qui demande un geste"
risque = "lecture"

[[capacites]]
id = "fiche"
libelle = "La fiche d'un site : sa ligne, son historique, ses liens, son journal, ce que ce compte peut faire dessus"
risque = "lecture"

[[capacites]]
id = "historique"
libelle = "Disponibilité, temps de réponse et événements d'un site sur une durée"
risque = "lecture"

[[capacites]]
id = "disponibilite"
libelle = "Disponibilité et temps de réponse de chaque site sur une durée"
risque = "lecture"

[[capacites]]
id = "journal"
libelle = "Les gestes faits sur un site, ou sur tous ceux de la portée"
risque = "lecture"

[[capacites]]
id = "liens"
libelle = "Les projets, contacts, machines et notes rattachés à un site"
risque = "lecture"

[[capacites]]
id = "demandes"
libelle = "Les demandes d'adossement au panneau (les siennes, ou toutes pour l'administrateur)"
risque = "lecture"

[[capacites]]
id = "accord"
libelle = "Le propriétaire a-t-il autorisé un geste lourd sur ce site, et jusqu'à quand"
risque = "lecture"


[[capacites]]
id = "incidents"
libelle = "Les incidents (pannes confirmées) des sites de la portée de ce compte : ouverts, rétablis à clore, résolus avec leur cause"
risque = "lecture"

[[capacites]]
id = "incident"
libelle = "Un incident : son diagnostic, ses dernières mesures, sa chronologie, ce que ce compte peut faire dessus"
risque = "lecture"

[[capacites]]
id = "calendrier"
libelle = "Tout ce qui est arrivé à un site, jour par jour, sur un mois : coupures, incidents, gestes, et le mois en chiffres face à son objectif"
risque = "lecture"

[[capacites]]
id = "concerne"
libelle = "Ce compte est-il concerné par les sites (il en a un, en déclare un, ou administre) : le menu ne montre « Sites » qu'à ceux-là"
risque = "lecture"

[[capacites]]
id = "voisins"
libelle = "Relire auprès du Sensorium les fenêtres de maintenance et les alertes de site acceptées, sans attendre le tour de la sonde (pour qui a le droit de les lire)"
risque = "lecture"

[[capacites]]
id = "gestes"
libelle = "Ce que chacun peut faire sur les sites : qui (humain, compte, agents), à quel palier, avec quel droit"
risque = "lecture"

[[capacites]]
id = "declarer"
libelle = "Déclarer un site qu'on possède hors du panneau : après la preuve de propriété, la sonde le suivra"
risque = "faible"
perimetre = ["un nom de domaine valide, pas déjà à un autre compte, pas géré par le panneau", "ni un nom partagé (github.io, gouv.fr…) ni le parent du site d'un autre compte", "tant que la preuve manque, le site n'est à personne et n'est pas mesuré"]
preuve = "relire la ligne du site, ou sa déclaration en attente de preuve : domaine et compte conformes"
retour = "retirer ce site (ou sa déclaration) de la liste de ce compte"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "prouver"
libelle = "Vérifier la preuve de propriété d'un site déclaré : le jeton du compte, dans le DNS (TXT _cassandra.<site>) ou dans un fichier servi par le site"
risque = "faible"
perimetre = ["une déclaration en attente de ce compte, de moins de sept jours", "une question DNS et une requête HTTPS vers le site, rien d'autre", "trouvée, les autres déclarations de ce nom tombent"]
preuve = "relire la ligne du site : il est à ce compte"
retour = "remettre le site en attente de preuve"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "relever"
libelle = "Mesurer un site tout de suite, sans attendre le tour de la sonde"
risque = "faible"
perimetre = ["un site suivi de la portée de ce compte", "une mesure au plus toutes les trente secondes par site", "la même requête que la sonde"]
preuve = "la mesure est dans l'historique du site"
retour = "aucun : une mesure ne se retire pas, elle s'ajoute à l'historique"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "objectif"
libelle = "Poser l'objectif de disponibilité d'un site (de 90 à 100 %), ou lui rendre celui du réglage"
risque = "faible"
perimetre = ["un site suivi de la portée de ce compte"]
preuve = "relire l'objectif du site"
retour = "remettre l'objectif d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "attribuer_societe"
libelle = "Attribuer un site à une société : ses administrateurs le voient alors, quel que soit son compte (réservé au superadministrateur)"
risque = "moyen"
droit = "administrer"
perimetre = ["un site suivi", "une société de l'instance, ou aucune pour lui rendre celle de son compte", "le superadministrateur seulement"]
preuve = "relire la société du site"
retour = "remettre la société d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "incident_prendre"
libelle = "Prendre en charge un incident : « je m'en occupe »"
risque = "faible"
perimetre = ["un incident ouvert d'un site de la portée de ce compte"]
preuve = "l'incident est en dépannage, pris par ce compte"
retour = "rendre l'incident à son état d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "incident_noter"
libelle = "Ajouter une note à la chronologie d'un incident"
risque = "faible"
perimetre = ["un incident d'un site de la portée de ce compte", "500 caractères au plus"]
preuve = "la note est dans la chronologie"
retour = "retirer la note"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "incident_connu"
libelle = "Dire qu'une panne est connue : son alerte se tait quelques heures, l'incident reste ouvert"
risque = "faible"
perimetre = ["un incident ouvert d'un site de la portée de ce compte", "de 1 heure à 7 jours, ou 0 pour que l'alerte reparle", "les mesures continuent"]
preuve = "l'échéance du silence est celle demandée"
retour = "remettre l'échéance d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra"]

[[capacites]]
id = "incident_clore"
libelle = "Clore un incident dont le site répond de nouveau, en notant sa cause (ou noter la cause d'un incident déjà clos)"
risque = "faible"
perimetre = ["un incident rétabli ou résolu d'un site de la portée de ce compte", "jamais un incident dont le site ne répond pas encore"]
preuve = "l'incident est résolu, avec cette cause"
retour = "rendre l'incident à son état et à sa cause d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "retirer"
libelle = "Retirer un site déclaré (ou une déclaration en attente de preuve) de la liste d'un compte (jamais un site du panneau)"
risque = "faible"
perimetre = ["un site déclaré par ce compte", "son historique est gardé", "ses liens sont mis de côté, ses accords tombent, sa demande ouverte se ferme"]
preuve = "le site n'est plus dans la liste du compte"
retour = "redéclarer le site au même compte"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "attribuer"
libelle = "Attribuer un site (déclaré ou du panneau) à un compte"
risque = "moyen"
droit = "administrer"
perimetre = ["un site sans propriétaire", "le compte reçoit la vue et le journal de ce site"]
preuve = "relire la ligne du site : compte et origine conformes"
retour = "retirer l'attribution"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "transferer"
libelle = "Faire passer un site d'un compte à un autre"
risque = "moyen"
droit = "administrer"
perimetre = ["un site déjà attribué ou déclaré", "un compte destinataire connu", "les liens, accords et demande de l'ancien compte ne suivent pas"]
preuve = "le site est au compte destinataire et plus à l'ancien"
retour = "remettre le site à l'ancien compte"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]


[[capacites]]
id = "demander"
libelle = "Demander que son site déclaré passe au panneau (une demande ouverte par site)"
risque = "faible"
perimetre = ["un site déclaré par ce compte", "un message de 500 caractères au plus"]
preuve = "la demande est ouverte pour ce site"
retour = "annuler la demande"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "repondre_demande"
libelle = "Fermer une demande d'adossement : fait, ou refusée"
risque = "faible"
droit = "administrer"
perimetre = ["une demande ouverte"]
preuve = "la demande est fermée avec cette décision"
retour = "rouvrir la demande"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "accorder"
libelle = "Le propriétaire autorise l'administrateur à faire un geste lourd sur son site, pour un temps limité"
risque = "faible"
perimetre = ["un site à ce compte", "un geste parmi restaurer, supprimer, transferer, migrer", "de 1 heure à 7 jours", "l'accord tombe si le site change de compte"]
preuve = "l'accord est valable pour ce site et ce geste"
retour = "révoquer cet accord"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "lier"
libelle = "Rattacher un projet, un contact, une machine ou une note à un site"
risque = "faible"
perimetre = ["un site de la portée de ce compte"]
preuve = "relire le lien"
retour = "retirer le lien"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "delier"
libelle = "Retirer un lien d'un site"
risque = "faible"
perimetre = ["un lien existant d'un site de la portée de ce compte"]
preuve = "le lien n'existe plus"
retour = "remettre le lien retiré"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[permissions]
stockage = true
lectures = true
reseau = ["les sites suivis (et leur « www. »), en HTTPS sur le port 443 : une requête GET, 2 Ko lus, les redirections suivies seulement vers le même site ; jamais une adresse interne, sauf réglage « sonde_interne »", "pour une preuve de propriété : une question DNS TXT aux serveurs de noms de la machine, et le fichier /.well-known/cassandra-site.txt du site (256 octets lus)"]

[[capacites]]
id = "serie"
libelle = "Les points de la sonde (disponibilité, temps de réponse, jours avant expiration du certificat, pannes) pour l'historique : une courbe par site de la portée du compte"
risque = "lecture"

[[mesures]]
id = "site_up"
libelle = "Sites — disponibilité"
capacite = "serie"
unite = "%"
famille = "Sites"
groupee = true
pire = "bas"
description = "Part du temps où chaque site a répondu."

[[mesures]]
id = "site_ms"
libelle = "Sites — temps de réponse"
capacite = "serie"
unite = "ms"
famille = "Sites"
groupee = true
description = "Durée de réponse mesurée, site par site. Au-delà du seuil réglé (3 s par défaut), le visiteur considère le site en panne."

[[mesures]]
id = "site_ssl"
libelle = "Sites — jours avant expiration SSL"
capacite = "serie"
unite = "j"
famille = "Sites"
groupee = true
agregat = "min"
pire = "bas"
description = "Le certificat le plus proche de l'expiration en premier."

[[mesures]]
id = "site_down"
libelle = "Sites — pannes"
capacite = "serie"
genre = "compteur"
unite = "/j"
famille = "Sites"
vide = "rien_a_signaler"
description = "Sites tombés. Le compte que personne ne tenait."
