droit = "utiliser"

[[capacites]]
id = "invitations"
libelle = "Les invitations en attente pour mon compte"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "corbeille"
libelle = "Mes projets à la corbeille"
risque = "lecture"
droit = "utiliser"

