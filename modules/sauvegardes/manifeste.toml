[module]
id = "sauvegardes"
nom = "Sauvegardes"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Plans de sauvegarde : planifier, lancer, vérifier l'empreinte, faire un essai de restauration, purger et historiser."
confiance = "interne"
famille = "securite"
requiert = ["droits"]

[[droits]]
id = "gerer"
libelle = "Gérer les plans de sauvegarde, lancer des sauvegardes et des restaurations"
sensible = true

[[droits]]
id = "lire"
libelle = "Voir les plans, l'historique et la couverture de sauvegarde"
defaut = true

[[reglages]]
id = "preuve_jours"
libelle = "Preuves (empreinte, restauration à blanc) : fréquence en jours"
type = "entier"
defaut = 7
portee = "global"

[[reglages]]
id = "fp_actif"
libelle = "Intégrer les plans FastPanel"
type = "booleen"
defaut = false
portee = "global"

[[reglages]]
id = "chemin_memoire"
libelle = "Chemin de la mémoire (pour la couverture)"
type = "texte"
defaut = "/root/.claude"
portee = "global"

[[reglages]]
id = "chemin_coffre"
libelle = "Chemin du coffre-fort (pour la couverture)"
type = "texte"
defaut = "/opt/vaultwarden"
portee = "global"

[[objets]]
type = "plan"
libelle = "Plan de sauvegarde"

[[objets]]
type = "copie"
libelle = "Copie de sauvegarde"

[evenements]
emet = ["plan.cree", "plan.modifie", "plan.supprime", "copie.lancee", "copie.verifiee", "copie.restauree", "plan.purge", "plan.tick"]
ecoute = []

[[moteurs]]
id = "tick"
libelle = "Lance les plans dus"
mode = "periodique"
toutes_les_s = 600
duree_max_s = 3600

[[moteurs]]
id = "preuves"
libelle = "Vérifie les empreintes et restaure en bac à sable (une par plan)"
mode = "periodique"
toutes_les_s = 3600
duree_max_s = 3600

[[detecteurs]]
id = "echecs"
libelle = "Détecte les sauvegardes et vérifications récemment échouées"
frequence_s = 3600

[[capacites]]
id = "lister"
libelle = "Lister les plans de sauvegarde"
risque = "lecture"
droit = "lire"

[[capacites]]
id = "enregistrer"
libelle = "Créer ou modifier un plan de sauvegarde"
risque = "moyen"
droit = "gerer"
perimetre = ["table sauv_plans"]
preuve = "relire le plan enregistré"
retour = "remettre l'état d'avant"

[[capacites]]
id = "supprimer"
libelle = "Supprimer un plan de sauvegarde"
risque = "moyen"
droit = "gerer"
perimetre = ["table sauv_plans"]
preuve = "vérifier l'état supprimé"
retour = "remettre l'état d'avant (désupprimer)"

[[capacites]]
id = "lancer"
libelle = "Lancer un plan de sauvegarde (à blanc ou réel)"
risque = "moyen"
droit = "gerer"
perimetre = ["table sauv_copies et date dernier lancement de sauv_plans"]
preuve = "relire la copie créée"
retour = "supprimer la ligne de la copie"

[[capacites]]
id = "verifier"
libelle = "Vérifier l'empreinte d'un fichier au hasard d'une copie"
risque = "faible"
droit = "gerer"
perimetre = ["table sauv_copies (champ verifie)"]
preuve = "relire le statut vérifié de la copie"
retour = "remettre le statut de vérification d'avant"

[[capacites]]
id = "purger"
libelle = "Purger les anciens dossiers de sauvegarde (rotation)"
risque = "eleve"
droit = "gerer"
perimetre = ["destination rclone distante"]
preuve = "pas de preuve locale fiable sans rappel rclone lourd"
retour = "impossible : destruction sur le distant"

[[capacites]]
id = "restaurer"
libelle = "Restaurer une copie (écrase ou met à côté)"
risque = "eleve"
droit = "gerer"
perimetre = ["système de fichiers local"]
preuve = "pas de preuve implémentée"
retour = "impossible : modification du système de fichiers local"

[[capacites]]
id = "historique"
libelle = "Lister l'historique des copies de sauvegarde"
risque = "lecture"
droit = "lire"

[[capacites]]
id = "destinations"
libelle = "Lister les destinations déclarées et leur utilisation"
risque = "lecture"
droit = "lire"

[[capacites]]
id = "couverture"
libelle = "Vérifier ce qui est protégé et ce qui ne l'est pas"
risque = "lecture"
droit = "lire"

[permissions]
stockage = true
droits = true
introspection = true
