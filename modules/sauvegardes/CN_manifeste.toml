# ▼▼▼ BORNE CN version=0.1.0 empreinte=7a3b1b ▼▼▼
[module]
id = "sauvegardes"
nom = "Sauvegardes"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Les plans de sauvegarde : une portée décide du moteur (un site ou une base passe par FastPanel, le reste par rclone), la rotation par dossiers datés, la vérification par échantillon. Ici : les plans, l'historique des copies, les destinations et la couverture. Différé : l'exécution rclone, la restauration, la vérification (par le courtier racine), et la planification."
confiance = "interne"
famille = "supervision"
importance = "important"
sans = "Plus de suivi des sauvegardes : une copie qui vieillit ou échoue ne déclenche plus d'alerte."

[[objets]]
type = "plan_sauvegarde"
libelle = "Un plan de sauvegarde"

[permissions]
stockage = true
racine = true

[[racine]]
id = "copier"
libelle = "Exécuter rclone copy d'une source vers une destination datée (avec ou sans test à blanc)"

[[racine]]
id = "lister"
libelle = "Lister les dossiers d'une destination rclone (lecture seule)"

[[racine]]
id = "purger"
libelle = "Ne garder que les N dossiers datés les plus récents d'une destination rclone"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "plans"
libelle = "Les plans de sauvegarde, avec l'âge de la dernière copie (vert/ambre/rouge selon l'âge, jamais selon l'existence)"
risque = "lecture"

[[capacites]]
id = "copies"
libelle = "L'historique des copies d'un plan : résultat, fichiers, octets, durée, vérification"
risque = "lecture"

[[capacites]]
id = "destinations"
libelle = "Les destinations de sauvegarde connues (distants rclone et dossiers)"
risque = "lecture"

[[capacites]]
id = "couverture"
libelle = "Ce qui est couvert et ce qui ne l'est pas : sites, bases, documents, par plan"
risque = "lecture"

[[capacites]]
id = "plan_save"
libelle = "Créer ou modifier un plan de sauvegarde (la portée décide du moteur ; une destination doit être un distant ou une racine déclarée)"
risque = "faible"
perimetre = ["un plan de sauvegarde"]
preuve = "le plan relu"
retour = "remettre le plan d'avant (ou le retirer si neuf)"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "plan_delete"
libelle = "Supprimer un plan et son historique de copies (les sauvegardes déjà faites restent sur leur destination)"
risque = "faible"
perimetre = ["un plan de sauvegarde et ses copies"]
preuve = "le plan n'existe plus"
retour = "remettre le plan"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "plan_run"
libelle = "Exécuter un plan (test à blanc par défaut) via rclone par le courtier, et inscrire la copie au journal"
risque = "faible"
perimetre = ["une copie d'un plan de sauvegarde"]
preuve = "la copie est inscrite"
retour = "supprimer la ligne de copie"
paliers = ["raconter", "auto", "maitre"]
# ▲▲▲ FIN BORNE CN ▲▲▲

# ═══ EXPLICATIF CN / EC ═══════════════════════════════════════════════════════
# CN : tout ce fichier est du nexus : à compléter
# EC : néant (aucun point d'évolution déclaré pour l'instant)
# LIEN : à compléter (contrat, fichiers voisins)

[[points_evolution]]
id = "age_mot"
libelle = "L'âge d'une sauvegarde dit en mots (jamais, 12 min, 5 h, 3 j) : l'âge en heures en entrée, le texte en sortie"
contrat = "1.0"
reference = "points/EC_age_mot"
fonction = "point_age_mot"
runtime = "python"

[[points_evolution]]
id = "etat"
libelle = "L'état d'une sauvegarde (ok, à surveiller, danger) selon son âge : l'âge et le seuil en heures en entrée, l'état en sortie"
contrat = "1.0"
reference = "points/EC_etat"
fonction = "point_etat"
runtime = "python"
