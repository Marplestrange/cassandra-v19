# RÔLE       : Assemble le thème et la mise en page que les modules actifs déclarent : tuiles, gabarits, touches de couleur, contraste vérifié, personnalisation par compte.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
