# ▼▼▼ BORNE CN version=0.6.0 empreinte=58195b ▼▼▼
[module]
id = "affichage"
nom = "Affichage"
version = "0.6.0"
noyau_min = "0.1.0"
description = "Assemble le thème et la mise en page que les modules actifs déclarent : tuiles, gabarits, touches de couleur, contraste vérifié, personnalisation par compte."
confiance = "interne"
famille = "socle"
essentiel = true

[[objets]]
type = "affichage_catalogue"
libelle = "Les écrans, tuiles et touches de couleur déclarés par les modules actifs"

[[objets]]
type = "widget_donnees"
libelle = "La dernière donnée d'une tuile (lue par un moteur, servie à l'interface)"

[[objets]]
type = "theme_perso"
libelle = "Le choix de thème, de densité et d'accent, global ou d'un compte"

[[objets]]
type = "organisation"
libelle = "L'organisation : nom, logo, forme juridique, identifiant légal, adresse, fuseau et langue par défaut"

[[objets]]
type = "epingle"
libelle = "Une page épinglée par un compte en tête de sa colonne de gauche"

[[objets]]
type = "plan_jour"
libelle = "Le plan d'un jour pour un compte : les blocs (tâche ou libre) posés sur la journée, avec heure de début et durée"

[[objets]]
type = "reglage_jour"
libelle = "Le réglage de la page Aujourd'hui d'un compte : heures de début et de fin de sa journée, durée de concentration, durée de ses tâches"

[[objets]]
type = "fil_page"
libelle = "Un fil du panneau conversationnel (un fil du salon), lié à un interlocuteur et, s'il y a lieu, à une page"

[[objets]]
type = "widget_perso"
libelle = "La personnalisation d'une tuile (masquée, déplacée, réordonnée), globale ou d'un compte"

[evenements]
emet = ["affichage_catalogue.change"]
ecoute = ["noyau.greffe", "noyau.module_debranche"]

[[moteurs]]
id = "reconstruire"
libelle = "Rebâtit le catalogue d'affichage quand un module est branché ou débranché"
mode = "evenement"
sur = ["noyau.greffe", "noyau.module_debranche"]
duree_max_s = 20

[[moteurs]]
id = "reconstruire_regulierement"
libelle = "Rebâtit le catalogue régulièrement (filet)"
mode = "periodique"
toutes_les_s = 300
duree_max_s = 20

[[moteurs]]
id = "donnees_widgets"
libelle = "Lit les sources des tuiles à leur rythme, pour que l'interface lise une donnée prête"
mode = "periodique"
toutes_les_s = 10
duree_max_s = 30

[[capacites]]
id = "lire_theme"
libelle = "Lire le thème résolu (jetons CSS) pour un compte et une préférence du système"
risque = "lecture"

[[capacites]]
id = "lire_onglets"
libelle = "Lire les onglets que les modules ajoutent à la fiche d'un objet"
risque = "lecture"

[[capacites]]
id = "lire_habillages"
libelle = "Lire les thèmes complets (variables CSS) que les modules livrent"
risque = "lecture"

[[capacites]]
id = "lire_ecran"
libelle = "Lire la mise en page d'un écran : zones, tuiles, données"
risque = "lecture"

[[capacites]]
id = "personnaliser_theme"
libelle = "Choisir le thème, la densité et l'accent, pour tous ou pour un compte"
risque = "faible"
perimetre = ["objets theme_perso du compte demandé"]
preuve = "relire le choix écrit"
retour = "restaurer le choix précédent, ou le retirer s'il n'y en avait pas"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "personnaliser_widget"
libelle = "Masquer, déplacer ou réordonner une tuile, pour tous ou pour un compte"
risque = "faible"
perimetre = ["objets widget_perso du compte demandé"]
preuve = "relire la personnalisation écrite"
retour = "restaurer la personnalisation précédente, ou la retirer s'il n'y en avait pas"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[points_evolution]]
id = "disposition"
libelle = "La disposition des menus : les entrées visibles par le compte en entrée, les groupes, entrées, sous-entrées, menu de l'avatar et niveaux d'alerte en sortie"
contrat = "1.0"
reference = "points/EC_disposition"
fonction = "point_disposition"
runtime = "python"

[[points_evolution]]
id = "idees"
libelle = "Les idées du panneau : les alertes du compte, le contexte (page, interlocuteur, heure) et les gestes proposables en entrée, au plus quelques idées classées avec leur raison en sortie"
contrat = "1.0"
reference = "points/EC_idees"
fonction = "point_idees"
runtime = "python"

[[capacites]]
id = "lire_disposition"
libelle = "Lire la disposition des menus pour le compte : groupes, entrées, sous-entrées, menu de l'avatar, pages épinglées, organisation et niveau d'alerte"
risque = "lecture"

[[capacites]]
id = "lire_idees"
libelle = "Lire les idées du panneau conversationnel pour la page et l'interlocuteur, avec leur raison"
risque = "lecture"

[[capacites]]
id = "lire_session"
libelle = "Lire ce que le serveur sait de la session en cours : compte, rôle, adresse de la connexion, organisation, dernières sessions"
risque = "lecture"
masque = ["ip_session"]

[[capacites]]
id = "lire_organisation"
libelle = "Lire l'organisation : toutes ses rubriques pour un administrateur, son nom et ses logos pour les autres"
risque = "lecture"

[[capacites]]
id = "lire_fils"
libelle = "Lire les fils du panneau d'un interlocuteur (Itare, Cassandra, invités), avec la page à laquelle chacun est lié"
risque = "lecture"

[[capacites]]
id = "modifier_organisation"
libelle = "Régler une rubrique de l'organisation (organisation, réseaux sociaux, heures d'ouverture, sous-traitants) : un administrateur seulement"
risque = "faible"
perimetre = ["l'objet organisation"]
preuve = "relire l'organisation écrite"
retour = "restaurer l'organisation précédente, ou le réglage par défaut s'il n'y en avait pas"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "lire_plan"
libelle = "Lire les blocs que le compte a posés sur sa journée (le sien seulement)"
risque = "lecture"

[[capacites]]
id = "modifier_plan"
libelle = "Remplacer les blocs du plan d'un jour pour le compte : tâche ou bloc libre, début, durée, fait"
risque = "faible"
perimetre = ["les objets plan_jour du compte"]
preuve = "relire le plan écrit"
retour = "restaurer le plan précédent, ou le retirer s'il n'y en avait pas"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "lire_reglage_jour"
libelle = "Lire le réglage de la page Aujourd'hui du compte (le sien seulement)"
risque = "lecture"

[[capacites]]
id = "modifier_reglage_jour"
libelle = "Régler la page Aujourd'hui du compte : début et fin de la journée, durée de concentration, durée des tâches"
risque = "faible"
perimetre = ["l'objet reglage_jour du compte"]
preuve = "relire le réglage écrit"
retour = "restaurer le réglage précédent, ou le retirer s'il n'y en avait pas"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "epingler"
libelle = "Épingler une page en tête de la colonne de gauche du compte"
risque = "faible"
perimetre = ["les objets epingle du compte"]
preuve = "relire l'épingle écrite"
retour = "retirer l'épingle, ou restaurer la précédente"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "desepingler"
libelle = "Retirer une page épinglée du compte"
risque = "faible"
perimetre = ["les objets epingle du compte"]
preuve = "relire que l'épingle a disparu"
retour = "remettre l'épingle retirée"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "lier_fil"
libelle = "Lier un fil du salon à un interlocuteur du panneau et à une page"
risque = "faible"
perimetre = ["les objets fil_page du compte"]
preuve = "relire le lien écrit"
retour = "retirer le lien, ou restaurer le précédent"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[ecrans]]
id = "vue_info"
libelle = "Info Cassandra"
domaine = "socle"
gabarit = "libre"

[[ecrans]]
id = "vue_societe"
libelle = "Société / Organisation"
domaine = "socle"
gabarit = "libre"

[[ecrans]]
id = "vue_affichage"
libelle = "Affichage"
domaine = "socle"
gabarit = "liste_detail"

[[menus]]
id = "societe"
libelle = "Société / Organisation"
ecran = "vue_societe"
ordre = 20
role = "admin"
icone = "building"
zone = "avatar"

[permissions]
introspection = true
lectures = true
