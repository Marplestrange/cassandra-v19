# TITRE      : Manifeste du module Tailscale
# LICENCE    : AGPL-3.0
# AUTEUR     : Atek Drisse
# GIT        : github.com/Marplestrange
# MAIL       : marplestrange@cassandra.center
# MODULE     : tailscale
# ZONE       : CN
# VERSION CN : 0.5.0  #5711e5
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : Le réseau privé Tailscale de la machine, piloté depuis l'interface : voir où elle en est, la connecter (par un lien à ouvrir ou par une clé), la déconnecter, activer SSH par Tailscale.
# MÉTHODE    : le client `tailscale` local, par son socket ; l'installateur donne à l'utilisateur de Cassandra le droit de le piloter (--operator), jamais de root.
# ══════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.5.0 empreinte=5711e5 ▼▼▼
[module]
id = "tailscale"
nom = "Tailscale"
version = "0.5.0"
noyau_min = "0.1.0"
description = "Le réseau privé Tailscale de la machine, piloté depuis l'interface : voir où elle en est, la connecter (par un lien à ouvrir ou par une clé), la déconnecter, activer SSH par Tailscale."
confiance = "interne"
famille = "reseau"
groupe = "parc"
proprietaire = "cassandra"
importance = "optionnel"
sans = "Plus de connexion à Tailscale depuis l'interface : il faudra la faire en ligne de commande (tailscale up)."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[droits]]
id = "utiliser"
libelle = "Voir l'état de Tailscale sur cette machine"
defaut = true

[[droits]]
id = "administrer"
libelle = "Connecter ou déconnecter la machine du réseau Tailscale, activer SSH par Tailscale"
sensible = true

[[objets]]
type = "reseau_prive"
libelle = "La connexion Tailscale de la machine"

[permissions]
stockage = true
reseau = ["le client Tailscale local (son socket) ; login.tailscale.com par ce client"]

[[reglages]]
id = "cle_auth"
libelle = "Clé d'authentification Tailscale (tskey-auth-…), le temps d'une connexion : l'écran l'efface aussitôt"
type = "secret"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "etat"
libelle = "Où en est Tailscale sur cette machine : installé ou non, connecté ou non, lien de connexion en attente, adresse, nom, machines du réseau"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "connecter"
libelle = "Connecter la machine à un réseau Tailscale : sans clé, rend un lien à ouvrir pour s'identifier ; avec une clé d'authentification, se connecte seule"
risque = "moyen"
droit = "administrer"
perimetre = ["la connexion Tailscale de cette machine", "le client local seulement, jamais le panneau d'administration du réseau"]
preuve = "l'état du client est « connecté » (tailscale status)"
retour = "déconnecter la machine (tailscale down)"

[[capacites]]
id = "annuler"
libelle = "Abandonner une connexion commencée et jamais terminée (le lien ouvert reste sans effet)"
risque = "faible"
droit = "administrer"
perimetre = ["une connexion commencée et pas terminée"]
preuve = "plus aucune connexion en attente et le client est coupé"
retour = "relancer la connexion (aucune identification n'a eu lieu)"

[[capacites]]
id = "deconnecter"
libelle = "Couper Tailscale sur cette machine sans l'oublier : elle se reconnecte d'un clic, sans nouvelle identification"
risque = "moyen"
droit = "administrer"
perimetre = ["la connexion Tailscale de cette machine"]
preuve = "l'état du client n'est plus « connecté »"
retour = "reconnecter la machine : elle garde son identité, sans nouvelle identification"

[[capacites]]
id = "quitter"
libelle = "Retirer la machine du réseau Tailscale (déconnexion complète : une nouvelle identification sera demandée)"
risque = "eleve"
droit = "administrer"
perimetre = ["la connexion Tailscale de cette machine"]
preuve = "l'état du client demande une nouvelle identification"
retour = "se reconnecter : une nouvelle identification est demandée (la machine peut changer d'adresse dans le réseau). Le retrait efface AUSSI le droit d'opérateur de Cassandra : avant de reconnecter depuis l'interface, sur la machine, `sudo tailscale set --operator=cassandra`"

[[capacites]]
id = "ssh_regler"
libelle = "Activer ou couper SSH par Tailscale (entrer sur la machine depuis le réseau privé sans clé)"
risque = "moyen"
droit = "administrer"
perimetre = ["l'option SSH du client Tailscale de cette machine"]
preuve = "relire les préférences du client : RunSSH a la valeur demandée"
retour = "remettre l'option à sa valeur précédente"

[[capacites]]
id = "regler"
libelle = "Changer un réglage du client Tailscale sans toucher aux autres : accepter les routes des autres machines, le DNS du réseau, le bouclier (refuser les connexions entrantes), le nom de la machine, les routes qu'elle annonce, la sortie Internet qu'elle offre, la sortie Internet qu'elle utilise"
risque = "moyen"
droit = "administrer"
perimetre = ["un réglage du client Tailscale de cette machine, parmi une liste fermée", "`tailscale set` : jamais `up --reset`, les autres réglages ne bougent pas"]
preuve = "relire les préférences du client : le réglage a la valeur demandée"
retour = "remettre le réglage à sa valeur précédente"

[[capacites]]
id = "ping"
libelle = "Joindre une machine du réseau Tailscale et dire par quel chemin (direct ou relais) et en combien de temps"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "journal"
libelle = "Les derniers gestes faits sur Tailscale depuis Cassandra : quand, par qui, quoi, et ce qui peut encore se défaire"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "defaire_geste"
libelle = "Défaire un geste du journal Tailscale : reconnecter après une coupure, remettre un réglage ou SSH à leur valeur d'avant, couper une connexion que l'on vient d'ouvrir"
risque = "moyen"
droit = "administrer"
perimetre = ["un geste noté au journal de ce module, une seule fois", "le même retour que celui du geste d'origine"]
preuve = "le geste est marqué défait au journal"
retour = "refaire le geste"

[[capacites]]
id = "reseau"
libelle = "La santé du réseau de cette machine : UDP, IPv4, IPv6, le relais Tailscale (DERP) préféré et la latence vers les plus proches (netcheck, quelques secondes)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "services"
libelle = "Les services que cette machine publie dans le réseau Tailscale (tailscale serve), et ceux que Funnel expose à Internet"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "serve_regler"
libelle = "Publier un service LOCAL de cette machine dans le réseau Tailscale, en HTTPS (443, 8443 ou 10000) : visible des seules machines du réseau. Jamais Internet (Funnel), jamais une autre machine que celle-ci"
risque = "moyen"
droit = "administrer"
perimetre = ["un port local de cette machine (127.0.0.1) vers le réseau Tailscale seulement", "`tailscale serve --bg` : ni Funnel, ni cible distante, ni fichier"]
preuve = "relire `tailscale serve status` : le service est publié sur ce port et ce chemin"
retour = "retirer le service (possible seulement s'il n'y en avait aucun avant)"

[[capacites]]
id = "serve_retirer"
libelle = "Retirer tous les services publiés par Tailscale Serve, et ce que Funnel exposait à Internet"
risque = "moyen"
droit = "administrer"
perimetre = ["la configuration Tailscale Serve de cette machine"]
preuve = "relire `tailscale serve status` : plus rien de publié"
retour = "republier les services un à un (la configuration d'avant est notée au journal, pas rétablie seule)"

[[ecrans]]
