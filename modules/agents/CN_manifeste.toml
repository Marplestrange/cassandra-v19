id = "resume_resultat"
libelle = "Ce que le modèle lit d'un acte : le résultat de l'acte en entrée, la phrase qui le dit en sortie (le résultat, ou pourquoi il n'y en a pas : jamais un silence)"
contrat = "1.0"
reference = "points/EC_resume_resultat"
fonction = "point_resume_resultat"
runtime = "python"

[[points_evolution]]
id = "choisir_outils"
libelle = "Les outils présentés d'emblée à un agent : le catalogue, la demande et le nombre maximal en entrée, la sélection en sortie (ceux que la demande touche, puis les lectures)"
contrat = "1.0"
reference = "points/EC_choisir_outils"
fonction = "point_choisir_outils"
runtime = "python"

[[points_evolution]]
id = "prompt_systeme"
libelle = "prompt_systeme (extrait automatiquement de CN_outils.py)"
contrat = "1.0"
reference = "points/EC_prompt_systeme"
fonction = "point_prompt_systeme"
runtime = "python"
