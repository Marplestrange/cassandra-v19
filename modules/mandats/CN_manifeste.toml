# RÔLE       : Les mandats d'envoi : l'autorisation d'envoyer, avec ses bornes (à qui, quand, combien, sous quel contrôle). La règle d'or : l'adresse ne vient JAMAIS de la demande. Différé : la résolution du destinataire et l'envoi réel (dépendent du courrier et des contacts).
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.2.0 empreinte=cd8a2a ▼▼▼
[module]
id = "mandats"
nom = "Mandats"
version = "0.2.0"
noyau_min = "0.1.0"
description = "Les mandats d'envoi : l'autorisation d'envoyer, avec ses bornes (à qui, quand, combien, sous quel contrôle). La règle d'or : l'adresse ne vient JAMAIS de la demande — elle se déréférence depuis le carnet, le courrier ou une liste fermée. Un envoi attend l'accord d'un humain, ou une minuterie que l'on peut arrêter, ou part seul ; il est posté par le courrier, qui ne reçoit qu'un numéro d'envoi."
confiance = "interne"
famille = "echanges"
importance = "important"
sans = "Les agents ne peuvent plus envoyer de messages : plus de mandat pour les y autoriser."

[[droits]]
id = "utiliser"
libelle = "Utiliser Mandats : consulter et travailler dans ce module"
defaut = true

[[droits]]
id = "administrer"
libelle = "Administrer Mandats : réglages et gestes sensibles"
sensible = true

[[objets]]
type = "mandat"
libelle = "Un mandat d'envoi"

[permissions]
stockage = true
lectures = true
agir = true

[[moteurs]]
id = "minuterie"
libelle = "Fait partir les envois différés dont la minuterie est écoulée (sauf si on les a arrêtés), et clôt ceux qu'un accord a laissés sans issue"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 120

[[capacites]]
id = "mandats"
libelle = "Les mandats d'envoi"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "plan"
libelle = "Un mandat tel qu'il se lit à voix haute : quand, à qui, quoi, sous quel contrôle, dans quelles limites"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "envois"
libelle = "Le journal des envois : ce qui est parti (ou pas), et pourquoi"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "save"
libelle = "Créer ou modifier un mandat (au moins un déclencheur, une source de destinataire connue, des variables déclarées — une adresse libre impose l'accord requis)"
risque = "faible"
droit = "utiliser"
perimetre = ["un mandat d'envoi"]
preuve = "le mandat relu"
retour = "remettre le mandat d'avant (ou le retirer si neuf)"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "delete"
libelle = "Supprimer un mandat (le journal des envois survit)"
risque = "faible"
droit = "utiliser"
perimetre = ["un mandat d'envoi"]
preuve = "le mandat n'existe plus"
retour = "remettre le mandat"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "suspendre"
libelle = "Suspendre ou reprendre un mandat"
risque = "faible"
droit = "utiliser"
perimetre = ["la suspension d'un mandat"]
preuve = "la suspension relue"
retour = "remettre la suspension d'avant"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "essai"
libelle = "L'essai à blanc d'un mandat : tous les verrous joués (origine, destinataire déréférencé, variables, pièce, limites), rien mis en file, rien envoyé"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "envoi_a_poster"
libelle = "L'envoi autorisé tel qu'il doit partir : réservé au courrier, qui ne reçoit de l'appelant qu'un numéro"
risque = "lecture"
droit = "utiliser"
qui = ["humain", "compte", "cassandra"]

[[capacites]]
id = "declencher"
libelle = "Déclencher un mandat : l'envoi part seul, attend une minuterie ou attend l'accord d'un humain, selon le contrôle du mandat (le destinataire vient du mandat, jamais de la demande)"
risque = "moyen"
droit = "utiliser"
perimetre = ["un mandat d'envoi", "ses quotas, sa plage horaire, son destinataire déréférencé"]
preuve = "l'envoi est consigné au journal des envois"
retour = "arrêter l'envoi tant qu'il attend ; un message parti ne se rappelle pas"
paliers = ["raconter", "auto"]
sortant = true

[[capacites]]
id = "accord"
libelle = "Donner l'accord à un envoi qui attend : réservé à un humain"
risque = "eleve"
droit = "utiliser"
perimetre = ["un envoi en attente"]
preuve = "l'envoi est autorisé"
retour = "remettre l'envoi en attente tant que le courrier ne l'a pas posté"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]
sortant = true

[[capacites]]
id = "sortie"
libelle = "Déclarer l'issue d'un envoi autorisé : parti (avec le message) ou échoué (avec la raison)"
risque = "faible"
droit = "utiliser"
perimetre = ["l'issue d'un envoi autorisé"]
preuve = "l'état de l'envoi relu"
retour = "aucun : c'est le constat de ce que le courrier a fait"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "annuler"
libelle = "Arrêter un envoi qui attend (accord ou minuterie)"
risque = "faible"
droit = "utiliser"
perimetre = ["un envoi en attente"]
preuve = "l'envoi est annulé"
retour = "remettre l'envoi en attente"
paliers = ["raconter", "auto", "maitre"]
# ▲▲▲ FIN BORNE CN ▲▲▲

