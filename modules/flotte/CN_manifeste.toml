[module]
id = "flotte"
nom = "Flotte"
version = "0.1.1"
noyau_min = "0.1.0"
description = "Le parc de machines : le registre déclaré, Tailscale et les relevés SSH côte à côte, la présence mesurée, la disponibilité, le verdict d'ouverture, les commandes nommées sur une machine. Réservé à l'administrateur."
confiance = "interne"
famille = "reseau"

[[droits]]
id = "gerer"
libelle = "Déclarer, retirer, engager, oublier une machine ; démarrer ou arrêter un service à distance"
sensible = true

[[objets]]
type = "serveur"
libelle = "Une machine du parc"

[evenements]
emet = ["serveur.perte", "serveur.retour", "serveur.disparition", "serveur.controle"]

[[reglages]]
id = "presence_active"
libelle = "Relever la présence des machines (sans elle, le parc ne peut pas dire qu'il répond)"
type = "booleen"
defaut = true

[[reglages]]
id = "presence_s"
libelle = "Période de la présence, en secondes"
type = "entier"
defaut = 300

[[reglages]]
id = "delai_s"
libelle = "Délai global d'une passe sur le registre, en secondes (une machine lente ne retient pas les autres)"
type = "entier"
defaut = 20

[[reglages]]
id = "sonde_utilisateurs"
libelle = "Utilisateurs essayés par la sonde Tailscale SSH (séparés par des virgules)"
defaut = "root"

[[moteurs]]
id = "presence"
libelle = "Relève la présence (Tailscale et registre), date les transitions, constate le contrôle SSH, oublie les disparues"
mode = "periodique"
toutes_les_s = 300
duree_max_s = 120

[[moteurs]]
id = "releve"
libelle = "Une sonde SSH par machine contrôlable : disques, mémoire, charge, redémarrage requis, services en échec, RAID, température"
mode = "periodique"
toutes_les_s = 900
duree_max_s = 600

[[detecteurs]]
id = "machine_muette"
libelle = "Une machine attendue ne répond plus"
frequence_s = 300

[[capacites]]
id = "parc"
libelle = "Le parc fusionné : une machine par nom, les sources côte à côte (registre, Tailscale, SSH, relevés) avec leur âge, l'engagement, la disponibilité mesurée"
risque = "lecture"

[[capacites]]
id = "verdict"
libelle = "Ce que le parc dit à l'ouverture : pannes, machines sans contrôle, pertes répétées, disparues ; « tout répond » seulement si la présence tourne"
risque = "lecture"

[[capacites]]
id = "machines"
libelle = "Le registre des machines déclarées (les secrets ne ressortent jamais : seulement lesquels sont posés)"
risque = "lecture"

[[capacites]]
id = "historique"
libelle = "L'historique d'une machine : disponibilité, mesures, événements, liens, derniers relevés"
risque = "lecture"

[[capacites]]
id = "disponibilite"
libelle = "Le taux de disponibilité de chaque machine sur N jours, avec les pannes et le temps d'indisponibilité"
risque = "lecture"

[[capacites]]
id = "evenements"
libelle = "Les derniers événements de la flotte (pertes, retours, découvertes, disparitions, contrôles, actions)"
risque = "lecture"

[[capacites]]
id = "liens"
libelle = "Les liens d'une machine vers un projet, un contact, un domaine, une note"
risque = "lecture"

[[capacites]]
id = "actions"
libelle = "Les commandes nommées qu'on peut lancer sur une machine, et lesquelles modifient"
risque = "lecture"

[[capacites]]
id = "ping"
libelle = "La latence jusqu'à une machine du tailnet, à l'instant"
risque = "lecture"
externe = true

[[capacites]]
id = "diagnostic"
libelle = "Une commande nommée de LECTURE sur une machine, par SSH (diagnostic, disques, mémoire, services, journal, réseau)"
risque = "lecture"
externe = true

[[capacites]]
id = "machine_ajouter"
libelle = "Déclarer (ou mettre à jour) une machine au registre : SSH, ping ou autre Cassandra ; clé, mot de passe et jeton chiffrés"
risque = "moyen"
droit = "gerer"
perimetre = ["une ligne du registre"]
preuve = "la machine est au registre"
retour = "remettre la ligne d'avant, ou la retirer si elle était nouvelle"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "machine_retirer"
libelle = "Retirer une machine du registre (son historique reste)"
risque = "moyen"
droit = "gerer"
perimetre = ["une ligne du registre"]
preuve = "la machine n'est plus au registre"
retour = "remettre la ligne retirée, secrets chiffrés compris"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "machine_basculer"
libelle = "Suspendre ou réactiver la surveillance d'une machine du registre"
risque = "faible"
droit = "gerer"
perimetre = ["une ligne du registre"]
preuve = "l'état actif relu est celui demandé"
retour = "remettre l'état d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "engagement"
libelle = "Poser le statut (attendue, intermittente, retirée) et le niveau de contrôle d'une machine"
risque = "faible"
droit = "gerer"
perimetre = ["l'engagement d'une machine"]
preuve = "l'engagement relu est celui posé"
retour = "remettre l'engagement d'avant, ou l'effacer"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "lien_enregistrer"
libelle = "Lier une machine à un projet, un contact, un domaine ou une note"
risque = "faible"
droit = "gerer"
perimetre = ["un lien de machine"]
preuve = "le lien existe"
retour = "retirer le lien, ou remettre sa note d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "lien_retirer"
libelle = "Retirer le lien d'une machine"
risque = "faible"
droit = "gerer"
perimetre = ["un lien de machine"]
preuve = "le lien n'existe plus"
retour = "remettre le lien retiré"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "oublier"
libelle = "Oublier une machine DISPARUE du tailnet : ses traces s'effacent, l'historique reste"
risque = "moyen"
droit = "gerer"
perimetre = ["les traces d'une machine absente du tailnet et du registre"]
preuve = "plus aucune trace de présence, de sonde, de relevé ni d'engagement"
retour = "remettre les traces effacées"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "service_agir"
libelle = "Démarrer, arrêter ou redémarrer un service d'une machine par SSH (jamais ce qui coupe le lien : sshd, réseau)"
risque = "eleve"
droit = "gerer"
perimetre = ["un service d'une machine du parc"]
preuve = "l'état du service relu est celui attendu"
retour = "remettre le service dans l'état où il était avant"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[ecrans]]
id = "vue_flotte"
libelle = "Flotte"
domaine = "reseau"
gabarit = "tableau"

[[menus]]
id = "flotte"
libelle = "Flotte"
ecran = "vue_flotte"
ordre = 40
role = "admin"
icone = "server"
badge = "constats"

[[widgets]]
id = "etat_parc"
libelle = "Le parc"
ecran = "accueil"
zone = "principal"
taille = "m"
role = "admin"
composant = "etat"
source = "verdict"
rafraichir_s = 60

[[capacites]]
id = "serie"
libelle = "Les points de présence et de ressources de chaque machine (une courbe par machine) et les pertes, pour l'historique"
risque = "lecture"

[[mesures]]
id = "fleet_up"
libelle = "Flotte — disponibilité"
capacite = "serie"
unite = "%"
famille = "Flotte"
groupee = true
pire = "bas"
description = "Part du temps où chaque machine a répondu."

[[mesures]]
id = "fleet_cpu"
libelle = "Flotte — processeur"
capacite = "serie"
unite = "%"
famille = "Flotte"
groupee = true
description = "Charge processeur, une courbe par machine."

[[mesures]]
id = "fleet_ram"
libelle = "Flotte — mémoire"
capacite = "serie"
unite = "%"
famille = "Flotte"
groupee = true
description = "Mémoire occupée, une courbe par machine."

[[mesures]]
id = "fleet_disk"
libelle = "Flotte — disque"
capacite = "serie"
unite = "%"
famille = "Flotte"
groupee = true
description = "Remplissage disque par machine."

[[mesures]]
id = "fleet_down"
libelle = "Flotte — pertes"
capacite = "serie"
genre = "compteur"
unite = "/j"
famille = "Flotte"
vide = "rien_a_signaler"
description = "Machines tombées. Une seule occurrence mérite qu'on regarde."

[permissions]
stockage = true
secrets = true
reseau = ["Tailscale (binaire local), les machines déclarées par SSH, TCP ou HTTP"]
