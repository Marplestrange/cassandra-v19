[module]
id = "fastpanel"
nom = "FastPanel"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Le pont vers le panneau d'hébergement FastPanel. Lit le parc (comptes, sites, certificats, bases, FTP, courrier, DNS, sauvegardes, services) dans la base du panneau, ouverte en lecture seule, et agit par son API : services, certificats, bases, stockages et plans de sauvegarde, avec preuve et retour arrière. Surveille les services tombés, les certificats proches de l'échéance, les sauvegardes absentes ou périmées et les versions de PHP en fin de support. Le plafond d'autonomie est le choix de l'administrateur."
confiance = "interne"
famille = "hebergement"
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[droits]]
id = "voir"
libelle = "Voir le parc d'hébergement : comptes, sites, bases, courrier, sauvegardes, services"
sensible = true

[[droits]]
id = "piloter"
libelle = "Agir sur le panneau : services, certificats, bases, sauvegardes"
sensible = true

[[objets]]
type = "fastpanel"
libelle = "Le panneau FastPanel piloté par Cassandra"

[[objets]]
type = "fastpanel_service"
libelle = "Un service du serveur, tel que le panneau le connaît"

[[reglages]]
id = "url"
libelle = "Adresse du panneau (https://127.0.0.1:8888)"
aide = "Vide : le panneau local, https puis http sur le port 8888. Rempli, c'est la seule adresse essayée : on ne devine pas à côté."

[[reglages]]
id = "utilisateur"
libelle = "Compte du panneau utilisé par Cassandra"
aide = "Un compte dédié, aux droits limités à ce que l'administrateur veut confier."

[[reglages]]
id = "mot_de_passe"
libelle = "Mot de passe de ce compte"
type = "secret"

[[reglages]]
id = "jeton"
libelle = "Jeton d'API du panneau (remplace le couple compte et mot de passe)"
type = "secret"

[[reglages]]
id = "base_panneau"
libelle = "Fichier SQLite du panneau (lecture seule)"
aide = "Vide : les emplacements habituels de FastPanel 2 sont essayés."

[[reglages]]
id = "delai"
libelle = "Délai d'attente d'une requête à l'API, en secondes"
type = "entier"
defaut = 20
minimum = 3
maximum = 120

[[reglages]]
id = "sauvegarde_age_max_j"
libelle = "Âge au-delà duquel une sauvegarde est dite périmée, en jours"
type = "entier"
defaut = 7
minimum = 1
maximum = 365

[[reglages]]
id = "ssl_alerte_j"
libelle = "Jours restants sous lesquels un certificat est signalé"
type = "entier"
defaut = 30
minimum = 1
maximum = 90

[evenements]
emet = ["fastpanel.injoignable", "fastpanel.acces_refuse", "fastpanel.reprise", "fastpanel.service_tombe", "fastpanel.service_revenu"]

[[moteurs]]
id = "releve"
libelle = "Sonde le panneau (services chaque minute, parc et audits tous les quarts d'heure)"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 120

[[detecteurs]]
id = "injoignable"
libelle = "Le panneau ne répond plus"
frequence_s = 60

[[detecteurs]]
id = "acces_refuse"
libelle = "Le panneau refuse les identifiants de Cassandra"
frequence_s = 60

[[detecteurs]]
id = "service_tombe"
libelle = "Un service actif s'est arrêté sans qu'on le lui demande"
frequence_s = 60

[[detecteurs]]
id = "certificat_proche"
libelle = "Un certificat arrive à échéance ou est échu"
frequence_s = 900

[[detecteurs]]
id = "sauvegarde_manquante"
libelle = "Un site n'a aucune sauvegarde réussie, ou elle est périmée"
frequence_s = 900

[[detecteurs]]
id = "php_fin_support"
libelle = "Un site tourne sur une version de PHP sans correctifs de sécurité"
frequence_s = 900

# ------------------------------------------------------------------ lectures
[[capacites]]
id = "sante"
libelle = "Éprouver l'accès : l'API répond-elle, la base du panneau se lit-elle, d'où vient chaque réponse"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "resume"
libelle = "La dernière relève : état du panneau, services, audits"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "utilisateurs"
libelle = "Les comptes du panneau : rôles, accès SSH, quota, sites et bases possédés"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "sites"
libelle = "Les sites : propriétaire, certificat (jours restants), PHP, gestionnaire, statistiques"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "bases"
libelle = "Les bases de données : moteur, taille, propriétaire, site, utilisateurs"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "ftp"
libelle = "Les comptes FTP et le site qu'ils servent"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "mail"
libelle = "Les boîtes mail : quota, taille, domaine"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "dns"
libelle = "Les enregistrements DNS hébergés par le panneau"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "sauvegardes"
libelle = "Les copies de sauvegarde faites : taille, durée, destination, état"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "plans"
libelle = "Les plans de sauvegarde du panneau"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "stockages"
libelle = "Les stockages de sauvegarde déclarés dans le panneau"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "services"
libelle = "Les services du serveur, tels que le panneau les connaît"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "certificats"
libelle = "L'état des certificats du parc : actifs, proches de l'échéance, échus, sans certificat"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "ssl_sonder"
libelle = "Le certificat réellement présenté par un domaine sur le port 443"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "php"
libelle = "Les versions de PHP des sites et celles qui sont en fin de support"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "audit"
libelle = "L'audit du parc : certificats, sauvegardes, PHP (recalculé à l'instant)"
risque = "lecture"
droit = "voir"

# ------------------------------------------------------------------ actions
[[capacites]]
id = "service_relancer"
libelle = "Démarrer, redémarrer ou activer un service par le panneau"
risque = "moyen"
droit = "piloter"
perimetre = ["un service connu du panneau", "start, restart ou enable"]
preuve = "relire l'état du service dans le panneau : il doit être actif (ou activé)"
retour = "remettre le service dans l'état relevé juste avant l'acte"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "service_arreter"
libelle = "Arrêter ou désactiver un service par le panneau"
risque = "eleve"
droit = "piloter"
perimetre = ["un service connu du panneau", "stop ou disable"]
preuve = "relire l'état du service dans le panneau : il doit être arrêté (ou désactivé)"
retour = "remettre le service dans l'état relevé juste avant l'acte"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "ssl_renouveler"
libelle = "Renouveler le certificat Let's Encrypt d'un domaine par le panneau"
risque = "moyen"
droit = "piloter"
perimetre = ["un certificat du panneau", "une demande à l'autorité de certification, qui limite le nombre d'essais"]
preuve = "la date d'émission du certificat doit avoir changé"
retour = "aucun : un certificat renouvelé ne se défait pas, l'ancien reste valable jusqu'à son terme"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "base_creer"
libelle = "Créer une base de données (avec son utilisateur) par le panneau"
risque = "moyen"
droit = "piloter"
masque = ["mot_de_passe"]
perimetre = ["une base nouvelle, nom en lettres, chiffres et souligné", "un serveur de bases déclaré dans le panneau"]
preuve = "la base figure dans la liste du panneau avec le nom demandé"
retour = "supprimer la base que cet acte vient de créer, et elle seule"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "stockage_local_creer"
libelle = "Déclarer un dossier du serveur comme stockage de sauvegarde"
risque = "moyen"
droit = "piloter"
perimetre = ["un dossier absolu du serveur, sans « .. »"]
preuve = "le stockage figure dans la liste du panneau, avec ce nom et ce dossier"
retour = "retirer le stockage que cet acte vient de déclarer"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "plan_creer"
libelle = "Créer un plan de sauvegarde dans un stockage déclaré"
risque = "moyen"
droit = "piloter"
perimetre = ["un plan nouveau, tous les comptes", "un stockage déclaré dans le panneau"]
preuve = "le plan figure dans la liste du panneau avec ce nom"
retour = "supprimer le plan que cet acte vient de créer, et lui seul"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[permissions]
reseau = ["l'API du panneau, à l'adresse des réglages (le port 8888 local par défaut)", "le port 443 d'un domaine, pour en lire le certificat"]
privileges = ["la base SQLite du panneau est ouverte en lecture seule", "le compte du panneau donne ses droits à Cassandra : en faire un compte dédié"]
