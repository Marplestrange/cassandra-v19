[module]
id = "themes"
nom = "Thèmes de la maison"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Deux thèmes complets pour l'interface, livrés comme n'importe quel module : Ardoise (sombre, bleu ardoise et cuivre) et Papier (clair chaud, encre indigo). Ils s'ajoutent au sélecteur d'apparence ; désactiver le module les retire."
confiance = "interne"
famille = "socle"
importance = "optionnel"
sans = "Les thèmes Ardoise et Crème disparaissent ; l'interface garde son thème de base."

[[habillages]]
id = "ardoise"
libelle = "Ardoise"
base = "sombre"
fichier = "themes/CN_ardoise.css"

[[habillages]]
id = "papier"
libelle = "Papier"
base = "creme"
fichier = "themes/CN_papier.css"
