# RÔLE       : Deux thèmes complets pour l'interface, livrés comme n'importe quel module : Ardoise (sombre, bleu ardoise et cuivre) et Papier (clair chaud, encre indigo). Ils s'ajoutent au sélecteur d'apparence ; désactiver le module les retire.
