# MODULE     : certificats
# ZONE       : CN
# VERSION CN : 0.3.0  #cded08
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : Surveille l'expiration des certificats TLS réellement servis (port 443), garde le registre des émissions Let's Encrypt (cinq par semaine et par domaine) et signale les certificats échus ou proches de l'échéance, avec le quota restant. Le renouvellement lui-même se fait par le panneau (module fastpanel, ssl_renouveler) ; ce module en tient le compte.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.3.0 empreinte=cded08 ▼▼▼
[module]
id = "certificats"
nom = "Certificats"
version = "0.3.0"
noyau_min = "0.1.0"
description = "Surveille l'expiration des certificats TLS réellement servis (port 443), garde le registre des émissions Let's Encrypt (cinq par semaine et par domaine) et signale les certificats échus ou proches de l'échéance, avec le quota restant. Le renouvellement lui-même se fait par le panneau (module fastpanel, ssl_renouveler) ; ce module en tient le compte."
confiance = "interne"
famille = "securite"
importance = "important"
sans = "Plus de surveillance de l'expiration des certificats : un site peut tomber sans prévenir."
requiert = ["dns"]
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[droits]]
id = "utiliser"
libelle = "Utiliser Certificats : consulter et travailler dans ce module"
defaut = true

[[droits]]
id = "administrer"
libelle = "Administrer Certificats : réglages et gestes sensibles"
sensible = true

[[droits]]
id = "demander"
libelle = "Demander un certificat pour ses propres sites"
defaut = false

[[droits]]
id = "valider"
libelle = "Valider ou refuser une demande de certificat (jamais la sienne)"
defaut = false
sensible = true

[[droits]]
id = "renouveler"
libelle = "Renouveler ou émettre un certificat (sollicite l'autorité, qui a un quota)"
defaut = false
sensible = true

[[droits]]
id = "revoquer"
libelle = "Révoquer un certificat (non défaisable chez l'autorité)"
defaut = false
sensible = true

[[droits]]
id = "importer"
libelle = "Importer le certificat public d'un hôte géré ailleurs"
defaut = false
sensible = true

[[droits]]
id = "voir_cles"
libelle = "Voir les métadonnées des clés (jamais la clé elle-même)"
defaut = false
sensible = true

[[objets]]
type = "certificat"
libelle = "Certificat TLS d'un hôte"

[[reglages]]
id = "hotes"
libelle = "Hôtes surveillés en plus de ceux du panneau (séparés par des virgules)"

[[reglages]]
id = "seuil_jours"
libelle = "Jours restants sous lesquels un certificat est signalé"
type = "entier"
defaut = 21
minimum = 3
maximum = 90

[[reglages]]
id = "delai_s"
libelle = "Délai d'attente de la connexion au port 443, en secondes"
type = "entier"
defaut = 5
minimum = 1
maximum = 30

[evenements]
emet = ["certificat.proche_expiration", "certificat.renouvele", "certificat.demande", "certificat.valide", "certificat.refuse", "certificat.emis", "certificat.revoque", "certificat.archive"]

[[moteurs]]
id = "sonde"
libelle = "Lit le certificat servi par chaque hôte suivi (toutes les heures)"
mode = "periodique"
toutes_les_s = 3600
duree_max_s = 600

[[moteurs]]
id = "emission"
libelle = "Inscrit au registre les émissions faites par le panneau (événements fastpanel.certificat_renouvele, lus dans le journal du bus)"
mode = "periodique"
toutes_les_s = 300
duree_max_s = 60

[[detecteurs]]
id = "expiration_proche"
libelle = "Certificat échu ou à moins de 21 jours de l'expiration"
frequence_s = 3600

[[capacites]]
id = "relire_expiration"
libelle = "Lire l'expiration du certificat réellement servi par un hôte, à l'instant"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "etat"
libelle = "Les certificats suivis : jours restants, échéance, quota d'émission"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "quota"
libelle = "Combien d'émissions Let's Encrypt restent à un domaine cette semaine, et quand le quota se libère"
risque = "lecture"
droit = "utiliser"

[[ecrans]]
