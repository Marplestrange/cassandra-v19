droit = "administrer"
perimetre = ["un certificat non révoqué"]
preuve = "l'état forcé est relu"
retour = "le certificat est désarchivé"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "desarchiver"
libelle = "Sortir un certificat des archives"
risque = "faible"
droit = "administrer"
perimetre = ["un certificat archivé"]
preuve = "l'état forcé est relu"
retour = "le certificat est de nouveau archivé"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "importer"
libelle = "Importer le certificat PUBLIC d'un hôte géré ailleurs (une clé privée est refusée)"
risque = "moyen"
droit = "importer"
perimetre = ["un certificat PEM public", "jamais une clé privée"]
preuve = "le certificat est relu au registre"
retour = "le certificat et sa fiche sont retirés"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "seuil"
libelle = "Le seuil d'alerte d'expiration (jours restants) : l'unique réglage, lu par les modules qui signalent aussi des certificats"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "signal_jour"
libelle = "Les certificats qui expirent bientôt, pour le bureau du jour"
risque = "lecture"
droit = "utiliser"

[[signaux]]
id = "expirations"
libelle = "Certificats"
capacite = "signal_jour"
admin = true
cadence_s = 3600

[permissions]
stockage = true
lectures = true
introspection = true
reseau = ["le port 443 des hôtes suivis (lecture du certificat présenté)"]

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"
