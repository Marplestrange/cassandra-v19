[[ecrans]]
id = "c_autorites"
libelle = "Autorités"
domaine = "securite"
gabarit = "libre"

[[ecrans]]
id = "c_modeles"
libelle = "Modèles"
domaine = "securite"
gabarit = "tableau"

[[ecrans]]
id = "c_cles"
libelle = "Clés"
domaine = "securite"
gabarit = "tableau"

[[ecrans]]
