risque = "faible"
droit = "renouveler"
perimetre = ["une demande validée"]
preuve = "l'état de la demande est relu"
retour = "la demande revient à « validée »"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "noter_echec"
libelle = "Inscrire un échec d'émission au registre du quota"
risque = "faible"
droit = "renouveler"
perimetre = ["une ligne du registre des émissions, ok=0"]
preuve = "la ligne est relue"
retour = "la ligne est supprimée"
paliers = ["raconter"]
qui = ["humain","cassandra","itare"]

[[capacites]]
id = "revoquer"
libelle = "Marquer un certificat révoqué et le retirer du suivi (la révocation chez l'autorité reste à faire)"
risque = "moyen"
droit = "revoquer"
perimetre = ["un certificat FastPanel ou importé", "aucun appel à l'autorité"]
preuve = "l'état forcé est relu"
retour = "l'état forcé précédent est remis"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "archiver"
libelle = "Archiver un certificat : il sort de la sonde et des constats, l'historique reste"
