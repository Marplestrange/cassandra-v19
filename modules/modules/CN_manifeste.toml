# RÔLE       : La gestion des modules : ce qui est installé, actif ou à installer, ce qui dépend de quoi, et le geste d'activer ou de désactiver. Le noyau fait le travail (dépendances, essentiels, branchement à chaud) ; ce module en fait des capacités, donc des droits, une preuve, un retour et une trace.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.1.0 empreinte=48f96c ▼▼▼
[module]
id = "modules"
nom = "Modules"
version = "0.1.0"
noyau_min = "0.1.0"
description = "La gestion des modules : ce qui est installé, actif ou à installer, ce qui dépend de quoi, et le geste d'activer ou de désactiver. Le noyau fait le travail (dépendances, essentiels, branchement à chaud) ; ce module en fait des capacités, donc des droits, une preuve, un retour et une trace."
confiance = "interne"
famille = "socle"
importance = "vital"
sans = "On ne peut plus activer ni désactiver les modules. Il ne se désactive pas."
essentiel = true
requiert = ["droits"]

[[droits]]
id = "gerer"
libelle = "Activer ou désactiver un module"
sensible = true

[[droits]]
id = "installer"
libelle = "Installer, mettre à jour, retirer un module venu d'une archive (il tourne ensuite dans Cassandra)"
sensible = true

[[reglages]]
id = "politique_confiance"
libelle = "Quels paquets de module s'installent"
type = "choix"
choix = ["signes", "tous"]
defaut = "signes"
aide = "« signes » : seulement les paquets signés par un éditeur dont vous avez posé la clé (config/cles/<éditeur>.pub). « tous » : un paquet non signé est permis, à vos risques : un module installé tourne DANS Cassandra, avec ses droits."

[[reglages]]
id = "autonomie"
libelle = "Jusqu'où Cassandra gère seule les modules"
type = "choix"
choix = ["observer", "entretien", "reine"]
defaut = "reine"
aide = "« reine » : Cassandra gère tout (elle ajoute, met à jour, retire, active, désactive). « entretien » : elle entretient seulement (module révoqué retiré, mise à jour sans permission en plus, module en échec mis en pause). « observer » : elle regarde et raconte ce qu'elle ferait. À tout niveau elle n'installe que le registre officiel et les éditeurs vérifiés, et chaque geste se défait en un clic."

[[reglages]]
id = "registre_url"
libelle = "Adresse d'un AUTRE registre de modules (non officiel)"
aide = "Le registre officiel de Cassandra est intégré à l'application : il n'est pas un réglage et ne se retire pas. Ce réglage en ajoute un second (l'index d'un magasin tiers), affiché comme NON officiel : son index n'est pas signé par la racine de Cassandra, chaque archive y reste examinée de la même façon."

[evenements]
emet = []

[[capacites]]
id = "lister"
libelle = "Le catalogue des modules : état, version, famille, dépendances (requiert / requis par), ce qu'on peut en faire et pourquoi pas"
risque = "lecture"
droit = "gerer"

[[capacites]]
id = "fiche"
libelle = "La fiche d'un module : son état et ce qu'il sait faire, capacité par capacité (paramètres, risque, garantie), limité à ce que le compte a le droit d'utiliser"
risque = "lecture"

[[capacites]]
id = "activer"
libelle = "Activer un module (et ses dépendances) : ses capacités, moteurs et menus se branchent à chaud, rien d'autre ne bouge"
risque = "moyen"
droit = "gerer"
perimetre = ["l'état d'un module et de ses dépendances (actif / inactif) ; aucune donnée n'est touchée"]
preuve = "le catalogue dit « actif » pour chacun des modules visés"
retour = "désactiver ceux que ce geste vient d'activer"
paliers = ["auto", "maitre", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "desactiver"
libelle = "Désactiver un module : ses capacités, moteurs et menus s'arrêtent, ses données restent (un module essentiel, ou dont un autre dépend, est refusé sans cascade)"
risque = "moyen"
droit = "gerer"
perimetre = ["l'état d'un module (et, en cascade, de ceux qui en dépendent) ; aucune donnée n'est effacée"]
preuve = "le catalogue dit « inactif » pour chacun des modules visés"
retour = "réactiver ceux que ce geste vient de désactiver"
paliers = ["auto", "maitre", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "examiner"
libelle = "Examiner une archive de module (.cmod) SANS rien installer : elle attend en quarantaine, et on dit ce qu'elle ferait : nouveau ou mise à jour, éditeur et signature, permissions demandées (et en plus), dépendances et conflits"
risque = "faible"
droit = "installer"
masque = ["corps_octets"]
perimetre = ["la quarantaine (donnees/quarantaine) ; rien n'est posé, rien ne s'exécute"]
preuve = "l'examen rend un jeton et l'archive est en quarantaine"
retour = "abandonner l'archive : elle quitte la quarantaine"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "installer"
libelle = "Installer une archive examinée : le consentement aux permissions montrées est exigé, l'ancienne version part en sauvegarde, le dossier est déposé (le module reste INACTIF jusqu'à son activation)"
risque = "eleve"
droit = "installer"
perimetre = ["le dossier d'un module dans les extensions ; jamais un module livré avec le noyau"]
preuve = "le catalogue montre le module dans la version installée"
retour = "remettre la version d'avant, ou retirer le module s'il était nouveau"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "retour_arriere"
libelle = "Remettre une version sauvegardée d'un module installé par archive (la version courante part elle-même en sauvegarde)"
risque = "eleve"
droit = "installer"
perimetre = ["le dossier d'un module dans les extensions"]
preuve = "le catalogue montre la version remise"
retour = "refaire un retour arrière : la version remplacée est en sauvegarde"
paliers = ["auto", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "desinstaller"
libelle = "Désinstaller un module installé par archive : son dossier part en sauvegarde ; ses données restent, sauf demande de purge (elles partent alors aussi en sauvegarde)"
risque = "eleve"
droit = "installer"
perimetre = ["le dossier d'un module dans les extensions, et ses données seulement sur demande"]
preuve = "le catalogue ne montre plus le module"
retour = "remettre le dossier sauvegardé (les données purgées restent en sauvegarde)"
paliers = ["auto", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "abandonner"
libelle = "Abandonner une archive examinée : elle quitte la quarantaine"
risque = "faible"
droit = "installer"
perimetre = ["la quarantaine"]
preuve = "l'archive n'y est plus"
retour = "déposer l'archive de nouveau"
paliers = ["auto", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "versions"
libelle = "Les versions d'un module installé par archive : ce qu'on peut remettre (sauvegardes) et ce qui s'est passé (installations, retours, désinstallations)"
risque = "lecture"
droit = "installer"

[[capacites]]
id = "sante"
libelle = "La santé d'un module : ses moteurs (exécutions, échecs, durée, suspension par le disjoncteur), ses détecteurs coupés, ce que ses capacités ont fait ou refusé depuis vingt-quatre heures, et un verdict : sain, à surveiller, en échec"
risque = "lecture"
droit = "gerer"

[[capacites]]
id = "contributions"
libelle = "Les points d'extension offerts par les modules actifs, et ce que les modules actifs y branchent (colonnes, tuiles, règles) : un module lit ce qu'on branche chez lui sans connaître ceux qui l'ont fait"
risque = "lecture"

[[capacites]]
id = "registre"
libelle = "Le registre officiel de Cassandra (index signé : modules, éditeurs vérifiés, révocations, niveaux de confiance) et, s'il y en a un, l'autre registre de l'administrateur (réglage registre_url, non officiel)"
risque = "lecture"
droit = "installer"
externe = true

[[capacites]]
id = "telecharger"
libelle = "Télécharger un module du registre officiel (ou de l'autre registre, source = \"autre\") : l'archive vient chez le registre, son empreinte est vérifiée contre l'index, une version révoquée est refusée, puis elle est EXAMINÉE comme une archive déposée (quarantaine, rien n'est installé)"
risque = "faible"
droit = "installer"
externe = true
perimetre = ["la quarantaine ; l'archive vient de l'hôte du registre et de lui seul"]
preuve = "l'examen rend un jeton et l'archive est en quarantaine"
retour = "abandonner l'archive : elle quitte la quarantaine"
paliers = ["auto", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "ajouter"
libelle = "Mettre un module du registre en service d'un seul tenant : télécharger, examiner, vérifier la règle d'autonomie, installer, activer (le geste de Cassandra ; un humain peut aussi s'en servir)"
risque = "eleve"
droit = "installer"
perimetre = ["le dossier d'un module dans les extensions et son état actif ; jamais un module livré avec le noyau, jamais une archive qui ne vient pas du registre officiel ou d'un éditeur vérifié (pour un agent)"]
preuve = "le catalogue montre le module dans la version installée, et actif si l'activation était demandée"
retour = "désactiver ce que ce geste vient d'activer, puis remettre la version d'avant ou retirer le module s'il était nouveau"
paliers = ["auto", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "entretien"
libelle = "Une passe d'entretien : retirer un module révoqué, prendre une mise à jour permise, remettre la version d'avant si elle tourne mal, mettre en pause un module qui échoue ; chaque geste est réversible (simuler = ne rien faire, seulement dire)"
risque = "moyen"
droit = "gerer"
perimetre = ["l'état et les versions des modules installés par archive ; aucune donnée n'est effacée"]
preuve = "chaque geste fait est consigné avec le geste qui le défait"
retour = "défaire, dans l'ordre inverse, chacun des gestes de la passe"
paliers = ["auto", "maitre", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "activite"
libelle = "Le récit de ce qui est arrivé aux modules (installés, mis à jour, retirés, activés, désactivés) : qui l'a fait, et le geste qui le défait"
risque = "lecture"
droit = "gerer"

[[capacites]]
id = "annuler"
libelle = "Défaire un acte du récit : le geste inverse du sien (activer un module désactivé, remettre la version d'avant, ré-installer un module retiré)"
risque = "moyen"
droit = "gerer"
perimetre = ["l'état et les versions d'un module ; rien n'est effacé pour de bon"]
preuve = "le geste inverse s'est exécuté sans erreur"
retour = "refaire le geste que l'annulation vient de défaire"
paliers = ["auto", "raconter"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[moteurs]]
id = "entretien"
libelle = "Fait la passe d'entretien de Cassandra sur les modules (toutes les six heures) : ce que son niveau d'autonomie lui permet, rien de plus"
mode = "periodique"
toutes_les_s = 21600
duree_max_s = 300

[permissions]
reseau = ["le registre officiel de Cassandra : son index signé et ses archives", "l'autre registre de l'administrateur (réglage registre_url), s'il y en a un"]
modules = true
droits = true
introspection = true
