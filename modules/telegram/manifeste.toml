[module]
id = "telegram"
nom = "Robot Telegram"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Le robot Telegram de chaque compte : il porte les notifications de CE compte vers SON téléphone, et ne lit rien de ce qu'on lui écrit (le premier message sert seulement à apprendre la conversation). Le destinataire est celui que la personne a déclaré et qu'on a essayé pour de bon, à défaut celui appris du « /start ». Le webhook est public par nécessité (c'est Telegram qui appelle) : il ne se protège que par le secret qu'il renvoie, qui seul désigne le compte."
confiance = "interne"
famille = "canaux"
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[objets]]
type = "telegram"
libelle = "Le robot Telegram d'un compte"

[[reglages]]
id = "url_publique"
libelle = "Adresse publique de Cassandra en https (où Telegram poste les messages)"
aide = "Obligatoire pour brancher un robot : Telegram exige https. Le webhook est <adresse>/api/public/telegram.recevoir."

[[reglages]]
id = "jeton"
libelle = "Jeton de mon robot (123456:ABC…, donné par @BotFather)"
type = "secret"
portee = "compte"

[[reglages]]
id = "api"
libelle = "Adresse de l'API Telegram"
defaut = "https://api.telegram.org"

[[reglages]]
id = "mot_du_role"
libelle = "Ce que le robot répond la première fois qu'on lui écrit (puis au plus une fois par heure)"
defaut = "Ce robot ne sert qu'à vous prévenir : il vous porte les notifications de votre compte Cassandra, et il ne lit pas ce qu'on lui écrit."

[evenements]
emet = ["telegram.branche", "telegram.detache", "telegram.message_recu", "telegram.envoye", "telegram.echec_envoi"]

[[capacites]]
id = "etat"
libelle = "Mon robot : branché ? destinataire (déclaré, ou appris) ? nombre de messages. Le jeton n'en sort jamais"
risque = "lecture"

[[capacites]]
id = "fil"
libelle = "Le fil des messages de mon robot (reçus et envoyés)"
risque = "lecture"

[[capacites]]
id = "brancher"
libelle = "Brancher mon robot (jeton déjà collé dans mes réglages) : vérifie le jeton auprès de Telegram, tire un secret, pose le webhook"
risque = "moyen"
perimetre = ["le compte qui agit", "un robot créé chez Telegram, dont le jeton est dans mes réglages", "une adresse publique en https réglée"]
preuve = "le lien existe et Telegram annonce le webhook posé à notre adresse"
retour = "retirer le webhook et le lien que cet acte vient de poser ; pour un rebranchement, le lien reprend ses conversations d'avant (le jeton est un réglage, le retour n'y touche pas)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "detacher"
libelle = "Débrancher mon robot : retire le webhook, oublie le secret et le jeton"
risque = "moyen"
perimetre = ["le compte qui agit"]
preuve = "plus aucun lien pour ce compte"
retour = "rebrancher le robot avec le jeton des réglages (nouveau secret)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "cible_poser"
libelle = "Déclarer mon destinataire Telegram (identifiant numérique), après l'avoir essayé pour de bon"
risque = "faible"
perimetre = ["le compte qui agit", "un identifiant numérique que le robot sait joindre (jamais un @pseudo)"]
preuve = "relire la cible du lien"
retour = "remettre la cible d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "envoyer"
libelle = "Porter une notification au destinataire d'un compte, par son robot (jamais ailleurs)"
risque = "moyen"
perimetre = ["le robot et le destinataire de ce compte seulement", "4000 caractères au plus"]
preuve = "Telegram a rendu l'identifiant du message envoyé"
retour = "supprimer le message envoyé chez Telegram (possible pendant 48 heures)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "recevoir"
libelle = "Le webhook : Telegram y poste un message (public, protégé par le seul secret du robot)"
risque = "moyen"
perimetre = ["le compte désigné par le secret, jamais par le contenu de l'appel", "un message rangé, rien exécuté, rien lu par un modèle"]
preuve = "le message est rangé dans le fil du compte"
retour = "retirer le message rangé"
paliers = ["auto", "raconter"]
qui = ["anonyme"]

[permissions]
stockage = true
reseau = ["l'API Telegram, à l'adresse des réglages (api.telegram.org par défaut)"]
