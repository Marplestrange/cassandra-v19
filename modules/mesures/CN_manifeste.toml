# RÔLE       : L'historique : chaque module déclare ses mesures ([[mesures]]) ; ce module en tire les courbes par période, l'habitude (ce qui est normal ce jour-là à cette heure), les écarts, la tendance (date de saturation) et un verdict. Une source muette est DITE muette : « tout est stable » n'est jamais un défaut.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
