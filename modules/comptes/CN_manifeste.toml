# ▼▼▼ BORNE CN version=0.5.0 empreinte=9347db ▼▼▼
[module]
id = "comptes"
nom = "Comptes"
version = "0.5.0"
noyau_min = "0.1.0"
description = "Les comptes et la preuve qu'on en est : identifiant (une adresse e-mail), mot de passe (règles de la V18, scrypt salé), sessions, jetons de mise en place du mot de passe. Le rôle d'administrateur, lui, vit dans les droits."
confiance = "interne"
famille = "securite"
groupe = "parametres"
proprietaire = "cassandra"
importance = "vital"
sans = "Plus personne ne peut se connecter ni être reconnu. Il ne se désactive pas."
essentiel = true
requiert = ["droits"]

[[droits]]
id = "gerer"
libelle = "Gérer les comptes : créer, modifier, supprimer, inviter"
sensible = true

[[droits]]
id = "fiche_voir_perso"
libelle = "Voir les coordonnées privées de la fiche des autres (courriel et mobile personnels, naissance, adresse)"
sensible = true

[[droits]]
id = "fiche_modifier_autres"
libelle = "Modifier la fiche d'un autre compte"
sensible = true

[[reglages]]
id = "session_heures"
libelle = "Durée d'une session, en heures (au-delà, il faut se reconnecter)"
type = "entier"
defaut = 24
minimum = 1
maximum = 720
aide = "S'applique tout de suite, aux sessions déjà ouvertes aussi."

[[reglages]]
id = "inactivite_heures"
libelle = "Une session inactive se ferme après (heures, utilisateur)"
type = "entier"
defaut = 8
minimum = 0
maximum = 720
aide = "0 : pas de délai d'inactivité. Compte seulement le temps passé sans servir."

[[reglages]]
id = "inactivite_admin_heures"
libelle = "Une session inactive se ferme après (heures, administrateur)"
type = "entier"
defaut = 2
minimum = 0
maximum = 720
aide = "Plus court que pour un utilisateur : le compte d'un administrateur ouvre plus de portes."

[[reglages]]
id = "admin_reverif_minutes"
libelle = "Un administrateur ressaisit son second facteur pour un geste sensible après (minutes)"
type = "entier"
defaut = 60
minimum = 0
maximum = 1440
aide = "0 : jamais redemandé. Ne concerne que les comptes qui ont un second facteur."

[[reglages]]
id = "admin_nouvel_appareil"
libelle = "Un administrateur sur un appareil jamais vu : prévenir seulement, ou bloquer jusqu'à l'approbation d'une session déjà ouverte"
type = "choix"
defaut = "alerter"
choix = ["alerter", "bloquer"]
aide = "Le superadministrateur n'est jamais bloqué : personne ne pourrait l'approuver. Bloquer sans session ouverte ailleurs enferme dehors : approuvez d'abord vos appareils."

[[reglages]]
id = "admin_second_facteur_obligatoire"
libelle = "Second facteur obligatoire pour les administrateurs"
type = "booleen"
defaut = true
aide = "Les administrateurs sans clé de sécurité sont prévenus à chaque connexion, puis refusés une fois la période de grâce écoulée. Sans module de second facteur branché, rien n'est exigé."

[[reglages]]
id = "admin_second_facteur_grace_jours"
libelle = "Période de grâce du second facteur, en jours"
type = "entier"
defaut = 7
minimum = 0
maximum = 90

[[reglages]]
id = "confirmation_minutes"
libelle = "Un geste sensible redemande le mot de passe après (minutes)"
type = "entier"
defaut = 10
minimum = 0
maximum = 240
aide = "0 : jamais redemandé. Concerne les gestes marqués « confirmer » (clés de sécurité, désactiver ou supprimer un compte, exporter la mémoire…)."

[[objets]]
type = "compte"
libelle = "Un compte : identifiant, profil, sites. Jamais son mot de passe en clair, ni son empreinte dans un événement"

[[objets]]
type = "session"
libelle = "Une session ouverte par un compte"

[evenements]
emet = ["compte.cree", "compte.modifie", "compte.supprime", "compte.restaure", "compte.desactive", "compte.reactive", "compte.mdp_change", "session.ouverte", "session.fermee", "session.refusee", "compte.nouvel_appareil", "compte.fiche_vue"]

# ---------- lectures ----------
[[capacites]]
id = "moi"
libelle = "Le profil du compte au nom duquel on agit"
risque = "lecture"

[[capacites]]
id = "fiche_modifier"
libelle = "Modifier des champs de la fiche d'un autre compte (une valeur trop longue est refusée, jamais coupée)"
risque = "moyen"
droit = "fiche_modifier_autres"
confirmer = true
perimetre = ["la fiche du compte visé : les champs donnés, pas les autres"]
preuve = "la fiche relue porte les valeurs écrites"
retour = "remettre les valeurs d'avant"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "mon_journal"
libelle = "Le journal de mon compte : connexions, sessions fermées, mot de passe, fiche (et qui l'a consultée), droits"
risque = "lecture"

[[capacites]]
id = "portrait"
libelle = "Mon portrait : l'image de la source choisie, sinon la première qui en a une, sinon mes initiales"
risque = "lecture"

[[capacites]]
id = "portrait_poser"
libelle = "Téléverser mon image propre (PNG, JPEG ou WebP, 300 Ko au plus) ; elle n'est jamais écrasée par une source externe"
risque = "faible"
perimetre = ["l'image propre du compte au nom duquel on agit, et sa source de portrait"]
preuve = "l'image relue a la taille de celle envoyée"
retour = "remettre l'image d'avant (ou aucune) et la source d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]
masque = ["image"]

[[capacites]]
id = "portrait_retirer"
libelle = "Retirer mon image propre (la source repasse au défaut)"
risque = "faible"
perimetre = ["l'image propre du compte au nom duquel on agit"]
preuve = "plus aucune image propre"
retour = "remettre l'image retirée"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "attente_cle"
libelle = "Ce que le compte attend : une (seconde) clé de sécurité, d'après le module webauthn"
risque = "lecture"

[[capacites]]
id = "attente_fiche"
libelle = "Ce que le compte attend : une fiche complétée (son nom)"
risque = "lecture"

[[capacites]]
id = "attente_appareils"
libelle = "Ce que le compte attend : l'approbation d'appareils neufs"
risque = "lecture"

[[capacites]]
id = "mes_attentes"
libelle = "« À faire sur mon compte » : ce que chaque module déclare attendre de moi (blocs [[attentes]] des manifestes)"
risque = "lecture"

[[attentes]]
id = "cle"
capacite = "attente_cle"
vers = "mc_secu"
action = "Ajouter"
niveau = "warn"

[[attentes]]
id = "fiche"
capacite = "attente_fiche"
vers = "mc_profil"
action = "Compléter"

[[attentes]]
id = "appareils"
capacite = "attente_appareils"
vers = "mc_secu"
action = "Voir"
niveau = "warn"

[[capacites]]
id = "fiche_visibilite"
libelle = "Qui voit ma fiche : ce que j'ai ouvert à mes collègues et aux administrateurs, et si j'inscris les accès d'autrui à mon journal"
risque = "lecture"

[[capacites]]
id = "fiche_visibilite_regler"
libelle = "Ouvrir ou fermer un groupe de champs de ma fiche à un public, ou régler la journalisation des accès d'autrui"
risque = "faible"
perimetre = ["les préférences de visibilité de la fiche du compte au nom duquel on agit ; aucun champ n'est modifié"]
preuve = "la visibilité relue est celle demandée"
retour = "remettre la visibilité d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "identites"
libelle = "Les identités liées d'un compte : pseudo FastPanel, utilisateur système (bash) et son état"
risque = "lecture"

[[capacites]]
id = "identite_lier"
confirmer = true
libelle = "Lier un compte à un pseudo FastPanel et/ou à un utilisateur système avec bash (réservé aux administrateurs)"
risque = "moyen"
droit = "gerer"
perimetre = ["les champs fp_account et unix_user de la ligne du compte ; aucun utilisateur système ni compte FastPanel n'est créé ou modifié"]
preuve = "la ligne du compte relue porte les liens demandés"
retour = "remettre les liens d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "appareils"
libelle = "Mes appareils : connus, de confiance (30 jours), en attente d'approbation"
risque = "lecture"

[[capacites]]
id = "appareil_confiance"
libelle = "Se souvenir de cet appareil pendant 30 jours (le mot de passe et le second facteur restent demandés)"
risque = "faible"
perimetre = ["la date de confiance d'un appareil du compte au nom duquel on agit"]
preuve = "l'appareil relu porte la confiance demandée"
retour = "remettre la confiance d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "appareil_decider"
libelle = "Approuver ou refuser un appareil neuf qui attend, pour un administrateur"
risque = "moyen"
perimetre = ["l'état d'un appareil du compte au nom duquel on agit (ou, pour un administrateur, d'un autre compte de sa société)"]
preuve = "l'appareil est approuvé, ou n'existe plus"
retour = "aucun : un appareil refusé se représente et attend de nouveau"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "portrait_source"
libelle = "Choisir la source de son portrait (image propre, Dolibarr, FastPanel, Telegram, initiales)"
risque = "faible"
perimetre = ["la source de portrait de la fiche du compte au nom duquel on agit ; aucune image n'est touchée"]
preuve = "la fiche relue porte la source choisie"
retour = "remettre la source d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "lire"
libelle = "Le profil d'un compte"
risque = "lecture"
droit = "gerer"

[[capacites]]
id = "lister"
libelle = "Tous les comptes"
risque = "lecture"
droit = "gerer"

[[capacites]]
id = "corbeille"
libelle = "Les comptes supprimés qu'on peut encore restaurer"
risque = "lecture"
droit = "gerer"

[[capacites]]
id = "regles_mdp"
libelle = "Les règles du mot de passe et leur légende"
risque = "lecture"

[[capacites]]
id = "valider_session"
libelle = "Un jeton de session est-il valable, et à quel compte appartient-il ?"
risque = "lecture"
masque = ["jeton"]

[[capacites]]
id = "mes_sessions"
libelle = "Les sessions ouvertes du compte au nom duquel on agit"
risque = "lecture"
masque = ["courant"]

# ---------- écritures ----------
[[capacites]]
id = "creer"
libelle = "Créer un compte (le premier est administrateur)"
risque = "moyen"
droit = "gerer"
perimetre = ["la table comptes : une ligne, celle du compte créé"]
preuve = "relire le compte créé"
retour = "supprimer la ligne créée (et le statut d'administrateur qu'elle a pu donner)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]
masque = ["mot_de_passe"]

[[capacites]]
id = "transferer"
libelle = "Rattacher un compte à une autre société (superadministrateur) : ses fonctions de l'ancienne société tombent"
risque = "moyen"
droit = "gerer"
perimetre = ["la société d'un compte, et ses appartenances aux fonctions de l'ancienne société"]
preuve = "relire la société du compte"
retour = "remettre la société d'avant et les fonctions retirées"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "inviter_agent"
libelle = "Inviter un agent : son compte (« agent:nom ») ET son jeton, rendu une seule fois. Ses droits sont ceux du compte qui l'invite"
risque = "moyen"
perimetre = ["la table comptes (une ligne de type agent) et la table agents_jetons (un jeton actif, les précédents désactivés)"]
preuve = "le jeton rendu reconnaît le compte de l'agent"
retour = "désactiver le jeton ; le compte de l'agent reste, sans plus pouvoir s'authentifier"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]
masque = ["jeton"]

[[capacites]]
id = "revoquer_agent"
libelle = "Révoquer un agent invité (son jeton cesse d'ouvrir). Un compte ordinaire ne révoque que les siens"
risque = "faible"
perimetre = ["les jetons de l'agent désigné"]
preuve = "plus aucun jeton actif pour cet agent"
retour = "réinviter l'agent (nouveau jeton)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "mes_agents"
libelle = "Les agents invités par le compte au nom duquel on agit (tous, pour un compte qui gère les comptes)"
risque = "lecture"

[[capacites]]
id = "valider_jeton_agent"
libelle = "À quel compte d'agent invité appartient ce jeton ? (l'invité ne se déclare pas, on le reconnaît)"
risque = "lecture"
masque = ["jeton"]

[[capacites]]
id = "modifier"
confirmer = true
libelle = "Modifier le profil ou les sites d'un compte"
risque = "faible"
droit = "gerer"
perimetre = ["la ligne du compte demandé, hors mot de passe"]
preuve = "relire le profil écrit"
retour = "remettre le profil d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "modifier_moi"
libelle = "Modifier son propre profil (nom, fonction, coordonnées, langue)"
risque = "faible"
perimetre = ["la ligne du compte au nom duquel on agit, hors mot de passe et sites"]
preuve = "relire le profil écrit"
retour = "remettre le profil d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "changer_mon_mot_de_passe"
libelle = "Changer son propre mot de passe (l'actuel est exigé)"
risque = "moyen"
perimetre = ["l'empreinte du mot de passe du compte au nom duquel on agit"]
preuve = "le nouveau mot de passe ouvre le compte, et aucune autre session du compte ne reste ouverte"
retour = "remettre l'ancienne empreinte ; les sessions fermées ne se rouvrent pas (une connexion les remplace)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]
masque = ["actuel", "nouveau", "ancien_hash", "courant"]

[[capacites]]
id = "creer_jeton"
libelle = "Créer le lien de mise en place ou de réinitialisation du mot de passe d'un compte (72 h, usage unique)"
risque = "faible"
droit = "gerer"
perimetre = ["la table jetons_mdp : une ligne"]
preuve = "relire le jeton créé"
retour = "invalider le jeton"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]
masque = ["jeton"]

[[capacites]]
id = "reinitialiser_mot_de_passe"
confirmer = true
libelle = "Poser un nouveau mot de passe avec un jeton (le jeton est consommé, les sessions du compte sont fermées)"
risque = "moyen"
perimetre = ["l'empreinte du mot de passe du compte du jeton, et ses sessions"]
preuve = "le nouveau mot de passe ouvre le compte"
retour = "remettre l'ancienne empreinte"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]
masque = ["jeton", "nouveau", "ancien_hash"]

[[capacites]]
id = "supprimer"
confirmer = true
libelle = "Supprimer un compte (copie entière en corbeille, sessions fermées)"
risque = "eleve"
droit = "gerer"
perimetre = ["la ligne du compte, ses sessions et ses jetons"]
preuve = "le compte n'existe plus et sa copie est en corbeille"
retour = "restaurer le compte depuis la corbeille (son mot de passe revient ; ses sessions non)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "desactiver"
confirmer = true
libelle = "Désactiver un compte : il n'entre plus, ses sessions se ferment, rien n'est supprimé. Ses sites peuvent passer à un autre compte, et ses agents invités être révoqués ou réattribués"
risque = "moyen"
droit = "gerer"
perimetre = ["la ligne du compte (désactivé), ses sessions et ses jetons de mot de passe, les sites du compte destinataire, les agents invités par ce compte"]
preuve = "le compte est désactivé et n'a plus de session"
retour = "réactiver le compte et rendre les sites et les agents d'avant (les jetons d'agent révoqués ne reviennent pas : on réinvite)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "reactiver"
libelle = "Réactiver un compte désactivé : il se reconnecte avec son mot de passe d'avant"
risque = "faible"
droit = "gerer"
perimetre = ["la ligne du compte demandé"]
preuve = "le compte n'est plus désactivé"
retour = "le désactiver de nouveau"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "restaurer"
libelle = "Restaurer un compte supprimé"
risque = "moyen"
droit = "gerer"
perimetre = ["la table comptes : une ligne rendue"]
preuve = "relire le compte rendu"
retour = "le supprimer de nouveau (la copie reste en corbeille)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "ouvrir_session"
libelle = "Ouvrir une session (identifiant et mot de passe ; dix échecs en cinq minutes bloquent)"
risque = "faible"
perimetre = ["la table sessions : une ligne"]
preuve = "le jeton rendu est valable"
retour = "fermer la session ouverte"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]
masque = ["mot_de_passe", "jeton", "preuve"]

[[capacites]]
id = "fermer_session"
libelle = "Fermer une session (déconnexion)"
risque = "faible"
perimetre = ["la ligne de la session désignée"]
preuve = "le jeton n'est plus valable"
retour = "aucun : une session fermée se rouvre par une connexion"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]
masque = ["jeton"]

[[capacites]]
id = "revoquer_session"
libelle = "Fermer une autre session de son compte, désignée par ses six derniers caractères"
risque = "faible"
perimetre = ["les sessions du compte au nom duquel on agit"]
preuve = "la session désignée n'existe plus"
retour = "aucun : une session fermée se rouvre par une connexion"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "revoquer_autres_sessions"
libelle = "Fermer toutes les autres sessions de son compte, en gardant la courante"
risque = "faible"
perimetre = ["les sessions du compte au nom duquel on agit, sauf la courante"]
