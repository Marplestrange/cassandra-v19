# ══════════════════════════════════════════════════════════════════════════════
# TITRE      : Manifeste du module Sensorium
# LICENCE    : AGPL-3.0
# AUTEUR     : Atek Drisse
# GIT        : github.com/Marplestrange
# MAIL       : marplestrange@cassandra.center
# MODULE     : sensorium
# ZONE       : CN
# VERSION CN : 0.1.12  #d7b620
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : Les sens de Cassandra. Le collecteur (CN_sensorium.py, gardé entier) mesure la machine et son monde ; ce module le relie au noyau : santé, ressources, constats, tuiles.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.1.12 empreinte=d7b620 ▼▼▼
[module]
id = "sensorium"
nom = "Sensorium"
version = "0.1.12"
noyau_min = "0.1.0"
description = "Les sens de Cassandra. Le collecteur (CN_sensorium.py, gardé entier) mesure la machine et son monde ; ce module le relie au noyau : santé, ressources, constats, tuiles."
confiance = "interne"
famille = "supervision"
importance = "important"
instance = true
sans = "La maison n'a plus de sens : plus de mesure de la machine ni de détection automatique des pannes."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[objets]]
type = "machine"
libelle = "Une machine observée par le Sensorium"

[[objets]]
type = "module_noyau"
libelle = "Un module du noyau de Cassandra, dont le Sensorium suit la santé"

[evenements]
emet = ["machine.sante_change", "machine.muette", "machine.reprise", "module_noyau.en_echec", "module_noyau.retabli"]

[[moteurs]]
id = "releve"
libelle = "Relève la santé et les ressources auprès du collecteur"
mode = "periodique"
toutes_les_s = 30
duree_max_s = 20

[[moteurs]]
id = "monde"
libelle = "Relit le modèle du monde du collecteur, une fois pour l'écran, les constats et la recherche"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 30

[[moteurs]]
id = "sante_modules"
libelle = "Relève la santé de chaque module du noyau (verdict, moteurs et détecteurs suspendus)"
mode = "periodique"
toutes_les_s = 120
duree_max_s = 30

[[detecteurs]]
id = "alertes_du_monde"
libelle = "Une mesure du collecteur est en alerte depuis deux relevés (ni acceptée, ni en maintenance)"
frequence_s = 60

[[detecteurs]]
id = "modules_en_echec"
libelle = "Un module du noyau est en échec (moteur ou détecteur suspendu, ou santé illisible)"
frequence_s = 120

[[detecteurs]]
id = "sans_administrateur"
libelle = "Plus aucun administrateur : personne ne peut plus administrer Cassandra"
frequence_s = 300

[[detecteurs]]
id = "collecteur_muet"
libelle = "Le collecteur ne répond plus"
frequence_s = 30

[[detecteurs]]
id = "unites_en_echec"
libelle = "Des unités systemd sont en échec"
frequence_s = 60

[[capacites]]
id = "sante"
libelle = "La dernière relève : score de santé, ressources, unités en échec"
risque = "lecture"

[[capacites]]
id = "demon"
libelle = "L'état du démon, dit par lui : processus, âge, mémoire, base, battement du watchdog, durée de ses passes ; et l'historique de ses redémarrages"
risque = "lecture"

[[capacites]]
id = "redemarrer"
libelle = "Redémarrer le démon du Sensorium (après la passe en cours, ou tout de suite) : quelques secondes de silence, aucune mesure perdue"
risque = "moyen"
droit = "agir"
perimetre = ["le démon du Sensorium (sensorium.service), par la commande root « redemarrer » du courtier"]
preuve = "le démon répond sur sa socket avec un autre processus"
retour = "aucun : un redémarrage ne se défait pas, il se vérifie (si le démon ne revient pas, le watchdog de systemd le relance)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra"]

[[capacites]]
id = "etat"
libelle = "Tout ce que l'écran du Sensorium lit : les mesures nommées en français (famille, objet, alerte acceptée, maintenance), les changements, les corrélations, les fenêtres"
risque = "lecture"

[[capacites]]
id = "fenetres"
libelle = "Les fenêtres de maintenance : en cours, à venir, et les dix dernières"
risque = "lecture"

[[capacites]]
id = "accepter"
libelle = "Accepter une alerte : « je sais, c'est normal ». Elle se tait jusqu'à l'échéance, et revient si son chiffre monte"
risque = "faible"
droit = "agir"
perimetre = ["une ligne d'alerte acceptée (la mesure, la raison, l'échéance, la valeur d'alors)"]
preuve = "la ligne existe"
retour = "remettre l'acceptation d'avant, ou la retirer"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "retirer_acceptation"
libelle = "Ne plus accepter une alerte : elle redevient une alerte"
risque = "faible"
droit = "agir"
perimetre = ["une ligne d'alerte acceptée"]
preuve = "la ligne n'existe plus"
retour = "remettre la ligne retirée"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "fenetre_poser"
libelle = "Poser une fenêtre de maintenance : les mesures qu'elle couvre se taisent le temps voulu (les relevés continuent), puis reviennent"
risque = "faible"
droit = "agir"
perimetre = ["une ligne de fenêtre de maintenance"]
preuve = "la fenêtre existe et n'est pas annulée"
retour = "annuler la fenêtre"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "fenetre_annuler"
libelle = "Annuler une fenêtre de maintenance : ses mesures reparlent aussitôt"
risque = "faible"
droit = "agir"
perimetre = ["une ligne de fenêtre de maintenance"]
preuve = "la fenêtre est marquée annulée"
retour = "rouvrir la fenêtre"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "modules"
libelle = "La santé de chaque module du noyau, telle que le noyau la mesure (verdict, moteurs, détecteurs coupés, refus)"
risque = "lecture"

[[capacites]]
id = "metriques"
libelle = "Les ressources, mesurées à l'instant (compter une fraction de seconde)"
risque = "lecture"

[[capacites]]
id = "monde"
libelle = "Le modèle du monde : ce que le collecteur sait, par préfixe de clé"
risque = "lecture"

[[capacites]]
id = "entite"
libelle = "Une entité surveillée (services, ports, certificats, sauvegardes...)"
risque = "lecture"

[[capacites]]
id = "historique"
libelle = "L'histoire d'une mesure sur trente jours"
risque = "lecture"

[[capacites]]
id = "changements"
libelle = "Ce qui a changé sur la machine depuis une date"
risque = "lecture"

[[ecrans]]
id = "vue_sensorium"
libelle = "Sensorium"
domaine = "supervision"
gabarit = "tableau"

[[menus]]
id = "sensorium"
libelle = "Sensorium"
ecran = "vue_sensorium"
ordre = 5
role = "admin"
icone = "radar"
badge = "constats"

[[widgets]]
id = "sante"
libelle = "Santé de la machine"
ecran = "accueil"
zone = "principal"
taille = "s"
ordre = 1
role = "admin"
composant = "jauge"
source = "sante"
rafraichir_s = 30

[[widgets]]
id = "ressources"
libelle = "Ressources"
ecran = "vue_sensorium"
composant = "liste"
source = "sante"
rafraichir_s = 30

[theme]
accent = "#4a56c8"

[permissions]
lectures = true
stockage = true
racine = true
privileges = ["installer : le service sensorium.service tourne en root, pour tout voir"]
ecritures = ["/run/sensorium"]

[[racine]]
id = "redemarrer"
libelle = "Redémarrer le démon du Sensorium (sensorium.service), après la passe en cours ou tout de suite, puis vérifier qu'il répond avec un autre processus"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "serie"
libelle = "Les points d'une mesure de la machine (processeur, mémoire, disque…) sur une période, lus dans l'historique du collecteur"
risque = "lecture"

[[mesures]]
id = "cpu"
libelle = "Processeur"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Charge processeur."

[[mesures]]
id = "ram"
libelle = "Mémoire vive"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Mémoire occupée."

[[mesures]]
id = "swap"
libelle = "Swap"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Recours au disque comme mémoire : un swap qui monte annonce l'étouffement."

[[mesures]]
id = "disk"
libelle = "Disque"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Remplissage du disque. C'est la tendance qui compte, pas l'instant."

[[mesures]]
id = "load1"
libelle = "Charge moyenne (1 min)"
capacite = "serie"
famille = "Système hôte"
fraicheur_s = 180
description = "File d'attente du processeur."

[[mesures]]
id = "disk_free"
libelle = "Espace libre"
capacite = "serie"
unite = "Go"
famille = "Système hôte"
pire = "bas"
fraicheur_s = 180
description = "Ce qu'il reste réellement."

[[mesures]]
id = "ram_used"
libelle = "Mémoire utilisée"
capacite = "serie"
unite = "Go"
famille = "Système hôte"
fraicheur_s = 180
description = "En valeur absolue."

[[mesures]]
id = "sante"
libelle = "Score de santé"
capacite = "serie"
unite = "/100"
famille = "Système hôte"
pire = "bas"
fraicheur_s = 1200
description = "Note globale calculée par le collecteur."

[[mesures]]
id = "oom"
libelle = "Tueur de processus (OOM)"
capacite = "serie"
genre = "compteur"
unite = "/h"
famille = "Système hôte"
vide = "rien_a_signaler"
description = "Processus tués faute de mémoire. Une seule occurrence est déjà une alerte."

[[droits]]
id = "agir"
libelle = "Agir depuis le Sensorium : accepter une alerte, poser une fenêtre de maintenance, redémarrer le démon"
sensible = true

[[droits]]
id = "voir_securite"
libelle = "Lire les totaux d'attaques de la machine (adresses, chemins, robots) pour la page Sécurité › En images"
sensible = true

[[capacites]]
id = "secu"
libelle = "Les totaux d'attaques que le collecteur tient (jours, heures, chemins, adresses les plus actives, sites, robots), les mesures diverses (courriel, box, tailnet) et la sauvegarde hors machine — des agrégats, aucune ligne de journal"
risque = "lecture"
droit = "voir_securite"
# ▲▲▲ FIN BORNE CN ▲▲▲

# ═══ EXPLICATIF CN / EC ═══════════════════════════════════════════════════════
# CN : tout ce fichier est du nexus : à compléter
# EC : néant (aucun point d'évolution déclaré pour l'instant)
# LIEN : à compléter (contrat, fichiers voisins)

[[points_evolution]]
id = "sante"
libelle = "Le score de santé d'une machine (0 à 100) : ses mesures en entrée, le score, son état (excellent, bon, à surveiller, critique) et le détail des points perdus en sortie"
contrat = "1.0"
reference = "points/EC_sante"
fonction = "point_sante"
runtime = "python"

[[points_evolution]]
id = "pente"
libelle = "La pente d'une série de mesures (par jour) et la qualité de l'ajustement (r²) : les points en entrée, [pente, r²] en sortie ; sous six points, aucune tendance"
contrat = "1.0"
reference = "points/EC_pente"
fonction = "point_pente"
runtime = "python"

[[points_evolution]]
id = "mogwai_table"
libelle = "La table que rend l'outil mogwai de FastPanel : le texte en entrée, une liste de lignes (en-têtes en minuscules) en sortie"
contrat = "1.0"
reference = "points/EC_mogwai_table"
fonction = "point_mogwai_table"
runtime = "python"

[[points_evolution]]
id = "duree_txt"
libelle = "Une durée en secondes dite en mots (« 3 j 4 h », « 2 h 15 min ») ; « ? » quand elle est illisible"
contrat = "1.0"
reference = "points/EC_duree_txt"
fonction = "point_duree_txt"
runtime = "python"

[[points_evolution]]
id = "cron_derniere"
libelle = "La dernière exécution d'une commande de crontab, retrouvée dans le journal : les exécutions connues, le compte et la commande en entrée, la date en sortie (vide si inconnue)"
contrat = "1.0"
reference = "points/EC_cron_derniere"
fonction = "point_cron_derniere"
runtime = "python"

[[points_evolution]]
id = "fp_formes"
libelle = "Les comptes mail et FTP de FastPanel, mis en forme : ce que le collecteur a lu (table de mogwai, API, fichiers de postfix et des serveurs FTP, dossiers) en entrée, les comptes en sortie"
contrat = "1.0"
reference = "points/EC_fp_formes"
fonction = "point_fp_formes"
runtime = "python"

[[points_evolution]]
id = "sys_formes"
libelle = "Les mesures du système, mises en forme : ce que le collecteur a lu (sessions, ports, certificats, disques, matériel, fichiers des serveurs web) en entrée, la mesure en sortie"
contrat = "1.0"
reference = "points/EC_sys_formes"
fonction = "point_sys_formes"
runtime = "python"
