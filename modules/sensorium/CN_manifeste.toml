# MAIL       : marplestrange@cassandra.center
# MODULE     : sensorium
# ZONE       : CN
# VERSION CN : 0.1.3  #4c0c07
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : Les sens de Cassandra. Le collecteur (CN_sensorium.py, gardé entier) mesure la machine et son monde ; ce module le relie au noyau : santé, ressources, constats, tuiles.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.1.3 empreinte=4c0c07 ▼▼▼
[module]
id = "sensorium"
nom = "Sensorium"
version = "0.1.3"
noyau_min = "0.1.0"
description = "Les sens de Cassandra. Le collecteur (CN_sensorium.py, gardé entier) mesure la machine et son monde ; ce module le relie au noyau : santé, ressources, constats, tuiles."
confiance = "interne"
famille = "supervision"
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[objets]]
type = "machine"
libelle = "Une machine observée par le Sensorium"

[evenements]
emet = ["machine.sante_change", "machine.muette", "machine.reprise"]

[[moteurs]]
id = "releve"
libelle = "Relève la santé et les ressources auprès du collecteur"
mode = "periodique"
toutes_les_s = 30
duree_max_s = 20

[[detecteurs]]
id = "collecteur_muet"
libelle = "Le collecteur ne répond plus"
frequence_s = 30

[[detecteurs]]
id = "unites_en_echec"
libelle = "Des unités systemd sont en échec"
frequence_s = 60

[[capacites]]
id = "sante"
libelle = "La dernière relève : score de santé, ressources, unités en échec"
risque = "lecture"

[[capacites]]
id = "metriques"
libelle = "Les ressources, mesurées à l'instant (compter une fraction de seconde)"
risque = "lecture"

[[capacites]]
id = "monde"
libelle = "Le modèle du monde : ce que le collecteur sait, par préfixe de clé"
risque = "lecture"

[[capacites]]
id = "entite"
libelle = "Une entité surveillée (services, ports, certificats, sauvegardes...)"
risque = "lecture"

[[capacites]]
id = "historique"
libelle = "L'histoire d'une mesure sur trente jours"
risque = "lecture"

[[capacites]]
id = "changements"
libelle = "Ce qui a changé sur la machine depuis une date"
risque = "lecture"

[[ecrans]]
id = "vue_sensorium"
libelle = "Sensorium"
domaine = "supervision"
gabarit = "tableau"

[[menus]]
id = "sensorium"
libelle = "Sensorium"
ecran = "vue_sensorium"
ordre = 5
role = "admin"
icone = "radar"
badge = "constats"

[[widgets]]
id = "sante"
libelle = "Santé de la machine"
ecran = "accueil"
zone = "principal"
taille = "s"
ordre = 1
role = "admin"
composant = "jauge"
source = "sante"
rafraichir_s = 30

[[widgets]]
id = "ressources"
libelle = "Ressources"
ecran = "vue_sensorium"
composant = "liste"
source = "sante"
rafraichir_s = 30

[theme]
accent = "#4a56c8"

[permissions]
privileges = ["installer : le service sensorium.service tourne en root, pour tout voir"]
ecritures = ["/run/sensorium"]

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "serie"
libelle = "Les points d'une mesure de la machine (processeur, mémoire, disque…) sur une période, lus dans l'historique du collecteur"
risque = "lecture"

[[mesures]]
id = "cpu"
libelle = "Processeur"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Charge processeur."

[[mesures]]
id = "ram"
libelle = "Mémoire vive"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Mémoire occupée."

[[mesures]]
id = "swap"
libelle = "Swap"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Recours au disque comme mémoire : un swap qui monte annonce l'étouffement."

[[mesures]]
id = "disk"
libelle = "Disque"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Remplissage du disque. C'est la tendance qui compte, pas l'instant."

[[mesures]]
id = "load1"
libelle = "Charge moyenne (1 min)"
capacite = "serie"
famille = "Système hôte"
fraicheur_s = 180
description = "File d'attente du processeur."

[[mesures]]
id = "disk_free"
libelle = "Espace libre"
capacite = "serie"
unite = "Go"
famille = "Système hôte"
pire = "bas"
fraicheur_s = 180
description = "Ce qu'il reste réellement."

[[mesures]]
id = "ram_used"
libelle = "Mémoire utilisée"
capacite = "serie"
unite = "Go"
famille = "Système hôte"
fraicheur_s = 180
description = "En valeur absolue."

[[mesures]]
id = "sante"
libelle = "Score de santé"
capacite = "serie"
unite = "/100"
famille = "Système hôte"
pire = "bas"
fraicheur_s = 1200
description = "Note globale calculée par le collecteur."

[[mesures]]
id = "oom"
libelle = "Tueur de processus (OOM)"
capacite = "serie"
genre = "compteur"
unite = "/h"
famille = "Système hôte"
vide = "rien_a_signaler"
description = "Processus tués faute de mémoire. Une seule occurrence est déjà une alerte."

[[droits]]
id = "voir_securite"
libelle = "Lire les totaux d'attaques de la machine (adresses, chemins, robots) pour la page Sécurité › En images"
sensible = true

[[capacites]]
id = "secu"
libelle = "Les totaux d'attaques que le collecteur tient (jours, heures, chemins, adresses les plus actives, sites, robots), les mesures diverses (courriel, box, tailnet) et la sauvegarde hors machine — des agrégats, aucune ligne de journal"
risque = "lecture"
droit = "voir_securite"
# ▲▲▲ FIN BORNE CN ▲▲▲

# ═══ EXPLICATIF CN / EC ═══════════════════════════════════════════════════════
# CN : tout ce fichier est du nexus : à compléter
# EC : néant (aucun point d'évolution déclaré pour l'instant)
# LIEN : à compléter (contrat, fichiers voisins)

[[points_evolution]]
id = "sante"
libelle = "Le score de santé d'une machine (0 à 100) : ses mesures en entrée, le score, son état (excellent, bon, à surveiller, critique) et le détail des points perdus en sortie"
contrat = "1.0"
reference = "points/EC_sante"
fonction = "point_sante"
runtime = "python"

[[points_evolution]]
id = "pente"
libelle = "La pente d'une série de mesures (par jour) et la qualité de l'ajustement (r²) : les points en entrée, [pente, r²] en sortie ; sous six points, aucune tendance"
contrat = "1.0"
reference = "points/EC_pente"
fonction = "point_pente"
runtime = "python"

[[points_evolution]]
id = "mogwai_table"
libelle = "La table que rend l'outil mogwai de FastPanel : le texte en entrée, une liste de lignes (en-têtes en minuscules) en sortie"
contrat = "1.0"
reference = "points/EC_mogwai_table"
fonction = "point_mogwai_table"
runtime = "python"

[[points_evolution]]
id = "duree_txt"
libelle = "Une durée en secondes dite en mots (« 3 j 4 h », « 2 h 15 min ») ; « ? » quand elle est illisible"
contrat = "1.0"
reference = "points/EC_duree_txt"
fonction = "point_duree_txt"
runtime = "python"

[[points_evolution]]
id = "cron_derniere"
libelle = "La dernière exécution d'une commande de crontab, retrouvée dans le journal : les exécutions connues, le compte et la commande en entrée, la date en sortie (vide si inconnue)"
contrat = "1.0"
reference = "points/EC_cron_derniere"
fonction = "point_cron_derniere"
runtime = "python"
