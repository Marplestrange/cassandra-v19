# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.2.9 empreinte=1656da ▼▼▼
[module]
id = "sensorium"
nom = "Sensorium"
version = "0.2.9"
noyau_min = "0.1.0"
description = "Les sens de Cassandra. Le collecteur (CN_sensorium.py, gardé entier) mesure la machine et son monde ; ce module le relie au noyau : santé, ressources, constats, tuiles."
confiance = "interne"
famille = "supervision"
groupe = "obs"
proprietaire = "cassandra"
importance = "important"
instance = true
sans = "La maison n'a plus de sens : plus de mesure de la machine ni de détection automatique des pannes."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[objets]]
type = "machine"
libelle = "Une machine observée par le Sensorium"

[[objets]]
type = "module_noyau"
libelle = "Un module du noyau de Cassandra, dont le Sensorium suit la santé"

[[objets]]
type = "mesure"
libelle = "Une mesure (clé « espace.nom ») dont le Sensorium suit l'état : sert de sujet à l'événement mesure.change ; le Sensorium n'en pose aucune au registre (les états se lisent par ses capacités, cloisonnées)"

[evenements]
emet = ["machine.sante_change", "machine.muette", "machine.reprise", "machine.relance_auto", "module_noyau.en_echec", "module_noyau.retabli", "mesure.change"]

[[moteurs]]
id = "releve"
libelle = "Relève la santé et les ressources auprès du collecteur"
mode = "periodique"
toutes_les_s = 30
duree_max_s = 20

[[reglages]]
id = "certificat_jours"
libelle = "Un certificat est signalé quand il lui reste moins de … jours"
type = "entier"
defaut = 21
minimum = 3
maximum = 90

[[reglages]]
id = "disque_jours"
libelle = "Un disque est signalé quand il sera plein dans moins de … jours"
type = "entier"
defaut = 30
minimum = 1
maximum = 120

[[reglages]]
id = "lenteur_ms"
libelle = "Le noyau est dit lent au-delà de … millisecondes de réponse"
type = "entier"
defaut = 3000
minimum = 500
maximum = 30000

[[reglages]]
id = "espace_min_pct"
libelle = "L'espace libre des données est signalé sous … % (ou sous 2 Go)"
type = "entier"
defaut = 8
minimum = 1
maximum = 50

[[reglages]]
id = "sauvegarde_max_h"
libelle = "La dernière copie des données est signalée au-delà de … heures"
type = "entier"
defaut = 72
minimum = 6
maximum = 720

[[reglages]]
id = "activite_max_h"
libelle = "La base du noyau est dite figée quand rien n'y est écrit depuis … heures"
type = "entier"
defaut = 6
minimum = 1
maximum = 72

[[reglages]]
id = "releves_avant_constat"
libelle = "Une alerte ouvre un constat après … relevés de suite (la sécurité n'attend pas)"
type = "entier"
defaut = 2
minimum = 1
maximum = 10

[[reglages]]
id = "constat_critique"
libelle = "Une alerte critique (panne : disque, site, unité en échec) ouvre un constat, donc une notification"
type = "booleen"
defaut = true

[[reglages]]
id = "constat_avoir"
libelle = "Une alerte « à voir » (ce qui ouvre la maison : clé SSH, redirection, virus) ouvre un constat"
type = "booleen"
defaut = true

[[reglages]]
id = "constat_info"
libelle = "Les autres alertes (information) ouvrent un constat ; sinon elles ne se lisent que dans le Sensorium"
type = "booleen"
defaut = true

[[reglages]]
id = "temoin_url_publique"
libelle = "Adresse publique de Cassandra, que le témoin extérieur interroge (https://…)"

[[reglages]]
id = "temoin_url_lan"
libelle = "Adresse de Cassandra sur le réseau local, si elle y écoute (http://IP:9000/) — vide sinon"

[[moteurs]]
id = "monde"
libelle = "Relit le modèle du monde du collecteur, une fois pour l'écran, les constats et la recherche"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 30

[[moteurs]]
id = "veille_demon"
libelle = "Veille sur le démon lui-même : s'il répond mais ne relève plus depuis dix minutes, ou s'il se tait depuis cinq, le relance (au plus une fois par demi-heure)"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 260

[[moteurs]]
id = "seuils"
libelle = "Pose les seuils du démon dans son fichier (commande root « seuils »), au départ puis tant qu'un échec dure"
mode = "periodique"
toutes_les_s = 300
duree_max_s = 40

[[moteurs]]
id = "sante_modules"
libelle = "Relève la santé de chaque module du noyau (verdict, moteurs et détecteurs suspendus)"
mode = "periodique"
toutes_les_s = 120
duree_max_s = 30

[[detecteurs]]
id = "alertes_du_monde"
libelle = "Une mesure du collecteur est en alerte depuis deux relevés (ni acceptée, ni en maintenance)"
frequence_s = 60

[[detecteurs]]
id = "modules_en_echec"
libelle = "Un module du noyau est en échec (moteur ou détecteur suspendu, ou santé illisible)"
frequence_s = 120

[[detecteurs]]
id = "sans_administrateur"
libelle = "Plus aucun administrateur : personne ne peut plus administrer Cassandra"
frequence_s = 300

[[detecteurs]]
id = "erreurs_navigateur"
libelle = "Des erreurs JavaScript se répètent dans les écrans des utilisateurs"
frequence_s = 300

[[detecteurs]]
id = "collecteur_muet"
libelle = "Le collecteur ne répond plus"
frequence_s = 30

[[detecteurs]]
id = "releves_figes"
libelle = "Le collecteur répond, mais ses relevés sont figés : il ne mesure plus (Cassandra le relance d'elle-même)"
frequence_s = 60

[[detecteurs]]
id = "unites_en_echec"
libelle = "Des unités systemd sont en échec"
frequence_s = 60

[[capacites]]
id = "sante"
libelle = "La dernière relève : score de santé, ressources, unités en échec"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "reparer"
libelle = "Réparer en un clic : le geste du catalogue qui répond à l'alerte (redémarrer une unité, nginx, relancer un conteneur compose, alléger le journal, appliquer les mises à jour), par la commande root du courtier, vérifié"
risque = "eleve"
droit = "agir"
perimetre = ["la machine : une unité, nginx, un projet docker compose, le journal système ou les paquets, selon le geste"]
preuve = "la commande root relit l'état après le geste (unité active, conteneur qui tourne) et le dit"
retour = "aucun : un geste de réparation ne se défait pas ; il est écrit au journal des gestes"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "seuils_pousser"
libelle = "Poser maintenant les seuils réglés dans le fichier du démon (commande root « seuils »), sans attendre le tour de cinq minutes"
risque = "faible"
droit = "agir"
perimetre = ["le fichier des seuils du démon (sensorium-seuils.json)"]
preuve = "le courtier a répondu ok et le fichier porte les seuils réglés"
retour = "aucun besoin : le prochain tour repose les seuils réglés ; remettre l'ancien réglage puis pousser rétablit l'ancien fichier"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "gestes_journal"
libelle = "Les derniers gestes de réparation faits depuis le Sensorium : qui, quoi, résultat"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "temoin"
libelle = "Le témoin extérieur : le script et la configuration à poser sur UNE AUTRE machine, qui sonne sur Telegram si ce serveur se tait dix minutes (le jeton de ton robot n'en sort jamais : il se remplit sur la machine témoin)"
risque = "lecture"
droit = "agir"

[[capacites]]
id = "demon"
libelle = "L'état du démon, dit par lui : processus, âge, mémoire, base, battement du watchdog, durée de ses passes ; et l'historique de ses redémarrages"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "redemarrer"
libelle = "Redémarrer le démon du Sensorium (après la passe en cours, ou tout de suite) : quelques secondes de silence, aucune mesure perdue"
risque = "moyen"
droit = "agir"
perimetre = ["le démon du Sensorium (sensorium.service), par la commande root « redemarrer » du courtier"]
preuve = "le démon répond sur sa socket avec un autre processus"
retour = "aucun : un redémarrage ne se défait pas, il se vérifie (si le démon ne revient pas, le watchdog de systemd le relance)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra"]

[[capacites]]
id = "etat"
libelle = "Tout ce que l'écran du Sensorium lit : les mesures nommées en français (famille, objet, alerte acceptée, maintenance), les changements, les corrélations, les fenêtres"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "erreur_navigateur"
libelle = "Signaler une erreur JavaScript d'un écran : une ligne dédoublonnée (message, fichier, ligne, page), plafonnée à 300 lignes et 14 jours"
risque = "faible"
droit = "signaler"
perimetre = ["une ligne du journal des erreurs d'écran (message, fichier, ligne, page)"]
preuve = "la ligne existe"
retour = "rien à défaire : c'est un compteur de signalements"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "erreurs_navigateur"
libelle = "Les erreurs JavaScript signalées par les écrans (les trente dernières, avec leur nombre)"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "fenetres"
libelle = "Les fenêtres de maintenance : en cours, à venir, et les dix dernières"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "accepter"
libelle = "Accepter une alerte : « je sais, c'est normal ». Elle se tait jusqu'à l'échéance, et revient si son chiffre monte"
risque = "faible"
droit = "agir"
perimetre = ["une ligne d'alerte acceptée (la mesure, la raison, l'échéance, la valeur d'alors)"]
preuve = "la ligne existe"
retour = "remettre l'acceptation d'avant, ou la retirer"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "retirer_acceptation"
libelle = "Ne plus accepter une alerte : elle redevient une alerte"
risque = "faible"
droit = "agir"
perimetre = ["une ligne d'alerte acceptée"]
preuve = "la ligne n'existe plus"
retour = "remettre la ligne retirée"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "fenetre_poser"
libelle = "Poser une fenêtre de maintenance : les mesures qu'elle couvre se taisent le temps voulu (les relevés continuent), puis reviennent"
risque = "faible"
droit = "agir"
perimetre = ["une ligne de fenêtre de maintenance", "une portée : tout, une famille, un domaine, une machine, ou un seul site (site:<nom de domaine>)"]
preuve = "la fenêtre existe et n'est pas annulée"
retour = "annuler la fenêtre"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "fenetre_annuler"
libelle = "Annuler une fenêtre de maintenance : ses mesures reparlent aussitôt"
risque = "faible"
droit = "agir"
perimetre = ["une ligne de fenêtre de maintenance"]
preuve = "la fenêtre est marquée annulée"
retour = "rouvrir la fenêtre"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "modules"
libelle = "La santé de chaque module du noyau, telle que le noyau la mesure (verdict, moteurs, détecteurs coupés, refus)"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "metriques"
libelle = "Les ressources, mesurées à l'instant (compter une fraction de seconde)"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "monde"
libelle = "Le modèle du monde : ce que le collecteur sait, par préfixe de clé"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "entite"
libelle = "Une entité surveillée (services, ports, certificats, sauvegardes...)"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "historique"
libelle = "L'histoire d'une mesure sur trente jours"
risque = "lecture"
droit = "voir_infra"

[[capacites]]
id = "changements"
libelle = "Ce qui a changé sur la machine depuis une date"
risque = "lecture"
droit = "voir_infra"

[[ecrans]]
id = "vue_sensorium"
libelle = "Sensorium"
domaine = "supervision"
gabarit = "tableau"

[[menus]]
id = "sensorium"
libelle = "Sensorium"
ecran = "vue_sensorium"
ordre = 5
role = "admin"
icone = "radar"
badge = "constats"

[[widgets]]
id = "sante"
libelle = "Santé de la machine"
ecran = "accueil"
zone = "principal"
taille = "s"
ordre = 1
role = "admin"
composant = "jauge"
source = "sante"
rafraichir_s = 30

[[widgets]]
id = "ressources"
libelle = "Ressources"
ecran = "vue_sensorium"
composant = "liste"
source = "sante"
rafraichir_s = 30

[theme]
accent = "#4a56c8"

[permissions]
lectures = true
stockage = true
racine = true
privileges = ["installer : le service sensorium.service tourne en root, pour tout voir"]
ecritures = ["/run/sensorium"]

[[racine]]
id = "reparer"
libelle = "Exécuter UN geste de réparation de la table fermée (redémarrer une unité, nginx, relancer un conteneur compose, alléger le journal, appliquer les mises à jour), puis le vérifier"

[[racine]]
id = "seuils"
libelle = "Poser le fichier des seuils du démon (certificats, disques, lenteur, espace, sauvegarde, activité) : des entiers dans leurs bornes, dans un dossier gravé à l'installation"

[[racine]]
id = "redemarrer"
libelle = "Redémarrer le démon du Sensorium (sensorium.service), après la passe en cours ou tout de suite, puis vérifier qu'il répond avec un autre processus"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "serie"
libelle = "Les points d'une mesure de la machine (processeur, mémoire, disque…) sur une période, lus dans l'historique du collecteur"
risque = "lecture"
droit = "voir_infra"

[[mesures]]
id = "cpu"
libelle = "Processeur"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Charge processeur."

[[mesures]]
id = "ram"
libelle = "Mémoire vive"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Mémoire occupée."

[[mesures]]
id = "swap"
libelle = "Swap"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Recours au disque comme mémoire : un swap qui monte annonce l'étouffement."

[[mesures]]
id = "disk"
libelle = "Disque"
capacite = "serie"
unite = "%"
famille = "Système hôte"
plafond = 100
fraicheur_s = 180
description = "Remplissage du disque. C'est la tendance qui compte, pas l'instant."

[[mesures]]
id = "load1"
libelle = "Charge moyenne (1 min)"
capacite = "serie"
famille = "Système hôte"
fraicheur_s = 180
description = "File d'attente du processeur."

[[mesures]]
id = "disk_free"
libelle = "Espace libre"
capacite = "serie"
unite = "Go"
famille = "Système hôte"
pire = "bas"
fraicheur_s = 180
description = "Ce qu'il reste réellement."

[[mesures]]
id = "ram_used"
libelle = "Mémoire utilisée"
capacite = "serie"
unite = "Go"
famille = "Système hôte"
fraicheur_s = 180
description = "En valeur absolue."

[[mesures]]
id = "sante"
libelle = "Score de santé"
capacite = "serie"
unite = "/100"
famille = "Système hôte"
pire = "bas"
fraicheur_s = 1200
description = "Note globale calculée par le collecteur."

[[mesures]]
id = "oom"
libelle = "Tueur de processus (OOM)"
capacite = "serie"
genre = "compteur"
unite = "/h"
famille = "Système hôte"
vide = "rien_a_signaler"
description = "Processus tués faute de mémoire. Une seule occurrence est déjà une alerte."

[[droits]]
id = "agir"
libelle = "Agir depuis le Sensorium : accepter une alerte, poser une fenêtre de maintenance, redémarrer le démon"
sensible = true

[[droits]]
id = "voir_infra"
libelle = "Lire ce que le Sensorium sait de l'infrastructure de l'instance (modèle du monde, démon, santé des modules, historiques) : jamais attribué par défaut, les administrateurs l'ont d'office"
sensible = true

[[droits]]
id = "signaler"
libelle = "Signaler au Sensorium une erreur JavaScript de son écran (message, fichier, ligne : rien d'autre)"
defaut = true

[[droits]]
id = "voir_securite"
libelle = "Lire les totaux d'attaques de la machine (adresses, chemins, robots) pour la page Sécurité › En images"
sensible = true

[[capacites]]
id = "secu"
libelle = "Les totaux d'attaques que le collecteur tient (jours, heures, chemins, adresses les plus actives, sites, robots), les mesures diverses (courriel, box, tailnet) et la sauvegarde hors machine — des agrégats, aucune ligne de journal"
risque = "lecture"
droit = "voir_securite"
# ── Les mesures de première classe (docs/CN_SENSORIUM_EVOLUTION.md) ──
[[droits]]
id = "voir_etat"
libelle = "Lire l'ÉTAT (ok, alerte, inconnu, depuis quand) des mesures que l'administrateur a publiées pour sa société : jamais une valeur, un détail ou un hôte"
defaut = true

[[droits]]
id = "alimenter"
libelle = "Déclarer des capteurs et leur envoyer des lectures, poser des relations entre objets (un module, un nœud satellite)"
sensible = true

[[droits]]
id = "suivre"
libelle = "Suivre des mesures : recevoir un événement mesure.change quand leur état change"
sensible = true

[[droits]]
id = "publier"
libelle = "Décider à qui l'état d'une mesure se montre (instance, certaines sociétés, toutes)"
sensible = true

[[moteurs]]
id = "suivi_mesures"
libelle = "Fait passer en « inconnu » une mesure suivie dont l'émetteur s'est tu, l'annonce, et purge l'historique ancien"
mode = "periodique"
toutes_les_s = 30
duree_max_s = 20

[[detecteurs]]
id = "capteurs_suivis_muets"
libelle = "Des mesures suivies ne répondent plus (un seul constat qui les résume)"
frequence_s = 120

[[capacites]]
id = "capteur_declarer"
libelle = "Déclarer un capteur (clé « espace.nom », fraîcheur attendue, seuils, sens du pire, confiance minimale) : l'espace appartient au compte qui le déclare en premier"
risque = "faible"
droit = "alimenter"
perimetre = ["un capteur (une ligne : clé, seuils, fraîcheur) dans l'espace du compte"]
preuve = "le capteur existe"
retour = "le capteur déclaré pour la première fois est retiré"
paliers = ["auto"]
qui = ["humain", "compte", "agent", "cassandra"]

[[capacites]]
id = "capteur_retirer"
libelle = "Retirer un capteur du compte, avec sa dernière lecture et son historique"
risque = "faible"
droit = "alimenter"
perimetre = ["un capteur du compte, sa lecture et son historique"]
preuve = "le capteur n'existe plus"
retour = "le capteur est redéclaré (sa lecture et son historique ne reviennent pas)"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "capteur_alimenter"
libelle = "Envoyer jusqu'à 50 lectures (valeur, gravité, heure revendiquée, confiance) aux capteurs du compte : chacune est acceptée ou refusée avec son motif"
risque = "faible"
droit = "alimenter"
perimetre = ["la dernière lecture et l'historique des capteurs du compte"]
preuve = "la dernière lecture acceptée est enregistrée"
retour = "rien à défaire : la lecture suivante remplace la précédente, et l'historique est plafonné"
paliers = ["auto"]
qui = ["humain", "compte", "agent", "cassandra"]

[[capacites]]
id = "mesure_suivre"
libelle = "Suivre une mesure : le compte reçoit mesure.change à chaque changement d'état (50 clés par compte, 500 au total)"
risque = "faible"
droit = "suivre"
perimetre = ["une ligne de suivi (clé, compte)"]
preuve = "le suivi existe"
retour = "le suivi créé est retiré"
paliers = ["auto"]
qui = ["humain", "compte", "agent", "cassandra"]

[[capacites]]
id = "mesure_ne_plus_suivre"
libelle = "Ne plus suivre une mesure"
risque = "faible"
droit = "suivre"
perimetre = ["une ligne de suivi (clé, compte)"]
preuve = "le suivi n'existe plus"
retour = "le suivi retiré est remis"
paliers = ["auto"]
qui = ["humain", "compte", "agent", "cassandra"]

[[capacites]]
id = "mesure_publier"
libelle = "Publier l'état d'une mesure pour des sociétés (« societes:1,2 »), pour toutes, ou la remettre à l'instance : jamais ses valeurs"
risque = "faible"
droit = "publier"
perimetre = ["la visibilité d'une clé (une ligne)"]
preuve = "la visibilité lue est celle demandée"
retour = "la visibilité d'avant est remise"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "lien_poser"
libelle = "Poser une relation « de dépend de vers » entre deux objets (depend_de, heberge_par, certifie_par, resout_par, decrit) pour l'analyse d'impact"
