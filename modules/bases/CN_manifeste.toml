# RÔLE       : Les bases de données du serveur (nom, utilisateur, site lié, taille, dernière copie), lues par le panneau d'hébergement détecté : le module ne nomme aucun panneau, il demande à Panel Detect. Créer et supprimer une base se font par le panneau, au nom de la personne et avec sa confirmation ; le mot de passe d'une base neuve n'est montré qu'une fois.
