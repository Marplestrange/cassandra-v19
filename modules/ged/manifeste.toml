[module]
id = "ged"
nom = "Gestion électronique de documents"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Gestion électronique : sources, fichiers, versions, indexation."
confiance = "interne"
famille = "gestion"
requiert = ["droits"]

[[droits]]
id = "gerer"
libelle = "Gérer les sources, les réglages et l'espace public"
sensible = true

[[reglages]]
id = "chemin_base"
libelle = "Chemin de base des documents"
type = "texte"
defaut = "/srv/documents"
portee = "global"

[[reglages]]
id = "taille_max"
libelle = "Taille maximale (octets)"
type = "entier"
defaut = 26214400
portee = "global"
minimum = 0

[[reglages]]
id = "sans_inline"
libelle = "Forcer le téléchargement (pas d'affichage en ligne)"
type = "booleen"
defaut = true
portee = "global"

[[reglages]]
id = "extraction"
libelle = "Nom du dossier d'extraction des pièces jointes"
type = "texte"
defaut = "Pièces jointes"
portee = "global"

[[objets]]
type = "document"
libelle = "Un document"

[[objets]]
type = "racine"
libelle = "Une source de documents (locale ou distante)"

[evenements]
emet = ["document.cree", "document.supprime", "document.modifie", "racine.creee"]
ecoute = []

[[detecteurs]]
id = "montages"
libelle = "Surveille la présence des montages réseau (sentinelles)"
frequence_s = 60

[[capacites]]
id = "configurer"
libelle = "Modifier les sources de documents (racines)"
risque = "moyen"
droit = "gerer"
perimetre = ["la table ged_racines"]
preuve = "relire les racines"
retour = "remettre l'état d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "operer"
libelle = "Renommer, copier, déplacer, supprimer un fichier ou créer un dossier"
risque = "moyen"
perimetre = ["le système de fichiers local ou distant via rclone, ou la corbeille"]
preuve = "vérifier la présence du fichier/dossier à destination"
retour = "défaire l'action (restaurer de la corbeille, supprimer le dossier, redéplacer)"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra"]

[[capacites]]
id = "lister"
libelle = "Lister le contenu d'une source"
risque = "lecture"

[[capacites]]
id = "voir"
libelle = "Lire un document ou obtenir son lien de téléchargement"
risque = "lecture"

[permissions]
stockage = true
droits = true
introspection = true
