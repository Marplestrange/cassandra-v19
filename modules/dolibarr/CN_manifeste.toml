# ══════════════════════════════════════════════════════════════════════════════
# TITRE      : Manifeste du module Dolibarr
# LICENCE    : AGPL-3.0
# AUTEUR     : Atek Drisse
# GIT        : github.com/Marplestrange
# MAIL       : marplestrange@cassandra.center
# MODULE     : dolibarr
# ZONE       : CN
# VERSION CN : 0.4.0  #f05625
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : Le pont vers une instance Dolibarr, par son API REST. Lit (santé, comptes, impayés, objets) et agit : créer et modifier des tiers, contacts, produits, projets, des brouillons de documents, avec preuve et retour arrière. Supprimer passe par une corbeille. Le plafond d'autonomie est le choix de l'administrateur.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.4.0 empreinte=f05625 ▼▼▼
[module]
id = "dolibarr"
nom = "Dolibarr"
version = "0.4.0"
noyau_min = "0.1.0"
description = "Le pont vers une instance Dolibarr, par son API REST. Lit (santé, comptes, impayés, objets) et agit : créer et modifier des tiers, contacts, produits, projets, des brouillons de documents, avec preuve et retour arrière. Supprimer passe par une corbeille. Le plafond d'autonomie est le choix de l'administrateur."
confiance = "interne"
famille = "finance"
famille_libelle = "Finance et ventes"
famille_icone = "fam_finance"
importance = "optionnel"
sans = "Plus de lien avec Dolibarr : factures, tiers et impayés ne remontent plus."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[droits]]
id = "utiliser"
libelle = "Utiliser Dolibarr : consulter et travailler dans ce module"
defaut = true

[[droits]]
id = "administrer"
libelle = "Administrer Dolibarr : réglages et gestes sensibles"
sensible = true

[[objets]]
type = "dolibarr"
libelle = "Une instance Dolibarr pilotée par Cassandra"

[[objets]]
type = "dolibarr_corbeille"
libelle = "La copie entière d'un objet supprimé de Dolibarr, de quoi le recréer"

[[reglages]]
id = "url"
libelle = "Adresse de l'API de Dolibarr (https://… ou http://…/api/index.php)"
aide = "Vide : on lit config/dolibarr.conf. Rempli, ce réglage l'emporte."
portee = "societe"
[[reglages]]
id = "hote"
libelle = "En-tête Host à envoyer (quand l'adresse est une IP)"
portee = "societe"
[[reglages]]
id = "delai"
libelle = "Délai d'attente d'une requête, en secondes"
type = "entier"
defaut = 0
minimum = 0
maximum = 120
aide = "0 : la valeur du fichier dolibarr.conf, sinon 15 secondes."
portee = "societe"
[[reglages]]
id = "cle_api"
libelle = "Ma clé d'API Dolibarr : mon Itare et moi agissons dans Dolibarr sous le nom de son utilisateur"
aide = "Jamais affichée, chiffrée au repos. Sans elle, ni vous ni votre Itare n'écrivez dans Dolibarr ; vous lisez avec la clé de mandat."
type = "secret"
portee = "compte"
[[reglages]]
id = "cle_mandat"
libelle = "Clé de mandat : celle de l'utilisateur Dolibarr dédié à Cassandra (moteurs, billetterie, lectures d'un compte sans clé)"
aide = "Vide : on lit le fichier de clé (config/dolibarr.key). Un utilisateur Dolibarr aux droits limités vaut mieux qu'un administrateur."
type = "secret"
portee = "societe"
[[reglages]]
id = "mandat_pour_tous"
libelle = "Un compte sans clé propre écrit avec la clé de mandat"
aide = "Désactivé par défaut : un compte sans clé ne peut rien écrire, et ne tombe jamais sur la clé d'un autre."
type = "booleen"
defaut = false
portee = "societe"
[[reglages]]
id = "societe_attendue"
libelle = "Nom exact de la société Dolibarr dans laquelle on écrit"
aide = "Rempli : avant chaque écriture, le pont vérifie que la clé voit cette société ; sinon il refuse. Évite d'écrire dans la mauvaise entité."
portee = "societe"
[evenements]
emet = ["dolibarr.injoignable", "dolibarr.acces_refuse", "dolibarr.reprise"]

[[moteurs]]
id = "releve"
libelle = "Sonde Dolibarr (santé chaque minute, comptes et impayés tous les quarts d'heure)"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 90

[[detecteurs]]
id = "injoignable"
libelle = "Dolibarr ne répond plus"
frequence_s = 60

[[detecteurs]]
id = "acces_refuse"
libelle = "Dolibarr refuse la clé d'API"
frequence_s = 60

[[capacites]]
id = "resume"
libelle = "La dernière relève : version, comptes, factures impayées"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "statut"
libelle = "L'état de Dolibarr à l'instant (version, latence)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "modules"
libelle = "Les modules actifs de Dolibarr"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "compter"
libelle = "Compter les objets d'un type (tiers, factures, devis, commandes, projets, produits, contacts)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "lister"
libelle = "Lister des objets, par page, avec des champs bornés (pas de coordonnées personnelles)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "lire"
libelle = "Lire un objet par son identifiant, avec des champs bornés"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "impayees"
libelle = "Les factures impayées : nombre, total TTC, la plus ancienne échéance"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "creer"
libelle = "Créer un tiers, un contact, un produit ou un projet dans Dolibarr"
risque = "moyen"
droit = "utiliser"
perimetre = ["tiers, contacts, produits, projets", "champs de la liste permise seulement"]
preuve = "relire l'objet créé et comparer chaque champ écrit"
retour = "supprimer l'objet que cet acte vient de créer, et lui seul"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "modifier"
libelle = "Modifier des champs d'un tiers, d'un contact, d'un produit ou d'un projet"
risque = "moyen"
droit = "utiliser"
perimetre = ["tiers, contacts, produits, projets", "champs de la liste permise seulement"]
preuve = "relire l'objet et comparer les champs modifiés"
retour = "remettre les valeurs d'avant, relevées juste avant l'écriture"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "creer_brouillon"
libelle = "Créer un brouillon de facture, de devis ou de commande (jamais validé par cet acte)"
risque = "moyen"
droit = "utiliser"
perimetre = ["factures, devis, commandes à l'état de brouillon"]
preuve = "relire le document : statut brouillon, nombre de lignes et tiers conformes"
retour = "supprimer ce brouillon, seulement s'il est encore un brouillon"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "supprimer"
libelle = "Supprimer un tiers, un contact, un produit, un projet ou un brouillon de document, après en avoir gardé une copie entière dans la corbeille"
risque = "eleve"
droit = "administrer"
perimetre = ["tiers, contacts, produits, projets, brouillons de documents", "Dolibarr refuse ce qui est référencé ailleurs"]
preuve = "relire l'objet : Dolibarr répond qu'il n'existe plus"
retour = "recréer l'objet depuis la copie de la corbeille (l'identifiant change)"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "restaurer"
libelle = "Recréer un objet supprimé, depuis la corbeille"
risque = "moyen"
droit = "utiliser"
perimetre = ["les objets de la corbeille à l'état supprimé"]
preuve = "relire l'objet recréé"
retour = "supprimer l'objet recréé, la copie restant dans la corbeille"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "corbeille"
libelle = "Lister la corbeille : ce qui a été supprimé et peut être recréé"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "valider_facture"
libelle = "Valider une facture brouillon : elle prend un numéro légal"
risque = "eleve"
droit = "administrer"
perimetre = ["une facture à l'état de brouillon"]
preuve = "relire la facture : statut validé"
retour = "repasser la facture en brouillon (impossible si elle est payée ou comptabilisée)"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "mon_acces"
libelle = "Qui suis-je dans Dolibarr : la clé utilisée (propre, de mandat ou du fichier), l'utilisateur, la société vue"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "encaisser"
libelle = "Encaisser un règlement sur une facture validée, sur un compte bancaire"
risque = "eleve"
droit = "administrer"
perimetre = ["une facture validée et ouverte", "le montant ne dépasse pas le reste dû"]
preuve = "relire la facture : le reste dû a baissé du montant, et un règlement de plus existe"
retour = "supprimer ce règlement (Dolibarr le refuse s'il est déjà rapproché en banque)"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "creer_avoir"
libelle = "Préparer un avoir en brouillon sur une facture validée"
risque = "moyen"
droit = "utiliser"
perimetre = ["un brouillon d'avoir, jamais validé par cet acte"]
preuve = "relire l'avoir : brouillon, relié à sa facture, mêmes lignes en négatif"
retour = "supprimer ce brouillon, seulement s'il l'est encore"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "relancer"
libelle = "Noter une relance de facture dans l'agenda du tiers (le courriel part par le module Mandats)"
risque = "moyen"
droit = "utiliser"
perimetre = ["une facture validée et ouverte", "le texte est gardé dans Dolibarr ; aucune adresse ne vient de la demande"]
preuve = "relire l'évènement de l'agenda"
retour = "supprimer l'évènement que cet acte vient de créer"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "devis"
libelle = "Valider un devis, le marquer signé ou refusé"
risque = "moyen"
droit = "utiliser"
perimetre = ["valider : brouillon → ouvert", "signer et refuser : ouvert → signé ou refusé"]
preuve = "relire le devis : le statut voulu"
retour = "remettre le devis en brouillon"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "facturer_devis"
libelle = "Préparer une facture en brouillon depuis un devis signé"
risque = "moyen"
droit = "utiliser"
perimetre = ["un devis signé, ses lignes recopiées", "la facture reste un brouillon"]
preuve = "relire la facture : brouillon, tiers et nombre de lignes du devis"
retour = "supprimer ce brouillon, seulement s'il l'est encore"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "don_creer"
libelle = "Saisir un don (promesse)"
risque = "moyen"
droit = "utiliser"
perimetre = ["montant, date, donateur"]
preuve = "relire le don : même montant"
retour = "supprimer cette promesse, seulement si elle n'est pas validée"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "don_valider"
libelle = "Valider un don : il prend son numéro"
risque = "eleve"
droit = "administrer"
perimetre = ["une promesse de don"]
preuve = "relire le don : statut validé"
retour = "impossible par l'API : Dolibarr ne repasse pas un don validé en promesse, à défaire dans Dolibarr"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "don_recu"
libelle = "Éditer le reçu fiscal (PDF) d'un don validé"
risque = "moyen"
droit = "utiliser"
perimetre = ["un don validé"]
preuve = "relire les documents du don : un PDF existe"
retour = "supprimer le PDF que cet acte vient de produire"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "cotisation"
libelle = "Enregistrer la cotisation d'un adhérent"
risque = "moyen"
droit = "utiliser"
perimetre = ["une cotisation sur un adhérent existant"]
preuve = "relire les cotisations de l'adhérent : une de plus"
retour = "supprimer la cotisation que cet acte vient de créer"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "virement_interne"
libelle = "Virer un montant d'un compte bancaire Dolibarr à un autre"
risque = "eleve"
droit = "administrer"
perimetre = ["deux comptes différents", "le montant est relu sur les deux soldes"]
preuve = "relire les deux soldes : l'un baisse, l'autre monte du montant"
retour = "faire le virement inverse"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "projet"
libelle = "Valider un projet ou le clore"
risque = "moyen"
droit = "utiliser"
perimetre = ["valider : brouillon → ouvert", "clore : ouvert → clos"]
preuve = "relire le projet : le statut voulu"
retour = "remettre le statut d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "lire_libre"
libelle = "Lire n'importe quel point de l'API de Dolibarr (les secrets sont masqués dans la réponse)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "ecrire_libre"
libelle = "Écrire n'importe où dans l'API de Dolibarr (POST ou PUT ; une suppression passe par « supprimer »)"
risque = "eleve"
droit = "administrer"
perimetre = ["tous les domaines de l'API de Dolibarr", "POST ou PUT seulement", "le corps est un objet JSON de 16 Ko au plus"]
preuve = "relire l'objet écrit et comparer les champs (une action sans objet : la réponse de Dolibarr)"
retour = "PUT : remettre les valeurs d'avant ; POST sur une collection : supprimer ce qui vient d'être créé ; une action n'a pas de retour générique"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "piece_pdf"
libelle = "Lire le PDF qu'a produit Dolibarr pour un devis, une facture ou un reçu de don (pour l'afficher dans Cassandra)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "produire_pdf"
libelle = "Faire produire à Dolibarr le PDF d'un devis, d'une facture ou d'un don qui n'en a pas encore"
risque = "moyen"
droit = "utiliser"
perimetre = ["devis, factures, dons", "une pièce qui n'a pas encore de PDF"]
preuve = "relire les documents de la pièce : un PDF existe"
retour = "supprimer le PDF que cet acte vient de produire"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[ecrans]]
id = "vue_dolibarr"
libelle = "Dolibarr"
domaine = "gestion"
gabarit = "tableau"

[[menus]]
id = "dolibarr"
libelle = "Dolibarr"
ecran = "vue_dolibarr"
ordre = 10
role = "admin"
icone = "briefcase"
badge = "constats"
droit = "utiliser"

[[widgets]]
id = "etat"
libelle = "Dolibarr"
ecran = "accueil"
zone = "principal"
taille = "s"
ordre = 20
role = "admin"
composant = "etat"
source = "resume"
rafraichir_s = 60

[[widgets]]
id = "chiffres"
libelle = "Chiffres de Dolibarr"
ecran = "vue_dolibarr"
composant = "liste"
source = "resume"
rafraichir_s = 60

[theme]
accent = "#6a3fa0"

[permissions]
reseau = ["l'hôte de l'instance, fixé dans config/dolibarr.conf"]
privileges = ["la clé d'API de Dolibarr donne les droits de son utilisateur : en faire un utilisateur dédié aux droits limités"]
