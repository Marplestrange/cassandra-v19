# ══════════════════════════════════════════════════════════════════════════════
# TITRE      : Manifeste du module Dolibarr
# LICENCE    : AGPL-3.0
# AUTEUR     : Atek Drisse
# GIT        : github.com/Marplestrange
# MAIL       : marplestrange@cassandra.center
# MODULE     : dolibarr
# ZONE       : CN
# VERSION CN : 0.4.1  #464208
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : Le pont vers une instance Dolibarr, par son API REST. Lit (santé, comptes, impayés, objets) et agit : créer et modifier des tiers, contacts, produits, projets, des brouillons de documents, avec preuve et retour arrière. Supprimer passe par une corbeille. Le plafond d'autonomie est le choix de l'administrateur.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.4.1 empreinte=464208 ▼▼▼
[module]
id = "dolibarr"
nom = "Dolibarr"
version = "0.4.1"
noyau_min = "0.1.0"
description = "Le pont vers une instance Dolibarr, par son API REST. Lit (santé, comptes, impayés, objets) et agit : créer et modifier des tiers, contacts, produits, projets, des brouillons de documents, avec preuve et retour arrière. Supprimer passe par une corbeille. Le plafond d'autonomie est le choix de l'administrateur."
confiance = "interne"
famille = "finance"
groupe = "metier"
proprietaire = "itare"
famille_libelle = "Finance et ventes"
famille_icone = "fam_finance"
importance = "optionnel"
sans = "Plus de lien avec Dolibarr : factures, tiers et impayés ne remontent plus."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[droits]]
id = "consulter"
libelle = "Consulter Dolibarr : lire les tiers, factures, devis, dons, adhérents, projets et la banque, et voir ses PDF"
defaut = true

[[droits]]
id = "facturer"
libelle = "Facturer et encaisser : préparer devis, factures (en brouillon) et avoirs, relancer, encaisser un règlement, produire un PDF"

[[droits]]
id = "valider"
libelle = "Valider : donner leur numéro légal aux factures (elles ne se défont pas), valider un don, valider ou clore un projet"
sensible = true

[[droits]]
id = "tiers"
libelle = "Gérer les tiers, contacts, produits et projets : créer, modifier, restaurer, les envoyer à Dolibarr ou les en détacher"

[[droits]]
id = "dons"
libelle = "Gérer les dons et les adhérents : saisir un don, enregistrer une cotisation"

[[droits]]
id = "tresorerie"
libelle = "Trésorerie : virements entre comptes bancaires et paiement des factures fournisseurs"
sensible = true

[[droits]]
id = "libre"
libelle = "Requête libre : lire et écrire dans n'importe quelle route de l'API de Dolibarr"
sensible = true

[[droits]]
id = "administrer"
libelle = "Administrer Dolibarr : supprimer, lire la base (superadministrateurs), réglages et pont de la billetterie"
sensible = true

[[objets]]
type = "dolibarr"
libelle = "Une instance Dolibarr pilotée par Cassandra"

[[objets]]
type = "dolibarr_lien"
libelle = "Le lien entre une fiche de Cassandra (projet, contact) et l'objet Dolibarr où elle a été envoyée"

[[objets]]
type = "dolibarr_corbeille"
libelle = "La copie entière d'un objet supprimé de Dolibarr, de quoi le recréer"

[[reglages]]
id = "url"
libelle = "Adresse de l'API de Dolibarr (https://… ou http://…/api/index.php)"
aide = "Vide : on lit config/dolibarr.conf. Rempli, ce réglage l'emporte."
portee = "societe"
[[reglages]]
id = "hote"
libelle = "En-tête Host à envoyer (quand l'adresse est une IP)"
portee = "societe"
[[reglages]]
id = "delai"
libelle = "Délai d'attente d'une requête, en secondes"
type = "entier"
defaut = 0
minimum = 0
maximum = 120
aide = "0 : la valeur du fichier dolibarr.conf, sinon 15 secondes."
portee = "societe"
[[reglages]]
id = "cle_api"
libelle = "Ma clé d'API Dolibarr : mon Itare et moi agissons dans Dolibarr sous le nom de son utilisateur"
aide = "Jamais affichée, chiffrée au repos. Sans elle, ni vous ni votre Itare n'écrivez dans Dolibarr ; vous lisez avec la clé de mandat."
type = "secret"
portee = "compte"
[[reglages]]
id = "cle_mandat"
libelle = "Clé de mandat : celle de l'utilisateur Dolibarr dédié à Cassandra (moteurs, billetterie, lectures d'un compte sans clé)"
aide = "Vide : on lit le fichier de clé (config/dolibarr.key). Un utilisateur Dolibarr aux droits limités vaut mieux qu'un administrateur."
type = "secret"
portee = "societe"
[[reglages]]
id = "base_hote"
libelle = "Base de données de Dolibarr : hôte (lecture seule, superadministrateurs)"
aide = "Adresse du serveur MySQL ou MariaDB de Dolibarr (127.0.0.1 s'il tourne sur la même machine). Vide : la lecture de la base est coupée et le module marche comme avant. Réservé aux superadministrateurs ; tout est en lecture seule."
portee = "societe"
[[reglages]]
id = "base_port"
libelle = "Base de données de Dolibarr : port (3306 par défaut)"
aide = "Le port du serveur SQL. 3306 si tu n'as rien changé."
portee = "societe"
[[reglages]]
id = "base_nom"
libelle = "Base de données de Dolibarr : nom de la base"
aide = "Le nom de la base de Dolibarr (la valeur de dolibarr_main_db_name dans conf/conf.php)."
portee = "societe"
[[reglages]]
id = "base_utilisateur"
libelle = "Base de données de Dolibarr : utilisateur SQL (SELECT seulement)"
aide = "Crée un utilisateur qui n'a QUE le droit SELECT : CREATE USER 'cassandra_ro'@'localhost' IDENTIFIED BY '…'; GRANT SELECT ON dolibarr.* TO 'cassandra_ro'@'localhost'; N'utilise jamais l'utilisateur de Dolibarr lui-même : la capacité « base_etat » dit si l'utilisateur choisi a plus que le droit de lire."
portee = "societe"
[[reglages]]
id = "base_motdepasse"
libelle = "Base de données de Dolibarr : mot de passe de cet utilisateur"
aide = "Rangé chiffré. Il passe au client SQL par l'environnement du processus, jamais par la ligne de commande, et n'apparaît dans aucun message."
type = "secret"
portee = "societe"
[[reglages]]
id = "base_prefixe"
libelle = "Base de données de Dolibarr : préfixe des tables (llx_ par défaut)"
aide = "Le préfixe des tables de Dolibarr (la valeur de dolibarr_main_db_prefix dans conf/conf.php). llx_ si tu n'as rien changé."
portee = "societe"
[[reglages]]
id = "base_client"
libelle = "Base de données de Dolibarr : programme client (mysql par défaut)"
aide = "Le programme en ligne de commande qui parle au serveur SQL : « mysql » (ou « mariadb »). Il doit être installé sur la machine de Cassandra."
portee = "societe"
[[reglages]]
id = "mandat_pour_tous"
libelle = "Un compte sans clé propre écrit avec la clé de mandat"
aide = "Désactivé par défaut : un compte sans clé ne peut rien écrire, et ne tombe jamais sur la clé d'un autre."
type = "booleen"
defaut = false
portee = "societe"
[[reglages]]
id = "societe_attendue"
libelle = "Nom exact de la société Dolibarr dans laquelle on écrit"
aide = "Rempli : avant chaque écriture, le pont vérifie que la clé voit cette société ; sinon il refuse. Évite d'écrire dans la mauvaise entité."
portee = "societe"
[[reglages]]
id = "itare_ecrire"
libelle = "Mon Itare écrit dans Dolibarr"
aide = "« libre » : il suit le palier de chaque geste. « desactive » : il lit, il n'écrit jamais, quel que soit le palier. Ce réglage n'est jamais plus large que le palier."
type = "choix"
choix = ["libre", "desactive"]
defaut = "libre"
portee = "compte"
[[reglages]]
id = "prudence"
libelle = "Gestes que mon Itare ne fait jamais seul : il les prépare, je les approuve (identifiants séparés par des virgules, ou * pour tous)"
aide = "Plus strict que le palier de l'administrateur, jamais plus large. Exemple : encaisser,payer_fournisseur,frais_payer."
portee = "compte"
[[reglages]]
id = "itare_seuil"
libelle = "Seuil en euros : au-dessus, mon Itare ne règle, ne vire, ne cotise ni ne saisit un don (0 : pas de seuil)"
type = "entier"
defaut = 0
minimum = 0
maximum = 10000000
portee = "compte"
[evenements]
emet = ["dolibarr.injoignable", "dolibarr.acces_refuse", "dolibarr.reprise", "dolibarr.facture_payee", "dolibarr.don_recu"]

[[moteurs]]
id = "releve"
libelle = "Sonde Dolibarr (santé chaque minute ; comptes, impayés, factures payées et dons reçus tous les quarts d'heure)"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 90

[[detecteurs]]
id = "injoignable"
libelle = "Dolibarr ne répond plus"
frequence_s = 60

[[detecteurs]]
id = "acces_refuse"
libelle = "Dolibarr refuse la clé d'API"
frequence_s = 60

[[detecteurs]]
id = "nouveautes"
libelle = "Une facture payée ou un don arrivé chez Dolibarr (affiché sept jours dans la cloche)"
frequence_s = 300

[[capacites]]
id = "resume"
libelle = "La dernière relève : version, comptes, factures impayées"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "statut"
libelle = "L'état de Dolibarr à l'instant (version, latence)"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "modules"
libelle = "Les modules actifs de Dolibarr"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "compter"
libelle = "Compter les objets d'un type (tiers, factures, devis, commandes, projets, produits, contacts)"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "lister"
libelle = "Lister des objets, par page, avec des champs bornés (pas de coordonnées personnelles)"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "lire"
libelle = "Lire un objet par son identifiant, avec des champs bornés"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "impayees"
libelle = "Les factures impayées : nombre, total TTC, la plus ancienne échéance"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "creer"
libelle = "Créer un tiers, un contact, un produit ou un projet dans Dolibarr"
risque = "moyen"
droit = "tiers"
perimetre = ["tiers, contacts, produits, projets", "champs de la liste permise seulement"]
preuve = "relire l'objet créé et comparer chaque champ écrit"
retour = "supprimer l'objet que cet acte vient de créer, et lui seul"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "modifier"
libelle = "Modifier des champs d'un tiers, d'un contact, d'un produit ou d'un projet"
risque = "moyen"
droit = "tiers"
perimetre = ["tiers, contacts, produits, projets", "champs de la liste permise seulement"]
preuve = "relire l'objet et comparer les champs modifiés"
retour = "remettre les valeurs d'avant, relevées juste avant l'écriture"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "creer_brouillon"
libelle = "Créer un brouillon de facture, de devis ou de commande (jamais validé par cet acte)"
risque = "moyen"
droit = "facturer"
perimetre = ["factures, devis, commandes à l'état de brouillon"]
preuve = "relire le document : statut brouillon, nombre de lignes et tiers conformes"
retour = "supprimer ce brouillon, seulement s'il est encore un brouillon"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "supprimer"
libelle = "Supprimer un tiers, un contact, un produit, un projet ou un brouillon de document, après en avoir gardé une copie entière dans la corbeille"
risque = "eleve"
droit = "administrer"
perimetre = ["tiers, contacts, produits, projets, brouillons de documents", "Dolibarr refuse ce qui est référencé ailleurs"]
preuve = "relire l'objet : Dolibarr répond qu'il n'existe plus"
retour = "recréer l'objet depuis la copie de la corbeille (l'identifiant change)"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "restaurer"
libelle = "Recréer un objet supprimé, depuis la corbeille"
risque = "moyen"
droit = "tiers"
perimetre = ["les objets de la corbeille à l'état supprimé"]
preuve = "relire l'objet recréé"
retour = "supprimer l'objet recréé, la copie restant dans la corbeille"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "corbeille"
libelle = "Lister la corbeille : ce qui a été supprimé et peut être recréé"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "valider_facture"
libelle = "Valider une facture brouillon : elle prend un numéro légal"
risque = "eleve"
droit = "valider"
perimetre = ["une facture à l'état de brouillon"]
preuve = "relire la facture : statut validé"
retour = "repasser la facture en brouillon (impossible si elle est payée ou comptabilisée)"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "base_requete"
libelle = "Lire la base de Dolibarr par une requête nommée (adresses des dons, champs personnalisés, journal inaltérable, chiffre d'affaires par mois) : superadministrateurs seulement"
risque = "lecture"
droit = "administrer"

[[capacites]]
id = "base_etat"
libelle = "Vérifier la lecture de la base de Dolibarr : connexion, version, tables attendues, et que l'utilisateur SQL n'a que le droit de lire"
risque = "lecture"
droit = "administrer"

[[droits]]
id = "ma_fiche"
libelle = "Lier, comparer et envoyer MA fiche utilisateur à Dolibarr (la mienne seulement, avec ma clé quand j'en ai une)"
defaut = true

[[capacites]]
id = "portrait"
libelle = "La photo de ma fiche utilisateur Dolibarr (si elle est liée et en porte une)"
risque = "lecture"
droit = "ma_fiche"

[[capacites]]
id = "fiche_chercher"
libelle = "Les utilisateurs de Dolibarr qui portent mon adresse : une proposition de lien, jamais un lien"
risque = "lecture"
droit = "ma_fiche"

[[capacites]]
id = "fiche_lire"
libelle = "Ma fiche utilisateur telle que Dolibarr la porte (liste blanche, au format de Cassandra)"
risque = "lecture"
droit = "ma_fiche"

[[capacites]]
id = "fiche_comparer"
libelle = "Ma fiche Cassandra et ma fiche Dolibarr, champ par champ : lesquels diffèrent"
risque = "lecture"
droit = "ma_fiche"

[[capacites]]
id = "fiche_lier"
libelle = "Lier ma fiche à un utilisateur de Dolibarr (qui doit porter mon adresse)"
risque = "faible"
droit = "ma_fiche"
perimetre = ["le lien de MA fiche : une ligne du registre du module"]
preuve = "relire le lien : il porte l'identifiant donné"
retour = "retirer le lien"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "fiche_delier"
libelle = "Délier ma fiche de Dolibarr (rien n'est effacé, ni d'un côté ni de l'autre)"
risque = "faible"
droit = "ma_fiche"
perimetre = ["le lien de MA fiche : une ligne du registre du module"]
preuve = "relire le lien : il n'existe plus"
retour = "remettre le lien d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "attente_lien"
libelle = "Ce que ce module attend du compte : relier sa fiche à Dolibarr"
risque = "lecture"

[[attentes]]
id = "lien"
capacite = "attente_lien"
vers = "mc_profil"
action = "Voir"

[[capacites]]
id = "fiche_regle"
libelle = "Qui l'emporte quand ma fiche Cassandra et ma fiche Dolibarr diffèrent : un choix par groupe de champs"
risque = "faible"
droit = "ma_fiche"
perimetre = ["le réglage « qui l'emporte » gardé dans le lien de MA fiche ; aucun champ n'est copié"]
preuve = "relire le lien : le choix est celui demandé"
retour = "remettre le choix d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "fiche_accorder"
libelle = "Noter que les deux fiches sont l'état convenu (le prochain changement des deux côtés se demandera)"
risque = "faible"
droit = "ma_fiche"
perimetre = ["les empreintes gardées dans le lien de MA fiche"]
preuve = "aucune : une simple note"
retour = "remettre les empreintes d'avant"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "mandat_etat"
libelle = "La clé de mandat de Dolibarr : l'adresse et la clé sont-elles posées (jamais leur valeur)"
risque = "lecture"

[[capacites]]
id = "mandat_verifier"
libelle = "Vérifier la clé de mandat par de vrais appels à Dolibarr (répond, clé reconnue, lecture des utilisateurs, pas administrateur) — rien n'est écrit"
risque = "lecture"

[[capacites]]
id = "fiche_ecrire"
libelle = "Envoyer des champs de ma fiche à Dolibarr (liste blanche ; les mots de passe, clés, salaires et notes privées ne passent jamais)"
risque = "moyen"
droit = "ma_fiche"
perimetre = ["ma fiche utilisateur dans Dolibarr : les champs donnés, de la liste blanche, pas les autres"]
preuve = "relire la fiche dans Dolibarr : les champs envoyés portent les valeurs envoyées"
retour = "remettre les valeurs d'avant, relevées juste avant l'envoi"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "mon_acces"
libelle = "Qui suis-je dans Dolibarr : la clé utilisée (propre, de mandat ou du fichier), l'utilisateur, la société vue"
risque = "lecture"
droit = "consulter"

[[capacites]]
id = "encaisser"
libelle = "Encaisser un règlement sur une facture validée, sur un compte bancaire"
risque = "eleve"
droit = "facturer"
perimetre = ["une facture validée et ouverte", "le montant ne dépasse pas le reste dû"]
preuve = "relire la facture : le reste dû a baissé du montant, et un règlement de plus existe"
retour = "supprimer ce règlement (Dolibarr le refuse s'il est déjà rapproché en banque)"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "creer_avoir"
libelle = "Préparer un avoir en brouillon sur une facture validée"
risque = "moyen"
droit = "facturer"
perimetre = ["un brouillon d'avoir, jamais validé par cet acte"]
preuve = "relire l'avoir : brouillon, relié à sa facture, mêmes lignes en négatif"
retour = "supprimer ce brouillon, seulement s'il l'est encore"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

# ── le pont de la billetterie : sa file d'écritures appelle ces capacités (ctx.agir, acteur « cassandra », compte système « noyau »). Tant que le palier est « raconter »,
# la file attend et le dit ; l'administrateur choisit « auto » pour donner son mandat à la billetterie (Dolibarr › Capacités).
[[capacites]]
id = "bil_tiers"
libelle = "Billetterie : retrouver ou créer le tiers (client, fournisseur ou « Clients divers ») d'une vente ou d'un versement"
risque = "moyen"
droit = "administrer"
perimetre = ["un tiers, retrouvé par courriel ou par référence extérieure avant d'être créé"]
preuve = "relire le tiers par son identifiant"
retour = "rien : un tiers déjà lié à des pièces ne se supprime pas à la volée, il s'archive dans Dolibarr"
paliers = ["raconter", "auto"]
qui = ["cassandra"]

[[capacites]]
id = "bil_facture"
libelle = "Billetterie : écrire la facture d'une commande payée, la valider (numéro légal) et y poser le règlement"
risque = "eleve"
droit = "administrer"
perimetre = ["une facture client par commande, retrouvée par sa référence extérieure ; un seul règlement"]
preuve = "relire la facture : validée, avec son numéro"
retour = "une facture validée ne s'efface pas : un avoir la corrige (bil_avoir)"
paliers = ["raconter", "auto"]
qui = ["cassandra"]

[[capacites]]
id = "bil_avoir"
libelle = "Billetterie : écrire et valider l'avoir d'une commande remboursée"
risque = "eleve"
droit = "administrer"
perimetre = ["un avoir par remboursement, retrouvé par sa référence extérieure"]
preuve = "relire l'avoir : de type avoir, validé, avec son numéro"
retour = "un avoir validé ne s'efface pas : il se corrige dans Dolibarr"
paliers = ["raconter", "auto"]
qui = ["cassandra"]

[[capacites]]
id = "bil_versement"
libelle = "Billetterie : écrire la facture fournisseur d'un versement de commission, la valider et y poser le virement"
risque = "eleve"
droit = "administrer"
perimetre = ["une facture fournisseur par versement, retrouvée par sa référence extérieure ; un seul règlement"]
preuve = "relire la facture fournisseur : validée, avec son numéro"
retour = "une facture validée ne s'efface pas : elle se corrige dans Dolibarr"
paliers = ["raconter", "auto"]
qui = ["cassandra"]

[[capacites]]
id = "bil_adherent"
libelle = "Billetterie : créer l'adhérent Dolibarr d'un artiste (type « Artiste », créé la première fois)"
risque = "moyen"
droit = "administrer"
perimetre = ["un adhérent par artiste, retrouvé par sa référence extérieure"]
preuve = "relire l'adhérent par son identifiant"
retour = "se corrige dans Dolibarr (résilier ou supprimer l'adhérent)"
paliers = ["raconter", "auto"]
qui = ["cassandra"]

[[capacites]]
id = "bil_tester"
libelle = "Billetterie : vérifier que Dolibarr est prêt (société, comptes bancaires, modes de paiement, taux de TVA)"
risque = "lecture"
droit = "consulter"
qui = ["cassandra", "humain"]

[[capacites]]
id = "relancer"
libelle = "Noter une relance de facture dans l'agenda du tiers (le courriel part par le module Mandats)"
risque = "moyen"
