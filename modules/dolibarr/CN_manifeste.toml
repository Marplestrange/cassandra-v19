[[points_evolution]]
id = "egaux"
libelle = "Dolibarr rend souvent des nombres en texte (« 1 » pour 1) : on compare ce qui compte (extrait automatiquement de CN_module.py)"
contrat = "1.0"
reference = "points/EC_egaux"
fonction = "point_egaux"
runtime = "python"

[[points_evolution]]
id = "completer"
libelle = "Ce que Dolibarr 24 exige à la CRÉATION et que l'appelant n'a pas à connaître : le code client ou fournisseur d'un tiers (« auto » : Dolibarr le numérote), (extrait automatiquement de CN_module.py)"
contrat = "1.0"
reference = "points/EC_completer"
fonction = "point_completer"
runtime = "python"
