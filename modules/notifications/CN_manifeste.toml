# ▼▼▼ BORNE CN version=0.3.0 empreinte=c8676a ▼▼▼
[module]
id = "notifications"
nom = "Notifications"
version = "0.3.0"
noyau_min = "0.1.0"
description = "Le Centre de notifications : ce qui mérite l'attention de quelqu'un. Une notification ouverte par clé (elle se répète, elle ne s'empile pas), lue et prise en compte PAR PERSONNE, cloisonnée par compte, qui se referme seule quand la cause disparaît."
confiance = "interne"
famille = "communication"
importance = "vital"
sans = "La cloche se tait : les constats ne deviennent plus des choses à faire et rien ne vous alerte. Il ne se désactive pas."
essentiel = true
requiert = ["droits"]

[[droits]]
id = "emettre"
libelle = "Émettre une notification"
defaut = true

[[droits]]
id = "gerer"
libelle = "Résoudre ou supprimer les notifications des autres, et lire celles de tous"
sensible = true

[[objets]]
type = "notification"
libelle = "Une notification : source, niveau, destinataires, état par personne"

# Les canaux (courriel, Telegram, webhook, digest du matin) viennent du module des canaux : il écoute « notification.emise »
# et applique la politique de chacun (calme, sourdines, urgence). Ce module-ci ne sait rien d'eux.
[evenements]
emet = ["notification.emise", "notification.resolue", "notification.supprimee"]
ecoute = ["constat.ouvert", "constat.resolu", "droit.change"]

# Un constat des détecteurs devient une notification (ouverte par la clé du constat) ; quand il est résolu, elle l'est aussi. C'est ce qui
# remplace les « sondes » de la V18 (rejouer une vérification pour savoir si l'alerte tient encore) : ici le détecteur le dit lui-même.
[[moteurs]]
id = "constats_ouverts"
libelle = "Ouvre une notification pour chaque constat ouvert"
mode = "evenement"
sur = ["constat.ouvert"]
duree_max_s = 20

[[moteurs]]
id = "droits_prevenus"
libelle = "Prévient un compte quand ses droits changent (si l'administrateur l'a demandé)"
mode = "evenement"
sur = ["droit.change"]
duree_max_s = 20

[[moteurs]]
id = "constats_resolus"
libelle = "Referme la notification d'un constat résolu"
mode = "evenement"
sur = ["constat.resolu"]
duree_max_s = 20

[[moteurs]]
id = "expirer"
libelle = "Retire les notifications périmées (infos : 7 jours, le reste : 30 jours)"
mode = "periodique"
toutes_les_s = 3600
duree_max_s = 60

# ---------- lectures ----------
[[capacites]]
id = "lister"
libelle = "Les notifications que le compte au nom duquel on agit a le droit de voir"
risque = "lecture"

[[capacites]]
id = "compteurs"
libelle = "Combien de non lues, combien de critiques ouvertes (pour le badge de la cloche)"
risque = "lecture"

# ---------- écritures ----------
[[capacites]]
id = "emettre"
libelle = "Émettre une notification (ou répéter celle qui est déjà ouverte sous la même clé)"
risque = "faible"
droit = "emettre"
perimetre = ["la table notifs : une ligne (créée, ou incrémentée si la clé est déjà ouverte)"]
preuve = "relire la notification écrite"
retour = "supprimer la notification créée, ou remettre l'état d'avant de celle qui a été répétée"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "vu"
libelle = "Marquer lue, pour soi seulement"
risque = "faible"
perimetre = ["la ligne notif_dest du compte qui agit"]
preuve = "relire l'état lu"
retour = "remettre l'état d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "acquitter"
libelle = "Prendre en compte, pour soi seulement (cela vaut lue)"
risque = "faible"
perimetre = ["la ligne notif_dest du compte qui agit"]
preuve = "relire l'état pris en compte"
retour = "remettre l'état d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "resoudre"
libelle = "Refermer une notification (par identifiant ou par clé) : la cause est réglée"
risque = "faible"
perimetre = ["la ligne notifs désignée"]
preuve = "relire l'état résolu"
retour = "rouvrir la notification"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "supprimer"
libelle = "Supprimer une notification (elle est marquée, pas détruite : elle se restaure)"
risque = "faible"
perimetre = ["la ligne notifs désignée"]
preuve = "relire l'état supprimé"
retour = "restaurer la notification"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "signal_jour"
libelle = "Les décisions qui m'attendent, pour le bureau du jour"
risque = "lecture"

[[capacites]]
id = "politique"
libelle = "Les réglages de la cloche : ma politique de canaux par gravité, celle de la machine, mes heures calmes et mon fuseau, mes sourdines, l'état de chaque canal et de son dernier essai"
risque = "lecture"

[[capacites]]
id = "sources"
libelle = "Les sources qui ont écrit dans la cloche : dernier cri, lignes, ouvertes (administrateur)"
risque = "lecture"
droit = "gerer"

[[capacites]]
id = "prefs"
libelle = "Régler mes préférences de notification : fuseau (lu du navigateur), heures calmes"
risque = "faible"
perimetre = ["la ligne notif_prefs du compte qui agit", "un fuseau connu, des heures HH:MM"]
preuve = "relire les préférences et comparer"
retour = "remettre les préférences d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "politique_ecrire"
libelle = "Choisir les canaux d'une gravité (pour moi, ou pour la machine si je suis administrateur) ; la cloche reçoit toujours"
risque = "faible"
perimetre = ["une ligne notif_politique : la mienne, ou celle de la machine pour un administrateur"]
preuve = "relire la politique de cette gravité"
retour = "remettre les canaux d'avant, ou retirer la ligne si elle n'existait pas"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "sourdine"
libelle = "Taire une source ou une notification pour N heures (1 h à 30 j) ou lever la sourdine ; seuls les canaux se taisent, la cloche reçoit toujours"
risque = "faible"
perimetre = ["une ligne notif_sourdines du compte qui agit"]
preuve = "la sourdine est posée, ou levée"
retour = "remettre la sourdine d'avant (ou aucune)"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "webhook_ecrire"
libelle = "Déclarer ou retirer le webhook de la machine (administrateur) : son adresse est un secret, chiffrée, que seul ce module relit"
risque = "moyen"
droit = "gerer"
perimetre = ["la ligne unique notif_webhook", "une adresse http(s)"]
preuve = "relire l'état du webhook (actif ou non)"
retour = "remettre la ligne d'avant, adresse chiffrée comprise"
paliers = ["raconter", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "essai"
libelle = "Essayer un canal et écrire son résultat ; seule la cloche part pour l'instant, les autres canaux disent qu'ils n'envoient pas encore"
risque = "faible"
perimetre = ["une notification d'essai pour moi", "une ligne notif_essais"]
preuve = "le résultat de l'essai est écrit"
retour = "supprimer la notification d'essai et le résultat"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[signaux]]
id = "decisions"
libelle = "Décisions"
capacite = "signal_jour"

[permissions]
stockage = true
droits = true
introspection = true
secrets = true
# ▲▲▲ FIN BORNE CN ▲▲▲

