[module]
id = "notifications"
nom = "Notifications"
version = "0.1.1"
noyau_min = "0.1.0"
description = "Le Centre de notifications : ce qui mérite l'attention de quelqu'un. Une notification ouverte par clé (elle se répète, elle ne s'empile pas), lue et prise en compte PAR PERSONNE, cloisonnée par compte, qui se referme seule quand la cause disparaît."
confiance = "interne"
famille = "communication"
essentiel = true
requiert = ["droits"]

[[droits]]
id = "emettre"
libelle = "Émettre une notification"
defaut = true

[[droits]]
id = "gerer"
libelle = "Résoudre ou supprimer les notifications des autres, et lire celles de tous"
sensible = true

[[objets]]
type = "notification"
libelle = "Une notification : source, niveau, destinataires, état par personne"

# Les canaux (courriel, Telegram, webhook, digest du matin) viennent du module des canaux : il écoute « notification.emise »
# et applique la politique de chacun (calme, sourdines, urgence). Ce module-ci ne sait rien d'eux.
[evenements]
emet = ["notification.emise", "notification.resolue", "notification.supprimee"]
ecoute = ["constat.ouvert", "constat.resolu"]

# Un constat des détecteurs devient une notification (ouverte par la clé du constat) ; quand il est résolu, elle l'est aussi. C'est ce qui
# remplace les « sondes » de la V18 (rejouer une vérification pour savoir si l'alerte tient encore) : ici le détecteur le dit lui-même.
[[moteurs]]
id = "constats_ouverts"
libelle = "Ouvre une notification pour chaque constat ouvert"
mode = "evenement"
sur = ["constat.ouvert"]
duree_max_s = 20

[[moteurs]]
id = "constats_resolus"
libelle = "Referme la notification d'un constat résolu"
mode = "evenement"
sur = ["constat.resolu"]
duree_max_s = 20

[[moteurs]]
id = "expirer"
libelle = "Retire les notifications périmées (infos : 7 jours, le reste : 30 jours)"
mode = "periodique"
toutes_les_s = 3600
duree_max_s = 60

# ---------- lectures ----------
[[capacites]]
id = "lister"
libelle = "Les notifications que le compte au nom duquel on agit a le droit de voir"
risque = "lecture"

[[capacites]]
id = "compteurs"
libelle = "Combien de non lues, combien de critiques ouvertes (pour le badge de la cloche)"
risque = "lecture"

# ---------- écritures ----------
[[capacites]]
id = "emettre"
libelle = "Émettre une notification (ou répéter celle qui est déjà ouverte sous la même clé)"
risque = "faible"
droit = "emettre"
perimetre = ["la table notifs : une ligne (créée, ou incrémentée si la clé est déjà ouverte)"]
preuve = "relire la notification écrite"
retour = "supprimer la notification créée, ou remettre l'état d'avant de celle qui a été répétée"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "vu"
libelle = "Marquer lue, pour soi seulement"
risque = "faible"
perimetre = ["la ligne notif_dest du compte qui agit"]
preuve = "relire l'état lu"
retour = "remettre l'état d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "acquitter"
libelle = "Prendre en compte, pour soi seulement (cela vaut lue)"
risque = "faible"
perimetre = ["la ligne notif_dest du compte qui agit"]
preuve = "relire l'état pris en compte"
retour = "remettre l'état d'avant"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte"]

[[capacites]]
id = "resoudre"
libelle = "Refermer une notification (par identifiant ou par clé) : la cause est réglée"
risque = "faible"
perimetre = ["la ligne notifs désignée"]
preuve = "relire l'état résolu"
retour = "rouvrir la notification"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "supprimer"
libelle = "Supprimer une notification (elle est marquée, pas détruite : elle se restaure)"
risque = "faible"
perimetre = ["la ligne notifs désignée"]
preuve = "relire l'état supprimé"
retour = "restaurer la notification"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare"]

[permissions]
stockage = true
droits = true
introspection = true
