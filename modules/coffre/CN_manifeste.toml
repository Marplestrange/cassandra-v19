# RÔLE       : Le coffre Vaultwarden : le magasin de secrets de Cassandra (statut, liste des noms sans jamais les valeurs, lecture, écriture réversible, retrait). Un compte Cassandra = un compte Vault natif (même identifiant). Différé : la fiche complète d'un secret (chiffrement fin), le provisionnement des comptes, les clés d'API personnelles, le TOTP.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.1.0 empreinte=7b703d ▼▼▼
[module]
id = "coffre"
nom = "Coffre fort"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Le coffre Vaultwarden : le magasin de secrets de Cassandra (statut, liste des noms sans jamais les valeurs, lecture, écriture réversible, retrait). Un compte Cassandra = un compte Vault natif (même identifiant). Différé : la fiche complète d'un secret (chiffrement fin), le provisionnement des comptes, les clés d'API personnelles, le TOTP."
confiance = "interne"
famille = "securite"
importance = "vital"
requiert = ["societes"]
sans = "Plus d'accès aux secrets de Cassandra : tout ce qui a besoin d'une clé ou d'un mot de passe gardé cesse de fonctionner."

[[droits]]
id = "utiliser"
libelle = "Utiliser Coffre fort : consulter et travailler dans ce module"
defaut = true

[[droits]]
id = "administrer"
libelle = "Administrer Coffre fort : réglages et gestes sensibles"
sensible = true

[[objets]]
type = "secret"
libelle = "Un secret du coffre"

[[objets]]
type = "espace"
libelle = "Un espace du coffre : le sien, ou celui d'une société"

[evenements]
emet = ["espace.cree", "espace.archive", "espace.acces_accorde", "espace.acces_retire"]
ecoute = ["societe.creee", "societe.archivee"]

[[moteurs]]
id = "espaces_societes"
libelle = "Ouvre l'espace de coffre d'une société quand elle naît, l'archive quand elle est archivée"
mode = "evenement"
sur = ["societe.creee", "societe.archivee"]
duree_max_s = 20

[permissions]
stockage = true

[[reglages]]
id = "vault_url"
libelle = "L'adresse du serveur Vaultwarden (vide : http://127.0.0.1:8087)"
type = "texte"
defaut = ""

[[reglages]]
id = "vault_timeout"
libelle = "Le délai d'un appel au coffre, en secondes"
type = "entier"
defaut = 8

[[capacites]]
id = "status"
libelle = "L'état du coffre : disponible, verrouillé, l'adresse du serveur"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "available"
libelle = "Vrai si le coffre répond et est déverrouillé"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "list"
libelle = "Les NOMS des secrets de l'espace (jamais les valeurs), par préfixe : seulement ceux que ce compte a le droit de lire"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "get"
libelle = "La valeur d'un secret par son nom (note sécurisée -> notes), ou rien"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "set"
libelle = "Créer ou mettre à jour un secret (idempotent, réversible : l'ancienne valeur revient)"
risque = "faible"
droit = "utiliser"
perimetre = ["un secret du coffre"]
preuve = "la valeur relue est la nouvelle"
retour = "remettre l'ancienne valeur (ou retirer si le secret est neuf)"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "delete"
libelle = "Retirer un secret (réversible : la valeur revient)"
risque = "faible"
droit = "utiliser"
perimetre = ["un secret du coffre"]
preuve = "le secret n'existe plus"
retour = "remettre le secret"
paliers = ["raconter", "auto", "maitre"]
qui = ["humain", "compte", "cassandra", "itare", "agent"]

[[capacites]]
id = "journal"
libelle = "Les accès aux secrets : qui, quand, sur quoi"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "espaces"
libelle = "Les espaces de ce compte : le sien, puis ceux de société où on l'a fait entrer, avec son rôle (jamais un espace étranger)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "membres"
libelle = "Les membres d'un espace de société (réservé à ses administrateurs)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "accorder"
libelle = "Donner accès à un espace de société : un rôle (admin, membre, contributeur, lecture), des collections, une date de fin facultative"
risque = "moyen"
droit = "utiliser"
perimetre = ["la ligne d'accès d'un compte à un espace de société"]
preuve = "la ligne d'accès relue est celle qu'on a posée"
retour = "remettre l'accès d'avant (ou le retirer s'il n'y en avait pas)"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "retirer"
libelle = "Retirer l'accès d'un compte à un espace de société (jamais le dernier administrateur)"
risque = "moyen"
droit = "utiliser"
perimetre = ["la ligne d'accès d'un compte à un espace de société"]
preuve = "le compte n'a plus de ligne d'accès"
retour = "remettre l'accès retiré"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "regler"
libelle = "Choisir si le coffre d'une société est dans l'instance ou hébergé ailleurs"
risque = "moyen"
droit = "utiliser"
perimetre = ["le mode d'un espace de société"]
preuve = "le mode relu est celui demandé"
retour = "remettre le mode d'avant"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "espace_creer"
libelle = "Ouvrir l'espace de coffre d'une société, avec son premier administrateur"
risque = "moyen"
droit = "administrer"
perimetre = ["un espace de société et sa première ligne d'accès"]
preuve = "l'espace existe et n'est pas archivé"
retour = "retirer l'espace neuf (ou le remettre comme il était)"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "espace_archiver"
libelle = "Archiver l'espace de coffre d'une société : plus personne n'y accède, rien n'est effacé"
risque = "moyen"
droit = "administrer"
perimetre = ["un espace de société"]
preuve = "l'espace est archivé"
retour = "le rouvrir"
paliers = ["raconter"]
qui = ["humain", "compte"]
[[ecrans]]
id = "vue_coffre"
libelle = "Mon coffre-fort"
domaine = "socle"
gabarit = "liste_detail"

[[ecrans]]
id = "c_tableau"
libelle = "Tableau de bord"
domaine = "socle"
gabarit = "liste_detail"

[[ecrans]]
id = "c_secrets"
libelle = "Coffre"
domaine = "socle"
gabarit = "liste_detail"

[[ecrans]]
id = "c_outils"
libelle = "Outils"
domaine = "socle"
gabarit = "liste_detail"

[[ecrans]]
id = "c_rapport"
libelle = "Rapport"
domaine = "socle"
gabarit = "liste_detail"

# Mon coffre-fort : un regroupement dans Paramètres (section Personnel), puis ses pages.
[[menus]]
id = "mon_coffre"
libelle = "Mon coffre-fort"
groupe = "parametres"
ordre = 3
role = "utilisateur"
icone = "lock"
droit = "utiliser"

[[menus]]
id = "c_tableau"
libelle = "Tableau de bord"
ecran = "c_tableau"
parent = "mon_coffre"
ordre = 10
role = "utilisateur"
icone = "panorama"
droit = "utiliser"

[[menus]]
id = "c_secrets"
libelle = "Coffre"
ecran = "c_secrets"
parent = "mon_coffre"
ordre = 20
role = "utilisateur"
icone = "lock"
droit = "utiliser"

[[menus]]
id = "c_outils"
libelle = "Outils"
ecran = "c_outils"
parent = "mon_coffre"
ordre = 30
role = "utilisateur"
icone = "key"
droit = "utiliser"

[[menus]]
id = "c_rapport"
libelle = "Rapport"
ecran = "c_rapport"
parent = "mon_coffre"
ordre = 40
role = "utilisateur"
icone = "scroll"
droit = "utiliser"
