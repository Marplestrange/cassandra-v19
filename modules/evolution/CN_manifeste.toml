# RÔLE       : Le pilotage de l'évolution : quels points d'évolution méritent d'être optimisés (par ce qu'ils coûtent réellement), proposer une variante (Orfan ou un modèle) que le noyau juge sur le corpus de rejeu avant de la mettre en OMBRE, la faire monter par paliers (10, 50, 100 % du trafic), la retirer en un geste, et vérifier un mois plus tard que le gain est resté. Le moteur de recherche ne fait que proposer du texte : tout ce qui décide est du noyau.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.5.0 empreinte=ae134c ▼▼▼
[module]
id = "evolution"
nom = "Évolution"
version = "0.5.0"
noyau_min = "0.1.0"
description = "Le pilotage de l'évolution : quels points d'évolution méritent d'être optimisés (par ce qu'ils coûtent réellement), proposer une variante (Orfan ou un modèle) que le noyau juge sur le corpus de rejeu avant de la mettre en OMBRE, la faire monter par paliers (10, 50, 100 % du trafic), la retirer en un geste, et vérifier un mois plus tard que le gain est resté. Le moteur de recherche ne fait que proposer du texte : tout ce qui décide est du noyau."
confiance = "interne"
famille = "evolution"
groupe = "auto"
proprietaire = "cassandra"
importance = "optionnel"
instance = true
sans = "Cassandra cesse d'améliorer ses propres fonctions ; tout continue de fonctionner à l'identique."
requiert = ["droits", "comptes"]

[permissions]
evolution = true
lectures = true

[[droits]]
id = "voir"
libelle = "Voir l'évolution : les cibles, les pièces en ombre ou en service, la chaîne d'empreintes"

[[droits]]
id = "agir"
libelle = "Proposer une variante, la retirer, lancer une visite : ce qui peut mettre en service un code que personne n'a relu"
sensible = true

[[capacites]]
id = "cibles"
libelle = "Les points d'évolution classés par ce que l'optimisation rapporterait (appels réels × durée moyenne) ; un point sans mesure est dit muet, jamais « zéro »"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "etat"
libelle = "L'état de l'évolution : cibles, pièces (ombre, paliers, en service, retirées), routage et suspensions de chaque point, tombes, seuils, et la vérification de la chaîne d'empreintes (une rupture arrête tout)"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "moteurs"
libelle = "Les moteurs de recherche connus : leur état, ce que chacun a coûté (essais, appels de modèle, jetons, refus du relais) et le nombre de pièces qu'il a fournies"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "cascade_regler"
libelle = "Régler la cascade des moteurs : l'ordre des étages, lesquels sont actifs, et les règles (s'arrêter à la première variante prouvée, ne dépenser un modèle que sur un point chaud, courir deux étages)"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : l'ordre et les options de la cascade"]
preuve = "le registre dit le nouvel ordre et les nouvelles options"
retour = "l'ordre et les options d'avant sont remis"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "affecter"
libelle = "Forcer un étage sur un point d'évolution (ou rendre le point à la cascade avec « auto »)"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : une ligne par point"]
preuve = "le registre dit l'étage du point"
retour = "l'affectation d'avant est remise"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "budget_regler"
libelle = "Régler le budget de la recherche : jetons par mois, seuil d'alerte, gratuits d'abord, couper au plafond"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : le budget"]
preuve = "le registre dit le nouveau budget"
retour = "le budget d'avant est remis"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "moteur_plafonner"
libelle = "Plafonner un moteur : jetons par jour et essais par jour ; au plafond, l'étage est sauté et la raison dite"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : le plafond d'un moteur"]
preuve = "le registre dit le nouveau plafond"
retour = "le plafond d'avant est remis"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "objectifs_regler"
libelle = "Régler les poids des objectifs (latence, mémoire, taille) et la tolérance de régression qui décident quelle variante prouvée est adoptée"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : les poids"]
preuve = "le registre dit les nouveaux poids"
retour = "les poids d'avant sont remis"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "course"
libelle = "Lancer une course : plusieurs étages sur le même point, le même corpus, le même budget par moteur ; un tableau et un classement ; rien n'est mis en service"
risque = "moyen"
droit = "agir"
perimetre = ["le registre des moteurs : l'historique des courses ; les variantes fausses laissent leur tombe ; aucune pièce n'est écrite"]
preuve = "la course est dans l'historique avec son tableau"
retour = "aucun : une course n'écrit aucune pièce"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "course_tache"
libelle = "Lancer une course EN FOND et la suivre : chaque chercheur cherche à son tour sur le même point, le même corpus, le même budget ; la tâche dit qui cherche et ce que chacun a rendu ; rien n'est mis en service"
risque = "moyen"
droit = "agir"
perimetre = ["le registre des moteurs : l'historique des courses ; les variantes fausses laissent leur tombe ; aucune pièce n'est écrite", "des appels de modèle, comptés et plafonnés par chercheur"]
preuve = "la tâche rend la course (son identifiant dans l'historique) quand elle est finie"
retour = "aucun : une course n'écrit aucune pièce"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "course_adopter"
libelle = "Adopter la variante qu'une course a gardée pour un étage : elle est rejugée, puis mise en ombre comme toute pièce"
risque = "moyen"
droit = "agir"
perimetre = ["le stock d'EC du point : une variante prouvée y est écrite et mise en OMBRE ; rien n'est servi à personne"]
preuve = "la pièce est dans le stock, en ombre, et la chaîne d'empreintes est intacte (ou rien n'a été écrit)"
retour = "retirer la pièce : un aiguillage vers la référence ; l'EC reste dans le stock"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "course_garder"
libelle = "Garder une course pour comparaison dans l'historique"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : un drapeau sur la course"]
preuve = "la course porte le drapeau « gardée »"
retour = "aucun : un drapeau d'historique"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "juger_prompt"
libelle = "Juger un prompt proposé : variables intactes, clauses d'interdiction conservées, longueur, schéma de réponse et cas piégés de sécurité (un canari planté dans la donnée)"
risque = "faible"
droit = "agir"
perimetre = ["aucune écriture : des appels de modèle pour jouer les cas piégés"]
preuve = "un verdict (accepté, refusé, indéterminé) et ses contrôles"
retour = "aucun : un jugement n'écrit rien"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "proposer_prompt"
libelle = "Proposer des réécritures d'un prompt selon une consigne : un modèle réécrit, le juge des prompts décide de chacune (variables, interdits, longueur, schéma, cas piégés) ; rien n'est écrit"
risque = "faible"
droit = "agir"
perimetre = ["aucune écriture : des appels de modèle ; le résultat est une liste de propositions jugées"]
preuve = "chaque réécriture rendue porte son jugement"
retour = "aucun : une proposition n'écrit rien"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "proposer_politique"
libelle = "Proposer un réglage de seuil d'après ce que l'utilisateur a acquitté sans agir : le meilleur seuil qui garde toutes les alertes suivies d'une action, dans l'intervalle et au-dessus du plancher du noyau ; rien n'est écrit"
risque = "faible"
droit = "agir"
perimetre = ["aucune écriture, aucun modèle"]
preuve = "la politique proposée porte son jugement"
retour = "aucun : une proposition n'écrit rien"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "juger_politique"
libelle = "Juger une politique proposée : mêmes clés, valeurs dans leur intervalle, planchers du noyau tenus, rejeu des décisions passées"
risque = "faible"
droit = "agir"
perimetre = ["aucune écriture"]
preuve = "un verdict (accepté, refusé) et ses contrôles"
retour = "aucun : un jugement n'écrit rien"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra", "itare"]

[[capacites]]
id = "cage"
libelle = "L'état de la cage : isolation, bac du système, plafonds, et ce qui est garanti en ce moment"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "bac_eprouver"
libelle = "Éprouver le bac du système maintenant : il fait tourner le vrai travailleur dedans"
risque = "faible"
droit = "agir"
perimetre = ["un processus d'épreuve, aussitôt arrêté"]
preuve = "le bac éprouvé est nommé (ou son absence dite)"
retour = "aucun : une épreuve n'écrit rien"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "moteur_desinstaller"
libelle = "Désinstaller un moteur externe : son environnement est supprimé, il repasse « prévu » ; ses pièces restent"
risque = "moyen"
droit = "agir"
perimetre = ["le dossier du moteur dans les moteurs de l'instance"]
preuve = "le dossier du moteur n'existe plus"
retour = "réinstaller depuis le catalogue (evolution.moteur_installer)"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "moteur_installer"
libelle = "Installer un moteur de recherche du catalogue scellé : un environnement à part, des paquets épinglés par empreinte, un banc d'import ; le moteur est installé, jamais actif d'office"
risque = "moyen"
droit = "agir"
perimetre = ["le dossier des moteurs de l'instance : un environnement par moteur ; rien du serveur ni des données"]
preuve = "le moteur est installé au registre et son environnement répond (l'adaptateur se charge) ; au moindre échec, l'environnement est supprimé et le registre n'est pas touché"
retour = "désinstaller : l'environnement est supprimé, le moteur repasse « prévu » ; les pièces qu'il a fournies restent, elles vivent par leur preuve"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "moteur_etat"
libelle = "Activer ou désactiver un moteur de recherche installé (actif, installé, prévu)"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : une ligne"]
preuve = "le registre dit le nouvel état"
retour = "l'état d'avant est remis"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "moteur_installer_tache"
libelle = "Préparer puis installer un chercheur du répertoire, EN FOND : épingler ses paquets par empreinte et sceller le catalogue, poser le Python qu'il exige, créer son environnement, générer et éprouver son adaptateur s'il n'en existe pas d'écrit, l'inscrire installé (jamais actif d'office)"
risque = "moyen"
droit = "agir"
perimetre = ["le dossier des moteurs de l'instance : un environnement par chercheur", "le catalogue scellé des moteurs", "des téléchargements de paquets (PyPI, GitHub), le temps de l'installation", "un appel de modèle pour écrire un adaptateur manquant"]
preuve = "la tâche rend ses étapes ; au moindre échec l'environnement est supprimé et le registre n'est pas touché"
retour = "désinstaller : l'environnement est supprimé, le chercheur repasse « prévu »"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "moteur_maj_tache"
libelle = "Mettre à jour un chercheur installé, EN FOND : la version nouvelle s'installe à côté de l'ancienne ; on bascule seulement si tout passe, sinon l'ancienne n'a pas bougé"
risque = "moyen"
droit = "agir"
perimetre = ["l'environnement du chercheur (un second est créé à côté, puis échangé)", "le catalogue scellé des moteurs"]
preuve = "la tâche rend ses étapes ; en cas d'échec l'ancienne version est remise et le catalogue redit ce qui tourne"
retour = "l'ancienne version n'est retirée qu'après la bascule réussie ; en cas d'échec rien n'a changé"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "moteur_tache"
libelle = "L'avancement d'une tâche de fond d'Évolution (installation, mise à jour) : ses étapes faites, l'étape en cours, la fin"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "moteur_maj_dispo"
libelle = "Les mises à jour disponibles des chercheurs externes installés : la version installée et la plus récente (PyPI ou dernier commit du dépôt)"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "moteur_adaptateur_lire"
libelle = "Lire l'adaptateur généré d'un chercheur : son code, son empreinte, ce que Cassandra en a contrôlé"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "moteur_adaptateur_approuver"
libelle = "Approuver l'adaptateur généré d'un chercheur après relecture : sans cet accord, le chercheur ne peut pas être activé"
risque = "faible"
droit = "agir"
perimetre = ["le registre des moteurs : une ligne (adaptateur relu)"]
preuve = "le registre dit que l'adaptateur est relu, pour l'empreinte exacte qu'on a montrée"
retour = "aucun : pour défaire, désinstaller le chercheur"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "moteur_controler"
libelle = "Contrôler l'intégrité d'un moteur de recherche : son programme, son isolation, sa réponse à un ping dans son processus, son modèle, son plafond ; la défaillance trouvée est dite, avec ce qu'on peut faire"
risque = "faible"
droit = "agir"
perimetre = ["un processus d'épreuve, aussitôt arrêté", "un appel d'essai d'un mot au modèle, si le moteur en dépense un", "le dernier contrôle noté au registre des moteurs"]
preuve = "le registre garde le dernier contrôle du moteur"
retour = "aucun : un contrôle n'écrit que son propre rapport"
paliers = ["raconter", "auto"]
qui = ["humain", "cassandra"]

[[capacites]]
id = "proposer"
libelle = "Proposer une variante d'un point : le moteur de recherche (Orfan, un modèle, ou les deux) rend du texte ; le noyau le juge sur le corpus de rejeu (équivalence par paliers, gain qui tient sur le jeu réservé, au-dessus du bruit de mesure, corpus assez fort) puis, seulement alors, l'écrit et le met en ombre"
risque = "moyen"
droit = "agir"
perimetre = ["le stock d'EC du point visé : une variante prouvée y est écrite et mise en OMBRE ; rien n'est servi à personne"]
preuve = "la pièce est dans le stock, en ombre, et la chaîne d'empreintes est intacte (ou rien n'a été écrit)"
retour = "retirer la pièce : un aiguillage vers la référence ; l'EC reste dans le stock, jamais détruite"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "retour"
libelle = "Le retour instantané : renvoyer toute la charge d'un point à la référence du dépôt (un aiguillage, rien à restaurer) ; la variante devient une tombe avec sa raison"
risque = "moyen"
droit = "agir"
perimetre = ["le routage du point visé et ses pièces vivantes"]
preuve = "le routage du point est à l'arrêt"
retour = "proposer de nouveau une variante : une pièce retirée ne se remet pas en service seule"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra", "itare"]

[[capacites]]
id = "visiter"
libelle = "La visite : rejouer chaque variante en service depuis assez longtemps contre la référence, sur le corpus d'aujourd'hui ; un gain qui n'est pas resté la retire"
risque = "moyen"
droit = "agir"
perimetre = ["les pièces en service, à chaque échéance (30 jours après la mise en service, puis après chaque visite)"]
preuve = "chaque pièce visitée porte son verdict"
retour = "aucun : une pièce retirée à la visite se propose de nouveau"
paliers = ["raconter", "auto"]
qui = ["humain", "compte", "cassandra"]

[[capacites]]
id = "purger_compte"
libelle = "Effacer du corpus de rejeu tout ce qu'un compte y a laissé (suppression du compte, demande d'effacement) : ses rattachements et les entrées réelles qui n'appartenaient qu'à lui"
risque = "moyen"
droit = "agir"
perimetre = ["les entrées de rejeu rattachées à ce compte ; celles d'un autre compte et celles du noyau restent"]
preuve = "plus aucune entrée du corpus n'est rattachée à ce compte"
retour = "aucun : les entrées se reforment du trafic à venir ; la mesure d'un point exclu n'est pas touchée"
paliers = ["raconter"]
qui = ["humain", "compte"]

[[capacites]]
id = "signal_evolution"
libelle = "Ce qui brûle ou se dégrade côté Évolution, pour le bureau du jour : chaîne rompue, amélioration retirée toute seule. Rien quand tout va bien"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "serie"
libelle = "Les séries d'Évolution pour l'historique : jetons et essais des moteurs par jour, retraits de pièces"
risque = "lecture"
droit = "voir"

[[detecteurs]]
id = "evolution_alertes"
libelle = "Évolution a quelque chose à faire savoir : chaîne scellée rompue, amélioration retirée toute seule par le disjoncteur ou la visite, chercheurs sans le bac du système (hôte POSIX)"
frequence_s = 600

[[signaux]]
id = "evolution"
libelle = "Évolution"
capacite = "signal_evolution"

[[mesures]]
id = "evolution_jetons"
libelle = "Jetons des chercheurs"
capacite = "serie"
genre = "compteur"
unite = "jetons"
famille = "Autonomie"
description = "Jetons de modèle dépensés par les chercheurs d'Évolution, par jour. Leur prix se lit dans Agents IA."

[[mesures]]
id = "evolution_essais"
libelle = "Essais des chercheurs"
capacite = "serie"
genre = "compteur"
unite = "essais"
famille = "Autonomie"
description = "Variantes essayées par les chercheurs d'Évolution, par jour."

[[mesures]]
id = "evolution_retraits"
libelle = "Améliorations retirées"
capacite = "serie"
genre = "compteur"
unite = "retraits"
famille = "Autonomie"
vide = "rien_a_signaler"
description = "Améliorations retirées (par toi, par le disjoncteur ou par la visite)."

[[ecrans]]
id = "cockpit"
libelle = "Évolution"
domaine = "evolution"
gabarit = "libre"

[[menus]]
id = "evolution"
libelle = "Évolution"
ecran = "cockpit"
ordre = 20
role = "admin"
icone = "dna"

[evenements]
ecoute = ["compte.supprime"]

[[moteurs]]
id = "purge_comptes"
libelle = "Retire du corpus de rejeu les entrées d'un compte supprimé : le corpus ne garde pas ce qu'un utilisateur parti a fait"
mode = "evenement"
sur = ["compte.supprime"]
duree_max_s = 20

[[moteurs]]
id = "tick"
libelle = "Fait avancer chaque pièce d'un cran seulement si ses preuves le permettent (ombre sans écart, puis 10, 50, 100 % du trafic ; retrait par le disjoncteur) et lance les visites échues"
mode = "periodique"
toutes_les_s = 300
duree_max_s = 120

[[reglages]]
id = "moteur_defaut"
libelle = "Le moteur de recherche par défaut"
type = "choix"
choix = ["cascade", "deterministe", "modele", "les_deux"]
defaut = "cascade"
aide = "Déterministe : les optimisations connues, zéro jeton. Modèle : un modèle de langage guidé par le profil de l'appel (coûte des jetons). Les deux : les gratuites d'abord."

[[reglages]]
id = "modele_role"
libelle = "Le rôle de modèle utilisé pour proposer des variantes"
type = "texte"
defaut = "evolution"
aide = "Un rôle du registre de modèles (module Modèles). Sans modèle lié à ce rôle, le moteur à modèle dit qu'il n'a pas de modèle : il n'invente rien. Garde un nom qui COMMENCE par « evolution » : c'est ce nom qui range la dépense dans le plafond de coût de la maison (Agents IA)."

[[reglages]]
id = "cache_prompt"
libelle = "Marquer la partie stable des prompts d'Orfan pour le cache du fournisseur"
type = "choix"
choix = ["non", "oui"]
defaut = "non"
aide = "À « oui », le prompt est envoyé en deux blocs dont le premier (la fonction, le profil, le contrat, les règles) porte un marqueur de cache de type Anthropic : les appels suivants sur la même fonction coûtent moins cher d'entrée si le fournisseur sait s'en servir (en dessous d'environ 1 000 jetons le cache ne s'applique pas). Un point d'accès qui refuse le marqueur est rejoué en texte simple. Les jetons servis par le cache sont comptés à part (cache_lu), mais le plafond de coût de la maison les compte encore au prix plein tant qu'Agents IA ne les distingue pas. Par défaut : non."

[[reglages]]
id = "budget_essais"
libelle = "Variantes évaluées par proposition"
type = "entier"
defaut = 3
minimum = 1
maximum = 10

[[reglages]]
id = "propositions_par_jour"
libelle = "Propositions par jour"
type = "entier"
defaut = 20
