[module]
id = "societes"
nom = "Sociétés"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Les sociétés de l'instance et la fiche de chacune (identité, siège, horaires, établissements, pièces, banque, conformité, habillage, responsables). Tout compte appartient à une société ; une société principale existe toujours. Seul le superadministrateur crée, archive et administre l'ensemble des sociétés ; l'administrateur d'une société ne gère que la sienne."
confiance = "interne"
famille = "socle"
importance = "vital"
sans = "Plus de fiche société : les en-têtes, signatures et mentions légales perdent leur source ; le rattachement des comptes à une société reste garanti par le noyau."

[permissions]
stockage = true
droits = true
identite = true
introspection = true

