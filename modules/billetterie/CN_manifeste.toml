[module]
id = "billetterie"
nom = "Billetterie"
version = "0.1.0"
noyau_min = "0.1.0"
description = "La billetterie : événements, salles, artistes, revendeurs et formules de rémunération, billets, caisse, contrôle à l'entrée, boutique publique et portefeuille des commissions. Le titulaire de l'instance est l'organisateur ; l'argent est tenu en centimes dans un registre en écriture seule ; Dolibarr est facultatif."
confiance = "interne"
famille = "gestion"
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[permissions]
stockage = true
secrets = true

[[droits]]
id = "gerer"
libelle = "Gérer la billetterie (le titulaire de l'instance : événements, formules, revendeurs, argent, réglages)"
sensible = true

[[points_evolution]]
id = "commission"
libelle = "Ce que rapporte une formule pour un nombre de places vendues : la formule et les places en entrée, le forfait, la commission, le fixe et le total (en centimes) en sortie"
contrat = "1.0"
reference = "points/EC_commission"
fonction = "point_commission"
runtime = "python"
[[reglages]]
id = "titulaire_nom"
libelle = "Nom de l'organisateur (le titulaire de l'instance)"

[[reglages]]
id = "titulaire_statut"
libelle = "Statut de l'organisateur"
type = "choix"
defaut = "association"
choix = ["association", "autre"]

[[reglages]]
id = "titulaire_tva"
libelle = "L'organisateur est assujetti à la TVA"
type = "booleen"
defaut = false

[[reglages]]
id = "titulaire_adresse"
libelle = "Adresse de l'organisateur"

[[reglages]]
id = "titulaire_mail"
