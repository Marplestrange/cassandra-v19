# ▼▼▼ BORNE CN version=0.1.0 empreinte=73dbd4 ▼▼▼
[module]
id = "billetterie"
nom = "Billetterie"
version = "0.1.0"
noyau_min = "0.1.0"
description = "La billetterie : événements, salles, artistes, revendeurs et formules de rémunération, billets, caisse, contrôle à l'entrée, boutique publique et portefeuille des commissions. Le titulaire de l'instance est l'organisateur ; l'argent est tenu en centimes dans un registre en écriture seule ; Dolibarr est facultatif."
confiance = "interne"
famille = "gestion"
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[permissions]
stockage = true

[[droits]]
id = "gerer"
libelle = "Gérer la billetterie (le titulaire de l'instance : événements, formules, revendeurs, argent, réglages)"
sensible = true

[[points_evolution]]
id = "commission"
libelle = "Ce que rapporte une formule pour un nombre de places vendues : la formule et les places en entrée, le forfait, la commission, le fixe et le total (en centimes) en sortie"
contrat = "1.0"
reference = "points/EC_commission"
fonction = "point_commission"
runtime = "python"
[[reglages]]
id = "titulaire_nom"
libelle = "Nom de l'organisateur (le titulaire de l'instance)"

[[reglages]]
id = "titulaire_statut"
libelle = "Statut de l'organisateur"
type = "choix"
defaut = "association"
choix = ["association", "autre"]

[[reglages]]
id = "titulaire_tva"
libelle = "L'organisateur est assujetti à la TVA"
type = "booleen"
defaut = false

[[reglages]]
id = "titulaire_adresse"
libelle = "Adresse de l'organisateur"

[[reglages]]
id = "titulaire_mail"
libelle = "Courriel d'envoi des billets"

[[reglages]]
id = "titulaire_tel"
libelle = "Téléphone de l'organisateur"

[[reglages]]
id = "titulaire_siret"
libelle = "SIRET de l'organisateur"

[[reglages]]
id = "retrait_delai_jours"
libelle = "Délai après l'événement avant qu'une commission soit retirable (jours)"
type = "entier"
defaut = 7
minimum = 0
maximum = 90

[[reglages]]
id = "retrait_seuil"
libelle = "Seuil minimal d'un retrait (centimes)"
type = "entier"
defaut = 2000
minimum = 0
maximum = 1000000

[[reglages]]
id = "compte_client"
libelle = "Compte client à l'achat"
type = "choix"
defaut = "libre"
choix = ["libre", "obligatoire"]

[[reglages]]
id = "frais_sans_compte"
libelle = "Frais de service d'un achat sans compte (centimes)"
type = "entier"
defaut = 200
minimum = 0
maximum = 100000

[[reglages]]
id = "reservation_minutes"
libelle = "Durée pendant laquelle les places d'un panier sont retenues pendant le paiement (minutes)"
type = "entier"
defaut = 10
minimum = 1
maximum = 120

[[reglages]]
id = "liste_attente"
libelle = "Liste d'attente quand un billet est épuisé"
type = "booleen"
defaut = true

[[reglages]]
id = "offre_attente_heures"
libelle = "Durée de l'offre faite à la liste d'attente (heures)"
type = "entier"
defaut = 24
minimum = 1
maximum = 168

[[reglages]]
id = "wallet_apple"
libelle = "Billets pour Apple Wallet"
type = "booleen"
defaut = true

[[reglages]]
id = "wallet_google"
libelle = "Billets pour Google Wallet"
type = "booleen"
defaut = true

[[reglages]]
id = "reserve_caisse"
libelle = "Taille de la réserve de numéros de billets d'une caisse (numéros)"
type = "entier"
defaut = 50
minimum = 10
maximum = 1000

[[reglages]]
id = "regle_hors_ligne"
libelle = "Règle du contrôle hors ligne quand deux portes ne se parlent pas"
type = "choix"
defaut = "portes"
choix = ["portes", "signaler", "secours"]

[[reglages]]
id = "recu_fiscal_autonome"
libelle = "Reçu fiscal de don produit par la billetterie (sans Dolibarr)"
type = "booleen"
defaut = true

[[reglages]]
id = "domaine"
libelle = "Domaine de la boutique (sans https:// ni chemin)"

[[reglages]]
id = "https"
libelle = "Boutique en connexion sécurisée (https)"
type = "booleen"
defaut = true

[[reglages]]
id = "boutique_en_ligne"
libelle = "Boutique en ligne (sinon page d'attente)"
type = "booleen"
defaut = true

[[reglages]]
id = "chemin_accueil"
libelle = "Page d'accueil par défaut de la boutique"
defaut = "/calendrier"

[[reglages]]
id = "chemin_evenement"
libelle = "Chemin d'une page événement ({id})"
defaut = "/e/{id}"

[[reglages]]
id = "chemin_compte"
libelle = "Chemin du compte client"
defaut = "/compte"

[[reglages]]
id = "chemin_revendeur"
libelle = "Chemin du lien de vente d'un revendeur ({code})"
defaut = "/r/{code}"

[[reglages]]
id = "chemin_retours"
libelle = "Chemin des retours des prestataires de paiement ({fournisseur})"
defaut = "/hooks/{fournisseur}"

