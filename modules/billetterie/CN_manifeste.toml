defaut = 10
minimum = 1
maximum = 120

[[reglages]]
id = "liste_attente"
libelle = "Liste d'attente quand un billet est épuisé"
type = "booleen"
defaut = true

[[reglages]]
id = "offre_attente_heures"
libelle = "Durée de l'offre faite à la liste d'attente (heures)"
