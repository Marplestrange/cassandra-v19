[module]
id = "billetterie"
nom = "Billetterie"
version = "0.1.0"
noyau_min = "0.1.0"
description = "La billetterie : événements, salles, artistes, revendeurs et formules de rémunération, billets, caisse, contrôle à l'entrée, boutique publique et portefeuille des commissions. Le titulaire de l'instance est l'organisateur ; l'argent est tenu en centimes dans un registre en écriture seule ; Dolibarr est facultatif."
confiance = "interne"
famille = "finance"
famille_libelle = "Finance et ventes"
famille_icone = "fam_finance"
importance = "optionnel"
sans = "Plus de billetterie : événements, billets et caisse ne sont plus accessibles ; les données restent."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[permissions]
stockage = true
stockage_par_societe = true
secrets = true
reseau = ["l'API de Stripe (api.stripe.com), pour créer la page de paiement hébergée d'une commande", "les API de PayPal (api-m.paypal.com) et de HelloAsso (api.helloasso.com), pour créer la page de paiement et vérifier le paiement au retour de l'acheteur", "le serveur d'envoi de courrier (SMTP) réglé dans la billetterie, pour expédier les billets et les messages aux acheteurs"]

[[droits]]
id = "gerer"
libelle = "Gérer la billetterie (le titulaire de l'instance : événements, formules, revendeurs, argent, réglages)"
sensible = true

[[droits]]
id = "controler"
libelle = "Contrôler les billets à l'entrée (l'ouvreur : lire les billets, voir le contrôle, rejouer ses entrées hors ligne)"

[[droits]]
id = "vendre"
libelle = "Vendre à la caisse (le caissier : ouvrir sa caisse, vendre, clôturer, réserver des numéros pour vendre sans réseau)"

[[droits]]
id = "revendeur"
libelle = "Espace revendeur (voir SES ventes, SON portefeuille et demander un retrait ; rien de plus)"

[[droits]]
id = "artiste"
libelle = "Espace artiste (voir SON programme, SA formule, SON portefeuille et demander un retrait ; rien de plus)"

[[points_evolution]]
id = "commission"
libelle = "Ce que rapporte une formule pour un nombre de places vendues : la formule et les places en entrée, le forfait, la commission, le fixe et le total (en centimes) en sortie"
contrat = "1.0"
reference = "points/EC_commission"
fonction = "point_commission"
runtime = "python"
