# MODULE     : securite
# ZONE       : CN
# VERSION CN : 0.5.4  #3ccb58
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : La sécurité : les gestes (bannir une adresse, fermer un chemin, faire tourner une clé…), le journal de ce qui a été fait, et les audits. Différé : l'état de la machine (ports, SSH, nginx), l'exécution des gestes (Lynis/Trivy/ClamAV/CrowdSec par le courtier racine) et le pare-feu (par l'API FastPanel).
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.5.4 empreinte=3ccb58 ▼▼▼
[module]
id = "securite"
nom = "Sécurité"
version = "0.5.4"
noyau_min = "0.1.0"
description = "La sécurité : les gestes (bannir une adresse, fermer un chemin, faire tourner une clé…), le journal de ce qui a été fait, et les audits. Différé : l'état de la machine (ports, SSH, nginx), l'exécution des gestes (Lynis/Trivy/ClamAV/CrowdSec par le courtier racine) et le pare-feu (par l'API FastPanel)."
confiance = "interne"
famille = "securite"
groupe = "secu"
proprietaire = "cassandra"
importance = "important"
instance = true
sans = "Plus de gestes de sécurité (bannir une adresse, fermer un chemin, faire tourner une clé) ni de journal de sécurité."

[[droits]]
id = "agir"
libelle = "Exécuter un geste de sécurité sur la machine (couper SSH par mot de passe, arrêter un service, mises à jour…)"
sensible = true

[[droits]]
id = "voir"
libelle = "Voir l'état de sécurité de la machine (ports ouverts, pare-feu, accès)"
sensible = true

[[objets]]
type = "geste_securite"
libelle = "Un geste de sécurité"

[permissions]
stockage = true
racine = true
lectures = true

[[racine]]
id = "mesurer"
libelle = "Relever les mesures de sécurité de la machine (ports, SSH, fail2ban, mises à jour, cage, outils Lynis/Trivy/ClamAV/CrowdSec), en lecture seule"
lecture = true

[[racine]]
id = "agir"
libelle = "Exécuter UN geste de sécurité de la table fermée (couper les mots de passe SSH, arrêter un service, garder MySQL sur la machine, lancer les mises à jour, débannir), le vérifier, et dire de quoi le défaire"

[[racine]]
id = "machine"
libelle = "Exécuter UN geste de la page « La machine » en table fermée (service, mémoire d'un service, conteneur, processus, bannir, sessions, redémarrage prévu), le vérifier, et dire de quoi le défaire ; lire un journal ou l'état d'un redémarrage"

[[racine]]
id = "outils"
libelle = "Installer, lancer ou arrêter UN des quatre outils de sécurité (Lynis, Trivy, ClamAV, CrowdSec) en arrière-plan, et lire leur état et leurs résultats"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "mesurer"
libelle = "Relever les mesures de sécurité de la machine (par le courtier racine), en JSON"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "etat"
libelle = "L'état de sécurité de la machine, calculé sur les relevés : services à l'écoute et qui peut les joindre, pare-feu du noyau, accès SSH, fail2ban, mises à jour, et un verdict. Un relevé qui manque est dit manquant"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "gestes"
libelle = "Les gestes de sécurité disponibles, avec leur réversibilité et leur garde"
risque = "lecture"

[[capacites]]
id = "journal"
libelle = "Le journal des gestes de sécurité : qui, quoi, résultat, retour possible"
risque = "lecture"

[[capacites]]
id = "audits"
libelle = "Les audits de sécurité rédigés, avec le modèle qui les a produits"
risque = "lecture"

[[capacites]]
id = "noter"
libelle = "Inscrire un geste de sécurité au journal (qui, quoi, cible, résultat, retour arrière)"
risque = "faible"
perimetre = ["une ligne du journal de sécurité"]
preuve = "la ligne existe"
retour = "retirer la ligne"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "audit_poser"
libelle = "Poser un rapport d'audit de sécurité (le modèle qui l'a produit, le titre, le corps)"
risque = "faible"
perimetre = ["une ligne d'audit de sécurité"]
preuve = "l'audit existe"
retour = "retirer l'audit"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "ssh_mdp"
libelle = "Couper les mots de passe SSH : plus personne n'entre par SSH avec un mot de passe, la clé seulement. Refusé si ni root ni un administrateur (sudo) n'a de clé autorisée"
risque = "eleve"
droit = "agir"
perimetre = ["le fichier SSH de Cassandra (/etc/ssh/sshd_config.d/00-cassandra-securite.conf), testé puis rechargé"]
preuve = "sshd -T dit passwordauthentication no"
retour = "remettre le fichier d'avant (ou le retirer), tester, recharger"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "ssh_x11"
libelle = "Couper le transfert X11 : personne n'affiche de fenêtre graphique par SSH sur un serveur"
risque = "moyen"
droit = "agir"
perimetre = ["le fichier SSH de Cassandra, testé puis rechargé"]
preuve = "sshd -T dit x11forwarding no"
retour = "remettre le fichier d'avant (ou le retirer), tester, recharger"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "arret"
libelle = "Arrêter et désactiver un service inutile d'un serveur (rpcbind, avahi, CUPS) : il ne revient pas au prochain démarrage"
risque = "moyen"
droit = "agir"
perimetre = ["les unités systemd du service, de la table fermée des arrêts"]
preuve = "le service n'écoute plus"
retour = "réactiver et relancer les unités qui étaient actives"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "mysql_local"
libelle = "Garder MySQL sur la machine : il n'écoutera plus que 127.0.0.1 (les sites et Cassandra, sur la même machine, continuent de s'y connecter)"
risque = "moyen"
droit = "agir"
perimetre = ["un fichier de configuration MySQL posé par Cassandra, et un redémarrage du service"]
preuve = "plus aucune écoute du port 3306 au-delà de la machine"
retour = "retirer le fichier et redémarrer le service"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "maj_securite"
libelle = "Appliquer les mises à jour du système (correctifs de sécurité compris) en arrière-plan, par systemd"
risque = "moyen"
droit = "agir"
perimetre = ["les paquets du système ; les services concernés redémarrent au besoin"]
preuve = "l'unité systemd existe"
retour = "AUCUN retour automatique : les paquets restent mis à jour (l'historique apt dit lesquels)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "maj_auto"
libelle = "Activer les mises à jour automatiques : chaque nuit, les correctifs de sécurité de Debian, et seulement eux"
risque = "moyen"
droit = "agir"
perimetre = ["le paquet unattended-upgrades et /etc/apt/apt.conf.d/20auto-upgrades"]
preuve = "l'unité systemd existe"
retour = "AUCUN retour automatique : désactiver /etc/apt/apt.conf.d/20auto-upgrades à la main"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "debannir"
libelle = "Débannir une adresse que fail2ban avait bannie : elle peut de nouveau tenter de se connecter"
risque = "faible"
droit = "agir"
perimetre = ["une adresse dans un jail de fail2ban"]
preuve = "l'adresse n'est plus dans la liste du jail"
retour = "bannir de nouveau l'adresse"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "annuler"
libelle = "Défaire un geste de sécurité avec ce qu'il avait rendu (« avant ») : remet le fichier SSH d'avant, relance les unités, retire le réglage MySQL, rebannit l'adresse"
risque = "moyen"
droit = "agir"
perimetre = ["ce que le geste avait changé, et rien d'autre"]
preuve = "le geste n'est plus en vigueur (relevé de nouveau)"
retour = "refaire le geste"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "outil_installer"
libelle = "Installer un outil de sécurité (Lynis, Trivy, ClamAV, CrowdSec) : paquet apt, réglage, passage régulier par une minuterie systemd, premier passage. Lancé en arrière-plan, il peut durer des minutes"
risque = "eleve"
droit = "agir"
perimetre = ["les paquets de l'outil et son dépôt apt signé", "une minuterie systemd et ses réglages (CrowdSec : liste blanche des réseaux de confiance, jamais le panneau)"]
preuve = "l'unité d'installation est lancée ; l'état de l'outil dira « installé » à la fin"
retour = "AUCUN retour automatique : les paquets restent (apt remove, à la main)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "outil_lancer"
libelle = "Lancer un passage d'un outil de sécurité tout de suite (audit Lynis, analyse Trivy des images, balayage ClamAV, résumé CrowdSec) ; rien n'est jamais supprimé ni mis en quarantaine"
risque = "faible"
droit = "agir"
perimetre = ["un passage de l'outil, en basse priorité ; son résultat est écrit pour la lecture"]
preuve = "l'unité du passage est lancée"
retour = "arrêter le passage en cours"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "oom_acquits"
libelle = "Les événements de mémoire saturée (OOM) déjà acquittés : leurs signatures (date + processus tué)"
risque = "lecture"
droit = "voir"

[[capacites]]
id = "oom_acquitter"
libelle = "Acquitter des événements de mémoire saturée : vus et acceptés, ils ne sont plus comptés comme alerte"
risque = "faible"
droit = "agir"
perimetre = ["la table des OOM acquittés de ce module (aucun journal système n'est touché)"]
preuve = "chaque signature est relue dans la table"
retour = "retirer ces signatures de la table : les événements redeviennent des alertes"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "unites_reinitialiser"
libelle = "Remettre à zéro les unités systemd en échec (systemctl reset-failed) : elles ne sont plus comptées en panne ; rien n'est redémarré"
risque = "faible"
droit = "agir"
perimetre = ["l'état « échec » des unités systemd (le journal garde leur cause)"]
preuve = "un nouveau relevé ne compte plus aucune unité en échec"
retour = "AUCUN retour : un échec remis à zéro n'est plus compté (la cause reste dans le journal systemd)"
paliers = ["raconter", "auto"]
qui = ["humain", "compte"]

[[capacites]]
id = "session_fermer"
libelle = "Fermer UNE session de connexion (SSH) d'un utilisateur : son terminal est retrouvé par le courtier, jamais désigné par l'appelant"
risque = "moyen"
droit = "agir"
perimetre = ["le terminal de la session désignée (utilisateur + adresse), pas ses autres sessions ni ses fichiers"]
preuve = "le courtier relit la liste des sessions : celle-ci n'y est plus"
retour = "AUCUN retour : une session fermée se rouvre en se reconnectant"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "systeme_geste"
libelle = "Recharger nginx (sa configuration est testée d'abord), relancer Ollama ou relancer le noyau lui-même (en différé de trois secondes) : une table fermée de trois services"
risque = "moyen"
droit = "agir"
perimetre = ["nginx (rechargement), ollama (relance), le noyau de Cassandra (relance différée) — aucun autre service"]
preuve = "le courtier relit l'état de l'unité : elle doit être active (le noyau, qui se coupe lui-même, annonce sa relance)"
retour = "rien à défaire : le service tourne comme avant"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "journal_service"
libelle = "Lire les 200 dernières lignes du journal du noyau, du Sensorium, d'Ollama ou de nginx (lecture seule, table fermée)"
risque = "lecture"
droit = "agir"
masque = ["texte"]

[[capacites]]
id = "service_geste"
libelle = "Démarrer, arrêter, redémarrer, recharger un service suivi par la page « La machine », ou le lancer (ou non) au démarrage : une table fermée de services et de six actions"
risque = "moyen"
droit = "agir"
perimetre = ["les services suivis par la page (web, courrier, données, réseau, sécurité, système) — jamais le noyau, le courtier ni le collecteur, qui ont leurs gestes", "ssh et nginx ne s'arrêtent pas d'ici : ils se redémarrent et se rechargent, configuration testée d'abord"]
preuve = "le courtier relit l'état de l'unité (active ou non, lancée au démarrage ou non) avant de répondre"
retour = "le geste inverse (arrêter après démarrer, activer après désactiver) ; rien à défaire après un redémarrage ou un rechargement"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "service_memoire"
libelle = "Limiter la mémoire d'un service suivi (MemoryMax de systemd), entre 128 Mo et la mémoire de la machine"
risque = "moyen"
droit = "agir"
perimetre = ["la limite de mémoire de l'unité du service (un réglage systemd persistant) — jamais le noyau, le courtier ni le collecteur"]
preuve = "le courtier relit la limite posée ; si elle n'a pas pris, celle d'avant est remise"
retour = "remettre la limite d'avant (ou aucune)"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "service_journal"
libelle = "Lire les 200 dernières lignes du journal d'un service suivi par la page « La machine » (lecture seule, table fermée)"
risque = "lecture"
droit = "agir"
masque = ["texte"]

[[capacites]]
id = "conteneur_geste"
libelle = "Démarrer, arrêter, redémarrer, mettre en pause ou reprendre UN conteneur que Docker (ou Podman) liste"
risque = "moyen"
droit = "agir"
perimetre = ["l'état de marche du conteneur désigné — ni son image, ni ses volumes, ni ses réglages"]
preuve = "le courtier relit l'état du conteneur (tourne, arrêté, en pause) avant de répondre"
retour = "le geste inverse (arrêter après démarrer, reprendre après pause) ; rien à défaire après un redémarrage"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "conteneur_journal"
libelle = "Lire les 200 dernières lignes du journal d'un conteneur (lecture seule)"
risque = "lecture"
droit = "agir"
masque = ["texte"]

[[capacites]]
id = "processus_geste"
libelle = "Terminer un processus, forcer son arrêt ou baisser sa priorité : le processus est relu par le courtier et doit être celui que la page montrait"
risque = "moyen"
droit = "agir"
perimetre = ["le processus désigné (numéro ET commande) — jamais le n° 1, un processus du noyau Linux, ni ceux de ssh, du noyau de Cassandra, du courtier ou du collecteur"]
preuve = "le courtier relit /proc : le processus a disparu, ou sa priorité a changé"
retour = "AUCUN retour pour un arrêt (un processus arrêté ne se relance pas d'ici) ; la priorité d'avant pour « baisser sa priorité »"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "adresse_bannir"
libelle = "Bannir une adresse dans une prison fail2ban (sshd par défaut)"
risque = "moyen"
droit = "agir"
perimetre = ["la liste des adresses bannies de la prison — jamais une adresse privée, du réseau privé, de la machine, ni une adresse entrée avec succès depuis trente jours"]
preuve = "le courtier relit la liste de la prison : l'adresse y figure"
retour = "débannir l'adresse"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "sessions_fermer_toutes"
libelle = "Tout le monde dehors : fermer toutes les sessions de connexion qui tiennent un terminal"
risque = "moyen"
droit = "agir"
perimetre = ["les terminaux des sessions ouvertes — ni les comptes, ni leurs fichiers, ni leurs clés"]
preuve = "le courtier relit la liste des sessions : il n'en reste aucune"
retour = "AUCUN retour : une session fermée se rouvre en se reconnectant"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "redemarrage_etat"
libelle = "Avant de redémarrer la machine : ce qui empêche de partir, ce qui ne reviendra pas seul, qui est connecté, ce qui est déjà prévu, et le compte rendu du dernier retour (lecture seule)"
risque = "lecture"
droit = "agir"

[[capacites]]
id = "machine_redemarrer"
libelle = "Redémarrer la machine, dans une minute ou à une heure choisie : refusé pendant un déploiement ou une installation de paquets, et sans le nom de la machine"
risque = "eleve"
droit = "agir"
perimetre = ["la machine entière : tout s'arrête une à deux minutes, Cassandra comprise", "le redémarrage est PRÉVU (shutdown), pas immédiat : il s'annule jusqu'au départ"]
preuve = "le courtier relit ce que systemd a prévu : un redémarrage, à l'heure dite"
retour = "annuler le redémarrage prévu, tant que la machine n'est pas partie"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "redemarrage_lu"
libelle = "Le compte rendu du retour de la machine a été lu : il ne s'affiche plus"
risque = "faible"
droit = "agir"
perimetre = ["la marque que le dernier redémarrage a laissée"]
preuve = "la lecture d'après ne rend plus de compte rendu"
retour = "AUCUN retour : le compte rendu effacé ne revient pas (le journal systemd garde la trace du redémarrage)"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "machine_gestes"
libelle = "Les derniers gestes de la page « La machine » : qui, quoi, sur quoi, et s'il se défait encore (lecture seule)"
risque = "lecture"
droit = "agir"

[[capacites]]
id = "machine_geste_defaire"
libelle = "Défaire UN geste de la page « La machine » inscrit au journal : le retour que le geste avait rendu est rejoué par le courtier, une seule fois"
risque = "moyen"
droit = "agir"
perimetre = ["un geste du journal de la page « La machine » qui a un retour et n'a pas encore été défait"]
preuve = "la ligne du journal ne porte plus de retour : il a été joué"
retour = "AUCUN retour : un retour arrière ne se rejoue pas, on refait le geste lui-même"
paliers = ["raconter"]
qui = ["humain"]

[[capacites]]
id = "images"
libelle = "Sécurité › En images : l'indice de sécurité, les familles, les attaques sur dix jours (chemins, adresses, robots, pays), les anneaux d'exposition, les certificats, le courriel, la box et les gardiens — composés de l'état de la machine et des totaux du collecteur ; une source muette est dite muette"
risque = "lecture"
droit = "voir"
# ▲▲▲ FIN BORNE CN ▲▲▲

