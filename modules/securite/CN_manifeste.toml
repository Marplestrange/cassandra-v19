fonction = "point_docker_publies"
runtime = "python"

[[points_evolution]]
id = "de_confiance"
libelle = "de_confiance (extrait automatiquement de CN_images.py)"
contrat = "1.0"
reference = "points/EC_de_confiance"
fonction = "point_de_confiance"
runtime = "python"

[[points_evolution]]
id = "fail2ban"
libelle = "fail2ban (extrait automatiquement de CN_analyse.py)"
contrat = "1.0"
reference = "points/EC_fail2ban"
fonction = "point_fail2ban"
runtime = "python"

[[points_evolution]]
id = "outils_analyse"
libelle = "Lynis, Trivy, ClamAV, CrowdSec : optionnels, jamais requis. L'état vient de leur programme (à root) ; sans lui, seulement ce qui est présent sur la machine (extrait automatiquement de CN_analyse.py)"
contrat = "1.0"
reference = "points/EC_outils_analyse"
fonction = "point_outils_analyse"
runtime = "python"
