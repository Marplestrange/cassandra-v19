# LICENCE    : AGPL-3.0
# AUTEUR     : Atek Drisse
# GIT        : github.com/Marplestrange
# MAIL       : marplestrange@cassandra.center
# MODULE     : netbird
# ZONE       : CN
# VERSION CN : 0.1.0  #686c86
# VERSION EC : néant
# EC LIÉES   : néant
# RÔLE       : Le réseau privé NetBird, piloté depuis l'interface : le client de la machine (l'installer dans Docker, le connecter, le couper) ET, au besoin, un serveur NetBird auto-hébergé (l'installer, le tenir à jour, administrer ses machines, clés, groupes et politiques).
# MÉTHODE    : le client `netbird` (natif ou dans son conteneur Docker) ; ce que le noyau ne peut pas faire sans root (Docker, installation) passe par le courtier et la commande `piloter`, jamais par un shell.
# ══════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.1.0 empreinte=686c86 ▼▼▼
[module]
id = "netbird"
nom = "NetBird"
version = "0.1.0"
noyau_min = "0.1.0"
description = "Le réseau privé NetBird, piloté depuis l'interface : le client de la machine (état, connexion, coupure, installation dans Docker) et, pour qui veut son propre réseau, un serveur NetBird auto-hébergé que Cassandra sait installer, tenir à jour et administrer (machines, clés d'installation, groupes, politiques d'accès)."
confiance = "interne"
famille = "reseau"
groupe = "parc"
proprietaire = "cassandra"
importance = "optionnel"
sans = "Plus de pilotage de NetBird depuis l'interface : le client se gère en ligne de commande (netbird up, docker) et un serveur auto-hébergé avec son tableau de bord et son docker compose."
auteur = "Drisse ATEK"
licence = "AGPL-3.0-or-later"

[[droits]]
id = "utiliser"
libelle = "Voir l'état de NetBird sur cette machine"
defaut = true

[[droits]]
id = "administrer"
libelle = "Connecter ou couper la machine du réseau NetBird, installer ou retirer son conteneur Docker"
sensible = true

[[droits]]
id = "serveur"
libelle = "Installer, mettre à jour, retirer un serveur NetBird auto-hébergé sur cette machine, et administrer son réseau (machines, clés d'installation, groupes, politiques d'accès)"
sensible = true

[[objets]]
type = "reseau_prive_netbird"
libelle = "La connexion NetBird de la machine"

[[objets]]
type = "serveur_netbird"
libelle = "Un serveur NetBird auto-hébergé et son réseau"

[permissions]
stockage = true
racine = true
lectures = true
reseau = ["le client NetBird local (son socket) ou son conteneur Docker ; le serveur de gestion NetBird (api.netbird.io par défaut, ou le vôtre) et ses relais, par ce client", "Docker Hub (netbirdio/netbird) quand le conteneur est installé", "github.com (le script officiel getting-started.sh, d'une version et d'une empreinte confirmées ; api.github.com pour la dernière version publiée, une demande par heure au plus) et les images du serveur NetBird quand un serveur est installé", "pkgs.netbird.io (le dépôt apt ou dnf du paquet officiel, quand le client natif est installé ou mis à jour : clé du dépôt, puis le paquet signé)", "l'API du serveur NetBird administré (réglage url_api, ou le domaine du serveur posé par Cassandra), avec le jeton d'accès enregistré : jamais ailleurs, sans suivre de redirection"]
privileges = ["installer : la commande /usr/libexec/cassandra/netbird/piloter, lancée en root par le courtier : une table fermée de verbes, jamais un shell, jamais le conteneur d'un autre service", "serveur : la commande /usr/libexec/cassandra/netbird/serveur, lancée en root par le courtier : installe le script officiel de la version confirmée dans /opt/netbird-serveur seulement, et pilote docker compose de ce dossier seulement ; sauvegarde et restaure ses volumes dans /var/backups/cassandra/netbird ; ouvre et referme seulement 80/tcp, 443/tcp et 3478/udp dans ufw ou firewalld", "paquet : pose le dépôt apt ou dnf de NetBird et installe, met à jour ou retire le paquet netbird, par apt-get ou dnf, rien d'autre"]

[[racine]]
id = "piloter"
libelle = "Piloter NetBird À ROOT : le client posé sur la machine ou son conteneur Docker (état, connexion, coupure), créer ou retirer le conteneur officiel netbirdio/netbird. La clé d'installation passe par l'entrée standard."

[[racine]]
id = "serveur"
libelle = "Poser et tenir un serveur NetBird auto-hébergé À ROOT : télécharger le script officiel de la version demandée, l'exécuter seulement si son empreinte est celle que l'administrateur a confirmée, puis docker compose de /opt/netbird-serveur (démarrer, arrêter, journaux, mise à jour, retrait). Rien d'autre."

[[reglages]]
id = "cle_install"
libelle = "Clé d'installation NetBird (setup key), le temps d'une connexion : l'écran l'efface aussitôt"
type = "secret"

[[reglages]]
id = "url_gestion"
libelle = "Adresse du serveur de gestion NetBird (vide : NetBird Cloud). Pour un NetBird auto-hébergé : https://netbird.exemple.fr:443"
type = "texte"
defaut = ""

[[reglages]]
id = "url_api"
libelle = "Adresse de l'API du serveur NetBird à administrer (https://netbird.exemple.fr). Vide : le domaine du serveur installé depuis Cassandra"
type = "texte"
defaut = ""

[[reglages]]
id = "jeton_api"
libelle = "Jeton d'accès personnel NetBird (tableau de bord › Settings › Personal Access Tokens) : donne à Cassandra la main d'un administrateur sur le réseau"
type = "secret"

[[reglages]]
id = "domaine_libre"
libelle = "Autoriser, pour le serveur NetBird, un domaine que Cassandra n'administre pas (ni site du panneau d'hébergement, ni zone DNS qu'il héberge). Par défaut non : le domaine se choisit parmi ceux qu'elle connaît"
type = "booleen"
defaut = false

[[reglages]]
id = "conteneur"
libelle = "Nom du conteneur Docker du client NetBird"
type = "texte"
defaut = "netbird"

[[reglages]]
id = "mode"
libelle = "Où est le client : auto (le module le trouve), natif (installé sur la machine) ou docker (dans le conteneur)"
type = "choix"
defaut = "auto"
choix = ["auto", "natif", "docker"]

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "etat"
libelle = "Où en est NetBird sur cette machine : client ou conteneur, connecté ou non, lien d'identification en attente, adresse, nom, machines du réseau, serveurs de gestion et relais"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "journal"
libelle = "Les derniers gestes faits sur NetBird depuis Cassandra : quand, par qui, quoi, et ce qui peut encore se défaire"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "connecter"
libelle = "Connecter la machine à un réseau NetBird : sans clé, rend un lien à ouvrir pour s'identifier ; avec la clé d'installation enregistrée, se connecte seule"
risque = "moyen"
droit = "administrer"
perimetre = ["la connexion NetBird de cette machine", "le client local seulement, jamais le tableau de bord NetBird"]
preuve = "l'état du client est « connecté » (netbird status), ou un lien d'identification attend"
retour = "abandonner l'attente (aucune identification n'a eu lieu), ou couper la connexion (netbird down)"

[[capacites]]
id = "annuler"
libelle = "Abandonner une connexion commencée et jamais terminée (le lien ouvert reste sans effet)"
risque = "faible"
droit = "administrer"
perimetre = ["une connexion commencée et pas terminée"]
preuve = "plus aucune connexion en attente"
retour = "relancer la connexion (aucune identification n'a eu lieu)"

[[capacites]]
id = "deconnecter"
libelle = "Couper NetBird sur cette machine sans l'oublier : elle se reconnecte d'un clic, sans nouvelle identification"
risque = "moyen"
droit = "administrer"
perimetre = ["la connexion NetBird de cette machine"]
preuve = "l'état du client n'est plus « connecté »"
retour = "reconnecter la machine (netbird up, sans option) : elle garde son identité"

[[capacites]]
id = "installer_docker"
libelle = "Installer le client NetBird dans un conteneur Docker officiel (netbirdio/netbird) : redémarre avec la machine, réseau de la machine, aucun autre conteneur touché. Avec la clé d'installation enregistrée, il se connecte seul"
risque = "eleve"
droit = "administrer"
perimetre = ["un conteneur nommé par le réglage « conteneur », image netbirdio/netbird seulement", "par le courtier : Cassandra n'a jamais accès à Docker"]
preuve = "relire `docker inspect` : le conteneur existe et tourne"
retour = "retirer le conteneur (son volume, donc l'identité de la machine, est gardé)"

[[capacites]]
id = "retirer_docker"
libelle = "Retirer le conteneur Docker du client NetBird (et, sur demande, son volume : la machine perd son identité dans NetBird)"
risque = "eleve"
droit = "administrer"
perimetre = ["le conteneur nommé par le réglage « conteneur », s'il est bien une image netbirdio/netbird"]
preuve = "relire `docker inspect` : le conteneur n'existe plus"
retour = "réinstaller le conteneur (avec son volume gardé, la machine retrouve son identité ; purgé, il faut une nouvelle identification)"

[[capacites]]
id = "mettre_a_jour_client"
libelle = "Mettre à jour le client NetBird : dans Docker, télécharge l'image (même étiquette, ou celle demandée) et, si elle a changé, recrée le conteneur avec son volume ; en natif, met le paquet à jour par apt ou dnf. La machine est coupée quelques secondes, son identité est gardée"
risque = "eleve"
droit = "administrer"
perimetre = ["le conteneur nommé par le réglage « conteneur », s'il est bien une image netbirdio/netbird, ou le paquet netbird du gestionnaire de paquets", "par le courtier : pull puis recréation seulement si l'image a changé ; apt-get ou dnf pour le paquet"]
preuve = "relire `docker inspect` : le conteneur tourne après la mise à jour"
retour = "remettre la version d'avant : l'ancienne image (si elle est encore sur la machine) avec le même volume, ou la version précédente du paquet"

[[capacites]]
id = "serveur_etat"
libelle = "Le serveur NetBird posé par Cassandra : installé ou non, version, domaine, conteneurs, premier compte à créer, API joignable"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "serveur_journaux"
libelle = "Les 80 dernières lignes des journaux du serveur NetBird (docker compose logs)"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "serveur_nginx"
libelle = "Le fichier de configuration nginx prêt à coller devant le serveur NetBird (mode « nginx »), tel que le script officiel l'a écrit"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "serveur_domaines"
libelle = "Les domaines que Cassandra administre et qui peuvent porter le serveur NetBird : les sites du panneau d'hébergement et les noms de ses zones DNS ; avec un domaine donné, dit s'il en fait partie"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "serveur_ports"
libelle = "Les ports du serveur NetBird : ceux qu'il faut publier (TCP 80 et 443, UDP 3478), ceux que ton proxy nginx ou caddy doit joindre sur cette machine (8080 tableau de bord, 8081 serveur), s'ils sont libres, et ceux que les conteneurs publient vraiment"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "serveur_telecharger"
libelle = "Télécharger le script officiel d'installation du serveur NetBird d'une version précise et en rendre l'empreinte SHA-256 : rien n'est exécuté, rien n'est installé"
risque = "faible"
droit = "serveur"
perimetre = ["le script getting-started.sh de la version demandée, déposé dans /opt/netbird-serveur", "jamais « latest » : une version explicite"]
preuve = "l'empreinte SHA-256 du fichier téléchargé est rendue"
retour = "supprimer le fichier téléchargé (retirer le serveur)"

[[capacites]]
id = "serveur_installer"
libelle = "Installer un serveur NetBird auto-hébergé : le script officiel de la version confirmée (empreinte comparée à celle de `serveur_telecharger`), son docker compose, ses certificats, le proxy choisi (traefik, nginx ou caddy)"
risque = "eleve"
droit = "serveur"
perimetre = ["/opt/netbird-serveur seulement", "ports 80, 443 et 3478/udp quand le proxy est traefik", "un domaine que Cassandra administre (site du panneau d'hébergement ou sa zone DNS) ou, sur demande expresse, un domaine qu'elle n'administre pas, et l'adresse e-mail, confirmés"]
preuve = "relire docker compose : les conteneurs du serveur tournent"
retour = "retirer le serveur (ses données sont gardées sauf demande contraire)"

[[capacites]]
id = "serveur_mettre_a_jour"
libelle = "Mettre à jour le serveur NetBird (docker compose pull puis up), sans changer sa configuration ; une sauvegarde est faite avant, sauf si on la refuse"
risque = "moyen"
droit = "serveur"
perimetre = ["les conteneurs de /opt/netbird-serveur"]
preuve = "les conteneurs tournent après la mise à jour"
retour = "restaurer la sauvegarde faite juste avant : données, configuration et images d'alors (sans sauvegarde, la mise à jour ne se défait pas)"

[[capacites]]
id = "versions"
libelle = "Les versions de NetBird : celle du client et du serveur installés, et la dernière publiée (GitHub, une demande par heure au plus)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "serveur_sauvegarder"
libelle = "Sauvegarder le serveur NetBird : ses volumes et son dossier sont copiés dans /var/backups/cassandra/netbird (le serveur est arrêté le temps de la copie) ; les 10 plus récentes sont gardées"
risque = "moyen"
droit = "serveur"
perimetre = ["le dossier du serveur et les volumes de sa pile", "écrit seulement dans /var/backups/cassandra/netbird, lisible par root seul"]
preuve = "la sauvegarde figure dans la liste avec sa date et sa taille"
retour = "supprimer la sauvegarde (elle ne change rien au serveur)"

[[capacites]]
id = "serveur_sauvegardes"
libelle = "Les sauvegardes du serveur NetBird : date, raison, version, taille"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "serveur_restaurer"
libelle = "Restaurer une sauvegarde du serveur NetBird : données et configuration remplacées (une sauvegarde de sécurité est faite avant) ; avec « images », les images d'alors reviennent aussi"
risque = "eleve"
droit = "serveur"
perimetre = ["une sauvegarde de la liste, par son identifiant", "archive refusée si un chemin ou un lien sort de son dossier ; seuls les volumes de la pile sont remplacés"]
preuve = "les conteneurs du serveur tournent après la restauration"
retour = "restaurer la sauvegarde de sécurité faite juste avant"

[[capacites]]
id = "pare_feu_etat"
libelle = "Le pare-feu de la machine (ufw ou firewalld) : actif ou non, et lesquels des ports publics de NetBird sont ouverts"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "pare_feu_ouvrir"
libelle = "Ouvrir dans le pare-feu les ports publics du serveur NetBird : 443/tcp et 3478/udp, et 80/tcp avec traefik ; ceux qui le sont déjà ne sont pas touchés"
risque = "eleve"
droit = "serveur"
perimetre = ["80/tcp, 443/tcp et 3478/udp seulement", "ufw ou firewalld, par le courtier"]
preuve = "relire le pare-feu : ces ports y sont ouverts"
retour = "refermer seulement les ports que ce geste a ouverts (ceux qui l'étaient déjà restent ouverts)"

[[capacites]]
id = "serveur_ip"
libelle = "L'adresse de cette machine telle que le système la voit (pour l'enregistrement DNS du serveur), et si elle est privée"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "serveur_dns_verifier"
libelle = "Vérifier que le domaine du serveur NetBird se résout, et vers quelle adresse"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "installer_natif"
libelle = "Installer le client NetBird natif par le paquet officiel : dépôt apt ou dnf de pkgs.netbird.io (clé et paquet signés), puis son service. Un seul client par machine"
risque = "eleve"
droit = "administrer"
perimetre = ["le paquet netbird et le dépôt de pkgs.netbird.io, rien d'autre", "refusé si un client existe déjà (natif ou conteneur)", "par le courtier : apt-get ou dnf"]
preuve = "relire l'état : le client natif est installé et son service répond"
retour = "désinstaller le paquet (la configuration de la machine est gardée)"

[[capacites]]
id = "retirer_natif"
libelle = "Désinstaller le client NetBird natif (le paquet) : la machine reste enregistrée dans le réseau et peut se reconnecter"
risque = "eleve"
droit = "administrer"
perimetre = ["le paquet netbird seulement", "par le courtier : apt-get ou dnf"]
preuve = "relire l'état : plus de client natif"
retour = "réinstaller le paquet depuis la page Client"

[[capacites]]
id = "serveur_redemarrer"
libelle = "Redémarrer le serveur NetBird (docker compose restart) : les machines se reconnectent seules"
risque = "moyen"
droit = "serveur"
perimetre = ["les conteneurs de /opt/netbird-serveur"]
preuve = "les conteneurs tournent"
retour = "aucun retour utile : un redémarrage n'a pas de contraire"

[[capacites]]
id = "serveur_retirer"
libelle = "Retirer le serveur NetBird (docker compose down). Sans purge, ses données sont gardées ; avec, les comptes, machines et clés sont perdus"
risque = "eleve"
droit = "serveur"
perimetre = ["les conteneurs et, sur demande, les données de /opt/netbird-serveur"]
preuve = "docker compose ne liste plus aucun conteneur"
retour = "réinstaller le serveur (avec ses données gardées, le réseau reprend tel quel ; purgé, il est perdu)"

[[capacites]]
id = "api_verifier"
libelle = "Vérifier que l'API du serveur NetBird répond et accepte le jeton d'accès enregistré, et dire combien de machines elle voit"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "api_machines"
libelle = "Les machines du réseau NetBird : nom, adresse, connectée ou non, système, version, groupes, dernière vue, SSH, expiration"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "api_cles"
libelle = "Les clés d'installation du réseau NetBird : nom, type, utilisations, expiration, groupes (jamais la clé elle-même : elle n'est montrée qu'à sa création)"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "api_groupes"
libelle = "Les groupes du réseau NetBird et le nombre de machines de chacun"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "api_politiques"
libelle = "Les politiques d'accès du réseau NetBird : qui peut joindre quoi, sur quel protocole"
risque = "lecture"
droit = "serveur"

[[capacites]]
id = "machine_modifier"
libelle = "Renommer une machine du réseau NetBird, ou régler son SSH et l'expiration de sa connexion"
risque = "moyen"
droit = "serveur"
perimetre = ["une machine du réseau, par son identifiant"]
preuve = "relire la machine : ses réglages sont ceux demandés"
retour = "remettre les réglages d'avant (ils sont au journal)"

[[capacites]]
id = "machine_supprimer"
libelle = "Retirer une machine du réseau NetBird : elle perd sa place et devra se reconnecter avec une clé"
risque = "eleve"
droit = "serveur"
perimetre = ["une machine du réseau, par son identifiant"]
preuve = "la machine n'est plus listée par l'API"
retour = "la machine se reconnecte avec une clé d'installation"

[[capacites]]
id = "cle_creer"
libelle = "Créer une clé d'installation NetBird (à usage unique ou réutilisable, durée limitée, groupes d'arrivée). La clé n'est montrée qu'une fois, à l'écran"
risque = "moyen"
droit = "serveur"
perimetre = ["une clé du réseau NetBird, nommée, valable de 1 à 365 jours"]
preuve = "relire les clés : la nouvelle est listée"
retour = "supprimer la clé (aucune machine ne s'est encore connectée avec)"
masque = ["cle_secrete"]

[[capacites]]
id = "cle_revoquer"
libelle = "Révoquer (ou rétablir) une clé d'installation NetBird : plus aucune machine ne peut s'enregistrer avec"
risque = "moyen"
droit = "serveur"
perimetre = ["une clé du réseau, par son identifiant"]
preuve = "relire la clé : révoquée ou rétablie comme demandé"
retour = "rétablir la clé"

[[capacites]]
id = "cle_supprimer"
libelle = "Supprimer une clé d'installation NetBird"
risque = "moyen"
droit = "serveur"
perimetre = ["une clé du réseau, par son identifiant"]
preuve = "la clé n'est plus listée"
retour = "créer une nouvelle clé (l'ancienne ne revient pas)"

[[capacites]]
id = "groupe_creer"
libelle = "Créer un groupe de machines dans le réseau NetBird"
risque = "faible"
droit = "serveur"
perimetre = ["un groupe nommé"]
preuve = "relire les groupes : le nouveau est listé"
retour = "supprimer le groupe"

[[capacites]]
id = "groupe_supprimer"
libelle = "Supprimer un groupe du réseau NetBird (refusé par NetBird tant qu'une règle ou une clé l'utilise)"
risque = "moyen"
droit = "serveur"
perimetre = ["un groupe, par son identifiant"]
preuve = "le groupe n'est plus listé"
retour = "recréer le groupe (ses machines devront y être remises)"

[[capacites]]
id = "politique_creer"
libelle = "Créer une politique d'accès NetBird entre des groupes sources et des groupes destinations (protocole et sens au choix)"
risque = "moyen"
droit = "serveur"
perimetre = ["une politique nommée, avec une règle"]
preuve = "relire les politiques : la nouvelle est listée"
retour = "supprimer la politique"

[[capacites]]
id = "politique_activer"
libelle = "Activer ou désactiver une politique d'accès NetBird sans la supprimer"
risque = "moyen"
droit = "serveur"
perimetre = ["une politique, par son identifiant"]
preuve = "relire la politique : active ou non comme demandé"
retour = "remettre l'état d'avant"

[[capacites]]
id = "politique_supprimer"
libelle = "Supprimer une politique d'accès NetBird : les machines qu'elle reliait ne se joignent plus"
risque = "eleve"
droit = "serveur"
perimetre = ["une politique, par son identifiant"]
preuve = "la politique n'est plus listée"
retour = "recréer la politique"

[[capacites]]
id = "defaire_geste"
libelle = "Défaire un geste du journal NetBird : reconnecter après une coupure, couper une connexion que l'on vient d'ouvrir, retirer le conteneur que l'on vient d'installer, remettre une machine, une clé, un groupe ou une politique comme avant"
risque = "moyen"
droit = "administrer"
perimetre = ["un geste noté au journal de ce module, une seule fois", "le même retour que celui du geste d'origine"]
preuve = "le geste est marqué défait au journal"
retour = "refaire le geste"

[[ecrans]]
id = "n_vue"
libelle = "Vue d'ensemble"
domaine = "reseau"
gabarit = "libre"

[[ecrans]]
id = "n_machines"
libelle = "Machines"
domaine = "reseau"
gabarit = "libre"

