[module]
id = "voix"
nom = "Voix"
version = "0.1.0"
noyau_min = "0.1.0"
description = "La voix : ce qui est installé (l'écoute par faster-whisper, la parole par piper), le catalogue des voix, et le choix par compte. Différé : l'écoute (transcription), la parole (synthèse) et le téléchargement des voix — des modèles de plusieurs centaines de mégaoctets, par le courtier."
confiance = "interne"
famille = "echanges"

[[objets]]
type = "voix_pref"
libelle = "Une préférence de voix"

[permissions]
stockage = true
racine = true

[[racine]]
id = "ecouter"
libelle = "Transcrire un fichier audio en texte (faster-whisper)"

[[racine]]
id = "parler"
libelle = "Synthétiser un texte en audio (piper), écrit dans un fichier"

[[racine]]
id = "telecharger"
libelle = "Télécharger une voix piper depuis HuggingFace"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "ecouter"
libelle = "Transcrire un enregistrement audio en texte (par le courtier), l'audio ne quitte pas la machine et est effacé"
risque = "lecture"

[[capacites]]
id = "parler"
libelle = "Synthétiser un texte en audio (par le courtier)"
risque = "faible"
perimetre = ["un fichier audio temporaire"]
preuve = "le fichier existe"
retour = "effacer le fichier"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "telecharger"
libelle = "Télécharger une voix (par le courtier)"
risque = "faible"
perimetre = ["les fichiers d'une voix"]
preuve = "la voix est posée"
retour = "effacer la voix"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "dispo"
libelle = "Ce qui est installé : l'écoute, la parole, le modèle et la voix en service"
risque = "lecture"

[[capacites]]
id = "catalogue"
libelle = "Le catalogue des voix : nom, genre, description, locuteurs"
risque = "lecture"

[[capacites]]
id = "reglages"
libelle = "Les préférences de voix du compte : la voix, le locuteur, la lecture automatique, le débit, le mode vocal"
risque = "lecture"

[[capacites]]
id = "choisir"
libelle = "Choisir sa voix, son locuteur et sa lecture automatique (la voix de chacun est par compte)"
risque = "faible"
perimetre = ["les préférences de voix du compte"]
preuve = "les préférences relues"
retour = "remettre les préférences d'avant"
paliers = ["raconter", "auto", "maitre"]
