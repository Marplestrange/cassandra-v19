# ▼▼▼ BORNE CN version=0.2.0 empreinte=cf8cf1 ▼▼▼
[module]
id = "voix"
nom = "Voix"
version = "0.2.0"
noyau_min = "0.1.0"
description = "La voix : ce qui est installé (l'écoute par faster-whisper, la parole par piper), le catalogue des voix, et le choix par compte. L'écoute, la parole et le téléchargement des voix sont des modèles de plusieurs centaines de mégaoctets : ils passent par le courtier. Le modèle de dictée et le lexique (les mots propres à la maison) se règlent."
confiance = "interne"
famille = "echanges"
groupe = "desk"
proprietaire = "itare"
importance = "optionnel"
sans = "Plus d'écoute ni de parole : la voix n'est plus disponible."

[[droits]]
id = "utiliser"
libelle = "Utiliser Voix : consulter et travailler dans ce module"
defaut = true

[[droits]]
id = "administrer"
libelle = "Administrer Voix : réglages et gestes sensibles"
sensible = true

[[objets]]
type = "voix_pref"
libelle = "Une préférence de voix"

[permissions]
stockage = true
racine = true

[[reglages]]
id = "modele_dictee"
libelle = "Le modèle de dictée (faster-whisper) : plus gros, plus juste, plus lent"
type = "choix"
defaut = "small"
choix = ["tiny", "base", "small", "medium"]

[[reglages]]
id = "lexique"
libelle = "Le lexique de la dictée : les noms propres et les mots de la maison que la dictée doit connaître (séparés par des virgules)"
defaut = ""

[[racine]]
id = "ecouter"
libelle = "Transcrire un fichier audio en texte (faster-whisper), avec le modèle et le lexique réglés"

[[racine]]
id = "parler"
libelle = "Synthétiser un texte en audio (piper), écrit dans un fichier"

[[racine]]
id = "telecharger"
libelle = "Télécharger une voix piper depuis HuggingFace"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "ecouter"
libelle = "Transcrire un enregistrement audio en texte (par le courtier), l'audio ne quitte pas la machine et est effacé"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "parler"
libelle = "Synthétiser un texte en audio (par le courtier) : le son est rendu à l'appelant, le fichier temporaire est effacé"
risque = "faible"
droit = "utiliser"
perimetre = ["un fichier audio temporaire, effacé aussitôt"]
preuve = "le son est rendu"
retour = "aucun : rien ne reste sur le disque"
paliers = ["raconter", "auto", "maitre"]
masque = ["audio_b64"]

[[capacites]]
id = "telecharger"
libelle = "Télécharger une voix (par le courtier)"
risque = "faible"
droit = "utiliser"
perimetre = ["les fichiers d'une voix"]
preuve = "la voix est posée"
retour = "effacer la voix"
paliers = ["raconter", "auto", "maitre"]

[[capacites]]
id = "dispo"
libelle = "Ce qui est installé : l'écoute, la parole, le modèle et la voix en service"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "catalogue"
libelle = "Le catalogue des voix : nom, genre, description, locuteurs"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "reglages"
libelle = "Les préférences de voix du compte : la voix, le locuteur, la lecture automatique, le débit, le mode vocal"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "choisir"
libelle = "Choisir sa voix, son locuteur et sa lecture automatique (la voix de chacun est par compte)"
risque = "faible"
droit = "utiliser"
perimetre = ["les préférences de voix du compte"]
preuve = "les préférences relues"
retour = "remettre les préférences d'avant"
paliers = ["raconter", "auto", "maitre"]
