# RÔLE       : La voix : ce qui est installé (l'écoute par faster-whisper, la parole par piper), le catalogue des voix, et le choix par compte. Différé : l'écoute (transcription), la parole (synthèse) et le téléchargement des voix — des modèles de plusieurs centaines de mégaoctets, par le courtier.
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
