# RÔLE       : Les canaux : porter une notification hors de la cloche quand la politique de son destinataire le demande (Telegram aujourd'hui ; le courriel et le webhook disent ce qu'il leur manque), et le miroir Telegram (ses conversations répétées sur Telegram, par compte). Le miroir est ÉTEINT PAR DÉFAUT, délibérément : relier Telegram pour recevoir des alertes n'est pas consentir à y voir surgir ses conversations. Différé : la connexion MTProto/Telethon et la session (qui ne vit QUE dans le coffre).
# MÉTHODE    : à compléter par l'auteur (comment le fichier s'y prend)
# ══════════════════════════════════════════════════════════════════════════════
# ▼▼▼ BORNE CN version=0.2.0 empreinte=a362ab ▼▼▼
[module]
id = "canaux"
nom = "Canaux"
version = "0.2.0"
noyau_min = "0.1.0"
description = "Les canaux : porter une notification hors de la cloche quand la politique de son destinataire le demande (Telegram aujourd'hui ; le courriel et le webhook disent ce qu'il leur manque), et le miroir Telegram (ses conversations répétées sur Telegram, par compte). Le miroir est ÉTEINT PAR DÉFAUT, délibérément : relier Telegram pour recevoir des alertes n'est pas consentir à y voir surgir ses conversations. Différé : la connexion MTProto/Telethon et la session (qui ne vit QUE dans le coffre)."
confiance = "interne"
famille = "canaux"
groupe = "parametres"
proprietaire = "cassandra"
importance = "optionnel"
sans = "Les notifications ne sortent plus de la cloche : plus d'alerte sur Telegram, même critique. Plus de miroir des conversations."
requiert = ["notifications"]             # il écoute « notification.emise » et lui demande la politique ; telegram, lui, reste facultatif (sans lui, rien ne part et la file le dit)

[[droits]]
id = "utiliser"
libelle = "Utiliser Canaux : consulter et travailler dans ce module"
defaut = true

[[droits]]
id = "administrer"
libelle = "Administrer Canaux : réglages et gestes sensibles"
sensible = true

[[objets]]
type = "canal_pref"
libelle = "Une préférence de canal"

[[objets]]
type = "livraison"
libelle = "Une notification à porter à un compte par un canal : en attente (et pourquoi), livrée, tue ou en échec"

# La politique (niveau, heures calmes, sourdines) est jugée par notifications : ce module la demande (« notifications.livraison ») et porte.
[evenements]
emet = ["livraison.faite", "livraison.echouee"]
ecoute = ["notification.emise"]

# Deux moteurs, parce qu'un moteur sur événement tourne au nom du compte de l'événement : il ne pourrait écrire qu'à celui-là.
# « noter » range ; « livrer », périodique, agit sous le compte « noyau » et porte à chacun. La file porte aussi ce qui doit attendre.
[[moteurs]]
id = "noter"
libelle = "Range chaque notification émise dans la file des livraisons (n'envoie rien)"
mode = "evenement"
sur = ["notification.emise"]
duree_max_s = 20
asynchrone = true                        # en file : deux notifications émises au même instant sont rangées toutes les deux (un moteur synchrone déjà occupé laisserait passer la seconde)

[[moteurs]]
id = "livrer"
libelle = "Porte ce qui est dû : demande à notifications qui reçoit quoi et ce qui le retient, puis confie le message au robot Telegram du destinataire"
mode = "periodique"
toutes_les_s = 60
duree_max_s = 120

[permissions]
stockage = true
racine = true
lectures = true                          # « notifications.livraison » (la politique, par notification) et « telegram.etat » (mon robot est-il prêt ?)
agir = true
agir_moteur = ["telegram.prevenir"]      # la seule chose que le moteur fait sortir, par la porte que telegram lui réserve

[[racine]]
id = "connecter"
libelle = "Connecter le compte Telegram (Telethon) ; la session arrive en stdin, jamais en argument, et ne sort pas"

[installation]
script = "CN_installer.sh"
verification = "CN_verifier.sh"
retrait = "CN_retirer.sh"

[[capacites]]
id = "connecter"
libelle = "Connecter le compte Telegram et rendre l'identifiant (la session ne vit que le temps de la connexion)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "etat"
libelle = "L'état du canal : le client est-il connecté, et le miroir est-il allumé pour ce compte"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "portes"
libelle = "Pour mon compte : quels canaux portent vraiment mes notifications, ce qui est branché pour moi, ce qu'il manque aux autres, et le sort de mon dernier essai"
risque = "lecture"

[[capacites]]
id = "livraisons"
libelle = "Ce qui est parti hors de la cloche, ce qui attend et pourquoi, ce qui a échoué : mes livraisons, ou toutes pour un administrateur"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "miroir"
libelle = "Le miroir de ce compte est-il allumé (éteint par défaut)"
risque = "lecture"
droit = "utiliser"

[[capacites]]
id = "miroir_ecrire"
libelle = "Allumer ou éteindre le miroir pour ce compte"
risque = "faible"
droit = "utiliser"
perimetre = ["le miroir du compte"]
preuve = "le miroir relu"
retour = "remettre le miroir d'avant"
paliers = ["raconter", "auto", "maitre"]
