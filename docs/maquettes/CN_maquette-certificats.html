<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cassandra V19 — maquette des certificats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Jetons : repris À L'IDENTIQUE de CN_maquette-menus.html (coque V19). Aucun jeton nouveau, sauf --info (déjà dans habillage.css : pastille pas_encore). */
:root{
  --sol:#eef1f5; --halo:#e9edf3; --verre:rgba(255,255,255,.66); --verre-fort:rgba(255,255,255,.92);
  --encre:#101828; --encre-2:#475467; --encre-3:#8b95a3; --filet:rgba(16,24,40,.09); --filet-fort:rgba(16,24,40,.16);
  --accent:#0b7c74; --accent-doux:rgba(11,124,116,.10); --accent-encre:#fff;
  --barre:#0b7c74; --barre-haut:#0e8a81; --barre-encre:#ffffff; --barre-doux:rgba(255,255,255,.16);
  --ok:#047857; --ok-doux:rgba(4,120,87,.10); --alerte:#b45309; --alerte-doux:rgba(180,83,9,.11); --danger:#be123c; --danger-doux:rgba(190,18,60,.10); --info:#1d4ed8; --info-doux:rgba(29,78,216,.10);
  --ombre:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:"Public Sans",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --sol:#0d1117; --halo:#111a24; --verre:rgba(26,33,44,.66); --verre-fort:rgba(30,38,50,.96);
  --encre:#e6ebf2; --encre-2:#aab4c3; --encre-3:#707c8d; --filet:rgba(230,235,242,.10); --filet-fort:rgba(230,235,242,.20);
  --accent:#34b3a8; --accent-doux:rgba(52,179,168,.14); --accent-encre:#06201d;
  --barre:#14524d; --barre-haut:#186059; --barre-encre:#eafaf8; --barre-doux:rgba(255,255,255,.12);
  --ok:#3ecf9a; --ok-doux:rgba(62,207,154,.12); --alerte:#e7a14c; --alerte-doux:rgba(231,161,76,.13); --danger:#ff6b8b; --danger-doux:rgba(255,107,139,.12); --info:#7aa2ff; --info-doux:rgba(122,162,255,.14);
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(900px 420px at 50% -25%,var(--halo),transparent),var(--sol);color:var(--encre);font:14px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-rows:60px minmax(0,1fr);height:100vh}

/* ---------- Barre haute (identique à la maquette des menus) ---------- */
.top{display:flex;align-items:center;gap:4px;padding:0 14px 0 10px;background:linear-gradient(180deg,var(--barre-haut),var(--barre));color:var(--barre-encre);box-shadow:0 2px 10px rgba(16,24,40,.14);position:relative;z-index:30}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--barre-encre);opacity:.9}
.ib:hover{background:var(--barre-doux);opacity:1}
.nav3{display:flex}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:grid;place-items:center;font:700 15px var(--mono);color:#0b7c74;margin:0 12px 0 6px;flex:none}
.groupes{display:flex;align-items:center;gap:clamp(2px,2.2vw,30px);min-width:0;flex:1;height:100%;padding-left:8px}
.mi.gr{position:relative;width:46px;height:60px;display:flex;align-items:center;justify-content:center;color:var(--barre-encre);opacity:.82}
.mi.gr svg{width:23px;height:23px;stroke-width:1.9}
.mi.gr:hover{background:var(--barre-doux);opacity:1}
.mi.gr.on{opacity:1}
.mi.gr.on::after{content:"";position:absolute;left:50%;bottom:0;width:16px;height:8px;margin-left:-8px;background:var(--sol);clip-path:polygon(50% 0,0 100%,100% 100%)}
.mi.gr::before{content:attr(data-tip);position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;font:500 11.5px var(--mono);padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.mi.gr:hover::before,.mi.gr:focus-visible::before{opacity:1}
.mi.gr .al{position:absolute;top:11px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--barre)}
.mi.gr .al.a{background:var(--alerte)}
.droite{display:flex;align-items:center;gap:4px;padding-left:6px;flex:none}
.wrap{position:relative}
.pastille{position:relative}
.pastille i{position:absolute;top:2px;right:2px;box-shadow:0 0 0 2px var(--barre);min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font:600 9.5px/15px var(--mono);text-align:center;font-style:normal;padding:0 3px}
.vtxt{font:500 12px var(--mono);opacity:.85;padding:0 6px}
.av{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px 0 4px;border-radius:999px;color:var(--barre-encre)}
.av:hover{background:var(--barre-doux)}
.av span{width:30px;height:30px;border-radius:50%;background:#fff;color:#0b7c74;display:grid;place-items:center;font:600 10.5px var(--mono)}
.av svg{width:11px;height:11px}
.pop{position:absolute;top:50px;color:var(--encre);right:0;min-width:270px;background:var(--verre-fort);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--filet);border-radius:16px;box-shadow:var(--ombre),0 18px 40px rgba(16,24,40,.12);padding:8px;display:none;z-index:40}
.pop.ouvert{display:block}
.pop .t{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-3);padding:8px 10px 4px}
.pop button.l{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;font-size:13.5px}
.pop button.l:hover{background:var(--accent-doux)}
.pop button.l small{margin-left:auto;font:400 11px var(--mono);color:var(--encre-3)}
.pop hr{border:0;border-top:1px solid var(--filet);margin:6px 4px}

/* ---------- Corps ---------- */
.corps{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0;position:relative}
.side{width:240px;overflow:auto;padding:14px 8px 14px 14px;transition:width .18s ease,padding .18s ease;position:relative;z-index:20}
.side.ferme{width:0;padding:14px 0;overflow:hidden}
.side h2{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3);padding:2px 10px 10px;white-space:nowrap}
.side .si{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;color:var(--encre-2);text-align:left;white-space:nowrap}
.side .si:hover{background:var(--verre);color:var(--encre)}
.side .si.ent{font-weight:500;color:var(--encre)}
.side .si.ent svg:first-child{color:var(--encre-3)}
.side .si .car{margin-left:auto;width:14px;height:14px;transition:transform .15s}
.side .si .car.ouv{transform:rotate(90deg)}
.side .si .nb{margin-left:auto;font:600 10px var(--mono);background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px}
.side .si .nb+.car{margin-left:6px}
.side .si.sub{padding-left:38px;font-size:13px}
.side .si.on{background:var(--verre);color:var(--accent);font-weight:600;box-shadow:var(--ombre)}
.side .si .pt{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.side .si.prop{font-style:italic}
.side .note{margin:12px 6px 0;padding:10px 12px;border-radius:12px;background:var(--alerte-doux);color:var(--alerte);font-size:12px;line-height:1.45}
.scene{overflow:auto;padding:26px 30px 90px}
.scene .in{max-width:1100px}
.fil{font:500 11.5px var(--mono);color:var(--encre-3);margin-bottom:6px}
.fil a{color:inherit;cursor:pointer;text-decoration:none}.fil a:hover{color:var(--accent)}
.scene h1{font:600 20px var(--mono);margin-bottom:4px}
.scene p.sous{color:var(--encre-2);margin-bottom:18px;max-width:70ch}

/* ---------- Composants (tenue de habillage.css : boutons, pastilles, tuiles, tableaux, champs) ---------- */
.carte{background:var(--verre);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:16px;box-shadow:var(--ombre);padding:16px 18px;border:1px solid var(--filet)}
.carte>h3,.carte>b.t{display:block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-3);margin-bottom:10px}
.btn{font:600 13px/1.2 var(--sans);padding:7px 14px;border-radius:10px;border:1px solid var(--filet-fort);background:var(--verre-fort);color:var(--encre);transition:border-color .15s,color .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-encre)}
.btn.pri:hover:not([disabled]){color:var(--accent-encre);filter:brightness(1.08)}
.btn.dng{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.dng:hover:not([disabled]){border-color:var(--danger);color:var(--danger)}
.btn.dng.pri{background:var(--danger);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn svg{width:15px;height:15px}
.p{font:600 11px/1.2 var(--sans);border-radius:7px;padding:3px 8px;background:color-mix(in srgb,var(--encre-2) 10%,transparent);color:var(--encre-2);display:inline-block;white-space:nowrap}
.p.ok{background:var(--ok-doux);color:var(--ok)}.p.al{background:var(--alerte-doux);color:var(--alerte)}.p.da{background:var(--danger-doux);color:var(--danger)}.p.in{background:var(--info-doux);color:var(--info)}
.p.rev{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.p.prop{border:1px dashed var(--alerte)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:600 12.5px/1.2 var(--sans);padding:5px 12px;border-radius:999px;border:1px solid var(--filet);background:var(--verre);color:var(--encre-2)}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-encre)}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tuile{background:var(--verre);border:1px solid var(--filet);border-radius:14px;padding:12px 14px;box-shadow:var(--ombre);text-align:left;display:block;width:100%}
.tuile span{display:block;font:600 12px var(--sans);color:var(--encre-2)}
.tuile b{display:block;font:650 22px var(--mono)}
.tuile small{font-size:11px;color:var(--encre-3)}
button.tuile:hover{border-color:var(--accent)}
.tuile.da b{color:var(--danger)}.tuile.al b{color:var(--alerte)}.tuile.ok b{color:var(--ok)}
.grille2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.barre-q{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search],input[type=text],input[type=number],select,textarea{font:13.5px var(--sans);border:1px solid var(--filet-fort);background:var(--verre-fort);color:var(--encre);border-radius:10px;padding:7px 11px;transition:border-color .15s,box-shadow .15s;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input::placeholder,textarea::placeholder{color:var(--encre-3)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
input[disabled],select[disabled],textarea[disabled]{opacity:.55}
input.inv,textarea.inv,select.inv{border-color:var(--danger)}
.champ{display:grid;gap:4px;margin-bottom:12px}
.champ label{font:600 12.5px/1.3 var(--sans);color:var(--encre-2)}
.champ .aide{font-size:12px;color:var(--encre-3)}.champ .err{font-size:12px;color:var(--danger);min-height:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:650 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--filet);white-space:nowrap}
th.tri{cursor:pointer}th.tri:hover{color:var(--accent)}
td{padding:9px 10px;border-bottom:1px solid var(--filet);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tr.sel td{background:var(--accent-doux)}
td.h{font:500 13px var(--mono)}
td.h a{cursor:pointer;color:var(--encre)}td.h a:hover{color:var(--accent);text-decoration:underline}
.num{font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--mono)}
.actions{display:flex;gap:6px;justify-content:flex-end}
.pied-tab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;font-size:12.5px;color:var(--encre-2)}
.pag{display:flex;gap:4px}
.pag button{min-width:30px;height:30px;border-radius:8px;border:1px solid var(--filet);background:var(--verre)}
.pag button.on{background:var(--accent);color:var(--accent-encre);border-color:transparent}
.pag button[disabled]{opacity:.4;cursor:not-allowed}
.lot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;border-radius:12px;background:var(--accent-doux);color:var(--accent);font-weight:600;font-size:13px}
.silence{border:1px solid var(--filet);border-radius:12px;background:color-mix(in srgb,var(--encre-2) 5%,transparent);color:var(--encre-2);padding:22px;text-align:center}
.silence b{display:block;font:600 14px var(--mono);color:var(--encre);margin-bottom:4px}
.bandeau{padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.bandeau.da{background:var(--danger-doux);color:var(--danger)}.bandeau.al{background:var(--alerte-doux);color:var(--alerte)}.bandeau.in{background:var(--info-doux);color:var(--info)}.bandeau.ok{background:var(--ok-doux);color:var(--ok)}
.bandeau .sp{flex:1;min-width:200px}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--filet),var(--filet-fort),var(--filet));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.mi.gr::before{transition:none}}
dl.g{display:grid;grid-template-columns:max-content 1fr;gap:7px 22px;font-size:13.5px}
dl.g dt{font:500 12px var(--mono);color:var(--encre-3)}dl.g dd{margin:0;word-break:break-word}
.lig{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--filet);font-size:13.5px;flex-wrap:wrap}
.lig:first-of-type{border-top:0}
.lig i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.lig i.a{background:var(--alerte)}.lig i.d{background:var(--danger)}.lig i.n{background:var(--encre-3)}
.lig em{font-style:normal;flex:1;min-width:160px}.lig small{font:400 11.5px var(--mono);color:var(--encre-3)}
.bar{height:10px;background:var(--filet);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar i.a{background:var(--alerte)}.bar i.d{background:var(--danger)}
.histo{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.histo div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font:500 10.5px var(--mono);color:var(--encre-3);text-align:center}
.histo div i{display:block;width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--accent);min-height:2px}
.histo div.d i{background:var(--danger)}.histo div.a i{background:var(--alerte)}
.histo b{font:600 12px var(--mono);color:var(--encre)}
.chaine{display:grid;gap:0}
.chaine .n{border:1px solid var(--filet);border-radius:12px;padding:10px 14px;background:var(--verre-fort);margin-left:calc(var(--d)*22px)}
.chaine .n+.n{margin-top:8px}.chaine .n b{font:600 13px var(--mono)}.chaine .n small{display:block;color:var(--encre-3);font-size:12px}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--filet);margin-left:6px}
.tl li{position:relative;padding:0 0 14px 18px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--sol)}
.tl li.d::before{background:var(--danger)}.tl li.a::before{background:var(--alerte)}
.tl small{display:block;font:400 11.5px var(--mono);color:var(--encre-3)}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--filet);padding-bottom:10px}
.onglets button{padding:6px 12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--encre-2)}
.onglets button:hover{color:var(--accent)}
.onglets button[aria-selected=true]{background:var(--verre);color:var(--accent);box-shadow:var(--ombre)}
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kanban .col{background:color-mix(in srgb,var(--encre-2) 5%,transparent);border-radius:14px;padding:10px;min-height:120px}
.kanban .col h4{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-3);margin-bottom:8px;display:flex;justify-content:space-between}
.kanban .fiche{background:var(--verre-fort);border:1px solid var(--filet);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.kanban .fiche b{font:500 12.5px var(--mono);display:block;word-break:break-all}
.kanban .fiche small{display:block;color:var(--encre-3);font-size:11.5px;margin:2px 0 8px}
.kanban .fiche .actions{justify-content:flex-start;flex-wrap:wrap}
.matrice td,.matrice th{text-align:center}.matrice td:first-child,.matrice th:first-child{text-align:left}
.cartes-ca{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* ---------- Fenêtres et notifications ---------- */
#fond{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
#fond.ouvert{display:flex}
.fen{background:var(--verre-fort);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--filet);border-radius:16px;box-shadow:var(--ombre),0 24px 60px rgba(16,24,40,.3);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px}
.fen h2{font:600 16px var(--mono);margin-bottom:4px}.fen .sous{color:var(--encre-2);font-size:13px;margin-bottom:14px}
.fen .pied{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.etapes{list-style:none;padding:0;margin:8px 0}
.etapes li{display:flex;gap:10px;padding:6px 0;font-size:13.5px;align-items:flex-start}
.etapes li::before{content:"○";color:var(--encre-3);font-family:var(--mono)}
.etapes li.ok::before{content:"✓";color:var(--ok)}.etapes li.en::before{content:"…";color:var(--accent)}.etapes li.ko::before{content:"✕";color:var(--danger)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:90;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--verre-fort);border:1px solid var(--filet);border-left:4px solid var(--ok);border-radius:12px;box-shadow:var(--ombre);padding:10px 14px;font-size:13px}
.toast.ko{border-left-color:var(--danger)}.toast.al{border-left-color:var(--alerte)}
/* Outil de maquette : n'existe pas dans la V19 */
#outil{position:fixed;left:12px;bottom:12px;z-index:70;font-size:12px}
#outil summary{cursor:pointer;background:#101828;color:#fff;border-radius:999px;padding:6px 12px;font:500 11.5px var(--mono);list-style:none;width:max-content}
#outil .bte{margin-top:6px;background:var(--verre-fort);border:1px solid var(--filet);border-radius:14px;box-shadow:var(--ombre);padding:12px;display:grid;gap:8px;width:250px}

}

function modal(html){retourFocus=document.activeElement;$('#fen').innerHTML=html;$('#fond').classList.add('ouvert');const f=$('#fen').querySelector('input,select,textarea,button.pri,button');f&&f.focus()}
function fermer(){$('#fond').classList.remove('ouvert');retourFocus&&retourFocus.focus&&retourFocus.focus()}
$('#fond').addEventListener('mousedown',e=>{if(e.target.id==='fond')fermer()});
addEventListener('keydown',e=>{if(e.key==='Escape'){fermer();fermerPops()}});
function toast(t,k=''){const d=document.createElement('div');d.className='toast '+k;d.textContent=t;$('#toasts').append(d);setTimeout(()=>d.remove(),5200)}
function fermerPops(){$$('.pop.ouvert').forEach(p=>p.classList.remove('ouvert'))}

/* ===== Rendu de la coque ===== */
const grp=()=>GROUPES.find(g=>g.id===S.g);
const ent=()=>grp().e.find(e=>e.id===S.e);
const constats=()=>CERTS.filter(c=>['proche','echu'].includes(etatDe(c))).length;
function rendreHaut(){
  const pire=CERTS.some(c=>etatDe(c)==='echu')?'':(constats()?'a':null);
  $('#groupes').innerHTML=GROUPES.map(g=>{const al=g.id==='secu'&&constats()?`<span class="al ${pire==='a'?'a':''}"></span>`:'';return `<button class="mi gr ${g.id===S.g?'on':''}" data-g="${g.id}" data-tip="${g.nom}" aria-label="${g.nom}">${ico(g.ic)}${al}</button>`}).join('');
  $('#avin').textContent=ROLES[S.role].in;
  $('#nbnotif').textContent=constats();
  $('#pop-notifs').innerHTML=`<div class="t">Notifications</div>`+CERTS.filter(c=>['proche','echu'].includes(etatDe(c))).sort((a,b)=>a.j-b.j).slice(0,4).map(c=>`<button class="l" data-cert="${c.id}"><span style="color:${c.j<=7?'var(--danger)':'var(--alerte)'}">●</span>${etatDe(c)==='echu'?'Certificat échu':'Certificat de '+esc(c.h)+' : '+c.j+' j'}<small>${etatDe(c)==='echu'?esc(c.h):'constat'}</small></button>`).join('')+`<hr><button class="l" data-go2="secu|certificats|Vue d’ensemble">Tout voir dans Certificats…</button>`;
}
function rendreGauche(){
  const g=grp();let h=`<h2>${g.nom}</h2>`;
  for(const en of g.e){
    const ouvert=en.id===S.e,sub=en.s||[];
    const nb=en.id==='certificats'&&constats()?`<span class="nb" title="Constats ouverts">${constats()}</span>`:'';
    h+=`<button class="si ent ${ouvert&&!sub.length?'on':''}" data-e="${en.id}">${ico(en.ic)}<span>${en.nom}</span>${nb}${sub.length?`<svg class="car ${ouvert?'ouv':''}" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`:''}</button>`;
    if(ouvert)h+=sub.map(x=>`<button class="si sub ${en.prop?'prop':''} ${x===S.sub?'on':''}" data-s="${esc(x)}"><span class="pt"></span>${x}</button>`).join('');
  }
  if(S.e==='certificats')h+=`<div class="note">Sous-entrées proposées (en italique) : à valider. L’entrée, son groupe et son ordre sont ceux du manifeste.</div>`;
  $('#side').innerHTML=h;
}
function fil(extra=[]){const parts=[`<a data-g="${S.g}">${grp().nom}</a>`,`<a data-e="${S.e}">${ent().nom}</a>`];if(S.sub)parts.push(`<a data-s="${esc(S.sub)}">${S.sub}</a>`);return `<div class="fil">${parts.concat(extra).join(' › ')}</div>`}
function go(g,e,sub,reset=true){if(reset){S.hist.push([S.g,S.e,S.sub,S.sel]);S.fut=[]}S.g=g;S.e=e;S.sub=sub||'';S.sel=null;S.tab='Résumé';S.sels.clear();S.page=1;rendre();$('#scene').scrollTop=0}
function rendre(){rendreHaut();rendreGauche();rendreScene()}
function rendreScene(){
  let h='';
  if(S.e!=='certificats')h=placeholder();
  else if(S.sel)h=detail(CERTS.find(c=>c.id===S.sel));
  else{const m={'Vue d’ensemble':vueEnsemble,'Certificats':vueListe,'Demandes':vueDemandes,'Autorités':vueAutorites,'Modèles':vueModeles,'Clés':vueCles,'Rapports':vueRapports,'Réglages':vueReglages};h=(m[S.sub]||vueEnsemble)()}
  $('#scene').innerHTML=`<div class="in">${h}</div>`;
}
function placeholder(){
  const lien=S.lien?`<div class="bandeau in"><div class="sp">Vous arrivez depuis <b>Certificats › ${esc(S.lien)}</b>. Cet écran appartient à un autre module et n’est pas dessiné ici.</div><button class="btn sm" data-go2="secu|certificats|Certificats">Retour aux certificats</button></div>`:'';
  return `${fil()}<h1>${esc(ent().nom)}${S.sub?' · '+esc(S.sub):''}</h1><p class="sous">Hors périmètre de cette maquette : le contenu de ce module n’est pas dessiné.</p>${lien}<div class="silence"><b>Écran d’un autre module</b>Voir la maquette de ce module ; seuls les liens depuis et vers Certificats sont montrés.</div>`;
}

/* ===== États communs ===== */
function etatCommun(){
  if(S.etat==='chargement')return `<div class="carte">${'<div class="sk" style="margin:12px 0;width:'+'90%'+'"></div><div class="sk" style="margin:12px 0;width:70%"></div><div class="sk" style="margin:12px 0;width:80%"></div>'.repeat(3)}</div><p class="sous" style="margin-top:10px" role="status">Lecture des certificats servis (relève horaire)…</p>`;
  if(S.etat==='erreur')return `<div class="bandeau da"><div class="sp"><b>FastPanel est injoignable.</b> Les certificats du panneau ne peuvent pas être relus ; les valeurs affichées sont celles de la dernière relève (il y a 47 min). Aucun geste sur le panneau n’est possible.</div><button class="btn sm" data-act="reessayer">Réessayer</button><button class="btn sm" data-go2="secu|certificats|Réglages" data-regl="Intégration FastPanel">Voir l’intégration</button></div>`;
  if(S.etat==='vide')return `<div class="silence"><b>Aucun certificat suivi</b>Les hôtes viennent des sites du panneau et de la liste « hôtes supplémentaires ». Rien n’est suivi pour l’instant.<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" data-act="nouvelle" ${can('demander')?'':'disabled '+refus('demander')}>Demander un certificat</button><button class="btn" data-go2="secu|certificats|Réglages">Ajouter des hôtes à suivre</button></div></div>`;
  return '';
}
const bloque=()=>S.etat==='chargement'||S.etat==='vide';
function refusEcran(d,txt){return `${fil()}<h1>${S.sub}</h1><div class="silence"><b>Permission refusée</b>${txt}<br><span class="mono" style="font-size:12px">droit requis : certificats.${d}</span><div style="margin-top:12px"><button class="btn" data-act="demanderacces" data-d="${d}">Demander l’accès à un administrateur</button></div></div>`}

/* ===== Vue d’ensemble ===== */
function vueEnsemble(){
  const act=CERTS.filter(c=>!['archive','revoque'].includes(c.force));
  const n=e=>act.filter(c=>etatDe(c)===e).length;
  const conf=act.length?Math.round(100*(n('valide'))/act.length):0;
  const tr=[['Échus',c=>c.j!=null&&c.j<=0,'d'],['0–7 j',c=>c.j>0&&c.j<=7,'d'],['8–21 j',c=>c.j>7&&c.j<=21,'a'],['22–30 j',c=>c.j>21&&c.j<=30,''],['31–60 j',c=>c.j>30&&c.j<=60,''],['61–90 j',c=>c.j>60&&c.j<=90,''],['> 90 j',c=>c.j>90,'']];
  const hist=tr.map(([l,f,k])=>({l,k,n:act.filter(f).length}));const mx=Math.max(1,...hist.map(x=>x.n));
  const doms=[...new Set(act.filter(c=>c.src==='fastpanel').map(c=>regDom(c.h)))];
  const crit=[['Aucun certificat échu',n('echu')===0],['Tous lisibles par la sonde',n('inconnu')===0],['Aucun sous le seuil sans renouvellement auto',act.filter(c=>etatDe(c)==='proche'&&!c.auto).length===0],['Algorithme ≥ RSA 2048 / ECDSA P-256',act.every(c=>c.algo==='—'||!/1024/.test(c.algo))],['Chaîne complète servie',true],['Autorité autorisée par la politique',true]];
  const aTraiter=act.filter(c=>['echu','proche','inconnu'].includes(etatDe(c))).sort((a,b)=>(a.j??-999)-(b.j??-999));
  return `${fil()}<h1>Certificats · Vue d’ensemble</h1><p class="sous">Ce que voient les visiteurs, ce qui expire, et combien d’émissions il reste. Le certificat servi sur le port 443 fait foi.</p>
  ${etatCommun()||`<div class="tuiles">
   <button class="tuile" data-go2="secu|certificats|Certificats"><span>Suivis</span><b>${act.length}</b><small>hors archivés et révoqués</small></button>
   <button class="tuile ok" data-filtre="valide"><span>Valides</span><b>${n('valide')}</b><small>au-delà de ${S.seuil} jours</small></button>
   <button class="tuile al" data-filtre="proche"><span>À renouveler</span><b>${n('proche')}</b><small>sous le seuil de ${S.seuil} j</small></button>
   <button class="tuile da" data-filtre="echu"><span>Échus</span><b>${n('echu')}</b><small>action immédiate</small></button>
   <button class="tuile" data-filtre="inconnu"><span>Inconnus</span><b>${n('inconnu')}</b><small>sonde sans réponse</small></button></div>
  <div class="grille2">
   <div class="carte"><h3>Échéancier</h3><div class="histo">${hist.map(x=>`<div class="${x.k}"><b>${x.n}</b><i style="height:${Math.round(x.n/mx*80)+2}px"></i>${x.l}</div>`).join('')}</div></div>
   <div class="carte"><h3>Conformité · ${conf} %</h3><div class="bar" style="margin-bottom:10px"><i class="${conf<60?'d':conf<85?'a':''}" style="width:${conf}%"></i></div>${crit.map(([l,ok])=>`<div class="lig"><i class="${ok?'':'d'}"></i><em>${l}</em><small>${ok?'conforme':'non conforme'}</small></div>`).join('')}</div>
  </div>
  <div class="grille2">
   <div class="carte"><h3>À traiter (${aTraiter.length})</h3>${aTraiter.length?aTraiter.map(c=>`<div class="lig"><i class="${etatDe(c)==='echu'||c.j<=7?'d':etatDe(c)==='inconnu'?'n':'a'}"></i><em><a data-cert="${c.id}" class="mono" style="cursor:pointer">${esc(c.h)}</a><br><small>${etatDe(c)==='inconnu'?esc(c.err||'non lisible'):(c.j<=0?'échu depuis '+(-c.j)+' j':c.j+' j restants')} · ${SRC[c.src]}${c.auto?' · renouvellement auto':''}</small></em>${c.src==='fastpanel'?`<button class="btn sm" data-ren="${c.id}" ${can('renouveler')?'':'disabled '+refus('renouveler')}>Renouveler</button>`:`<button class="btn sm" data-cert="${c.id}">Ouvrir</button>`}</div>`).join(''):'<div class="silence"><b>Rien à traiter</b>Tous les certificats sont au-dessus du seuil.</div>'}</div>
   <div class="carte"><h3>Quota Let’s Encrypt (7 jours glissants)</h3>${doms.map(d=>{const q=quotaDe(d);return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span class="mono">${d}</span><span>${q.u} / 5 ${q.bloque?'<span class="p da">bloqué</span>':''}</span></div><div class="bar"><i class="${q.bloque?'d':q.u>=3?'a':''}" style="width:${q.u*20}%"></i></div>${q.bloque?`<small style="color:var(--danger)">Libre le ${q.libre}. Ce n’est pas contournable ; le certificat en place reste valide.</small>`:''}</div>`}).join('')}
    <h3 style="margin-top:16px">Synchronisation FastPanel</h3>
    <div class="lig"><i></i><em>Dernière relève</em><small>il y a 4 min</small></div><div class="lig"><i></i><em>Certificats du panneau</em><small>9</small></div><div class="lig"><i class="a"></i><em>Écarts à examiner</em><small>2</small></div>
    <button class="btn sm" style="margin-top:8px" data-go2="secu|certificats|Réglages" data-regl="Intégration FastPanel">Détail de l’intégration</button></div>
  </div>`}`;
}

/* ===== Liste des certificats ===== */
function filtrer(){
  const f=S.f;let l=CERTS.filter(c=>S.archives?['archive','revoque'].includes(c.force):!['archive'].includes(c.force));
  if(f.q)l=l.filter(c=>(c.h+' '+c.san.join(' ')+' '+c.aut).toLowerCase().includes(f.q.toLowerCase()));
  if(f.etat)l=l.filter(c=>etatDe(c)===f.etat);if(f.source)l=l.filter(c=>c.src===f.source);if(f.aut)l=l.filter(c=>c.aut===f.aut);if(f.auto)l=l.filter(c=>String(c.auto)===f.auto);
  const k=S.tri.k,d=S.tri.d;
  return l.sort((a,b)=>{const va=k==='h'?a.h:k==='src'?a.src:k==='aut'?a.aut:(a.j==null?-9999:a.j),vb=k==='h'?b.h:k==='src'?b.src:k==='aut'?b.aut:(b.j==null?-9999:b.j);return (va>vb?1:va<vb?-1:0)*d});
}
const PAR=10;
function vueListe(){
  const bc=etatCommun();
  const tout=filtrer(),pages=Math.max(1,Math.ceil(tout.length/PAR));S.page=Math.min(S.page,pages);const l=tout.slice((S.page-1)*PAR,S.page*PAR);
  const auts=[...new Set(CERTS.map(c=>c.aut))];
  const th=(k,t)=>`<th class="tri" data-tri="${k}" aria-sort="${S.tri.k===k?(S.tri.d>0?'ascending':'descending'):'none'}">${t}${S.tri.k===k?(S.tri.d>0?' ▲':' ▼'):''}</th>`;
  const lot=S.sels.size?`<div class="lot"><span>${S.sels.size} sélectionné(s)</span><button class="btn sm" data-lot="relire">Relire maintenant</button><button class="btn sm" data-lot="renouveler" ${can('renouveler')?'':'disabled '+refus('renouveler')}>Renouveler</button><button class="btn sm" data-lot="exporter">Exporter la sélection</button><button class="btn sm" data-lot="archiver" ${can('administrer')?'':'disabled '+refus('administrer')}>Archiver</button><button class="btn sm" data-lot="vider">Désélectionner</button></div>`:'';
  return `${fil()}<h1>Certificats</h1><p class="sous">Tous les certificats suivis, quelle que soit leur origine. Ce qu’on peut faire dépend de la source : un certificat « sondé seulement » ne se renouvelle pas d’ici.</p>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><button class="btn pri" data-act="nouvelle" ${can('demander')?'':'disabled '+refus('demander')}>${ico('plus')}Demander un certificat</button><button class="btn" data-act="importer" ${can('importer')?'':'disabled '+refus('importer')}>${ico('ul')}Importer</button><button class="btn" data-act="exporter">${ico('dl')}Exporter (CSV)</button><button class="btn" data-act="relireTout">${ico('refresh')}Tout relire</button></div>
  ${S.etat==='erreur'?bc:''}
  ${bloque()?bc:`
  <div class="carte"><div class="barre-q"><input type="search" id="q" placeholder="Rechercher un hôte, un SAN, une autorité" value="${esc(S.f.q)}" aria-label="Rechercher" style="flex:1;min-width:200px">
   <select data-f="etat" aria-label="État"><option value="">Tous les états</option>${Object.entries(PILL).filter(([k])=>k!=='archive').map(([k,v])=>`<option value="${k}" ${S.f.etat===k?'selected':''}>${v[0]}</option>`).join('')}</select>
   <select data-f="source" aria-label="Source"><option value="">Toutes les sources</option>${Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${S.f.source===k?'selected':''}>${v}</option>`).join('')}</select>
   <select data-f="aut" aria-label="Autorité"><option value="">Toutes les autorités</option>${auts.map(a=>`<option ${S.f.aut===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
   <select data-f="auto" aria-label="Renouvellement automatique"><option value="">Renouvellement : tous</option><option value="true" ${S.f.auto==='true'?'selected':''}>Automatique</option><option value="false" ${S.f.auto==='false'?'selected':''}>Manuel</option></select>
   <label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="arch" ${S.archives?'checked':''}> Archivés et révoqués</label>
   ${S.f.q||S.f.etat||S.f.source||S.f.aut||S.f.auto?'<button class="btn sm" data-act="raz">Effacer les filtres</button>':''}</div>
  ${lot}
  ${l.length?`<div style="overflow-x:auto"><table class="cartes"><thead><tr><th style="width:30px"><input type="checkbox" id="all" aria-label="Tout sélectionner" ${l.every(c=>S.sels.has(c.id))?'checked':''}></th>${th('h','Hôte')}<th>État</th>${th('jours','Jours')}<th>Échéance</th>${th('src','Source')}${th('aut','Autorité')}<th>Auto</th><th></th></tr></thead><tbody>
   ${l.map(c=>`<tr class="${S.sels.has(c.id)?'sel':''}"><td data-l="Sélection"><input type="checkbox" data-sel="${c.id}" aria-label="Sélectionner ${esc(c.h)}" ${S.sels.has(c.id)?'checked':''}></td><td class="h" data-l="Hôte"><a data-cert="${c.id}" tabindex="0">${esc(c.h)}</a>${c.san.length>1?`<br><small style="color:var(--encre-3);font-family:var(--sans)">+${c.san.length-1} nom(s)</small>`:''}</td><td data-l="État">${pillE(c)}</td><td class="num" data-l="Jours">${c.j==null?'—':c.j}</td><td class="cm" data-l="Échéance">${c.j==null?'—':fr(jourDans(c.j))}</td><td class="cm" data-l="Source">${SRC[c.src]}</td><td class="cm" data-l="Autorité">${esc(c.aut)}</td><td class="cm" data-l="Auto">${c.auto?'<span class="p ok">auto</span>':'<span class="p">manuel</span>'}</td><td class="act"><div class="actions"><button class="btn sm" data-relire="${c.id}">Relire</button><button class="btn sm" data-ren="${c.id}" ${can('renouveler')&&c.src==='fastpanel'&&!c.force?'':'disabled'} title="${c.src!=='fastpanel'?'Se renouvelle hors de Cassandra ('+SRC[c.src]+')':can('renouveler')?'':'Droit requis : certificats.renouveler'}">Renouveler</button><button class="btn sm" data-plus="1" aria-label="Déplier" style="display:none">⋯</button></div></td></tr>`).join('')}
   </tbody></table></div>
  <div class="pied-tab"><span>${tout.length} certificat(s) · ${(S.page-1)*PAR+1}–${Math.min(tout.length,S.page*PAR)}</span><div class="pag"><button data-p="${S.page-1}" ${S.page<=1?'disabled':''} aria-label="Page précédente">‹</button>${Array.from({length:pages},(_,i)=>`<button data-p="${i+1}" class="${i+1===S.page?'on':''}">${i+1}</button>`).join('')}<button data-p="${S.page+1}" ${S.page>=pages?'disabled':''} aria-label="Page suivante">›</button></div></div>`
  :`<div class="silence"><b>Aucun résultat</b>Aucun certificat ne correspond à ces filtres.<div style="margin-top:10px"><button class="btn" data-act="raz">Effacer les filtres</button></div></div>`}</div>`}`;
}

/* ===== Détail ===== */
const ONGLETS=['Résumé','Chaîne','Historique','Liens','Clé','Audit'];
function detail(c){
  const e=etatDe(c),mod=!c.force&&c.src!=='sonde';
  const tab={Résumé:()=>`<div class="carte"><dl class="g"><dt>Hôte</dt><dd class="mono">${esc(c.h)}</dd><dt>Noms (SAN)</dt><dd class="mono">${c.san.map(esc).join('<br>')}</dd><dt>État</dt><dd>${pillE(c)} ${e==='inconnu'?'<br><small style="color:var(--danger)">'+esc(c.err)+'. « Inconnu » n’est pas « sans certificat » : on n’a simplement pas pu le lire.</small>':''}</dd><dt>Jours restants</dt><dd>${c.j==null?'—':c.j<=0?'échu depuis '+(-c.j)+' j':c.j}</dd><dt>Échéance</dt><dd>${c.j==null?'—':fr(jourDans(c.j))}</dd><dt>Émis le</dt><dd>${c.j==null?'—':fr(jourDans(c.j-c.dur))} (durée ${c.dur} j)</dd><dt>Autorité</dt><dd>${esc(c.aut)}</dd><dt>Source</dt><dd>${SRC[c.src]}<br><small style="color:var(--encre-3)">${SRCNOTE[c.src]}</small></dd><dt>Algorithme</dt><dd>${c.algo}</dd><dt>Empreinte SHA-256</dt><dd class="mono">${c.emp}</dd><dt>Renouvellement</dt><dd>${c.auto?'automatique (règle Proactivité « Renouveler un certificat », palier proposer)':'manuel'}</dd><dt>Quota ${regDom(c.h)}</dt><dd>${quotaDe(regDom(c.h)).u} / 5 cette semaine</dd></dl></div>`,
   Chaîne:()=>c.j==null?`<div class="silence"><b>Chaîne illisible</b>La sonde n’a pas pu lire le certificat servi.</div>`:`<div class="carte"><div class="chaine"><div class="n" style="--d:0"><b>${esc(c.h)}</b><small>feuille · ${c.algo} · échéance ${fr(jourDans(c.j))}</small></div><div class="n" style="--d:1"><b>${c.src==='interne'?'Intermédiaire interne':'Let’s Encrypt R11'}</b><small>intermédiaire · ${c.src==='importe'?'complète':'complète'}</small></div><div class="n" style="--d:2"><b>${c.src==='interne'?'Racine interne Cassandra':'ISRG Root X1'}</b><small>racine · ${c.src==='interne'?'à distribuer aux clients internes':'dans les magasins de confiance'}</small></div></div></div>`,
   Historique:()=>`<div class="carte"><ul class="tl">${c.hist.map(h=>`<li class="${/échec|révoqu/i.test(h.t)?'d':''}">${esc(h.t)}<small>${esc(h.d)} · ${esc(h.a)}</small></li>`).join('')}</ul></div>`,

/* ===== Gestes ===== */
function relire(id){
  const c=CERTS.find(x=>x.id===id);
  if(c.j==null){toast('Relecture de '+c.h+' : toujours injoignable ('+c.err+').','ko');log('relire_expiration',c.h,'echec',c.err);return}
  log('relire_expiration',c.h,'ok','lecture à la demande');toast('Certificat servi par '+c.h+' relu : '+(c.j<=0?'échu':c.j+' jour(s) restant(s)')+'.');
}
function renouveler(ids){
  const sel=ids.map(i=>CERTS.find(c=>c.id===i)),ok=sel.filter(c=>c.src==='fastpanel'&&!c.force),ign=sel.filter(c=>!ok.includes(c));
  if(!can('renouveler')){toast('Permission refusée : droit certificats.renouveler.','ko');log('ssl_renouveler',sel[0].h,'refus','droit absent');rendre();return}
  if(S.etat==='erreur'){modal(`<h2 id="fen-t">Renouvellement impossible</h2><p class="sous">FastPanel est injoignable : la demande ne peut pas être envoyée. Le certificat en place reste valide jusqu’à son échéance.</p><div class="pied"><button class="btn pri" data-fermer>Fermer</button></div>`);return}
  const need={};ok.forEach(c=>{const d=regDom(c.h);need[d]=(need[d]||0)+1});
  const qs=Object.entries(need).map(([d,n])=>({...quotaDe(d),n}));const bl=qs.filter(q=>q.bloque||q.n>q.r);
  modal(`<h2 id="fen-t">Renouveler ${ok.length} certificat(s)</h2><p class="sous">Le panneau demande un nouveau certificat à Let’s Encrypt. Le geste n’est réussi que si la date d’émission change.</p>
  ${ok.map(c=>`<div class="lig"><i></i><em class="mono" style="font-size:13px">${esc(c.h)}</em><small>${c.j<=0?'échu':c.j+' j'}</small></div>`).join('')}
  ${ign.length?`<div class="bandeau al" style="margin-top:10px"><div class="sp">${ign.length} ignoré(s) : ${ign.map(c=>esc(c.h)+' ('+(c.force?etatDe(c):SRC[c.src])+')').join(', ')} — non renouvelable(s) d’ici.</div></div>`:''}

});
let minuterie;
document.addEventListener('input',e=>{if(e.target.id==='q'){S.f.q=e.target.value;S.page=1;clearTimeout(minuterie);minuterie=setTimeout(()=>{rendreScene();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)},180)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.cert){e.target.click()}});
$('#burger').onclick=()=>$('#side').classList.toggle('ferme');
$('#rafr').onclick=()=>{rendreScene();toast('Scène actualisée.')};
$('#prec').onclick=()=>{const h=S.hist.pop();if(!h)return;S.fut.push([S.g,S.e,S.sub,S.sel]);[S.g,S.e,S.sub,S.sel]=h;rendre()};
$('#suiv').onclick=()=>{const h=S.fut.pop();if(!h)return;S.hist.push([S.g,S.e,S.sub,S.sel]);[S.g,S.e,S.sub,S.sel]=h;rendre()};
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
$('#o-role').onchange=e=>{S.role=e.target.value;S.sels.clear();rendre()};
$('#o-etat').onchange=e=>{S.etat=e.target.value;S.sel=S.etat==='vide'?null:S.sel;rendre()};
const etroit=matchMedia('(max-width:900px)');
const caler=()=>$('#side').classList.toggle('ferme',etroit.matches);
etroit.addEventListener('change',caler);caler();
rendre();
</script>
</body>
