<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassandra — Agents IA (maquette)</title>
<style>
:root{
--sol:#eef1f5;--halo:#e9edf3;--verre:rgba(255,255,255,.66);--verre-fort:rgba(255,255,255,.88);
--encre:#101828;--encre-2:#475467;--encre-3:#7a8595;--filet:rgba(16,24,40,.10);
--accent:#0b7c74;--accent-doux:rgba(11,124,116,.10);--accent-encre:#fff;
--idee:#6d3fd1;--idee-doux:rgba(109,63,209,.10);
--ok:#047857;--ok-doux:rgba(4,120,87,.10);--alerte:#b45309;--alerte-doux:rgba(180,83,9,.11);--danger:#be123c;--danger-doux:rgba(190,18,60,.09);
--ombre:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"Inter","Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
--sol:#0d1117;--halo:#111a24;--verre:rgba(26,33,44,.66);--verre-fort:rgba(30,38,50,.92);
--encre:#e6ebf2;--encre-2:#aab4c3;--encre-3:#7d8999;--filet:rgba(230,235,242,.11);
--accent:#34b3a8;--accent-doux:rgba(52,179,168,.15);--accent-encre:#06201d;
--idee:#b49cff;--idee-doux:rgba(180,156,255,.14);
--ok:#3ecf9a;--ok-doux:rgba(62,207,154,.12);--alerte:#e7a14c;--alerte-doux:rgba(231,161,76,.13);--danger:#ff6b8b;--danger-doux:rgba(255,107,139,.12);
--ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
:root[data-theme="ardoise"]{
--sol:#1c2128;--halo:#222a33;--verre:rgba(45,51,59,.72);--verre-fort:rgba(52,59,68,.94);
--encre:#e2e8ef;--encre-2:#b3bdc9;--encre-3:#8793a1;--filet:rgba(226,232,239,.12);
--accent:#6cb6ff;--accent-doux:rgba(108,182,255,.15);--accent-encre:#0a1a2b;
--idee:#c3a8ff;--idee-doux:rgba(195,168,255,.15);
--ok:#57d6a3;--ok-doux:rgba(87,214,163,.12);--alerte:#eab25a;--alerte-doux:rgba(234,178,90,.14);--danger:#ff7d99;--danger-doux:rgba(255,125,153,.13);
--ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 520px at 50% -25%,var(--halo),var(--sol));background-color:var(--sol);color:var(--encre);font:14px/1.5 var(--sans);min-height:100vh;padding:16px 16px 70px;overflow-x:hidden}
.page{min-width:0;width:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.verre{background:var(--verre);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--filet);border-radius:16px;box-shadow:var(--ombre)}
.mono{font-family:var(--mono)}
.lib{font:650 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--encre-3)}
h1,h2,h3,p{margin:0}
h1{font:650 20px/1.2 var(--sans)}
h2{font:650 13px/1.2 var(--sans);letter-spacing:.01em}
h3{font:650 12.5px/1.3 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--filet);background:var(--verre-fort);border-radius:10px;padding:7px 12px;font:600 12px var(--sans);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.prim{background:var(--accent);color:var(--accent-encre);border-color:transparent}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.pt{padding:4px 9px;font-size:11.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.puce{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font:600 10.8px var(--sans);background:var(--accent-doux);color:var(--accent);white-space:nowrap}
.puce.ok{background:var(--ok-doux);color:var(--ok)}.puce.al{background:var(--alerte-doux);color:var(--alerte)}.puce.dg{background:var(--danger-doux);color:var(--danger)}.puce.mu{background:var(--filet);color:var(--encre-3)}
.idee{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:1px 7px;font:700 9.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;background:var(--idee-doux);color:var(--idee);border:1px solid color-mix(in srgb,var(--idee) 35%,transparent);white-space:nowrap;vertical-align:middle}
body.sans-idees .idee-bloc{display:none!important}
.idee-bloc{border:1.5px dashed color-mix(in srgb,var(--idee) 55%,transparent)!important}
.note{font-size:11.8px;color:var(--encre-3)}
.muet{color:var(--encre-2)}
/* barre haute */
.haut{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px}
.haut .g{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-encre);display:grid;place-items:center;font:700 15px var(--sans)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:var(--filet)}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font:600 11.5px var(--sans);color:var(--encre-2)}
.seg button.on{background:var(--verre-fort);color:var(--encre);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{display:flex;gap:4px;padding:5px;overflow-x:auto;scrollbar-width:thin}
.nav button{border:0;background:transparent;border-radius:10px;padding:8px 13px;font:600 12.5px var(--sans);color:var(--encre-2);white-space:nowrap;display:flex;gap:7px;align-items:center}
.nav button.on{background:var(--accent-doux);color:var(--accent)}
.nav .n{background:var(--danger);color:#fff;border-radius:99px;font:700 10px var(--sans);padding:1px 6px}
/* bandeau d'état */
.etat{display:flex;gap:14px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.etat .rond{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ok-doux);color:var(--ok);font-size:20px;flex:none}
.etat.gel .rond{background:var(--alerte-doux);color:var(--alerte)}
.etat .t{flex:1;min-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.kpi .v{font:650 20px/1.1 var(--sans)}
.barre{height:6px;border-radius:99px;background:var(--filet);overflow:hidden}.barre i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.barre.al i{background:var(--alerte)}.barre.dg i{background:var(--danger)}
/* grilles */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.deux{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.deux.essai-g{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media(max-width:900px){.deux,.deux.essai-g{grid-template-columns:1fr}}
.carte{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.carte.clic{cursor:pointer;transition:transform .15s,border-color .15s;text-align:left}
.carte.clic:hover{transform:translateY(-2px);border-color:var(--accent)}
.tete{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 18px var(--sans);color:#fff;flex:none;position:relative}
.avatar .pt{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2px solid var(--sol);background:var(--ok)}
.avatar .pt.tour{background:var(--accent);animation:batt 1.2s infinite}.avatar .pt.pause{background:var(--alerte)}
@keyframes batt{50%{transform:scale(1.35);opacity:.6}}
.l2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--filet);font-size:12.5px}
.l2:first-child{border-top:0}
.l2 .g{color:var(--encre-3);font-size:11.8px}
.pal{display:flex;gap:6px;flex-wrap:wrap}
/* fiche */
.fiche-tete{padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.onglets{display:flex;gap:2px;overflow-x:auto;padding:4px;scrollbar-width:thin}
.onglets button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font:600 12px var(--sans);color:var(--encre-2);white-space:nowrap}
.onglets button.on{background:var(--accent-doux);color:var(--accent)}
.corps{display:flex;flex-direction:column;gap:14px}
/* cadran d'autonomie */
.cadran{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.cadran{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--filet);border-radius:12px;padding:11px;background:transparent;text-align:left;display:flex;flex-direction:column;gap:4px}
.opt.on{border-color:var(--accent);background:var(--accent-doux)}
.opt b{font-size:13px}.opt span{font-size:11.8px;color:var(--encre-2)}
/* outils */
.filtres{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select,textarea{border:1px solid var(--filet);background:var(--verre-fort);color:var(--encre);border-radius:9px;padding:7px 10px;font:13px var(--sans);min-width:0}
textarea{width:100%;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.outil{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 4px;border-top:1px solid var(--filet)}
.outil:first-child{border-top:0}
.outil .n{font:600 12.5px var(--mono);word-break:break-all}
.outil .d{font-size:12px;color:var(--encre-2);margin-top:2px}
.outil .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.sel3{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--filet)}
.sel3 button{border:0;background:transparent;border-radius:7px;padding:4px 9px;font:600 11px var(--sans);color:var(--encre-2)}
.sel3 button.on.auto{background:var(--ok);color:#fff}.sel3 button.on.raconter{background:var(--alerte);color:#fff}.sel3 button.on.demander{background:var(--idee);color:#fff}.sel3 button.on.retire{background:var(--encre-3);color:#fff}
.sel3 button[disabled]{opacity:.3;cursor:default}
@media(max-width:620px){.outil{grid-template-columns:1fr}}
/* journal */
.ev{display:grid;grid-template-columns:54px 1fr auto;gap:10px;padding:10px 4px;border-top:1px solid var(--filet);align-items:start;cursor:pointer}
.ev:first-child{border-top:0}
.ev:hover{background:var(--accent-doux);border-radius:10px}
.ev .h{font:600 11px var(--mono);color:var(--encre-3);padding-top:2px}
.ev .t{font-size:13px;font-weight:600}
.ev .s{font-size:12px;color:var(--encre-2);margin-top:2px}
.ev.defait .t{text-decoration:line-through;color:var(--encre-3)}
.detail{grid-column:1/-1;margin:4px 0 2px 64px;padding:12px;border-radius:12px;background:var(--verre-fort);border:1px solid var(--filet);cursor:default;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
@media(max-width:620px){.detail{margin-left:0}.ev{grid-template-columns:44px 1fr}.ev>.dr{grid-column:2}}
.chaine{display:flex;flex-direction:column;gap:0}
.chaine .e{display:grid;grid-template-columns:22px 1fr;gap:9px;padding:4px 0;position:relative}
.chaine .e:not(:last-child)::after{content:"";position:absolute;left:10px;top:26px;bottom:-4px;width:2px;background:var(--filet)}
.chaine .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--sans);background:var(--accent-doux);color:var(--accent)}
.chaine .k.ok{background:var(--ok-doux);color:var(--ok)}.chaine .k.al{background:var(--alerte-doux);color:var(--alerte)}.chaine .k.dg{background:var(--danger-doux);color:var(--danger)}.chaine .k.id{background:var(--idee-doux);color:var(--idee)}
/* essai */
.chat{display:flex;flex-direction:column;gap:10px;height:min(560px,70vh);overflow-y:auto;padding:14px;scroll-behavior:smooth}
.bulle{max-width:88%;padding:9px 13px;border-radius:14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.bulle.u{align-self:flex-end;background:var(--accent);color:var(--accent-encre);border-bottom-right-radius:4px}
.bulle.a{align-self:flex-start;background:var(--verre-fort);border:1px solid var(--filet);border-bottom-left-radius:4px}
.etapes{align-self:stretch;display:flex;flex-direction:column;gap:5px}
.etape{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:10px;background:var(--verre-fort);border:1px solid var(--filet);font-size:12px;animation:ap .25s}
@keyframes ap{from{opacity:0;transform:translateY(5px)}}
.etape .i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--sans);background:var(--accent-doux);color:var(--accent)}
.etape.ok .i{background:var(--ok-doux);color:var(--ok)}.etape.al .i{background:var(--alerte-doux);color:var(--alerte)}.etape.dg .i{background:var(--danger-doux);color:var(--danger)}
.etape code{font:600 11.5px var(--mono)}
.saisie{display:flex;gap:8px;padding:10px;border-top:1px solid var(--filet)}
.saisie input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--filet);background:var(--verre-fort);border-radius:99px;padding:5px 11px;font:600 11.5px var(--sans);text-align:left}
.chip:hover{border-color:var(--accent)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;user-select:none}
.sw input{display:none}.sw i{width:34px;height:20px;border-radius:99px;background:var(--filet);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{left:16px}
/* coût */
svg text{font-family:var(--sans);fill:var(--encre-3);font-size:10px}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--encre-2)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--filet);vertical-align:top}
th{font:650 10.5px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3)}
.zone-x{overflow-x:auto}
/* tiroir + toast */
.tiroir{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:20}
.tiroir.on{display:flex}.tiroir>.verre{background:var(--verre-fort);max-width:760px;width:100%;padding:18px;display:flex;flex-direction:column;gap:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--encre);color:var(--sol);padding:9px 14px;border-radius:12px;font:600 12px var(--sans);opacity:0;pointer-events:none;transition:all .25s;max-width:92vw;z-index:40;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--sol);text-decoration:underline;font-weight:700;padding:0}
.champ{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:center;font-size:12.5px}
@media(max-width:620px){.champ{grid-template-columns:1fr}}
.mem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--filet);font-size:12.5px}
.mem:first-child{border-top:0}.mem.epingle{background:var(--accent-doux);border-radius:8px;padding-left:8px}
.matrice{display:grid;grid-template-columns:minmax(120px,1.4fr) repeat(5,1fr);font-size:12px;border:1px solid var(--filet);border-radius:12px;overflow:hidden}
.matrice>div{padding:8px 9px;border-top:1px solid var(--filet);text-align:center}
.matrice>div:nth-child(6n+1){text-align:left}.matrice>div:nth-child(-n+6){border-top:0;background:var(--filet);font:650 10.5px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--encre-3)}
@media(max-width:600px){.matrice{font-size:10.2px;grid-template-columns:minmax(80px,1.5fr) repeat(5,minmax(0,1fr))}.matrice>div{padding:6px 3px;overflow-wrap:anywhere}}
.rapport{font-size:13.5px;line-height:1.65}
.rapport b{color:var(--accent)}
.coupe{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.coupe{grid-template-columns:1fr}}
.colm{padding:12px;border:1px solid var(--filet);border-radius:12px;background:var(--verre-fort);display:flex;flex-direction:column;gap:7px;font-size:12.5px}
/* menu de gauche, comme la barre latérale de la V19 */
.coque{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;max-width:1560px;margin:0 auto;align-items:start}
.menu{position:sticky;top:16px;padding:12px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 32px);overflow:auto}
.menu .gr{font:650 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--encre-3);padding:12px 10px 4px}
.menu a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;color:var(--encre-2);text-decoration:none;font:600 12.8px var(--sans);cursor:pointer}
.menu a:hover{background:var(--accent-doux)}.menu a.on{background:var(--accent-doux);color:var(--accent)}
.menu a .n{margin-left:auto;background:var(--danger);color:#fff;border-radius:99px;font:700 10px var(--sans);padding:1px 6px}
.menu .ic{width:16px;text-align:center;opacity:.8}
.menu .marque{display:flex;gap:10px;align-items:center;padding:4px 6px 8px}
.burger{display:none}
@media(max-width:900px){.coque{grid-template-columns:1fr}.menu{display:none;position:fixed;inset:0 auto 0 0;width:min(280px,86vw);max-height:none;z-index:30;border-radius:0 16px 16px 0;background:var(--verre-fort)}.menu.ouvert{display:flex}.burger{display:inline-flex}}
.voile{display:none;position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:29}.voile.on{display:block}
.barre-app{display:flex;gap:6px;align-items:center;padding:8px 12px;background:linear-gradient(90deg,#0f8b80,#0b7c74);border-radius:16px;max-width:1560px;margin:0 auto 14px;overflow-x:auto}
.barre-app .bi{width:34px;height:34px;display:grid;place-items:center;color:#fff;border-radius:10px;font-size:16px;flex:none}.barre-app .bi.home{background:rgba(255,255,255,.18)}.barre-app .bi.dim{opacity:.45}
.barre-app .sep{width:10px;flex:none}.barre-app .bg{width:44px;height:36px;display:grid;place-items:center;color:#fff;border-radius:10px;background:rgba(255,255,255,.14);flex:none}.barre-app .bg.on{background:rgba(255,255,255,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.menu{gap:12px}.menu .grp{display:flex;gap:10px;align-items:center;padding:12px}
.menu .gi{width:36px;height:36px;border-radius:11px;background:var(--accent-doux);color:var(--accent);display:grid;place-items:center;position:relative;font-size:16px}
.menu .pastille{position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--sol)}
.menu .liste{padding:10px;display:flex;flex-direction:column;gap:2px}

function vMaison(){
  $('#vue').innerHTML=`<section class="verre carte"><h2>Les règles communes</h2><p class="muet" style="font-size:12.5px">Valent pour tous les agents. Ce ne sont pas des interdits de plus : ce sont les garanties qui permettent de les laisser agir.</p>
   ${REGLES.map((r,i)=>`<div class="l2"><div><b>${i+1}. ${r[0]}</b><div class="g">${r[1]}</div></div></div>`).join('')}</section>
  <section class="verre carte" id="gl-card"><h2>Le plafond global de coût</h2><p class="muet" style="font-size:12.5px">En plus du plafond de chaque agent : une limite pour tout ce que les agents dépensent en une journée. Le plus bas des deux s\'applique.</p>
   <div class="champ"><label for="gl-p">Plafond global (€ / jour)</label><div><input type="range" id="gl-p" min="1" max="20" step=".5" value="${GLOBAL.plafond}"><div class="note" id="gl-pv">${eur(GLOBAL.plafond)} par jour</div></div></div>
   <div class="champ"><label for="gl-a">Quand il est atteint</label><select id="gl-a">${ACTIONS_PLAFOND.map((x,i)=>`<option value="${i}" ${GLOBAL.action===i?'selected':''}>${x}</option>`).join('')}</select></div>
   <div id="gl-bar"></div></section>
  <section class="verre carte"><h2>Le palier par défaut</h2><p class="muet" style="font-size:12.5px">Le point de départ de tout nouvel agent. Chaque agent peut ensuite être réglé outil par outil.</p>
   <div class="cadran" id="cad-m">${['observer','entretien','reine'].map(k=>`<button class="opt ${k==='entretien'?'on':''}" data-n="${k}"><b>${NIVEAUX[k][0]}</b><span>${NIVEAUX[k][1]}</span></button>`).join('')}</div>
   <div class="note">Défaut prudent, capacité complète : rien n'est interdit, tout est réglable.</div></section>
  <section class="verre carte idee-bloc"><h2>${idee('Le dehors passe par un seul agent')}</h2><p class="muet" style="font-size:12.5px">Seul Amizo lit le web, et il n\'a aucun outil qui sort. Cassandra et Itare, qui agissent, ne lisent jamais le dehors eux-mêmes : ils le lui demandent et reçoivent un résumé étiqueté « externe ». Une page piégée n\'atteint donc jamais un agent capable d\'agir.</p></section>
  <section class="verre carte idee-bloc"><h2>${idee('Le journal à l\'envers : le mode « mauvais jour »')}</h2><p class="muet" style="font-size:12.5px">Un seul bouton quand quelque chose te semble bizarre : les agents passent tous en « raconter » pendant une durée choisie, et le journal te dit exactement ce qui a changé depuis ce moment.</p>
   <div class="pal"><button class="btn" data-mj="1">1 heure</button><button class="btn" data-mj="24">24 heures</button><button class="btn" data-mj="0">Jusqu'à ce que je lève</button></div></section>`;
  const glDess=()=>{const tot=totalJour(),p=GLOBAL.plafond,somme=AGENTS.reduce((x,a)=>x+a.budget,0);
    $('#gl-bar').innerHTML=`<div style="display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--filet)">${AGENTS.filter(a=>jourCout(a.id)).map(a=>`<i title="${a.nom} ${eur(jourCout(a.id))}" style="width:${Math.min(100,jourCout(a.id)/p*100)}%;background:${a.coul}"></i>`).join('')}</div>
     <div class="legende" style="margin-top:6px">${AGENTS.filter(a=>jourCout(a.id)).map(a=>`<span><i style="background:${a.coul}"></i>${a.nom} ${eur(jourCout(a.id))}</span>`).join('')}</div>
     <div class="note" style="margin-top:6px">Aujourd\'hui : <b>${eur(tot)}</b> sur ${eur(p)} (${Math.round(tot/p*100)} %).</div>
     ${somme>p?`<div class="puce al" style="margin-top:6px;white-space:normal">La somme des plafonds par agent (${eur(somme)}) dépasse le plafond global : c\'est le global qui gagne.</div>`:''}
     ${tot/p>.85?`<div class="puce dg" style="margin-top:6px;white-space:normal">Presque atteint : ${ACTIONS_PLAFOND[GLOBAL.action]}.</div>`:''}`;};
  glDess();$('#gl-p').oninput=e=>{GLOBAL.plafond=+e.target.value;$('#gl-pv').textContent=eur(GLOBAL.plafond)+' par jour';glDess()};
  $('#gl-p').onchange=()=>toast('Plafond global : '+eur(GLOBAL.plafond)+' par jour');
  $('#gl-a').onchange=e=>{GLOBAL.action=+e.target.value;glDess();toast('Au plafond : '+ACTIONS_PLAFOND[GLOBAL.action])};
  $$('#cad-m .opt').forEach(b=>b.onclick=()=>{$$('#cad-m .opt').forEach(x=>x.classList.toggle('on',x===b));toast('Palier par défaut : '+NIVEAUX[b.dataset.n][0])});
  $$('[data-mj]').forEach(b=>b.onclick=()=>{const sv=JSON.parse(JSON.stringify(ETAT));AGENTS.forEach(a=>Object.keys(ETAT[a.id]).forEach(k=>ETAT[a.id][k]='raconter'));
    toast('Mauvais jour : tous les agents racontent seulement'+(b.dataset.mj!=='0'?' pendant '+b.dataset.mj+' h':''),()=>{AGENTS.forEach(a=>Object.assign(ETAT[a.id],sv[a.id]))})});
}

function recruter(){
  const taches=[['Surveiller les certificats des sites et renouveler à J-14','cassandra','chaque nuit',1.0],['Ranger les comptes rendus du conseil dans le classeur « Association »','itare','le lundi matin',0.3],['Veille : nouvelles règles sur les dons et le mécénat','amizo','chaque semaine',0.2]];
  let ch=0,qui=taches[0][1];
  const dessin=()=>{const t=taches[ch];
    $('#tiroir-c').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${idee('Confier une tâche récurrente')}</h2><button class="btn pt" id="x">Fermer</button></div>
     <p class="muet" style="font-size:12.5px">Une consigne qui revient, confiée à l\'un des agents. Pas un agent de plus : la tâche utilise ses outils, sa mémoire et son palier, et reste lisible dans son journal.</p>
     <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">${taches.map((x,i)=>`<button class="opt ${i===ch?'on':''}" data-i="${i}"><b>${x[0]}</b><span>${x[2]}</span></button>`).join('')}</div>
     <div class="champ"><label for="t-qui">Confiée à</label><select id="t-qui">${AGENTS.filter(x=>!x.service).map(x=>`<option value="${x.id}" ${x.id===qui?'selected':''}>${x.nom}</option>`).join('')}</select></div>
     <div class="l2"><span class="g">Quand</span><span>${t[2]} <span class="note">· dans la fenêtre de maintenance si elle agit</span></span></div>
     <div class="l2"><span class="g">Plafond</span><span>${eur(t[3])} / jour</span></div>
     <div class="note">Les outils dont la tâche a besoin et que l\'agent n\'avait pas commencent « racontés » pendant 7 jours.</div>
     <div class="pal"><button class="btn prim" id="go">Confier la tâche</button></div>`;
    $('#x').onclick=fermer;$$('#tiroir-c [data-i]').forEach(b=>b.onclick=()=>{ch=+b.dataset.i;qui=taches[ch][1];dessin()});$('#t-qui').onchange=e=>{qui=e.target.value};
    $('#go').onclick=()=>{journalise({ag:qui,type:'réglage',st:'fait',titre:'Tâche récurrente confiée à '+ag(qui).nom+' : '+t[0],sous:t[2]+' · plafond '+eur(t[3])+' par jour.',pourquoi:'Ta décision.',rev:true});fermer();toast('Confiée à '+ag(qui).nom+' — au journal',()=>{JOURNAL.shift();render()});render()};};
  dessin();$('#tiroir').classList.add('on');
}

    <div class="pal">${st.map((x,i)=>`<span class="puce ${i<n?'ok':i===n?'':'mu'}">${i+1}. ${x}</span>`).join('')}</div><div id="ob-c" class="corps"></div></section>`.replace(/\'/g,"'");
  const c=$('#ob-c');
  if(n===0){c.innerHTML=`<div class="cadran">${MODELES.filter(m=>m.etat==='ok').slice(0,3).map((m,i)=>`<button class="opt ${i===(S.obm||0)?'on':''}" data-m="${i}"><b>${m.nom}</b><span>${m.type==='local'?'Sur la machine, gratuit, plus lent':m.four+' · '+m.prix.toFixed(2)+' €/M'}</span></button>`).join('')}</div><div class="pal"><button class="btn prim" id="ob-n">Continuer</button></div>`;
    $$('#ob-c [data-m]').forEach(b=>b.onclick=()=>{S.obm=+b.dataset.m;onboarding(0)});$('#ob-n').onclick=()=>onboarding(MODELES[S.obm||0].type==='local'?2:1)}
  if(n===1){c.innerHTML=`<div class="champ"><label for="ob-k">Clé API</label><input type="text" id="ob-k" placeholder="collée ici, rangée chiffrée, jamais relue"></div><div class="note">La clé est rangée chiffrée : elle ne s\'affiche plus jamais, ni ici ni dans un agent.</div><div class="pal"><button class="btn" id="ob-p">Retour</button><button class="btn prim" id="ob-n">Ranger la clé</button></div>`.replace(/\'/g,"'");
    $('#ob-p').onclick=()=>onboarding(0);$('#ob-n').onclick=()=>onboarding(2)}
  if(n===2){c.innerHTML=`<div id="ob-ep">${EPREUVES.map((e,i)=>`<div class="l2"><div><b>${e[0]}</b></div><span class="puce mu" id="obe${i}">en attente</span></div>`).join('')}</div><div class="pal"><button class="btn prim" id="ob-go">Lancer les 8 épreuves</button></div>`;
    $('#ob-go').onclick=async()=>{$('#ob-go').disabled=true;for(let i=0;i<8;i++){await wait(220);const e=$('#obe'+i);if(e){e.className='puce ok';e.textContent='réussie'}}onboarding(3)}}
  if(n===3){c.innerHTML=`<div class="etat"><div class="rond">✓</div><div class="t"><h2>Les agents peuvent répondre</h2><p class="muet" style="font-size:12.5px">Le modèle a passé les huit épreuves. Cassandra, Itare et Amizo l\'utilisent ; tu pourras en ajouter d\'autres dans « Modèles & clés ».</p></div><button class="btn prim" id="ob-f">Voir l\'équipe</button></div>`.replace(/\'/g,"'");
    $('#ob-f').onclick=()=>{S.sim='';$('#sim').value='';S.ob=0;render()}}
}
const CONVS=[
 {id:'c1',ag:'itare',titre:'Préparer le conseil de jeudi',date:'aujourd\'hui',msgs:[['u','Prépare ma journée.'],['a','Ta journée : 2 réunions le matin (10 h et 11 h 30), l\'après-midi libre. J\'ai créé la tâche « Préparer le conseil » sur l\'après-midi.']]},
 {id:'c2',ag:'amizo',titre:'Règles de déduction des dons',date:'aujourd\'hui',msgs:[['u','Cherche la règle de déduction fiscale des dons aux associations.'],['a','Trois sources lues, une retenue : réduction d\'impôt dans une limite annuelle (source externe, état « non vérifié »). Fiche classée en quarantaine.']]},
 {id:'c3',ag:'cassandra',titre:'Certificat de l\'atelier',date:'hier',msgs:[['u','Le certificat de atelier.exemple.test expire dans 9 jours.'],['a','Certificat renouvelé : 90 jours, l\'ancien reste 30 jours si tu veux revenir en arrière.']]},
 {id:'c4',ag:'itare',titre:'Fil principal',date:'lundi',msgs:[['u','Merci pour le rangement des notes.'],['a','Avec plaisir : 12 notes dans « Association », la liste des anciens emplacements est gardée.']]}
].map(c=>({...c,date:c.date.replace(/\'/g,"'"),titre:c.titre.replace(/\'/g,"'"),msgs:c.msgs.map(m=>[m[0],m[1].replace(/\'/g,"'")])}));
function convsVisibles(){return CONVS.filter(c=>S.role==='admin'||c.ag!=='cassandra')}
function vConv(){
  const L=convsVisibles();if(!L.find(c=>c.id===S.cv.id))S.cv.id=(L[0]||{}).id;
  const c=L.find(x=>x.id===S.cv.id);
  $('#vue').innerHTML=`<div class="conv-g"><section class="verre carte"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Conversations</h2><button class="btn pt prim" id="cv-new">+ Nouvelle</button></div>
    <input type="search" id="cv-q" placeholder="Chercher…"><div class="conv-l" id="cv-l"></div>
    <div class="note">Les fils partagés avec d'autres personnes vivent dans le Salon ; ici, tes échanges avec les agents.</div></section>
   <section class="verre" style="display:flex;flex-direction:column;overflow:hidden"><div id="cv-t"></div></section></div>`;
  const liste=()=>{const q=($('#cv-q').value||'').toLowerCase();$('#cv-l').innerHTML=L.filter(x=>!q||x.titre.toLowerCase().includes(q)).map(x=>{const A=ag(x.ag);return `<button class="conv-i ${x.id===S.cv.id?'on':''}" data-c="${x.id}"><div class="avatar" style="background:${A.coul};width:30px;height:30px;font-size:13px;border-radius:10px">${A.lettre}</div><div style="min-width:0"><div class="t">${esc(x.titre)}</div><div class="note">${A.nom} · ${x.date} · ${x.msgs.length} messages</div></div></button>`}).join('')||'<div class="note" style="padding:10px">Aucune conversation.</div>';
    $$('#cv-l [data-c]').forEach(b=>b.onclick=()=>{S.cv.id=b.dataset.c;vConv()})};
  liste();$('#cv-q').oninput=liste;
  const A=c?ag(c.ag):null;
  $('#cv-t').innerHTML=c?`<div style="display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--filet);flex-wrap:wrap"><div class="avatar" style="background:${A.coul};width:34px;height:34px;font-size:14px;border-radius:11px">${A.lettre}</div><div style="flex:1;min-width:140px"><b>${esc(c.titre)}</b><div class="note">avec ${A.nom}</div></div>
    <button class="btn pt" id="cv-ren">Renommer</button><button class="btn pt dng" id="cv-del">Supprimer</button></div>
    <div class="chat" id="cv-chat" style="height:min(380px,50vh)">${c.msgs.map(m=>`<div class="bulle ${m[0]}">${esc(m[1])}</div>`).join('')}</div>
    <div style="padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--filet)"><label class="sw"><input type="checkbox" id="cv-fige" ${S.cv.fige?'checked':''}><i></i><span>Figer ce fil <span class="note">(la navigation ne le quitte plus)</span></span></label><span class="note">Interlocuteur automatique selon la page : ${S.role==='user'?'Itare':'Cassandra pour la machine, Itare pour le bureau, Amizo pour une recherche'}.</span></div>
    ${S.cv.pj?`<div style="padding:0 12px 6px"><span class="puce">📎 ${esc(S.cv.pj)} · lue par Vision</span> <button class="btn pt" id="cv-pjx">Retirer</button></div>`:''}
    <div class="saisie"><button class="btn" id="cv-pj" aria-label="Joindre un fichier">📎</button><input type="text" id="cv-in" placeholder="Écrire à ${A.nom}…" aria-label="Message"><button class="btn prim" id="cv-ok">Envoyer</button><button class="btn dng" id="cv-stop" style="display:none">■ Arrêter</button></div>`:'<div class="note" style="padding:20px">Aucune conversation. Crée-en une avec « + Nouvelle ».</div>';
  if(!c)return;
  const ch=$('#cv-chat');ch.scrollTop=ch.scrollHeight;
  $('#cv-fige').onchange=e=>{S.cv.fige=e.target.checked;toast(S.cv.fige?'Fil figé':'Fil libre')};
  $('#cv-pj').onclick=()=>{S.cv.pj='facture-fournisseur.jpg';vConv()};const px=$('#cv-pjx');if(px)px.onclick=()=>{S.cv.pj='';vConv()};
  $('#cv-ren').onclick=()=>{const n=prompt('Nouveau titre',c.titre);if(n&&n.trim()){const av=c.titre;c.titre=n.trim();toast('Renommée',()=>{c.titre=av;vConv()});vConv()}};
  $('#cv-del').onclick=()=>{const i=CONVS.indexOf(c);CONVS.splice(i,1);journalise({ag:c.ag,type:'acte',st:'fait',titre:'Conversation supprimée : '+c.titre,sous:'Une copie est gardée dans le résultat de l\'acte.'.replace(/\'/g,"'"),pourquoi:'Geste de l\'utilisateur.'.replace(/\'/g,"'"),outil:'conversation.supprimer',palier:'auto',preuve:'La conversation n\'existe plus.'.replace(/\'/g,"'"),retour:'Recréer la conversation depuis la copie gardée.',rev:true});toast('Conversation supprimée',()=>{CONVS.splice(i,0,c);vConv()});vConv()};
  const envoie=async()=>{const v=$('#cv-in').value.trim();if(!v||S.cv.run)return;S.cv.run=true;S.cv.stop=false;
    const pj=S.cv.pj;S.cv.pj='';c.msgs.push(['u',(pj?'📎 '+pj+'\n':'')+v]);
    ch.insertAdjacentHTML('beforeend',`<div class="bulle u">${esc((pj?'📎 '+pj+'\n':'')+v)}</div><div class="bulle a" id="cv-att">…</div>`);ch.scrollTop=ch.scrollHeight;$('#cv-in').value='';$('#cv-ok').style.display='none';$('#cv-stop').style.display='';
    $('#cv-stop').onclick=()=>{S.cv.stop=true};
    await wait(500);let rep;
    if(S.cv.stop)rep='Arrêté entre deux étapes : rien n\'a été fait de plus. Une action déjà lancée finit, avec son journal et son retour.';
    else if(S.sim==='plafond'&&GLOBAL.action>0&&!(GLOBAL.action===1&&c.ag==='cassandra'))rep='Le plafond de coût du jour est atteint : '+ACTIONS_PLAFOND[GLOBAL.action]+'.';
    else{const low=v.toLowerCase();const sc=SCEN.filter(s=>s.pour.includes(c.ag)).map(s=>({s,n:s.cle.filter(k=>low.includes(k)).length})).sort((x,y)=>y.n-x.n)[0];
      if(!sc||!sc.n)rep='Je n\'ai pas d\'outil pour ça, et je ne vais pas inventer de réponse.';
      else{const tools=sc.s.etapes.filter(e=>e.t==='tool'||e.t==='via').map(e=>({ag:e.t==='via'?e.ag:c.ag,o:e.o}));const tout=tools.every(t=>(ETAT[t.ag]||{})[t.o]==='auto');rep=tout?sc.s.fin.fait:sc.s.fin.racon;
        if(!tout&&!GEL){}if(GEL)rep='La pause est posée : je ne touche à rien. '+sc.s.fin.racon}}
    if(S.sim==='panne')rep+=' (réponse du modèle de secours)';
    rep=rep.replace(/\'/g,"'");
    if(pj)rep='Vision a lu '+pj+' : un document de 184,20 € (total lisible, date floue). '+rep;
    c.msgs.push(['a',rep]);const at=$('#cv-att');if(at){at.removeAttribute('id');at.textContent=rep}
    $('#cv-stop').style.display='none';$('#cv-ok').style.display='';S.cv.run=false;ch.scrollTop=ch.scrollHeight;liste()};
  $('#cv-ok').onclick=envoie;$('#cv-in').onkeydown=e=>{if(e.key==='Enter')envoie()};
  $('#cv-new').onclick=()=>{const ags=AGENTS.filter(x=>!x.service&&(S.role==='admin'||x.id!=='cassandra'));let ch0=ags[0].id;
    tiroir(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Nouvelle conversation</h2><button class="btn pt" id="x">Fermer</button></div>
     <div class="champ"><label for="nv-a">Avec</label><select id="nv-a">${ags.map(x=>`<option value="${x.id}">${x.nom} — ${x.role}</option>`).join('')}</select></div>
     <div class="champ"><label for="nv-t">Titre</label><input type="text" id="nv-t" placeholder="(facultatif)"></div><div class="pal"><button class="btn prim" id="nv-ok">Ouvrir</button></div>`);
    $('#x').onclick=fermer;$('#nv-ok').onclick=()=>{const id='c'+Date.now();CONVS.unshift({id,ag:$('#nv-a').value,titre:$('#nv-t').value.trim()||'Nouvelle conversation',date:'à l\'instant'.replace(/\'/g,"'"),msgs:[]});S.cv.id=id;fermer();toast('Conversation ouverte');vConv()}};
}
document.addEventListener('click',e=>{if(e.target.id==='sim-off'){S.sim='';$('#sim').value='';render()}});
function setRole(r){S.role=r;$$('#role-seg button').forEach(x=>x.classList.toggle('on',x.dataset.r===r));$('#gel-btn').style.display=r==='user'?'none':'';
  if(r==='user'&&S.vue!=='conv'&&S.vue!=='boite'&&S.vue!=='journal'){S.vue='fiche';S.agent='itare';S.onglet='apercu'}render()}
$$('#role-seg button').forEach(b=>b.onclick=()=>setRole(b.dataset.r));
$('#soc').onchange=e=>{S.soc=e.target.value;toast('Société active : '+S.soc);render()};
$('#sim').onchange=e=>{S.sim=e.target.value;S.ob=0;render()};

/* ════════════ THÈME & IDÉES ════════════ */
$$('#themes button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;document.documentElement.setAttribute('data-theme',b.dataset.th==='light'?'':b.dataset.th);$$('#themes button').forEach(x=>x.classList.toggle('on',x===b))});
$('#sw-idees').onchange=e=>document.body.classList.toggle('sans-idees',!e.target.checked);
if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');$$('#themes button').forEach(x=>x.classList.toggle('on',x.dataset.th==='dark'))}
const h=new URLSearchParams(location.search);if(h.get('theme')){const t=h.get('theme');document.documentElement.setAttribute('data-theme',t==='light'?'':t);$$('#themes button').forEach(x=>x.classList.toggle('on',x.dataset.th===t))}
$('#burger').onclick=()=>{$('#menu').classList.add('ouvert');$('#voile').classList.add('on')};
$('#voile').onclick=()=>{$('#menu').classList.remove('ouvert');$('#voile').classList.remove('on')};
initPaliers();
appliquerNiveau(ag('cassandra'),'reine');appliquerNiveau(ag('itare'),'entretien');appliquerNiveau(ag('relecteur'),'observer');appliquerNiveau(ag('vision'),'observer');appliquerNiveau(ag('amizo'),'reine');appliquerNiveau(ag('auditeur'),'observer');
render();
if(h.get('v')){S.vue=h.get('v');if(h.get('a'))S.agent=h.get('a');if(h.get('o'))S.onglet=h.get('o');render()}
if(h.get('role')||h.get('sim')||h.get('soc')){if(h.get('sim')){S.sim=h.get('sim');$('#sim').value=S.sim}if(h.get('soc')){S.soc=h.get('soc');$('#soc').value=S.soc}if(h.get('role'))setRole(h.get('role'));else render()}
})();
</script>
