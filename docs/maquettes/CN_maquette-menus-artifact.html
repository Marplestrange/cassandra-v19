<title>Maquette menus Cassandra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Disposition V19 : barre haute à groupes-icônes, colonne de gauche transparente, menu avatar. Les largeurs se mesurent sur le cadre de l'appli (data-w), pas sur la fenêtre, pour montrer tablette et téléphone. */
:root{
  --sol:#eef1f5; --halo:#e9edf3; --verre:rgba(255,255,255,.66); --verre-fort:rgba(255,255,255,.94);
  --encre:#101828; --encre-2:#475467; --encre-3:#8b95a3; --filet:rgba(16,24,40,.09);
  --accent:#0b7c74; --accent-doux:rgba(11,124,116,.10); --accent-encre:#ffffff;
  --barre:#0b7c74; --barre-haut:#0e8a81; --barre-encre:#ffffff; --barre-doux:rgba(255,255,255,.16);
  --dalle:rgba(255,255,255,.13); --dalle-haut:rgba(255,255,255,.42); --dalle-bas:rgba(0,0,0,.20); --dalle-on:rgba(255,255,255,.27); --dalle-ombre:rgba(0,0,0,.22);
  --ok:#047857; --ok-doux:rgba(4,120,87,.10); --alerte:#b45309; --alerte-doux:rgba(180,83,9,.11); --danger:#be123c; --danger-doux:rgba(190,18,60,.09);
  --ombre:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sol:#0d1117; --halo:#111a24; --verre:rgba(26,33,44,.66); --verre-fort:rgba(30,38,50,.97);
  --encre:#e6ebf2; --encre-2:#aab4c3; --encre-3:#707c8d; --filet:rgba(230,235,242,.10);
  --accent:#34b3a8; --accent-doux:rgba(52,179,168,.14); --accent-encre:#06201d;
  --barre:#14524d; --barre-haut:#186059; --barre-encre:#eafaf8; --barre-doux:rgba(255,255,255,.12);
  --ok:#3ecf9a; --ok-doux:rgba(62,207,154,.12); --alerte:#e7a14c; --alerte-doux:rgba(231,161,76,.13); --danger:#ff6b8b; --danger-doux:rgba(255,107,139,.12);
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --sol:#0d1117; --halo:#111a24; --verre:rgba(26,33,44,.66); --verre-fort:rgba(30,38,50,.97);
  --encre:#e6ebf2; --encre-2:#aab4c3; --encre-3:#707c8d; --filet:rgba(230,235,242,.10);
  --accent:#34b3a8; --accent-doux:rgba(52,179,168,.14); --accent-encre:#06201d;
  --barre:#14524d; --barre-haut:#186059; --barre-encre:#eafaf8; --barre-doux:rgba(255,255,255,.12);
  --ok:#3ecf9a; --ok-doux:rgba(62,207,154,.12); --alerte:#e7a14c; --alerte-doux:rgba(231,161,76,.13); --danger:#ff6b8b; --danger-doux:rgba(255,107,139,.12);
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}
/* habillages de modules (démonstration) */
:root[data-hab="ardoise"]{--barre:#334155;--barre-haut:#3b4a61;--accent:#475a78;--accent-doux:rgba(71,90,120,.12)}
:root[data-hab="papier"]{--dalle:rgba(16,24,40,.045);--dalle-haut:rgba(255,255,255,.95);--dalle-bas:rgba(16,24,40,.10);--dalle-on:rgba(11,124,116,.12);--dalle-ombre:rgba(16,24,40,.12);--barre:#f6f7f9;--barre-haut:#ffffff;--barre-encre:#101828;--barre-doux:rgba(16,24,40,.07)}
:root[data-hab="papier"][data-theme="dark"]{--barre:#1c2430;--barre-haut:#222c3a;--barre-encre:#e6ebf2;--barre-doux:rgba(255,255,255,.10)}

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(900px 420px at 50% -25%,var(--halo),transparent),var(--sol);color:var(--encre);font:14px/1.5 var(--sans);overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.page{height:100%;height:100dvh;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;transition:padding .2s}
.stage.cadre{padding:14px 0;background:rgba(16,24,40,.06)}
.app{position:relative;display:grid;grid-template-rows:60px minmax(0,1fr) auto;width:100%;height:100%;background:radial-gradient(900px 420px at 50% -25%,var(--halo),transparent),var(--sol);overflow:hidden;transition:max-width .25s}
.stage.cadre .app{border-radius:22px;box-shadow:0 20px 60px rgba(16,24,40,.28);border:1px solid var(--filet)}
.stage[data-cadre="tab"] .app{max-width:768px}
.stage[data-cadre="tel"] .app{max-width:390px}

/* ---------- Barre haute ---------- */
.top{display:flex;align-items:center;gap:4px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,var(--barre-haut),var(--barre));color:var(--barre-encre);box-shadow:0 2px 10px rgba(16,24,40,.14);position:relative;z-index:30}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--barre-encre);opacity:.9}
.ib:hover{background:var(--barre-doux);opacity:1}
.ib:disabled{opacity:.35;cursor:default;background:none}
.nav3{display:flex}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:grid;place-items:center;font:700 15px var(--mono);color:#0b7c74;margin:0 10px 0 0;flex:none}
.groupes{display:flex;align-items:stretch;gap:5px;min-width:0;flex:1;height:100%;padding-left:10px}
.gr{position:relative;width:42px;height:100%;border-radius:0 0 10px 10px;display:grid;place-items:center;color:var(--barre-encre);opacity:.92;
  background:linear-gradient(180deg,var(--dalle-haut),var(--dalle) 30%,var(--dalle));
  border:0;border-left:1px solid var(--dalle-haut);border-right:1px solid var(--dalle-bas);
  box-shadow:inset 0 1px 0 var(--dalle-haut),inset 0 -1px 2px var(--dalle-bas),0 2px 6px var(--dalle-ombre);
  transition:background .14s ease,box-shadow .14s ease,transform .14s ease}
.gr svg{width:21px;height:21px;stroke-width:1.8}
.gr:hover{opacity:1;background:linear-gradient(180deg,var(--dalle-haut),var(--dalle-on) 40%,var(--dalle-on))}
.gr.on{opacity:1;background:linear-gradient(180deg,var(--dalle-bas),var(--dalle-on) 55%,var(--dalle-on));
  box-shadow:inset 0 3px 6px var(--dalle-bas),inset 0 -2px 0 var(--barre-encre),0 0 0 1px var(--dalle-haut)}
.gr::before{content:attr(data-tip);position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;font:500 11.5px var(--mono);padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.gr:hover::before,.gr:focus-visible::before{opacity:1}
.dot{position:absolute;top:10px;right:5px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--barre)}
.dot.danger{background:var(--danger)}.dot.alerte{background:#f59e0b}
.droite{display:flex;align-items:center;gap:4px;padding-left:6px;flex:none}
.vtxt{font:500 12px var(--mono);opacity:.85;padding:0 6px}
.wrap{position:relative}
.bw{position:relative;display:block}
.bw i{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font:600 9.5px/15px var(--mono);text-align:center;font-style:normal;padding:0 3px;box-shadow:0 0 0 2px var(--barre);pointer-events:none}
.av{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px 0 4px;border-radius:999px;color:var(--barre-encre)}
.av:hover{background:var(--barre-doux)}
.av span,.av-g{width:30px;height:30px;border-radius:50%;background:#fff;color:#0b7c74;display:grid;place-items:center;font:600 10.5px var(--mono)}
.av svg{width:11px;height:11px;stroke-width:1.5}

/* ---------- Menus déroulants ---------- */
.pop{position:absolute;top:48px;right:0;width:max-content;min-width:250px;max-width:calc(100vw - 32px);max-height:calc(100vh - 120px);overflow:auto;background:var(--verre-fort);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--filet);border-radius:16px;box-shadow:var(--ombre),0 18px 40px rgba(16,24,40,.14);padding:8px;display:none;z-index:50;color:var(--encre)}
.pop.ouvert{display:block}
.pop .t{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-3);padding:8px 10px 4px}
.pop .l{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-align:left;font-size:13.5px}
.pop .l:hover{background:var(--accent-doux)}
.pop .l small{margin-left:auto;padding-left:14px;font:400 11px var(--mono);color:var(--encre-3)}
.pop .l .pt2{width:8px;height:8px;border-radius:50%;flex:none}
.pop .l.nonlu{font-weight:600}
.pop hr{border:0;border-top:1px solid var(--filet);margin:6px 4px}
.pop .danger{color:var(--danger)}
.pop .id{display:flex;align-items:center;gap:10px;padding:8px 10px}
.pop .id b{display:block;font-size:13.5px}.pop .id small{font:400 11px var(--mono);color:var(--encre-3)}
.pop .id em{margin-left:auto;font:600 10px var(--mono);font-style:normal;background:var(--accent-doux);color:var(--accent);border-radius:999px;padding:2px 8px}
.pop .id .av-g{background:var(--accent);color:var(--accent-encre)}
.pop .mini{display:grid;grid-template-columns:max-content 1fr;gap:2px 14px;padding:2px 10px 4px;font-size:12.5px}
.pop .mini dt{font:500 11px var(--mono);color:var(--encre-3)}.pop .mini dd{margin:0}
.seg{display:flex;gap:2px;margin:2px 8px 6px;padding:3px;border-radius:10px;background:var(--accent-doux)}
.seg button{flex:1;padding:5px 8px;border-radius:8px;font:500 12px var(--mono);color:var(--encre-2)}
.seg button.on{background:var(--verre-fort);color:var(--accent);box-shadow:var(--ombre)}
.sw{position:relative;width:34px;height:20px;border-radius:999px;background:var(--filet);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(14px)}

/* ---------- Corps ---------- */
.corps{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0}
.side{width:248px;background:transparent;overflow:auto;padding:14px 8px 14px max(14px,env(safe-area-inset-left,0px));transition:width .18s ease,padding .18s ease,transform .2s ease;position:relative;z-index:20}
.side.ferme{width:0;padding-left:0;padding-right:0;overflow:hidden}
.side h2{font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3);padding:2px 10px 10px;white-space:nowrap}
.si{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;color:var(--encre-2);text-align:left;white-space:nowrap}
.si:hover{background:var(--verre);color:var(--encre)}
.si.ent{font-weight:500;color:var(--encre)}
.si.ent>svg:first-child{color:var(--encre-3)}
.si.on{background:var(--verre);color:var(--accent);font-weight:600;box-shadow:var(--ombre)}
.si .car{margin-left:auto;width:14px;height:14px;transition:transform .15s}
.si .car.ouv{transform:rotate(90deg)}
.si.sub{padding-left:38px;font-size:13px}
.si .pt{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.nb{margin-left:auto;min-width:18px;height:18px;border-radius:9px;font:600 10.5px/18px var(--mono);text-align:center;padding:0 5px;background:var(--accent-doux);color:var(--accent)}
.nb.alerte{background:var(--alerte-doux);color:var(--alerte)}.nb.danger{background:var(--danger-doux);color:var(--danger)}
.si .car+.nb,.si .nb+.car{margin-left:6px}
.note{margin:12px 6px 0;padding:10px 12px;border-radius:12px;background:var(--alerte-doux);color:var(--alerte);font-size:12px;line-height:1.45;white-space:normal}
.scrim{display:none}
.scene{overflow:auto;padding:24px max(30px,env(safe-area-inset-right,0px)) 40px 30px}
.fil{display:flex;flex-wrap:wrap;gap:4px;font:500 11.5px var(--mono);color:var(--encre-3);margin-bottom:6px}
.fil button{color:inherit;padding:0}.fil button:hover{color:var(--accent)}
.scene h1{font:600 20px var(--mono);margin-bottom:4px;text-wrap:balance}
.sous{color:var(--encre-2);margin-bottom:20px;max-width:62ch}
.cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.carte{background:var(--verre);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:16px;box-shadow:var(--ombre);padding:16px 18px;border:1px solid var(--filet);min-width:0}
.carte>b{display:block;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-3);margin-bottom:8px}
.carte .v{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
.carte .v small{font-size:12px;color:var(--encre-3);margin-left:3px}
.bloc{margin-top:16px;max-width:820px}
.lig{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--filet);font-size:13.5px;width:100%;text-align:left}
.lig:first-of-type{border-top:0}
.lig:hover em{color:var(--accent)}
.lig i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.lig i.alerte{background:var(--alerte)}.lig i.danger{background:var(--danger)}
.lig em{font-style:normal;flex:1;min-width:0}
.lig small{font:400 11.5px var(--mono);color:var(--encre-3)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:600 11px var(--mono);background:var(--ok-doux);color:var(--ok)}
.pill.alerte{background:var(--alerte-doux);color:var(--alerte)}.pill.danger{background:var(--danger-doux);color:var(--danger)}
.btn{padding:7px 14px;border-radius:10px;background:var(--accent);color:var(--accent-encre);font:500 12.5px var(--mono)}
.btn.sec{background:var(--accent-doux);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{padding:5px 12px;border-radius:999px;background:var(--verre);border:1px solid var(--filet);font:500 12px var(--mono);color:var(--encre-2)}
.chip.on{background:var(--accent);color:var(--accent-encre);border-color:transparent}
.grille-info{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;font-size:13.5px;max-width:640px}
.grille-info dt{font:500 12px var(--mono);color:var(--encre-3)}.grille-info dd{margin:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--encre-3);text-align:left;padding:6px 8px}
.tbl td{padding:9px 8px;border-top:1px solid var(--filet)}
.tw{overflow-x:auto}
.salon{display:flex;flex-direction:column;gap:10px;max-width:700px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:180px}
.m{max-width:85%;padding:9px 13px;border-radius:14px;background:var(--verre);border:1px solid var(--filet);box-shadow:var(--ombre)}
.m.moi{align-self:flex-end;background:var(--accent);color:var(--accent-encre);border-color:transparent}
.salon form{display:flex;gap:8px}
.salon input{flex:1;min-width:0;padding:9px 14px;border-radius:12px;border:1px solid var(--filet);background:var(--verre-fort)}
.barres{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.barres div{flex:1;min-width:0;background:var(--accent);border-radius:6px 6px 0 0;opacity:.8;position:relative;transition:height .3s}
.barres div:hover{opacity:1}
.barres div:hover::after{content:attr(data-v);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#101828;color:#fff;font:500 11px var(--mono);padding:2px 7px;border-radius:6px;white-space:nowrap;margin-bottom:4px}
.jauge{height:7px;border-radius:4px;background:var(--filet);margin-top:10px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s}
.coche{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--encre-3);display:grid;place-items:center;flex:none}
.coche.on{background:var(--accent);border-color:var(--accent)}
.coche.on::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.fait em{text-decoration:line-through;color:var(--encre-3)}
.detail{padding:6px 0 10px 18px;color:var(--encre-2);font-size:13px}
.app.allege .sous,.app.allege .detail{display:none}

/* ---------- Anneau d'état, flyout, épingles, panneau Cassandra ---------- */
.logo{transition:box-shadow .3s;background-size:cover;background-position:center;overflow:hidden}
.logo.s-ok{box-shadow:0 0 0 3px rgba(74,222,128,.85),0 1px 4px rgba(0,0,0,.25)}
.logo.s-alerte{box-shadow:0 0 0 3px #f59e0b,0 1px 4px rgba(0,0,0,.25)}
.logo.s-danger{box-shadow:0 0 0 3px var(--danger),0 1px 4px rgba(0,0,0,.25)}
.fly{position:absolute;top:60px;z-index:45;display:none;min-width:320px;max-width:calc(100% - 16px);max-height:calc(100% - 90px);overflow:auto;background:var(--verre-fort);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--filet);border-radius:0 0 16px 16px;box-shadow:var(--ombre),0 18px 40px rgba(16,24,40,.16);padding:12px 14px 14px}
.fly.ouvert{display:block}
.fly h3{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3);margin-bottom:8px}
.fly .col{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 18px}
.fly .en>b{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:3px}
.fly .en>b svg{width:16px;height:16px;color:var(--encre-3)}
.fly .en button{display:flex;width:100%;align-items:center;gap:8px;padding:3px 8px;border-radius:7px;font-size:12.5px;color:var(--encre-2);text-align:left}
.fly .en button:hover{background:var(--accent-doux);color:var(--accent)}
.fly .en .plus{color:var(--accent);font-weight:600}
.pin{margin-left:auto;color:var(--encre-3);padding:0 2px;display:inline-flex}
.pin svg{width:15px;height:15px}.pin:hover{color:#d97706}
.pin.on{color:#d97706}.pin.on svg{fill:currentColor}
.sep{border:0;border-top:1px solid var(--filet);margin:8px 10px}
.si.pinned svg:first-child{color:#d97706;fill:currentColor;width:15px;height:15px}
.si.pinned{font-size:13px}
.cass{position:absolute;top:60px;right:0;bottom:0;width:370px;max-width:100%;z-index:60;background:var(--verre-fort);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--filet);box-shadow:var(--ombre);display:flex;flex-direction:column;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility .22s}
.cass.ouvert{transform:none;visibility:visible}
.cass header{padding:12px 14px 10px 16px;border-bottom:1px solid var(--filet);display:flex;align-items:flex-start;gap:10px}
.cass header b{font:600 13px var(--mono);display:block}
.cass header small{font:400 11px var(--mono);color:var(--encre-3);display:block;overflow-wrap:anywhere}
.cass header .ib{color:var(--encre-2);margin-left:auto}

function seed(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}

  const val=[(h%9)+1,(h>>3)%40+2,(h>>5)%12,(97+(h%30)/10).toFixed(1)+' %'];
  const cartes=L.map((l,i)=>'<div class="carte"><b>'+esc(l)+'</b><div class="v">'+val[i]+'</div></div>').join('');

  return fil([g.nom,e.nom,s])+'<h1>'+esc(s)+'</h1><p class="sous">Écran d’exemple du module « '+esc(e.nom)+' ». Les chiffres sont fictifs ; la maquette montre où l’écran se place.</p><div class="cartes">'+cartes+'</div><div class="carte bloc"><b>Dernières activités</b>'+rows+'</div>';
}

  if(x=c('[data-msback]')){ouvrirMs(false);return}
  if(x=c('[data-msen]')){ouvrirMs(false);go(enG().id,x.dataset.msen,null);return}
  if(x=c('[data-mspin]')){ouvrirMs(false);go(x.dataset.pg,x.dataset.pe,x.dataset.ps);return}
  if(x=c('#strip [data-sx]')){go(st.g,st.e,x.dataset.sx);return}

  if(x=c('[data-back]')){st.drill=null;rendreGauche();return}
  if(x=c('[data-cbas]')){$('#plus').classList.remove('ouvert');ouvrirPanel();return}

  if(x=c('[data-poignee]'))return;
  if(x=c('[data-reg]')){st.regOuvert=!st.regOuvert;rendrePanel();return}
  if(x=c('[data-verre]')){st.verre=!st.verre;appliquerTheme();syncDemo();repop('params');return}
  if(x=c('[data-soc-reset]')){st.soc.logo=null;rendreHaut();rendreScene();toast('Logo de Cassandra rétabli.');return}
  if(x=c('[data-soc-save]')){toast('Société enregistrée : '+st.soc.nom);return}
  if(x=c('[data-pin]')){basculerPin();return}
  if(x=c('.si.pinned')){go(x.dataset.pg,x.dataset.pe,x.dataset.ps);return}
  if(x=c('#fly [data-fg]')){flyFermer();go(x.dataset.fg,x.dataset.fe,x.dataset.fs||null);return}
  if(x=c('[data-mode]')){if(x.disabled)return;st.sugOuvert=false;st.fmenu=false;st.manual=x.dataset.mode;rendrePanel();return}
  if(x=c('[data-inv]')){const id=x.dataset.inv;st.invites.has(id)?st.invites.delete(id):st.invites.add(id);rendrePanel();return}
  if(x=c('[data-cclose]')){ouvrirPanel(false);return}
  if(x=c('[data-fsel]')){st.fmenu=!st.fmenu;st.sugOuvert=false;rendrePanel();return}
  if(x=c('[data-fpage]')){st.sel[mode()]='page';st.fmenu=false;rendrePanel();return}
  if(x=c('[data-fnew]')){const m=mode(),t={id:'t'+(++st.tid),titre:'Nouveau fil',page:null,maj:'à l’instant',msgs:[]};st.threads[m].unshift(t);st.sel[m]=t.id;st.fmenu=false;rendrePanel();return}
  if(x=c('[data-fth]')){st.sel[mode()]=x.dataset.fth;st.fmenu=false;rendrePanel();return}
  if(x=c('[data-sug]')){st.sugOuvert=!st.sugOuvert;st.fmenu=false;rendrePanel();return}
  if(x=c('[data-prop]')){st.sugOuvert=false;proposer(x.dataset.prop);return}

if(q.includes('cert'))return 'Le certificat de shop.exemple.fr expire dans 6 jours. Je peux demander le renouvellement.';if(q.includes('nuit')||q.includes('changé'))return 'Cette nuit : sauvegarde +40 % de durée, disque /var à 71 %, rien d’autre.';if(q.includes('billet'))return 'Cette semaine : 412 billets, 12 commandes à traiter, un remboursement en attente.';if(q.includes('machine'))return 'shop.exemple.fr répond en 1,8 s ; toutes les autres sont sous 300 ms.';if(q.includes('journée'))return 'Aujourd’hui : 3 tâches, un courrier de la salle Atelier à relire, réunion de production jeudi à 10:00.';if(q.includes('courrier'))return '3 non lus : le relevé de l’Atelier, un contrat artiste, une facture à valider.';if(q.includes('copie'))return 'La copie hors site a 9 heures de retard ; la dernière a fini hier à 23:12.';if(q.includes('salle b'))return 'Souvenir : « Atelier » est l’alias de la salle B, noté hier.';if(q.includes('studio'))return 'Module tiers : projets, bibliothèque d’images et rendus.';return 'Bien noté. Je regarde et je te réponds ici.'}
function repAgent(id,t){if(id==='itare'||id==='courrier'&&t.toLowerCase().includes('courrier'))return reponse(t);if(id==='veille')return 'Réseau : rien de nouveau depuis ce matin, 214 adresses repoussées sur 7 jours.';if(id==='billet')return 'Billetterie : 12 commandes à traiter, un remboursement en attente.';if(id==='courrier')return 'Courrier : 3 non lus, aucun urgent.';return reponse(t)}

   +(st.fmenu?menuFils():'')+reg.replace('class="reg"','class="reg'+(st.regOuvert?' ouvert':'')+'"')+qui
   +'<div class="cmsgs" id="cmsgs">'+(thread.length?thread.map((x,i)=>x.de==='acte'?carteActe(x,i):'<div class="m '+(x.de==='moi'?'moi':'')+'">'+(x.de!=='moi'&&x.a?'<span class="au">'+esc(x.a)+'</span>':'')+esc(x.t)+'</div>').join(''):'<div class="intro">'+esc(INTRO[m])+'</div>')+'</div>'
   +'<div class="sug'+(st.sugOuvert?' ouvert':'')+'"><div class="sughead">Idées pour cette page <i>· en direct</i></div>'+(idl.length?idl.map(x=>x.k?'<button class="idee act" data-prop="'+x.k+'"><span>✦ '+esc(x.t)+'</span>'+(x.why?'<small>'+esc(x.why)+' · risque '+x.r+'</small>':'<small>risque '+x.r+'</small>')+'</button>':'<button class="idee" data-cdire="'+esc(x.q)+'"><span>'+esc(x.t)+'</span>'+(x.why?'<small>'+esc(x.why)+'</small>':'')+'</button>').join(''):'<div class="vide">Rien à proposer pour l’instant.</div>')+'</div>'

function carteActe(m,i){const a=ACT[m.k];const pill='<span class="pill '+(a.r==='faible'?'':'alerte')+'">risque '+a.r+'</span>';
  let h='<div class="acte"><h4>'+esc(a.t)+pill+'</h4><dl><dt>Périmètre</dt><dd>'+esc(a.p)+'</dd><dt>Preuve</dt><dd>'+esc(a.preuve)+'</dd><dt>Retour</dt><dd>'+esc(a.retour)+'</dd></dl>';
  if(m.etat==='propose')h+=(a.confirme?'<label><input type="checkbox" id="ck'+i+'"> Je confirme ce geste</label>':'')+'<div class="bt"><button class="btn" data-valider="'+i+'">Valider</button><button class="btn sec" data-refuser="'+i+'">Refuser</button></div>';
  else if(m.etat==='fait')h+='<p class="fait">'+esc(a.ok)+'</p><div class="bt"><button class="btn sec" data-annuler="'+i+'">Annuler (retour)</button></div>';
  else if(m.etat==='annule')h+='<p>Retour effectué : '+esc(a.retour)+'.</p>';
  else h+='<p>Refusé. Rien n’a été fait.</p>';
  return h+'</div>'}

function ouvrirPanel(v){const avant=st.panel;st.panel=v===undefined?!st.panel:v;if(st.panel===avant)return;

  $('#b-cass').classList.toggle('actif',st.panel);$('#app').classList.toggle('panel-ouvert',st.panel);
  const w=$('#app').dataset.w;
  if(st.panel){if(isPetit())fermerSide();ouvrirMs(false);st.sideAvant=st.side;st.sideTouche=false;if(!isPetit()&&w!=='xl'){st.side='rail';majSide();rendreGauche()}fermerPops();flyFermer();$('#plus').classList.remove('ouvert');rendrePanel()}
  else if(!isPetit()&&!st.sideTouche&&st.sideAvant!==undefined&&w!=='xl'){st.side=st.sideAvant;majSide();rendreGauche()}

function proposer(k){const q=ACT[k].qui;if(q!==mode())st.manual=q;const th=thr();th.push({de:'c',a:NOMS[mode()],t:'Voici ce que je propose. Rien ne part sans ton accord.'});th.push({de:'acte',k,etat:'propose'});rendrePanel()}
function direC(t){if(!t.trim())return;st.sugOuvert=false;st.fmenu=false;{const T=threadCourant();T.maj='à l’instant';if(T.titre==='Nouveau fil'&&!T.msgs.length)T.titre=t.length>38?t.slice(0,36)+'…':t}const m=mode(),th=thr();th.push({de:'moi',t});rendrePanel();
  if(m==='inv'){const ids=[...st.invites];if(!ids.length){setTimeout(()=>{th.push({de:'c',a:'Système',t:'Personne n’est invité : choisis au moins un agent ci-dessus.'});rendrePanel()},300);return}
    ids.forEach((id,i)=>setTimeout(()=>{th.push({de:'c',a:AGENTS.find(a=>a[0]===id)[1],t:repAgent(id,t)});rendrePanel()},500+i*450));return}
  setTimeout(()=>{th.push({de:'c',a:NOMS[m],t:reponse(t)});rendrePanel()},600)}
