<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Sites</title>
<style>
:root{
  --bg:#eef1f5; --bg2:#e9edf3; --surface:rgba(255,255,255,.72); --surface2:rgba(255,255,255,.5); --solid:#fff;
  --line:rgba(16,24,40,.09); --line2:rgba(16,24,40,.16);
  --strong:#101828; --txt:#2b3646; --soft:#5a6675; --muted:#667080;
  --accent:#0a726b; --accent2:#0f9b90; --acc10:rgba(11,124,116,.10); --acc20:rgba(11,124,116,.20);
  --ok:#047857; --warn:#b45309; --danger:#be123c; --info:#0369a1;
  --ok10:rgba(4,120,87,.10); --warn10:rgba(180,83,9,.11); --dan10:rgba(190,18,60,.09); --inf10:rgba(3,105,161,.10);
  --shadow:0 6px 24px rgba(16,24,40,.07),0 1px 2px rgba(16,24,40,.05); --lift:0 14px 40px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.06);
  --r:16px; --rs:10px; --barre:linear-gradient(135deg,#0a726b,#0f9b90);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0e1417; --bg2:#111a1e; --surface:rgba(28,38,44,.78); --surface2:rgba(28,38,44,.5); --solid:#182228;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --strong:#f1f5f7; --txt:#d3dbe0; --soft:#a6b2ba; --muted:#93a0a9;
  --accent:#3fc7ba; --accent2:#2aa99d; --acc10:rgba(63,199,186,.12); --acc20:rgba(63,199,186,.22);
  --ok:#34d399; --warn:#f0a94a; --danger:#fb7185; --info:#5cb8e6;
  --ok10:rgba(52,211,153,.12); --warn10:rgba(240,169,74,.13); --dan10:rgba(251,113,133,.13); --inf10:rgba(92,184,230,.12);
  --shadow:0 6px 24px rgba(0,0,0,.3); --lift:0 14px 40px rgba(0,0,0,.5); --barre:linear-gradient(135deg,#0b4f4a,#0d6b63);
}}
:root[data-theme="dark"]{
  --bg:#0e1417; --bg2:#111a1e; --surface:rgba(28,38,44,.78); --surface2:rgba(28,38,44,.5); --solid:#182228;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --strong:#f1f5f7; --txt:#d3dbe0; --soft:#a6b2ba; --muted:#93a0a9;
  --accent:#3fc7ba; --accent2:#2aa99d; --acc10:rgba(63,199,186,.12); --acc20:rgba(63,199,186,.22);
  --ok:#34d399; --warn:#f0a94a; --danger:#fb7185; --info:#5cb8e6;
  --ok10:rgba(52,211,153,.12); --warn10:rgba(240,169,74,.13); --dan10:rgba(251,113,133,.13); --inf10:rgba(92,184,230,.12);
  --shadow:0 6px 24px rgba(0,0,0,.3); --lift:0 14px 40px rgba(0,0,0,.5); --barre:linear-gradient(135deg,#0b4f4a,#0d6b63);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--bg2),var(--bg) 40%,var(--bg2));background-attachment:fixed;color:var(--txt);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.mono,code,.num{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
code{font-size:.92em;color:var(--strong)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
/* barre du haut */
.haut{background:var(--barre);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:30}
.haut b{font-weight:650;letter-spacing:.2px}
@media (max-width:700px){.haut{flex-wrap:wrap}.haut .note{order:9;flex:1 1 100%;margin:0}}
.haut .note{font-size:12.5px;opacity:.88;margin-right:auto}
.haut button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:6px 11px;font-size:13px}
.haut button[aria-pressed="true"]{background:#fff;color:#0a726b}
.seg{display:inline-flex;gap:2px;background:rgba(255,255,255,.12);padding:3px;border-radius:12px}
.seg button{border:0;background:transparent}
/* disposition */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);gap:18px;max-width:1380px;margin:0 auto;padding:18px 16px 60px}
@media (max-width:900px){.app{grid-template-columns:1fr}.menu{position:static!important;max-height:none!important}}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
/* menu de gauche */
.menu{position:sticky;top:66px;align-self:start;padding:8px;max-height:calc(100vh - 84px);overflow:auto}
.menu h2{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:10px 12px 6px;font-weight:650}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:9px 12px;color:var(--txt)}
.mi:hover{background:var(--acc10)}
.mi .ic{width:18px;text-align:center;opacity:.75}
.mi .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.mi[aria-expanded="true"]{font-weight:650;color:var(--strong)}
.mi[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sous{margin:2px 0 6px 21px;padding-left:10px;border-left:2px solid var(--acc20);display:grid;gap:1px}
.sous .mi{padding:7px 10px;font-size:14px}
.sous .mi[aria-current="page"]{background:var(--solid);box-shadow:var(--shadow);color:var(--strong);font-weight:650}
.sous .mi[aria-current="page"]::before{content:"";position:absolute;margin-left:-22px;width:2px;height:20px;background:var(--accent);border-radius:2px}
.bad{margin-left:auto;font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--soft)}
.bad.w{background:var(--warn10);color:var(--warn)}.bad.d{background:var(--dan10);color:var(--danger)}
.ac{font-size:10px;letter-spacing:.5px;text-transform:uppercase;background:var(--warn10);color:var(--warn);border-radius:6px;padding:1px 5px;margin-left:6px;font-weight:650;white-space:nowrap}
.legende{margin:12px 6px 4px;padding:10px 10px 6px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);display:grid;gap:6px}
.legende span{margin-left:0;margin-right:6px}
.bandeau{background:var(--inf10);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:14px}
.de{font-size:10px;letter-spacing:.5px;text-transform:uppercase;background:var(--inf10);color:var(--info);border-radius:6px;padding:1px 5px;margin-left:6px;font-weight:650;white-space:nowrap}
.neuf{font-size:10px;letter-spacing:.5px;text-transform:uppercase;background:var(--acc10);color:var(--accent);border-radius:6px;padding:1px 5px;margin-left:6px;font-weight:650}
/* page */
.fil{font-size:13px;color:var(--muted);margin:2px 0 6px}
h1{font-size:26px;margin:0 0 4px;color:var(--strong);letter-spacing:-.2px;text-wrap:balance}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.tete .meta{font-size:13px;color:var(--muted);margin-right:auto}
.btn{background:var(--solid);border:1px solid var(--line2);border-radius:11px;padding:7px 13px;font-size:14px;color:var(--strong)}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.p{color:#06231f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#06231f}}
.btn.d{color:var(--danger);border-color:var(--dan10)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.s{padding:4px 10px;font-size:13px}
.sec{padding:16px 18px;margin-bottom:16px}
.sec h2{font-size:16px;margin:0;color:var(--strong)}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh .meta{font-size:12.5px;color:var(--muted)}
.sh .dr{margin-left:auto;display:flex;gap:6px}
/* verdict */
.verdict{display:flex;gap:14px;align-items:stretch;margin-bottom:14px}
.vm{width:5px;border-radius:4px;background:var(--ok)}.vm.w{background:var(--warn)}.vm.d{background:var(--danger)}
.verdict p{margin:0}.vt{font-size:19px;font-weight:700;color:var(--strong);text-wrap:balance}.vs{color:var(--soft);font-size:14px;margin-top:2px!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left}
button.kpi:hover{border-color:var(--accent)}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font:650 22px/1.25 "JetBrains Mono",ui-monospace,monospace;color:var(--strong)}
.kpi b.w{color:var(--warn)}.kpi b.d{color:var(--danger)}
.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--soft)}
/* pastilles */
.pl{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--soft);white-space:nowrap}
.pl::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pl.ok{background:var(--ok10);color:var(--ok)}.pl.w{background:var(--warn10);color:var(--warn)}.pl.d{background:var(--dan10);color:var(--danger)}.pl.i{background:var(--inf10);color:var(--info)}
.pl.nu::before{display:none}
/* lignes */
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) auto;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 13px;text-align:left;width:100%}
button.row:hover{border-color:var(--accent);background:var(--solid)}
.row .nm{min-width:0}.row .nm b{display:block;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.row .nm small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cote{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px;color:var(--soft)}
@media (max-width:700px){.row{grid-template-columns:1fr}.row .cote{align-items:flex-start;flex-direction:row;flex-wrap:wrap}}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06231f}
input[type=search],input[type=text],input[type=number],select{font:inherit;color:var(--strong);background:var(--solid);border:1px solid var(--line2);border-radius:11px;padding:7px 11px;min-width:0}
/* bande de disponibilité */
.bande{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;height:26px;min-width:0}
.bande i{border-radius:2px;background:var(--ok);opacity:.85}
.bande i.w{background:var(--warn)}.bande i.d{background:var(--danger)}.bande i.n{background:var(--line2)}
.bande i:hover{opacity:1;transform:scaleY(1.15)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg.sp{width:100%;height:34px;display:block}
/* certificats */
.frise{position:relative;height:22px;background:var(--line);border-radius:999px;overflow:hidden}
.frise i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ok)}
.frise i.w{background:var(--warn)}.frise i.d{background:var(--danger)}
.graduation{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:4px 0 12px}
/* fiche (tiroir) */
.voile{position:fixed;inset:0;background:rgba(16,24,40,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.voile.on{opacity:1;pointer-events:auto}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--bg);z-index:41;box-shadow:var(--lift);transform:translateX(102%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow:auto;padding:18px}
.tiroir.on{transform:none}
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px;overflow:auto}
.onglets button{background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 11px;color:var(--soft);white-space:nowrap;font-size:14px}
.onglets button[aria-selected="true"]{color:var(--strong);border-bottom-color:var(--accent);font-weight:650}
dl.paires{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 12px;margin:0;font-size:14px}
dl.paires dt{color:var(--muted)}dl.paires dd{margin:0;color:var(--strong)}
.encart{background:var(--acc10);border-radius:12px;padding:10px 13px;font-size:13.5px;margin:10px 0}
.encart.w{background:var(--warn10)}.encart.d{background:var(--dan10)}
.gest{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.jl{display:grid;gap:7px;font-size:13.5px}
.jl div{display:grid;grid-template-columns:86px auto minmax(0,1fr);gap:9px;align-items:baseline}
.jl .t{color:var(--muted);font-size:12.5px}
/* vignettes : l'aperçu du site, comme dans l'écran actuel */
.vg{position:relative;width:84px;height:56px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);flex:none;background:var(--solid)}
.vg svg{display:block;width:100%;height:100%}
.vg.gd{width:100%;height:auto;aspect-ratio:16/8;border-radius:14px;cursor:zoom-in;margin:12px 0 4px;box-shadow:var(--shadow)}
.vg.bas svg{filter:grayscale(1) brightness(.75)}
.vg .et{position:absolute;inset:auto 0 0 0;font-size:10.5px;text-align:center;padding:2px 0;background:rgba(190,18,60,.9);color:#fff;letter-spacing:.3px}
.vg.gd .et{font-size:13px;padding:6px 0}
.vg .ini{position:absolute;inset:0;display:grid;place-items:center;font:650 17px "JetBrains Mono",monospace;color:var(--muted);background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 6px,transparent 6px,transparent 12px)}
.vg.gd .ini{font-size:15px;font-family:inherit;font-weight:500;padding:0 20px;text-align:center}
.row.site{grid-template-columns:auto minmax(0,1.5fr) minmax(0,1.2fr) auto}
@media (max-width:700px){.row.site{grid-template-columns:auto minmax(0,1fr)}.row.site>div:nth-child(3),.row.site>.cote{grid-column:1/-1}}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(10,16,20,.82);display:none;place-items:center;padding:24px;cursor:zoom-out}
.zoom.on{display:grid}.zoom .vg{width:min(1000px,94vw);height:auto;aspect-ratio:16/10;border-radius:14px;cursor:zoom-out}
.silence{color:var(--soft);font-size:14px;padding:6px 0}
.grille2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.champ{display:grid;gap:4px;margin-bottom:12px;font-size:14px}.champ small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--strong);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ── deuxième version : incidents, calendrier, sociétés, page d'un site, échelle, téléphone ── */
.bande i.m{background:var(--info)}
.row.site{grid-template-columns:auto minmax(0,1.6fr) minmax(0,1.2fr) auto}
.row.site:hover{border-color:var(--accent)}
.row.site .ouv{display:flex;gap:11px;align-items:center;background:none;border:0;text-align:left;padding:0;min-width:0;color:inherit}
.ouv .nm{display:block;min-width:0}
@media (max-width:700px){.row.site{grid-template-columns:auto minmax(0,1fr)}.row.site>.bz,.row.site>.cote{grid-column:1/-1}}
details.grp{margin-bottom:8px}
details.grp>summary{cursor:pointer;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);padding:8px 2px;list-style:none;display:flex;gap:8px;align-items:center;font-weight:650}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸";transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
.lot{position:sticky;bottom:12px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--strong);color:var(--bg);border-radius:14px;padding:9px 14px;box-shadow:var(--lift);margin-top:12px;font-size:14px}
.lot .btn,.lot select{background:transparent;color:inherit;border-color:rgba(127,127,127,.55)}
.lot select option{color:#101828}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:13px;color:var(--muted);margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .ent{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .j{min-height:66px;border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:10px;background:var(--surface2);padding:5px 6px;text-align:left;font-size:11.5px;color:var(--soft);display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .j b{font:600 12px "JetBrains Mono",ui-monospace,monospace;color:var(--strong)}
.cal .j.ok{border-left-color:var(--ok)}
.cal .j.w{border-left-color:var(--warn);background:var(--warn10)}
.cal .j.d{border-left-color:var(--danger);background:var(--dan10)}
.cal .j.m{border-left-color:var(--info);background:var(--inf10)}
.cal .j.vide{visibility:hidden}
.cal .j.futur{opacity:.4;cursor:default}
.cal .j.sel{outline:2px solid var(--accent);outline-offset:1px}
.cal .j.auj b::after{content:" · auj.";font:500 10.5px Inter,sans-serif;color:var(--accent)}
.cal .j span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
@media (max-width:700px){.cal .j{min-height:46px;padding:4px}.cal .j span{display:none}.cal .j i{display:inline}}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.choix .c{border:1px solid var(--line2);border-radius:14px;padding:13px 14px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.choix .c.pr{border-color:var(--accent);background:var(--acc10)}
.choix h3{margin:0;font-size:15px;color:var(--strong)}
.choix p{margin:0;font-size:13.5px;color:var(--soft)}
.etapes{display:grid;gap:6px;margin:4px 0;padding:0;list-style:none;font-size:14px}
.etapes li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:baseline}
.etapes li::before{content:"○";color:var(--muted)}
.etapes li.fait::before{content:"✓";color:var(--ok);font-weight:700}
.etapes li.cours::before{content:"…";color:var(--accent);font-weight:700}
.chrono{display:grid;gap:9px;font-size:13.5px;border-left:2px solid var(--line2);padding-left:14px;margin-left:5px}
.chrono div{position:relative}
.chrono div::before{content:"";position:absolute;left:-19px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.chrono .t{color:var(--muted);font-size:12.5px;margin-right:8px}
textarea{font:inherit;color:var(--strong);background:var(--solid);border:1px solid var(--line2);border-radius:11px;padding:8px 11px;width:100%;min-height:70px;resize:vertical}
.wrap{overflow-x:auto}
table.tab{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.tab th,table.tab td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tab th{color:var(--muted);font-weight:600;font-size:12px}
.site-t{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.site-t .vg.gd{margin:0}

        <button class="kpi" onclick="aller('alertes')"><span>Alertes</span><b class="${graves.length ? 'd' : moy.length ? 'w' : ''}">${graves.length + moy.length}</b><em>${graves.length} grave${graves.length > 1 ? 's' : ''} · ${moy.length} à regarder</em></button>
        <button class="kpi" onclick="aller('sites','sans')"><span>Sauvegardes</span><b class="${sansSauv ? 'w' : ''}">${pan.length ? (pan.length - sansSauv) + ' / ' + pan.length : '—'}</b><em>${pan.length ? (sansSauv ? sansSauv + ' sans copie' : 'tous couverts') : 'pas de panneau'}</em></button>
        <button class="kpi" onclick="aller('sites','analyse')"><span>Analyses</span><b class="${pan.some(s => s.analyse === 'jamais') ? 'w' : ''}">${pan.length ? (pan.filter(s => s.analyse === 'jamais').length ? pan.filter(s => s.analyse === 'jamais').length + ' à revoir' : 'à jour') : '—'}</b><em>antivirus · sites du panneau</em></button>
        <div class="kpi"><span>Disque</span><b>${go(l.reduce((a, s) => a + (s.disque || 0), 0))}</b><em>fichiers des sites de la machine</em></div>
      </div></section>
    ${parSoc}
    <section class="sec carte"><div class="sh"><h2>Ce qui demande un geste</h2><span class="meta">les incidents d’abord, puis le plus grave</span><span class="dr"><button class="btn s" onclick="aller('alertes')">Toutes les alertes</button></span></div>
      ${io.length || al.length ? `<div class="rows">${io.map(incidentLigne).join('')}${al.slice(0, 4).map(alerteHtml).join('')}</div>` : '<p class="silence"><b>Rien ne demande un geste.</b></p>'}</section>
    <div class="grille2">
      <section class="sec carte"><div class="sh"><h2>Les plus fragiles</h2><span class="meta">disponibilité sur 30 jours</span></div><div class="rows">${mes.slice().sort((a, b) => pct(a, 30) - pct(b, 30)).slice(0, 3).map(s => `<button class="row" ${G('minmax(0,1fr) minmax(0,1.2fr) auto')} onclick="aller('calendrier','${s.d}')"><div class="nm"><b><code>${E(s.d)}</code></b></div>${bande(s, 30)}<span class="num">${fpct(pct(s, 30))}</span></button>`).join('') || '<p class="silence">Pas encore de mesure.</p>'}</div></section>
      <section class="sec carte"><div class="sh"><h2>Derniers événements</h2><span class="dr"><button class="btn s" onclick="aller('journal')">Tout le journal</button></span></div>${journalHtml(4)}</section>
    </div>
    <section class="sec carte"><div class="sh"><h2>Si ceci tombe, qui est touché ?</h2>${tag('Sensorium')}<span class="meta">les dépendances déclarées : hébergé par, certifié par, résolu par</span></div>
      <div class="chips">${OBJETS.map(o => `<button class="chip" aria-pressed="${ETAT.impact === o[0]}" onclick="ETAT.impact='${o[0]}';rendre()">${E(o[1])}</button>`).join('')}</div>
      ${(() => { const o = OBJETS.find(x => x[0] === ETAT.impact), ls = l.filter(o[2]); return ls.length ? `<p class="silence" style="padding-top:0"><b>${ls.length} site${ls.length > 1 ? 's' : ''}</b> sur ${l.length} dépend${ls.length > 1 ? 'ent' : ''} de ${E(o[1])}.</p><div class="pills">${ls.slice(0, 12).map(s => `<button class="chip" onclick="aller('site','${s.d}','liens')"><code>${E(s.d)}</code></button>`).join('')}${ls.length > 12 ? `<span class="silence">et ${ls.length - 12} autres</span>` : ''}</div>` : `<p class="silence">Aucun de ces sites ne dépend de ${E(o[1])}.</p>`; })()}</section>
    <section class="sec carte"><div class="sh"><h2>D’où viennent les chiffres</h2><span class="meta">et leur âge</span></div><div class="rows">
      <div class="row" ${G('auto minmax(0,1fr) auto')}>${pill('sensorium', 'ok')}<div class="nm"><b>Le Sensorium</b><small>il relève : réponse et durée, pannes et retours, PHP, disque, CMS, bases, courrier, sauvegardes, attaques. Sites le questionne, il ne sonde plus de son côté. Relancé par Cassandra cette nuit à 02:40 : 6 minutes sans mesure.</small></div><span class="num">il y a 2 min</span></div>
      <div class="row" ${G('auto minmax(0,1fr) auto')}>${pill('comptes', 'ok')}<div class="nm"><b>Les comptes et les sociétés</b><small>à qui est chaque site : c’est ce qui fait que chacun voit tout de ses sites, et rien de ceux des autres</small></div><span class="num">il y a 2 min</span></div>
      <div class="row" ${G('auto minmax(0,1fr) auto')}>${pill('certificats', 'ok')}<div class="nm"><b>Le module Certificats</b><small>échéance, quota d’émission, renouvellement : Sites les lit, ne les refait pas</small></div><span class="num">il y a 38 min</span></div>
      <div class="row" ${G('auto minmax(0,1fr) auto')}>${pill(ETAT.sans ? 'absent' : 'panneau', ETAT.sans ? 'w' : '')}<div class="nm"><b>FastPanel, facultatif</b><small>${ETAT.sans ? 'pas installé : Sites s’en passe' : 'quand il est là : le propriétaire du panneau, ses copies de sauvegarde, ses gestes'}</small></div><span class="num">${ETAT.sans ? '—' : '04:31'}</span></div></div></section>`;
  },

  sites(){
    let l = sites(); const q = ETAT.q.toLowerCase(), f = ETAT.filtre;
    if (q) l = l.filter(s => (s.d + ' ' + s.compte + ' ' + s.soc).toLowerCase().includes(q));
    const F = {tombes: s => s.up === false, regarder: s => etat(s).r < 2, panneau: s => !hors(s), declares: s => hors(s), sans: s => !hors(s) && s.sauv == null, analyse: s => !hors(s) && s.analyse === 'jamais', sanssoc: s => !s.soc};
    if (F[f]) l = l.filter(F[f]);
    l = l.slice().sort((a, b) => etat(a).r - etat(b).r || (pct(a, 30) ?? 101) - (pct(b, 30) ?? 101));
    const chips = [['', 'tous'], ['tombes', 'en panne'], ['regarder', 'à regarder'], ['panneau', 'du panneau'], ['declares', 'déclarés'], ['sans', 'sans sauvegarde'], ['analyse', 'jamais analysés']].concat(admin() ? [['sanssoc', 'sans société']] : []);
    const pg = pager(l, 'sites'), cle = ETAT.role === 'super' ? (s => s.soc || 'Sans société — à attribuer') : ETAT.role === 'admin' ? (s => s.compte || 'Sans compte') : null;
    let corps;
    if (!l.length) corps = '<p class="silence"><b>Aucun site</b> pour ce filtre.</p>';
    else if (cle){ const g = {}; pg.page.forEach(s => (g[cle(s)] = g[cle(s)] || []).push(s)); corps = Object.keys(g).sort().map(c => `<details class="grp" open><summary>${E(c)} · ${g[c].length}</summary><div class="rows">${g[c].map(ligne).join('')}</div></details>`).join(''); }
    else corps = `<div class="rows">${pg.page.map(ligne).join('')}</div>`;
    const nc = ETAT.coche.size, lot = nc ? `<div class="lot"><b>${nc} site${nc > 1 ? 's' : ''} choisi${nc > 1 ? 's' : ''}</b><button class="btn s" onclick="[...ETAT.coche].forEach(d => { if (!enMaintenance(d)) FENETRES.push({d, fin:'dans 2 h', raison:'intervention', par:'toi'}); });ETAT.coche.clear();rendre();toast('Fenêtre de maintenance posée sur ${nc} site(s).')">Maintenance 2 h</button><button class="btn s" onclick="[...ETAT.coche].forEach(d => SUIVIS.add(d));ETAT.coche.clear();rendre();toast('${nc} site(s) suivis.')">Suivre</button>
      ${ETAT.role === 'super' ? `<select id="lot-soc" aria-label="Société">${SOCIETES.map(s => `<option>${s}</option>`).join('')}</select><button class="btn s" onclick="const so=$('lot-soc').value;[...ETAT.coche].forEach(d => trouver(d).soc = so);ETAT.coche.clear();rendre();toast('Site(s) attribué(s) à ' + so + '.')">Attribuer à cette société</button>` : ''}
      <button class="btn s" onclick="toast('Export CSV des sites choisis (maquette).')">Exporter</button><button class="btn s" onclick="ETAT.coche.clear();rendre()">Tout décocher</button></div>` : '';
    return tete('Tous les sites', `${sites().length} sites · le pire d’abord · ${quiRegarde()}`, `${admin() ? `<button class="btn" aria-pressed="${ETAT.masse}" onclick="ETAT.masse=!ETAT.masse;ETAT.pg={};rendre()" title="Ajoute 193 sites fictifs pour juger l’écran à l’échelle">${ETAT.masse ? 'Revenir à 9 sites' : 'Essayer avec 200 sites'}</button>` : ''}<button class="btn p" onclick="ETAT.declare=!ETAT.declare;rendre()">Déclarer un site</button>`) + `
    <section class="sec carte"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><input type="search" id="q" placeholder="Chercher un site${admin() ? ', un compte, une société' : ''}" aria-label="Chercher" value="${E(ETAT.q)}" oninput="ETAT.q=this.value;ETAT.pg={};rendre('q')" style="flex:1 1 220px">
      ${ETAT.role === 'super' ? `<select aria-label="Société" onchange="ETAT.soc=this.value;ETAT.pg={};rendre()"><option value="">toutes les sociétés</option>${SOCIETES.map(s => `<option ${ETAT.soc === s ? 'selected' : ''}>${s}</option>`).join('')}<option value="aucune" ${ETAT.soc === 'aucune' ? 'selected' : ''}>sans société</option></select>` : ''}</div>
      <div class="chips">${chips.map(c => `<button class="chip" aria-pressed="${f === c[0]}" onclick="ETAT.filtre='${c[0]}';ETAT.pg={};rendre()">${c[1]}</button>`).join('')}</div>
      ${ETAT.declare ? formDeclarer() : ''}${corps}${pg.html}${legende()}${lot}</section>`;
  },

  incidents(){
    const o = incidents(true), r = incidents(false);
    return tete('Incidents', `${o.length} ouvert${o.length > 1 ? 's' : ''} · ${r.length} résolu${r.length > 1 ? 's' : ''} sur 30 jours`, '') + `
    <section class="sec carte"><div class="sh"><h2>Ouverts</h2><span class="meta">une panne est un objet : un diagnostic, des actions, une chronologie, une cause</span></div>${o.length ? `<div class="rows">${o.map(incidentLigne).join('')}</div>` : '<p class="silence"><b>Aucun incident ouvert.</b> « Simuler une panne », en haut, en ouvre un.</p>'}</section>
    <section class="sec carte"><div class="sh"><h2>Résolus</h2><span class="meta">avec leur cause, pour ne pas la rechercher deux fois</span></div>${r.length ? `<div class="rows">${r.map(incidentLigne).join('')}</div>` : '<p class="silence">Aucun.</p>'}</section>`;
  },

  incident(){
    const i = INC.find(x => x.id === ETAT.inc);
    if (!i || !visible(i.d)) return tete('Incident', '', '') + '<section class="sec carte"><p class="silence">Cet incident n’est pas dans ta vue.</p></section>';
    const s = trouver(i.d), ouvert = i.etat !== 'resolu', mien = s.compte === MOI[ETAT.role], contact = 'Zoé Martin, hébergeur';
    const plan = ['Relancer le service PHP de ce site (lui seul, pas les autres).', 'Demander une relève au Sensorium et attendre deux mesures bonnes.', 'Si le 502 persiste : recharger nginx.', 'Te rendre compte, et noter la cause dans l’incident.'];
    const blocPlan = !i.plan ? '' : `<div class="encart"><b>${i.plan.fait >= plan.length ? 'Plan terminé.' : i.plan.accord ? 'Cassandra exécute le plan…' : 'Ce que Cassandra propose de faire'}</b> ${tag('agents')}<ol class="etapes">${plan.map((p, k) => `<li class="${k < i.plan.fait ? 'fait' : (i.plan.accord && k === i.plan.fait ? 'cours' : '')}">${p}</li>`).join('')}</ol>
      ${i.plan.accord ? '' : `<p class="silence" style="padding:0">Palier « raconter » : elle dit ce qu’elle ferait et attend ton accord. Elle agit en ton nom, avec tes droits, jamais plus.</p><div class="gest"><button class="btn p" onclick="incApprouver(${i.id})">Approuver et lancer</button><button class="btn" onclick="incAnnulerPlan(${i.id})">Non, je m’en occupe</button></div>`}</div>`;
    return `<p class="fil">Parc › Sites › Incidents › n° ${i.id}</p><button class="retour" onclick="aller('incidents')">‹ tous les incidents</button>
    <div class="tete"><h1><code>${E(i.d)}</code></h1><span class="meta">${pill(ouvert ? (i.etat === 'depannage' ? 'dépannage en cours' : 'incident ouvert') : 'résolu', ouvert ? 'd' : 'ok')} ${ouvert ? 'depuis ' + E(i.depuis) + ' · début ' + E(i.debut) : 'du ' + E(i.debut) + ' au ' + E(i.fin) + ' · ' + E(i.duree)}</span><button class="btn" onclick="aller('site','${i.d}')">La page du site</button></div>
    ${ouvert ? `<section class="sec carte"><div class="sh"><h2>Ce qui se passe</h2>${tag('Sensorium')}</div><p class="vs" style="color:var(--strong);font-size:15px;margin:0 0 10px">${E(i.diag)}</p><div class="rows">${i.preuves.map(p => `<div class="row" ${G('minmax(0,1fr) auto')}><div class="nm"><b>${E(p[0])}</b></div>${pill(p[1], p[2])}</div>`).join('')}</div></section>
    <section class="sec carte"><div class="sh"><h2>Que faire</h2><span class="meta">dépanner, pas seulement accuser réception</span></div>${blocPlan}
      <div class="choix">
        <div class="c pr"><h3>Demander à Cassandra de corriger</h3><p>Elle propose un plan, tu l’approuves, elle l’exécute et te rend compte. Chaque étape se défait.</p><div class="gest"><button class="btn p" ${i.plan ? 'disabled' : ''} onclick="incDemander(${i.id})">Demander un plan</button></div></div>
        <div class="c"><h3>Dépanner moi-même</h3><p>Les gestes qui répondent à cette panne, un par un.</p><div class="gest"><button class="btn s" onclick="incGeste(${i.id},'Relancer PHP')">Relancer PHP ${tag('à créer', 'ac')}</button><button class="btn s" onclick="incGeste(${i.id},'Recharger nginx')">Recharger nginx ${tag('Sensorium')}</button><button class="btn s" onclick="incJournaux(${i.id})">Voir les journaux ${tag('à créer', 'ac')}</button>${hors(s) ? '' : `<button class="btn s" onclick="incGeste(${i.id},'Restaurer la dernière copie')">Restaurer la dernière copie</button>`}<button class="btn s" onclick="incGeste(${i.id},'Relever à nouveau')">Relever à nouveau</button></div><div id="inc-log"></div></div>
        <div class="c"><h3>Confier à quelqu’un</h3><p>Créer une tâche pour un collègue, ou prévenir le contact rattaché au site (${contact}).</p><div class="gest"><button class="btn s" onclick="incNoter(${i.id},'Tâche créée et confiée à leo.');toast('Tâche créée dans le module Tâches.')">Créer une tâche ${tag('tâches')}</button><button class="btn s" onclick="incNoter(${i.id},'Contact prévenu : ${contact}.');toast('Message préparé pour ${contact}.')">Prévenir le contact ${tag('contacts')}</button></div></div>
        <div class="c"><h3>Le temps d’intervenir</h3><p>Taire les alertes de ce site sans arrêter les mesures, ou dire que la panne est connue.</p><div class="gest">${enMaintenance(i.d) ? `<button class="btn s" onclick="finMaintenance('${i.d}')">Fin de la maintenance</button>` : `<button class="btn s" onclick="maintenance('${i.d}','2 h');incNoter(${i.id},'Site mis en maintenance pour 2 h.')">Maintenance 2 h ${tag('Sensorium')}</button>`}<button class="btn s" onclick="incNoter(${i.id},'Panne connue : acceptée pour 24 h.');toast('Panne acceptée : elle se tait 24 h, l’incident reste ouvert.')">C’est connu, je gère</button></div></div>
      </div></section>` : `<section class="sec carte"><div class="sh"><h2>Cause</h2></div><p class="vs" style="color:var(--strong);font-size:15px;margin:0">${E(i.cause || 'non notée')}</p><p class="silence">Résolu par : ${E(i.par)}.</p></section>`}
    <div class="grille2">
      <section class="sec carte"><div class="sh"><h2>Chronologie</h2><span class="meta">qui a su, qui a fait quoi</span></div><div class="chrono">${i.chrono.map(c => `<div><span class="t num">${E(c[0])}</span>${E(c[1])}</div>`).join('')}</div></section>
      <section class="sec carte"><div class="sh"><h2>${ouvert ? 'Clore' : 'Note'}</h2></div>
        ${ouvert ? `<label class="champ"><span>La cause, pour la prochaine fois</span><textarea id="inc-note" placeholder="Ce qui s’est passé, ce qui l’a réglé…">${E(i.note)}</textarea></label><div class="gest"><button class="btn p" ${s.up === false ? 'disabled title="Le site ne répond pas encore"' : ''} onclick="incClore(${i.id})">Clore l’incident</button><button class="btn" onclick="aller('calendrier','${i.d}')">Voir dans le calendrier</button></div>${s.up === false ? '<p class="silence">Un incident se clôt quand le site répond de nouveau.</p>' : ''}` : `<p class="silence" style="padding-top:0">Cet incident est clos. Il reste dans le calendrier du site.</p><div class="gest"><button class="btn" onclick="aller('calendrier','${i.d}')">Voir dans le calendrier</button></div>`}</section>
    </div>`;
  },

  alertes(){
    const al = alertes(), tues = alertes.tues.filter(a => ACCEPTEES[a.t]);
    return tete('Alertes', `${al.filter(a => a.n === 'd').length} graves · ${al.filter(a => a.n === 'w').length} à regarder · ${al.filter(a => a.n === 'i').length} pour information · les pannes sont dans Incidents`, '') + `
    <section class="sec carte">${al.length ? `<div class="rows">${al.map(alerteHtml).join('')}</div>` : '<p class="silence"><b>Rien ne demande un geste.</b></p>'}</section>
    <section class="sec carte"><div class="sh"><h2>Fenêtres de maintenance</h2>${tag('Sensorium')}<span class="meta">les alertes du site se taisent, les mesures continuent</span></div>
      ${FENETRES.filter(f => visible(f.d)).length ? `<div class="rows">${FENETRES.filter(f => visible(f.d)).map(f => `<div class="row" ${G('auto minmax(0,1fr) auto')}>${pill('en cours', 'i')}<div class="nm"><b><code>${E(f.d)}</code></b><small>${E(f.raison)} · posée par ${E(f.par)} · jusqu’à ${E(f.fin)}</small></div><button class="btn s" onclick="finMaintenance('${f.d}')">Annuler</button></div>`).join('')}</div>` : '<p class="silence">Aucune fenêtre en cours.</p>'}
      <div class="gest" style="align-items:center"><select id="fm-d" aria-label="Site">${sites().filter(s => !enMaintenance(s.d)).slice(0, 40).map(s => `<option>${E(s.d)}</option>`).join('')}</select><select id="fm-t" aria-label="Durée"><option>1 h</option><option selected>2 h</option><option>une nuit</option><option>24 h</option></select><button class="btn" onclick="maintenance($('fm-d').value, $('fm-t').value)">Poser une fenêtre</button></div></section>
    <section class="sec carte"><div class="sh"><h2>Alertes acceptées</h2>${tag('Sensorium')}<span class="meta">« je sais, c’est normal » : elles se taisent jusqu’à l’échéance</span></div>
      ${tues.length ? `<div class="rows">${tues.map(a => `<div class="row" ${G('auto minmax(0,1fr) auto')}>${pill('acceptée', '')}<div class="nm"><b>${E(a.t)}</b><small>jusqu’à ${E(ACCEPTEES[a.t].jusqu)} · revient si son chiffre monte</small></div><button class="btn s" onclick="delete ACCEPTEES[${JSON.stringify(a.t).replace(/"/g, '&quot;')}];rendre();toast('Elle redevient une alerte.')">Ne plus accepter</button></div>`).join('')}</div>` : '<p class="silence">Aucune. Le bouton « Accepter » d’une alerte la range ici.</p>'}</section>
    <section class="sec carte"><div class="sh"><h2>Qui est prévenu, et comment</h2></div><p class="silence" style="padding-top:0">Le propriétaire reçoit les alertes de ses sites ; les administrateurs de sa société aussi ; les super-administrateurs reçoivent celles des sites sans société. Une mesure ratée isolée ne prévient personne.</p>
      <div class="rows">
        <label class="row" ${G('auto minmax(0,1fr) auto')}><input type="checkbox" checked disabled><div class="nm"><b>Dans Cassandra (la cloche)</b><small>toujours : c’est le seul canal qui marche aujourd’hui</small></div>${tag('notifications')}</label>
        <label class="row" ${G('auto minmax(0,1fr) auto')}><input type="checkbox" onchange="toast(this.checked ? 'Tu recevras un courriel à chaque incident et à chaque retour.' : 'Plus de courriel.')"><div class="nm"><b>Par courriel</b><small>à l’adresse de contact du compte ; demande un serveur d’envoi de l’instance</small></div>${tag('à créer', 'ac')}</label>
        <label class="row" ${G('auto minmax(0,1fr) auto')}><input type="checkbox" onchange="toast(this.checked ? 'Tu recevras un message Telegram pour les incidents.' : 'Plus de message Telegram.')"><div class="nm"><b>Par Telegram</b><small>les incidents seulement, par le robot du compte</small></div>${tag('à créer', 'ac')}</label>
      </div></section>`;
  },

  dispo(){
    const n = ETAT.periode, l = sites().filter(s => pct(s, n) != null).sort((a, b) => pct(a, n) - pct(b, n)), sansMesure = sites().filter(s => pct(s, n) == null), pg = pager(l, 'dispo');
    return tete('Disponibilité', `tous les sites, comparés · un trait par jour`, periodes()) + `
    <section class="sec carte"><div class="rows">${pg.page.map(s => { const v = pct(s, n), av = pct(s, n, n), ec = v - s.objectif, d = av == null ? null : Math.round((v - av) * 100) / 100;
      return `<button class="row" ${G('minmax(0,1fr) minmax(0,1.6fr) minmax(0,.9fr) auto')} onclick="aller('calendrier','${s.d}')"><div class="nm"><b><code>${E(s.d)}</code></b><small>objectif ${fpct(s.objectif)} · ${ec >= 0 ? 'tenu' : 'manqué de ' + fpct(Math.round(-ec * 100) / 100)}</small></div>${bande(s, n)}${courbe(s)}<div class="cote"><span class="num"><b style="color:var(--${ec >= 0 ? 'strong' : 'danger'})">${fpct(v)}</b></span><span class="delta ${d == null ? '' : d >= 0 ? 'h' : 'b'}">${d == null ? 'pas de période d’avant' : (d >= 0 ? '▲ +' : '▼ ') + d.toLocaleString('fr-FR') + ' pt vs les ' + n + ' j d’avant'}</span></div></button>`; }).join('') || '<p class="silence">Pas encore de mesure.</p>'}</div>${pg.html}
      ${sansMesure.length ? `<p class="silence">Pas encore de mesure sur cette période : ${sansMesure.slice(0, 6).map(s => '<code>' + E(s.d) + '</code>').join(', ')}${sansMesure.length > 6 ? '…' : ''}. Ils n’ont pas 100 % : ils n’ont pas de chiffre.</p>` : ''}${legende()}<div class="leg"><span>┄ seuil « lent » : ${nb(REGL.lent)} ms</span></div></section>
    <section class="sec carte"><div class="sh"><h2>Ce qui s’annonce</h2>${tag('Sensorium')}<span class="meta">la pente des trente derniers jours, jamais une date inventée</span></div><div class="rows">
      ${[['atelier.exemple.test', 'w', 'Temps de réponse en hausse', 'à ce rythme, au-dessus de 5 s dans environ 12 jours'], ['atelier.exemple.test', 'w', 'Disque du compte qui se remplit', '5 Go sur 8 : plein dans environ 40 jours'], ['boutique.exemple.test', '', 'Rien ne s’annonce', 'la tendance est plate : aucune prévision, plutôt qu’une date fausse']].filter(x => visible(x[0])).map(x => `<button class="row" ${G('auto minmax(0,1fr)')} onclick="aller('site','${x[0]}','dispo')">${pill(x[1] ? 'à prévoir' : 'stable', x[1] || 'ok')}<div class="nm"><b><code>${x[0]}</code> · ${x[2]}</b><small>${x[3]}</small></div></button>`).join('') || '<p class="silence">Rien ne s’annonce.</p>'}</div></section>
    <section class="sec carte"><div class="sh"><h2>Comment c’est compté</h2></div><p class="silence">Une mesure toutes les 5 minutes. Une panne se dit au ${REGL.echecs}ᵉ échec de suite et commence au premier ; une panne qui dure encore compte jusqu’à maintenant. Les jours de maintenance et les jours sans mesure ne comptent ni pour ni contre.</p></section>`;
  },

  calendrier(){
    const l = sites(); if (!l.length) return tete('Calendrier', '', '') + '<section class="sec carte"><p class="silence">Aucun site.</p></section>';
    const s = l.find(x => x.d === ETAT.calSite) || l[0], [an, mo] = ETAT.calMois.split('-').map(Number), premier = new Date(an, mo - 1, 1), nj = new Date(an, mo, 0).getDate(), vide = (premier.getDay() + 6) % 7;
    const moisDe = k => { const d = new Date(an, mo - 1 + k, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
    const jours = Array.from({length: nj}, (_, k) => { const d = new Date(an, mo - 1, k + 1), il = ilYA(d); return {d, il, e: il < 0 ? 'futur' : il > 89 ? 'n' : s.dispo[89 - il], ev: evenements(s, il)}; });
    const sym = {d:'●', w:'●', m:'■', n:'○', s:'◆', c:'▲', g:'✎', i:'⚑'};
    const cases = jours.map(j => `<button class="j ${j.e === 'ok' ? 'ok' : j.e} ${j.il === 0 ? 'auj' : ''} ${ETAT.calJour === iso(j.d) ? 'sel' : ''}" ${j.e === 'futur' ? 'disabled' : ''} onclick="ETAT.calJour='${iso(j.d)}';rendre()" aria-label="${j.d.getDate()} ${MOIS[mo - 1]} : ${j.ev.map(x => x[1]).join(', ') || 'rien à signaler'}"><b>${j.d.getDate()}</b>${j.ev.slice(0, 3).map(x => `<span><i style="font-style:normal">${sym[x[0]]}</i> ${E(x[1])}</span>`).join('')}</button>`).join('');
    const sel = jours.find(j => iso(j.d) === ETAT.calJour);
    const mesures = jours.filter(j => ['ok', 'w', 'd'].includes(j.e)), v = mesures.length ? Math.round(mesures.reduce((t, j) => t + (j.e === 'ok' ? 1 : j.e === 'w' ? 0.985 : 0.62), 0) / mesures.length * 10000) / 100 : null;
    const coup = jours.filter(j => j.e === 'w' || j.e === 'd').length, sauv = jours.filter(j => j.ev.some(x => x[0] === 's')).length;
    const avant = (() => { const d0 = new Date(an, mo - 2, 1), n0 = new Date(an, mo - 1, 0).getDate(), a = Array.from({length: n0}, (_, k) => { const il = ilYA(new Date(d0.getFullYear(), d0.getMonth(), k + 1)); return il < 0 || il > 89 ? null : s.dispo[89 - il]; }).filter(x => ['ok', 'w', 'd'].includes(x)); return a.length ? Math.round(a.reduce((t, x) => t + (x === 'ok' ? 1 : x === 'w' ? 0.985 : 0.62), 0) / a.length * 10000) / 100 : null; })();
    return tete('Calendrier', 'tout ce qui est arrivé à un site, jour par jour', `<select aria-label="Site" onchange="aller('calendrier', this.value, ETAT.calMois)">${l.slice(0, 60).map(x => `<option ${x.d === s.d ? 'selected' : ''}>${E(x.d)}</option>`).join('')}</select>`) + `
    <section class="sec carte"><div class="sh"><button class="btn s" ${moisDe(-1) < '2026-08' ? 'disabled' : ''} onclick="aller('calendrier','${s.d}','${moisDe(-1)}')" aria-label="Mois précédent">‹</button><h2 style="min-width:150px;text-align:center">${MOIS[mo - 1]} ${an}</h2><button class="btn s" ${moisDe(1) > '2026-11' ? 'disabled' : ''} onclick="aller('calendrier','${s.d}','${moisDe(1)}')" aria-label="Mois suivant">›</button><span class="dr"><button class="btn s" onclick="aller('site','${s.d}')">La page du site</button></span></div>
      <div class="cal">${['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'].map(x => `<div class="ent">${x}</div>`).join('')}${'<div class="j vide"></div>'.repeat(vide)}${cases}</div>
      <div class="leg"><span>● coupure</span><span>⚑ incident</span><span>■ maintenance</span><span>◆ sauvegarde</span><span>▲ certificat</span><span>✎ geste</span><span>○ pas de mesure</span></div>
      ${sel ? `<div class="encart"><b>${sel.d.getDate()} ${MOIS[mo - 1]}</b>${sel.ev.length ? `<div class="jl" style="margin-top:8px">${sel.ev.map(x => `<div><span class="t">${sym[x[0]]}</span><span></span><span>${E(x[1])}${x[2] ? ` · <a href="#incident/${x[2]}" onclick="aller('incident','${x[2]}');return false">ouvrir l’incident</a>` : ''}</span></div>`).join('')}</div>` : ' — rien à signaler : le site a répondu toute la journée.'}</div>` : '<p class="silence">Clique un jour pour voir ce qui s’y est passé.</p>'}</section>
    <section class="sec carte"><div class="sh"><h2>Le mois en chiffres</h2><span class="dr"><button class="btn s" onclick="toast('PDF du rapport (maquette).')">Télécharger</button><button class="btn s" onclick="toast('Envoi au propriétaire (maquette).')">Envoyer au propriétaire ${tag('à créer', 'ac')}</button></span></div>
      ${v == null ? '<p class="silence"><b>Pas de mesure ce mois-là.</b> Le rapport dit « pas de mesure » ; il n’emprunte pas les chiffres d’un autre mois.</p>' : `<div class="kpis"><div class="kpi"><span>Disponibilité</span><b class="${v < s.objectif ? 'w' : ''}">${fpct(v)}</b><em>objectif ${fpct(s.objectif)} · ${v >= s.objectif ? 'tenu' : 'manqué'}</em></div><div class="kpi"><span>Mois d’avant</span><b>${fpct(avant)}</b><em>${avant == null ? 'pas de mesure' : (v >= avant ? '▲ +' : '▼ ') + (Math.round((v - avant) * 100) / 100).toLocaleString('fr-FR') + ' pt'}</em></div><div class="kpi"><span>Jours avec coupure</span><b class="${coup ? 'w' : ''}">${coup}</b><em>sur ${mesures.length} jours mesurés</em></div><div class="kpi"><span>Sauvegardes</span><b>${sauv || '—'}</b><em>${sauv ? 'réussies ce mois' : hors(s) ? 'hors panneau' : 'aucune'}</em></div></div>`}
      <label class="champ" style="margin:14px 0 0;max-width:320px"><span>Objectif de ce site</span><span style="display:flex;gap:8px;align-items:center"><input type="number" step="0.1" min="90" max="100" value="${s.objectif}" style="max-width:110px" onchange="trouver('${s.d}').objectif=Math.max(90,Math.min(100,+this.value||99));rendre()"> % de disponibilité</span></label></section>`;
  },

  demandes(){
    const l = demandes(), pr = sites().filter(s => s.preuve === 'attente'), ac = ACCORDS.filter(a => visible(a.d));

      <div class="gest">${admin() ? `<button class="btn p" onclick="repondre('${s.d}',true)">Adossé, c’est fait</button><button class="btn" onclick="repondre('${s.d}',false)">Refuser…</button>` : `<button class="btn" onclick="repondre('${s.d}',false,true)">Annuler ma demande</button>`}<button class="btn" onclick="aller('site','${s.d}')">La page du site</button></div></div>`).join('') : '<p class="silence">Aucune demande ouverte.</p>'}</section>
    <section class="sec carte"><div class="sh"><h2>Preuves de propriété en attente</h2>${tag('à créer', 'ac')}<span class="meta">sans panneau pour dire à qui est un site, c’est la preuve qui le dit</span></div>${pr.length ? `<div class="rows">${pr.map(s => `<button class="row" ${G('minmax(0,1fr) auto')} onclick="aller('site','${s.d}')"><div class="nm"><b><code>${E(s.d)}</code></b><small>déclaré par ${E(s.compte)} · la preuve expire dans 6 jours</small></div>${pill('à prouver', 'i')}</button>`).join('')}</div>` : '<p class="silence">Aucune.</p>'}</section>
    <section class="sec carte"><div class="sh"><h2>Accords en cours</h2><span class="neuf">nouveau</span><span class="meta">un propriétaire autorise un geste lourd, pour un temps borné</span></div>
      ${ac.length ? `<div class="rows">${ac.map(a => `<div class="row" ${G('minmax(0,1fr) auto auto')}><div class="nm"><b><code>${E(a.d)}</code> · ${E(a.geste)}</b><small>donné par ${E(a.par)} · tombe si le site change de compte</small></div>${pill('jusqu’à ' + a.fin, 'i')}${a.par === MOI[ETAT.role] ? `<button class="btn s d" onclick="ACCORDS.splice(ACCORDS.findIndex(x => x.d === '${a.d}'), 1);rendre();toast('Accord révoqué.')">Révoquer</button>` : '<span></span>'}</div>`).join('')}</div>` : '<p class="silence">Aucun accord en cours.</p>'}</section>`;
  },

  journal(){
    return tete('Journal', 'les gestes et la veille, fondus · un clic ouvre le site', '') + `<section class="sec carte"><div class="chips">${FAMILLES.map(c => `<button class="chip" aria-pressed="${ETAT.jfam === c}" onclick="ETAT.jfam='${c}';rendre()">${c}</button>`).join('')}</div>${journalHtml(99, ETAT.jfam)}</section>`;
  },

  reglages(){
    const num = (k, lib, aide, min, max, pas = 1) => `<label class="champ"><span>${lib}</span><input type="number" step="${pas}" min="${min}" max="${max}" value="${REGL[k]}" onchange="REGL.${k}=Math.max(${min},Math.min(${max},+this.value||${min}));rendre();toast('Réglage enregistré.')" style="max-width:140px"><small>${aide}</small></label>`;
    const coche = (k, lib, aide) => `<label class="champ" style="grid-template-columns:auto 1fr;align-items:start;column-gap:10px"><input type="checkbox" ${REGL[k] ? 'checked' : ''} onchange="REGL.${k}=this.checked;rendre();toast('Réglage enregistré.')" style="margin-top:5px"><span>${lib}<br><small>${aide}</small></span></label>`;
    const gestes = [['Déclarer un site', 'humain, compte, Cassandra, Itare', 'raconter', '—'], ['Retirer un site', 'humain, compte, Cassandra, Itare', 'raconter', '—'], ['Attribuer à un compte ou à une société', 'humain, Cassandra, Itare', 'raconter', 'administrer'], ['Transférer', 'humain, Cassandra', 'raconter', 'administrer'], ['Demander l’adossement', 'humain, compte, Cassandra, Itare', 'auto', '—'], ['Répondre à une demande', 'humain, Cassandra', 'raconter', 'administrer'], ['Donner un accord', 'humain, compte — jamais un agent', '—', '—'], ['Rattacher, détacher', 'humain, compte, Cassandra, Itare', 'auto', '—'], ['Dépanner un incident', 'humain, Cassandra', 'raconter', 'à créer']];
    const agents = `<section class="sec carte"><div class="sh"><h2>Ce que les agents peuvent faire sur ${admin() ? 'les sites' : 'tes sites'}</h2>${tag('noyau')}</div>
      <p class="silence" style="padding-top:0">Un agent agit toujours au nom d’un compte et n’a jamais plus de droits que lui. Chaque geste dit qui peut le faire. Au palier « raconter », l’agent dit ce qu’il ferait et attend un accord ; à « auto », il le fait et en rend compte.</p>
      <div class="wrap"><table class="tab"><thead><tr><th>Geste</th><th>Qui peut</th><th>Palier des agents</th><th>Droit exigé</th></tr></thead><tbody>${gestes.map(g => `<tr><td>${g[0]}</td><td>${g[1]}</td><td>${g[2] === '—' ? '—' : admin() ? `<select aria-label="Palier" onchange="toast('Palier réglé : ' + this.value + '.')"><option ${g[2] === 'raconter' ? 'selected' : ''}>raconter</option><option ${g[2] === 'auto' ? 'selected' : ''}>auto</option></select>` : g[2]}</td><td>${g[3] === 'à créer' ? tag('à créer', 'ac') : g[3]}</td></tr>`).join('')}</tbody></table></div>
      ${coche('prudence', 'Mes agents racontent toujours avant d’agir sur mes sites', 'Plus strict que le palier, jamais plus large : un compte ne peut pas donner à ses agents ce que l’administrateur leur refuse.')}</section>`;
    return tete('Réglages', admin() ? 'ce que l’écran appelle une panne, et ce que les agents peuvent faire' : 'ce que tes agents peuvent faire sur tes sites', '') + (admin() ? `<div class="grille2">
      <section class="sec carte"><div class="sh"><h2>Seuils d’alerte</h2>${tag('Sensorium')}</div>${num('echecs', 'Mesures ratées de suite avant une panne', '1 : dès la première. 2 évite les fausses alertes.', 1, 5)}${num('lent', 'Seuil « lent », en millisecondes', 'Au-delà, le site répond mais le visiteur s’en va.', 500, 60000)}${coche('proteges', 'Un 401 ou 403 est « en ligne »', 'Pour les sites protégés par un mot de passe.')}
        <div class="encart">Le seuil des certificats se règle dans Sécurité › Certificats. Essaie : passe « lent » à 4000, ou coche « 401 est en ligne » — alertes et pastilles changent tout de suite.</div></section>
      <section class="sec carte"><div class="sh"><h2>Objectifs</h2><span class="neuf">nouveau</span></div>${num('objectif', 'Objectif de disponibilité par défaut (%)', 'Chaque site peut avoir le sien, réglé dans son calendrier.', 90, 100, 0.1)}
        <div class="sh" style="margin-top:14px"><h2>Qui voit le menu Sites</h2><span class="neuf">nouveau</span></div><p class="silence" style="padding-top:0">Le menu n’apparaît que pour un compte concerné : il a un site (déclaré, attribué, ou du panneau par son compte lié), ou il administre une société qui en a. Les autres ne le voient pas.</p></section></div>` : '') + agents;
  },

  site(){

    const e = etat(s), mien = s.compte === MOI[ETAT.role], d = s.d, io = INC.find(i => i.d === d && i.etat !== 'resolu'), acc = ACCORDS.find(a => a.d === d);
    const O = [['apercu', 'Aperçu'], ['dispo', 'Disponibilité'], ['heberg', 'Hébergement'], ['secu', 'Sécurité'], ['liens', 'Liens'], ['journal', 'Journal']];

      <div class="gest"><button class="btn p" onclick="relever('${d}')">Relever maintenant</button>${enMaintenance(d) ? `<button class="btn" onclick="finMaintenance('${d}')">Fin de la maintenance</button>` : `<button class="btn" onclick="maintenance('${d}','2 h')">Maintenance 2 h</button>`}<button class="btn" aria-pressed="${SUIVIS.has(d)}" title="Recevoir un avis à chaque changement d’état (Sensorium)" onclick="SUIVIS.has('${d}') ? SUIVIS.delete('${d}') : SUIVIS.add('${d}');rendre();toast(SUIVIS.has('${d}') ? 'Tu seras prévenu à chaque changement d’état.' : 'Tu ne suis plus ce site.')">${SUIVIS.has(d) ? '★ Suivi' : '☆ Suivre'}</button><button class="btn" onclick="aller('calendrier','${d}')">Calendrier</button>${io ? `<button class="btn d" onclick="aller('incident','${io.id}')">Incident ouvert ›</button>` : ''}</div></div></div>
      <div class="onglets" role="tablist">${O.map(o => `<button role="tab" aria-selected="${ETAT.onglet === o[0]}" onclick="aller('site','${d}','${o[0]}')">${o[1]}</button>`).join('')}</div>
      <div role="tabpanel">${ONGLETS[ETAT.onglet](s, {mien, acc, io, e})}</div></section>`;
  },
};

// ═══════════════════════════ les onglets de la page d'un site ═══════════════════════════
const ONGLETS = {
  apercu(s, c){
    const d = s.d;
    const preuve = s.preuve === 'attente' ? `<div class="encart"><b>Prouve que ce site est à toi</b> ${tag('à créer', 'ac')}<p style="margin:6px 0">Avec le panneau, le propriétaire est connu. Sans lui, il faut une preuve : tant qu’elle manque, le site n’est à personne et un autre peut encore le réclamer. Deux façons, au choix :</p>
        <p style="margin:6px 0 2px"><b>1. Par le DNS</b> — un enregistrement TXT :</p><div class="code">_cassandra.${E(d)}   TXT   "cassandra-site=${E(s.jeton || '7f3a9c21')}"</div>
        <p style="margin:10px 0 2px"><b>2. Par un fichier</b> — à déposer sur le site :</p><div class="code">https://${E(d)}/.well-known/cassandra-site.txt   →   ${E(s.jeton || '7f3a9c21')}</div>
        <div class="gest"><button class="btn p" onclick="prouver('${d}')">Vérifier maintenant</button><span class="silence" style="padding:0">La demande expire dans 6 jours.</span></div></div>` : '';
    const pasReleve = s.preuve !== 'attente' && s.up == null ? `<div class="encart"><b>Pas encore relevé.</b> Le Sensorium le prendra à son prochain tour, dans moins de 5 minutes. D’ici là il n’a ni état ni disponibilité : pas 100 %, pas de chiffre. <button class="btn s" onclick="relever('${d}')">Relever maintenant</button></div>` : '';
    return `${c.io ? `<div class="encart d"><b>Incident ouvert depuis ${E(c.io.depuis)}.</b> ${E(c.io.diag)} <button class="btn s" onclick="aller('incident','${c.io.id}')">Dépanner ›</button></div>` : ''}${preuve}${pasReleve}
      ${s.douteux ? `<div class="encart w"><b>Une mesure ratée, pas encore une panne.</b> Si la prochaine échoue aussi, un incident s’ouvrira, daté de 04:31.</div>` : ''}
      ${admin() && !s.soc ? `<div class="encart w"><b>Ce site n’est attribué à aucune société.</b> ${s.compte ? 'Son compte en a une, mais le site lui-même ne l’est pas : aucun administrateur de société ne le voit.' : 'Il n’a ni compte ni société.'} ${ETAT.role === 'super' ? 'Attribue-le ci-dessus.' : ''}</div>` : ''}
      <dl class="paires">
        <dt>réponse</dt><dd>${s.up == null ? '<small style="color:var(--muted)">pas encore relevé</small>' : `${s.code ?? 'sans réponse'} en ${nb(s.ms)} ms <small style="color:var(--muted)">Sensorium · il y a 2 min</small>`}</dd>
        <dt>disponibilité 30 j</dt><dd>${fpct(pct(s, 30))}${pct(s, 30) != null ? ` · objectif ${fpct(s.objectif)}` : ''} <button class="btn s" onclick="aller('site','${d}','dispo')">détail</button></dd>

function evenements(s, il){
  if (il < 0 || il > 89) return [];
  const e = [], st = s.dispo[89 - il];
  INC.filter(i => i.d === s.d && i.il === il).forEach(i => e.push(['i', 'incident n° ' + i.id, i.id]));
  if (st === 'd') e.push(['d', 'coupure longue']); if (st === 'w') e.push(['w', 'coupure courte']); if (st === 'm') e.push(['m', 'maintenance']);
  if (st === 'n' && il < 90) e.push(['n', il >= s.suivi ? 'pas encore suivi' : 'pas de mesure']);
  if (il === 0 && s.suivi > 0) e.push(['n', '6 min sans mesure : Sensorium relancé']);
  if ((s.src0 || s.src) === 'panneau' && s.sauv != null && il >= s.sauv && st !== 'n') e.push(['s', 'sauvegarde 03:00']);
  if (s.renouv === il) e.push(['c', 'certificat renouvelé']);
  JOURNAL.filter(j => j.d === s.d && j.il === il && !/coupure|attente|relève|sauvegarde|certificat/.test(j.v)).forEach(j => e.push(['g', j.v + ' · ' + j.q]));
  return e;
}
