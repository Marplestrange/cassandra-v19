<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — La machine (refonte de « Détails système »)</title>
<!--
  REFONTE DE « DÉTAILS SYSTÈME ». La page d'aujourd'hui est clonée à l'identique dans CN_maquette-systeme-actuelle.html : tout ce qu'elle montre et fait
  se retrouve ici (page « Ancienne page → nouvelle », en bas du menu).
  Le tiroir de treize cartes devient une vraie page du Panorama, « La machine » : tout s'y voit d'un coup d'œil, une tuile par sujet, comme avant ;
  le détail d'un sujet ne s'ouvre qu'au clic sur sa tuile (deuxième version, à la demande d'Atek : la première découpait la page en cinq sous-entrées du menu).
  Ce qu'un autre module fait déjà (ports, bannissements, certificats, Tailscale, NetBird, hébergement, dépôts distants) garde sa tuile et son chiffre, et s'ouvre chez lui.
  Ces tuiles ne sont pas écrites en dur : une découverte automatique les fait paraître selon ce que la machine porte (bouton « Découverte »). Presque tout ce qui est « nouveau » vient de relevés que le Sensorium tient déjà (sensorium.etat) : rien à recoder côté collecteur.
  Données fictives, calquées sur les états d'Argos du 11-11-2026. Aucun geste n'écrit.
-->
<style>

  --bg:#eef1f5; --bg2:#e9edf3; --surface:rgba(255,255,255,.72); --surface2:rgba(255,255,255,.5); --solid:#fff;

  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --strong:#f1f5f7; --txt:#d3dbe0; --soft:#a6b2ba; --muted:#93a0a9;
  --accent:#3fc7ba; --accent2:#2aa99d; --acc10:rgba(63,199,186,.12); --acc20:rgba(63,199,186,.22); --violet:#a78bfa;
  --ok:#34d399; --warn:#f0a94a; --danger:#fb7185; --info:#5cb8e6;
  --ok10:rgba(52,211,153,.12); --warn10:rgba(240,169,74,.13); --dan10:rgba(251,113,133,.13); --inf10:rgba(92,184,230,.12);
  --shadow:0 6px 24px rgba(0,0,0,.3); --lift:0 14px 40px rgba(0,0,0,.5); --barre:linear-gradient(135deg,#0b4f4a,#0d6b63);
}}
:root[data-theme="dark"]{
  --bg:#0e1417; --bg2:#111a1e; --surface:rgba(28,38,44,.78); --surface2:rgba(28,38,44,.5); --solid:#182228;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --strong:#f1f5f7; --txt:#d3dbe0; --soft:#a6b2ba; --muted:#93a0a9;
  --accent:#3fc7ba; --accent2:#2aa99d; --acc10:rgba(63,199,186,.12); --acc20:rgba(63,199,186,.22); --violet:#a78bfa;

*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--bg2),var(--bg) 40%,var(--bg2));background-attachment:fixed;color:var(--txt);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.mono,code,.num{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
code{font-size:.92em;color:var(--strong)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* barre de la maquette */
.haut{background:var(--barre);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.haut b{font-weight:650}
.haut .note{font-size:12.5px;opacity:.9;margin:0 auto 0 0;color:#fff}
.haut button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:6px 11px;font-size:13px}
.haut button[aria-pressed="true"]{background:#fff;color:#0a726b}
.seg{display:inline-flex;gap:2px;background:rgba(255,255,255,.12);padding:3px;border-radius:12px}
.seg button{border:0;background:transparent}
/* disposition */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:18px;max-width:1380px;margin:0 auto;padding:18px 16px 60px}
@media (max-width:900px){.app{grid-template-columns:1fr}.menu{position:static!important;max-height:none!important}}
.carte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
/* menu de gauche */
.menu{position:sticky;top:66px;align-self:start;padding:8px;max-height:calc(100vh - 84px);overflow:auto}
.menu h2{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:10px 12px 6px;font-weight:650}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:8px 12px;color:var(--txt);position:relative}
.mi:hover{background:var(--acc10)}
.mi svg.i{opacity:.75}
.mi .chev{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:12px}
.mi[aria-expanded="true"]{font-weight:650;color:var(--strong)}
.mi[aria-expanded="true"] .chev{transform:rotate(90deg)}
.mi.inerte{color:var(--muted)}
.sous{margin:2px 0 6px 21px;padding-left:8px;border-left:2px solid var(--acc20);display:grid;gap:1px}
.sous .mi{padding:6px 10px;font-size:14px}
.sous .sous{margin-left:14px}
.sous .sous .mi{font-size:13.5px}
.mi[aria-current="page"]{background:var(--solid);box-shadow:var(--shadow);color:var(--accent);font-weight:650}
.bad{margin-left:auto;white-space:nowrap;font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--soft);font-weight:600}
.bad.w{background:var(--warn10);color:var(--warn)}.bad.d{background:var(--dan10);color:var(--danger)}.bad.ok{background:var(--ok10);color:var(--ok)}
.legende{margin:12px 6px 4px;padding:10px 6px 6px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);display:grid;gap:6px}
.de,.neuf,.ac{font-size:10px;letter-spacing:.5px;text-transform:uppercase;border-radius:6px;padding:1px 5px;margin-left:6px;font-weight:650;white-space:nowrap;vertical-align:1px}
.de{background:var(--inf10);color:var(--info)}.neuf{background:var(--acc10);color:var(--accent)}.ac{background:var(--warn10);color:var(--warn)}
.legende .de,.legende .neuf,.legende .ac{margin-left:0;margin-right:6px}
/* page */
.fil{font-size:13px;color:var(--muted);margin:2px 0 6px}
h1{font-size:26px;margin:0 0 4px;color:var(--strong);letter-spacing:-.2px}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.tete .meta{font-size:13px;color:var(--muted);margin-right:auto;flex:1 1 320px}
.btn{background:var(--solid);border:1px solid var(--line2);border-radius:11px;padding:7px 13px;font-size:14px;color:var(--strong);display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.p{color:#06231f}
.btn.d{color:var(--danger);border-color:var(--dan10)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.s{padding:4px 10px;font-size:13px}
.sec{padding:16px 18px;margin-bottom:16px}
.sec h2{font-size:16px;margin:0;color:var(--strong)}
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh .meta{font-size:12.5px;color:var(--muted)}
.sh .dr{margin-left:auto;display:flex;gap:6px;align-items:center}
.cmd{background:transparent;border:0;color:var(--muted);border-radius:8px;padding:2px 7px;font-size:14px}
.cmd:hover{background:var(--acc10);color:var(--strong)}
.sec.plie>:not(.sh){display:none}.sec.plie .sh{margin-bottom:0}
.sec.plein{position:fixed;inset:14px;z-index:50;overflow:auto;margin:0;background:var(--solid)}
.age{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.age::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.age.mu::before{background:var(--danger)}.age.mu{color:var(--danger)}
/* verdict */
.verdict{display:flex;gap:14px;align-items:stretch}
.vm{width:5px;border-radius:4px;background:var(--ok);flex:none}.vm.w{background:var(--warn)}.vm.d{background:var(--danger)}.vm.n{background:var(--line2)}
.verdict p{margin:0}.vt{font-size:19px;font-weight:700;color:var(--strong)}.vs{color:var(--soft);font-size:14px;margin-top:2px!important}
.gestes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* jauges */
.jauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.jg{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.jg span{display:block;font-size:12.5px;color:var(--muted)}
.jg b{display:block;font:650 24px/1.2 "JetBrains Mono",ui-monospace,monospace;color:var(--strong)}
.jg b.w{color:var(--warn)}.jg b.d{color:var(--danger)}.jg b.mu{color:var(--muted)}
.jg em{display:block;font-style:normal;font-size:12.5px;color:var(--soft)}
.barre{height:5px;border-radius:3px;background:var(--line);margin:7px 0 4px;overflow:hidden}
.barre i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .6s}
.barre i.w{background:var(--warn)}.barre i.d{background:var(--danger)}
.courbe{width:100%;height:150px;display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
/* pastilles, lignes, paires */
.pl{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--soft);white-space:nowrap}
.pl::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pl.ok{background:var(--ok10);color:var(--ok)}.pl.w{background:var(--warn10);color:var(--warn)}.pl.d{background:var(--dan10);color:var(--danger)}.pl.i{background:var(--inf10);color:var(--info)}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) auto;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:9px 13px}
.row .nm{min-width:0}.row .nm b{display:block;color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.row .nm small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mil{font-size:13px;color:var(--soft);min-width:0;display:flex;align-items:center;gap:8px}
.row .cote{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.row{grid-template-columns:1fr}.row .cote{justify-content:flex-start}}
.paires{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2px 26px;margin:0}
.paires div{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;align-items:baseline}
.paires dt{color:var(--muted);flex:0 0 118px;font-size:13px}.paires dd{margin:0;color:var(--strong);min-width:0}
.paires dd small{display:block;color:var(--soft);font-size:12.5px}
.vide{color:var(--muted);font-size:14px;padding:6px 0}
.muet{background:var(--dan10);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font-size:14px;color:var(--strong)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
input[type=search]{font:inherit;color:var(--strong);background:var(--solid);border:1px solid var(--line2);border-radius:11px;padding:6px 11px;min-width:0;width:220px}
.pbar{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--accent)}.pbar i.w{background:var(--warn)}.pbar i.d{background:var(--danger)}
/* ce qui vit ailleurs */
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.tuile{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.tuile .t{display:flex;align-items:center;gap:8px;color:var(--strong);font-weight:650}
.tuile .t small{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px}
.tuile p{margin:0;font-size:14px;color:var(--soft)}
.tuile .gestes{margin-top:auto;padding-top:6px}
.puces{display:flex;gap:6px;flex-wrap:wrap}
.puce{background:var(--solid);border:1px solid var(--line2);border-radius:10px;padding:3px 9px;font-size:12.5px;color:var(--strong)}
.puce:hover{border-color:var(--accent)}
/* la page d'ensemble : une tuile par sujet */
.bandeau-v{padding:14px 18px;margin-bottom:6px}
.bandeau-v .vt{font-size:18px}
.note-sante{text-align:right;min-width:150px;cursor:help}
.note-sante span,.note-sante em{display:block;font-size:12.5px;color:var(--muted);font-style:normal}
.note-sante b{display:block;font-size:28px;line-height:1.1}.note-sante b small{font-size:13px;color:var(--muted)}
.gt{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:14px 4px 8px;font-weight:650;display:flex;align-items:center;gap:8px;min-height:26px}
.gt .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.gt span{text-transform:none;letter-spacing:0;font-weight:500}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:10px}
.tu{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px 10px;display:flex;flex-direction:column;gap:5px;cursor:pointer;box-shadow:var(--shadow);min-height:158px;min-width:0}
.tu:hover{border-color:var(--accent);background:var(--solid)}
.tu.ext{background:var(--surface2);box-shadow:none}
.tu.mu>:not(.tt):not(.tp){opacity:.42;filter:grayscale(1)}
.tu .tt{display:flex;align-items:center;gap:8px;color:var(--strong);font-size:14px;margin-bottom:2px}
.tu .tt b{font-weight:650}.tu .tt .pl{margin-left:auto}
.tu .gr{font:650 25px/1.1 "JetBrains Mono",ui-monospace,monospace;color:var(--strong)}
.tu .gr.w{color:var(--warn)}.tu .gr.d{color:var(--danger)}.tu .gr.mu{color:var(--muted)}
.tu .cc{display:flex;flex-direction:column;gap:5px}
.tu .li{font-size:12.5px;color:var(--soft);display:flex;gap:8px;align-items:center;min-width:0}
.tu .li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tu .li small{color:var(--muted)}
.tu .li b{color:var(--strong);font-weight:600;font-size:12px;white-space:nowrap}
.tu .mb{display:grid;grid-template-columns:74px 1fr 42px;gap:8px;align-items:center;font-size:12.5px;color:var(--soft)}
.tu .mb b{text-align:right;font-size:12px}
.tu .tp{margin-top:auto;padding-top:5px;font-size:12px;font-weight:600;color:var(--accent)}
.tu.ext .tp{color:var(--muted)}
.tu .puces{margin-top:2px}.tu .puce{padding:2px 7px;font-size:12px}
.tu .btn.s{padding:2px 8px;font-size:12px}
.grille.v{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.grille.v .tu{min-height:124px;padding:10px 10px 8px}
.grille.v .tu .gr{font-size:21px}
.grille.v .tu .tt{font-size:13px;flex-wrap:wrap;gap:6px}
.grille.v .tu .tt svg.i{width:15px;height:15px}
.grille.v .tu .tt .pl{font-size:11px;padding:1px 7px}
.grille.v .tu .li{flex-wrap:wrap}
.grille.v .tu .li .n{white-space:normal}
/* la fiche de la machine : des blocs deux par deux */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:16px;margin-bottom:16px;align-items:start}
@media (max-width:560px){.duo{grid-template-columns:1fr}}
.duo .paires.un dt{flex-basis:118px}
/* l'appel à Cassandra, les filtres, le plan, la mémoire */
.cass{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--acc10);border:1px solid var(--acc20);border-radius:12px;padding:4px 8px 4px 10px;font-size:13px;color:var(--accent)}
.cass b{font-weight:650;margin-right:2px}.cass .puce{font-size:12.5px;padding:3px 9px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#06231f}
.feuille h4{margin:14px 0 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:650}
.coche{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--txt);padding:4px 0}
.coche input{accent-color:var(--accent);width:16px;height:16px}
.plan{margin:0 0 12px;padding-left:22px;font-size:14px;color:var(--strong);display:grid;gap:6px}
.pile{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);gap:2px}
.pile i{display:block;height:100%}
.dit{margin:0 0 4px;font-size:14px;color:var(--txt)}
pre.jl{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:11.5px/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--txt);white-space:pre-wrap;word-break:break-word}
/* la page Conteneurs : une ligne par conteneur, sa fiche au clic */
.cts{display:grid;gap:6px}
.ct{background:var(--surface2);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.ct.ouvert{border-color:var(--acc20);background:var(--solid)}
.ctl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.25fr) minmax(0,1.15fr) 200px 14px;gap:14px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:10px 13px}
.ctl:hover{background:var(--acc10)}
.ctl>span{min-width:0;display:flex;flex-direction:column;gap:2px}
.ctl b,.ctl .mono{color:var(--strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.ctl b{font-weight:650;font-size:14.5px}
.ctl small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl .c3{flex-direction:row;flex-wrap:wrap;gap:4px 6px;align-items:center}
.ctl .c3 small{flex:1 1 100%}
.ctl .c4{align-items:flex-end}
.ctl .chev{color:var(--muted);transition:transform .2s}
.ct.ouvert .ctl .chev{transform:rotate(90deg)}
.pc{font:600 12px "JetBrains Mono",ui-monospace,monospace;border:1px solid var(--line2);border-radius:7px;padding:1px 6px;color:var(--strong);background:var(--solid)}
.pc.w{border-color:var(--warn);color:var(--warn);background:var(--warn10)}
.ctf{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:4px 26px;padding:6px 16px 14px;border-top:1px solid var(--line)}
.ctf .bloc{min-width:0;padding-top:8px}
.ctf h3{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:650}
.ctf h3 .ac{text-transform:uppercase}
.ctf table.ptab{font-size:13px}.ctf table.ptab th{font-size:11px;padding:4px 6px}.ctf table.ptab td{padding:5px 6px;font-weight:500;color:var(--txt);white-space:nowrap}
.ctf table.ptab td:first-child{font-weight:500}
.paires.un{grid-template-columns:1fr}
.paires.un div{padding:5px 0;font-size:13.5px}.paires.un dt{flex-basis:104px}
.paires.un dd small{display:inline;margin-left:4px}
.chemin{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.chemin .fl{color:var(--muted);font-size:12px}
.ctf a,.note a{color:var(--accent);cursor:pointer}
@media (max-width:860px){.ctl{grid-template-columns:1fr}.ctl .c4{align-items:flex-start}.ctl .chev{display:none}}
.lk{cursor:pointer;background:none;border:0;padding:0;color:var(--soft);font-size:12.5px;text-decoration:underline dotted;text-underline-offset:3px}
.lk:hover{color:var(--accent)}
.tu.det{border-style:dashed}
.tu.det .tp{color:var(--accent)}
.pt{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:4px}.pt.d{background:var(--danger)}
.pied{font-size:13px;color:var(--muted);margin:14px 4px 0}
.pied a,.fil a{color:var(--accent);cursor:pointer}
/* tableau de correspondance */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line2)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--strong);font-weight:650;white-space:nowrap}
/* feuille et toast */
.voile{position:fixed;inset:0;background:rgba(16,24,40,.34);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.voile.on{display:flex}
.feuille{background:var(--solid);border-radius:16px;box-shadow:var(--lift);max-width:620px;width:100%;padding:18px 20px;max-height:86vh;overflow:auto}
.feuille h3{margin:0 0 4px;color:var(--strong);font-size:17px}
.feuille p{margin:0 0 12px;color:var(--soft);font-size:14px}
.feuille pre{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:12px/1.55 "JetBrains Mono",ui-monospace,monospace;overflow:auto;max-height:46vh;color:var(--txt)}
.feuille .gestes{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--strong);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:90;max-width:min(680px,92vw)}
#toast.on{opacity:1;transform:translate(-50%,0)}

}
const GESTES_SV = {

function svAppliquer(u, g){ if (g === 'arreter') S.svE[u] = 'arret'; else if (g === 'demarrer' || g === 'redemarrer'){ S.svE[u] = 'actif'; M.echecs = M.echecs.filter(x => x[0].replace('.service', '') !== u); } else if (g === 'debrancher') S.svB[u] = false; else if (g === 'brancher') S.svB[u] = true; }

    <h4>Pour confirmer, tape le nom de la machine</h4>
    <input type="search" id="rd-nom" placeholder="${E(M.nom)}" autocomplete="off" style="width:100%" oninput="$('oui').disabled = this.value.trim() !== '${E(M.nom)}'">
    <p class="note">Une commande nommée du courtier, différée de quelques secondes comme la relance du noyau, avec sa preuve au retour (durée de marche repartie de zéro). ${creer()}</p>

}
function annulerRedemarrage(){ S.prevu = ''; const g = S.gestes.find(x => /Programmer un redémarrage/.test(x.quoi) && !x.defait); if (g) g.defait = true; rendre(); toast('Redémarrage annulé.'); }
function limiter(u){ confirmer('Limiter la mémoire du service ' + u + ' ?', 'Proposé : 1,5 Go au plus. Au-delà, c’est lui qui est arrêté et relancé, pas ses voisins. Le service est redémarré pour prendre le réglage.', 'Poser la limite', () => { noter(u, 'Limiter la mémoire à 1,5 Go', 'limite relue dans systemd', 'Retirer la limite', () => {}); rendre(); toast('Limite posée sur ' + u + ' (à créer).'); }); }
function bannir(i){ const s = M.sessions[i]; confirmer('Bannir l’adresse ' + s[1] + ' ?', 'Sa session est fermée et l’adresse ne peut plus se connecter à la machine. Elle se débannit dans Sécurité › Défenses.', 'Bannir', () => { const ad = s[1]; M.sessions.splice(i, 1); S.se = ''; const x = M.refus.adresses.find(a => a[0] === ad); if (x) x[2] = true; noter(ad, 'Bannir l’adresse', 'règle fail2ban relue', 'Débannir', () => { if (x) x[2] = false; }); rendre(); toast('Adresse bannie (à créer).'); }); $('oui').className = 'btn d'; }
// LES GESTES SUR UN CONTENEUR. Chacun : une confirmation qui dit ce qui va se passer, une preuve relue après coup, un retour possible. Dans la maquette, rien n'est exécuté.
const GESTES_CT = {
  demarrer:   ['Démarrer', 'Démarrer', 'Le conteneur repart avec les mêmes réglages.', 'état « tourne » relu', 'Arrêter', 'arreter', ''],

  retour:     ['Revenir à l’image d’avant', 'Revenir en arrière', 'Le conteneur est recréé avec l’image gardée avant la mise à jour. Coupure de quelques secondes.', 'ancienne image en place, état « tourne »', '', '', ''],

const ctDe = n => M.conteneurs.find(c => c[0] === n);
function gestesCt(c){
  const n = c[0], b = (g, cls = '') => `<button class="btn s ${cls}" onclick="ctGeste('${n}', '${g}')">${GESTES_CT[g][0]}</button>`;

    noter(n, G[0], G[3], G[4], G[5] ? () => ctAppliquer(n, G[5]) : null); rendre(); toast(G[0] + ' ' + n + ' : fait, preuve relue (' + G[3] + ').'); };
