<title>Maquette · Évolution · Les comparer (version proposée)</title>
<!--
  VERSION PROPOSÉE de « Les comparer », à confronter à CN_maquette-evolution-comparer-actuelle.html (la page d'aujourd'hui, qui charge le vrai écran).

  Ce que la page actuelle fait mal (constaté sur Argos, 05-11) :
   - pour choisir la fonction, une liste déroulante de 104 identifiants techniques, sans recherche et sans dire lesquelles valent la peine ;
   - des cases à cocher « étages » aux noms à rallonge, sans repère de coût, qui s'appellent « moteurs » ailleurs ;
   - un budget à régler soi-même (jetons / essais / temps, une limite en chiffres) et un critère « rendement (gain par jeton) » que personne ne comprend ;
   - aucune idée de ce que la course va coûter avant de la lancer ;
   - une course qui dure des minutes sans rien montrer ; un résultat en tableau de neuf colonnes (« Pt / 1k jetons », « Tient hors du vu »…) ;
   - aucune phrase qui dise qui a gagné et pourquoi ; aucune trace des courses d'avant, sauf la dernière.

  Ce que la page proposée change :
   1. UNE FONCTION CHOISIE par recherche, les plus utiles en premier (le temps que ses appels font perdre), avec ce qu'elle fait en mots ;
   2. DES CHERCHEURS en tuiles, avec leur coût en mots (gratuit, sobre, gourmand), des raccourcis, et ceux qui ne sont pas actifs grisés avec le chemin pour les activer ;
   3. UN BUDGET EN TROIS TAILLES (petit, moyen, large) et un critère en mots (le meilleur gain, le plus économe, le plus rapide) ; les réglages fins restent, repliés ;
   4. UN RÉSUMÉ QUI LANCE : ce que ça coûtera au plus (jetons, part du budget du mois, durée) AVANT de cliquer ;
   5. LA COURSE EN DIRECT : une piste par chercheur, qui avance à son tour ;
   6. UN RÉSULTAT QUI SE LIT : une phrase (qui gagne, de combien, pour quel prix), puis un classement en barres, un détail à la demande ; changer le critère reclasse sans relancer ;
   7. LES GESTES APRÈS : adopter (avec sa confirmation : rejugée, mise à l'ombre, rien n'est servi), épingler, refaire avec plus de budget ; l'historique des courses d'avant, épinglable.

  Pas dans la page actuelle, donc à construire si tu valides : le suivi en direct (le serveur lancera la course en tâche de fond, comme l'installation), l'estimation avant lancement (le coût par chercheur est déjà connu), l'historique (le serveur garde déjà les courses : « Garder pour comparaison »).
  Tout est simulé : aucune course réelle. Les fonctions et leurs chiffres sont ceux d'Argos du 05-11 ; les phrases qui disent ce qu'elles font sont des exemples.
-->

.ev .cp-piste .etat{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--e-encre3);white-space:nowrap;min-width:92px;text-align:right}

.ev .cp-verdict.rien{background:var(--e-doux);color:var(--e-encre2)}

.ev .cp-rang{display:flex;flex-direction:column;gap:8px}

.ev .cp-lg:hover{border-color:var(--accent)}

.ev .cp-lg .rg{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;line-height:1;background:var(--e-doux);font:700 13px/1 ui-monospace,monospace;color:var(--e-encre2);box-sizing:border-box;text-align:center}
.ev .cp-lg.gagne .rg{background:var(--ok,#047857);color:#fff}

@media(max-width:700px){.ev .cp-lg .haut{grid-template-columns:30px 1fr auto}.ev .cp-lg .haut .cp-barre{grid-column:1/-1;order:5}.ev .cp-lg .bas,.ev .cp-det{margin-left:0}.ev .cp-piste{grid-template-columns:1fr auto}.ev .cp-piste .cp-barre{grid-column:1/-1}}

<body>
<div class="mq-bandeau"><b>Maquette · « Les comparer » proposée</b><span>Tout est simulé : aucune course réelle, les chiffres sont des exemples (ceux d'Argos pour les fonctions)</span><span style="margin-left:auto">Démonstration :</span><button id="d-raz">Remettre à zéro</button></div>
<div class="mq-cadre">
  <nav class="mq-menu" id="mq-menu" aria-label="Menu d'Évolution"></nav>
  <main class="mq-corps"><div class="ev" id="ev"></div></main>
</div>
<script>
(function () {
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const k = (v) => (v >= 1000000 ? (v / 1000000).toFixed(v % 1000000 ? 1 : 0).replace(".", ",") + " M" : v >= 10000 ? Math.round(v / 1000) + " k" : v >= 1000 ? (v / 1000).toFixed(1).replace(".", ",") + " k" : String(v));
  const racine = document.getElementById("ev");

  // les fonctions : les plus utiles à améliorer d'abord (valeur espérée = temps que les appels réels font perdre). Données d'Argos du 05-11 ; les phrases sont des exemples.
  const FN = [
    { id: "planifie.decrire", dit: "décrit une tâche planifiée en une phrase", appels: 46849, ms: 0.316, valeur: 14804, essais: 2 },
    { id: "affichage.disposition", dit: "calcule la disposition de l'écran", appels: 4488, ms: 2.75, valeur: 12342, essais: 5 },
    { id: "planifie.suivante", dit: "trouve la prochaine occurrence d'une tâche", appels: 5718, ms: 0.501, valeur: 2865, essais: 0 },
    { id: "fastpanel.lecture", dit: "lit l'état de FastPanel", appels: 4557, ms: 0.463, valeur: 2110, essais: 0 },
    { id: "jour.tuiles", dit: "prépare les tuiles de la page Aujourd'hui", appels: 6316, ms: 0.297, valeur: 1876, essais: 1 },
    { id: "securite.sans_options_cible", dit: "retire les options d'une cible d'analyse", appels: 5411, ms: 0.263, valeur: 1423, essais: 0 },
    { id: "planifie.derive", dit: "mesure la dérive d'une tâche", appels: 5726, ms: 0.224, valeur: 1283, essais: 0 },
    { id: "flotte.duree", dit: "met en forme une durée", appels: 3867, ms: 0.254, valeur: 982, essais: 0 },
    { id: "dns.analyser", dit: "analyse un nom de domaine", appels: 1970, ms: 0.366, valeur: 721, essais: 0 },
    { id: "affichage.idees", dit: "propose des idées d'écran", appels: 1579, ms: 0.408, valeur: 644, essais: 3 }];
  const NB_FONCTIONS = 104, NB_MUETTES = 56;

  // les chercheurs d'Argos aujourd'hui : un coût en mots, et s'ils peuvent courir (actifs)
  const CH = [
    { id: "orfan/deterministe", nom: "Orfan · règles", sous: "des règles sûres, sans modèle", cout: "gratuit", actif: true },
    { id: "frugal", nom: "Frugal", sous: "des règles, puis les idées d'un modèle fort", cout: "sobre", actif: true },
    { id: "orfan/modele", nom: "Orfan · modèle", sous: "un modèle guidé par le profil de l'appel", cout: "gourmand", actif: true },
    { id: "sedal", nom: "Sedal", sous: "des générations de variantes qui se croisent", cout: "gourmand", actif: true },
    { id: "gepa", nom: "GEPA", sous: "réfléchit sur ses échecs (externe)", cout: "sobre", actif: true },
    { id: "textgrad", nom: "TextGrad", sous: "améliore par retours en langage naturel (externe)", cout: "sobre", actif: true },
    { id: "codeevolve", nom: "CodeEvolve", sous: "îlots de populations (externe)", cout: "gourmand", actif: false },
    { id: "dspy", nom: "DSPy", sous: "optimise des consignes (externe)", cout: "sobre", actif: false }];
  const COUT = { gratuit: ["Gratuit : 0 jeton", "ok"], sobre: ["Sobre en jetons", "ok"], gourmand: ["Gourmand en jetons", "fort"] };
  const BUDGETS = { petit: [5000, "Petit", "≈ 5 k jetons par chercheur : un premier coup d'œil"], moyen: [20000, "Moyen", "≈ 20 k jetons : le bon compromis"], large: [60000, "Large", "≈ 60 k jetons : on cherche à fond"] };
  const CRITERES = { gain: ["Le meilleur gain", "le plus de temps gagné"], econome: ["Le plus économe", "le plus de gain pour le moins de jetons"], rapide: ["Le plus rapide à trouver", "celui qui répond le plus vite"] };
  const MOIS = { budget: 2000000, depense: 101545 };

  // le résultat d'exemple d'une course (pour la fonction choisie) : un chercheur peut ne rien trouver, ou être sauté
  const RES = [
    { id: "orfan/deterministe", variantes: 3, equivalentes: 2, gain: 34.2, tient: true, jetons: 0, duree: 2.1, memoire: 3 },
    { id: "frugal", variantes: 4, equivalentes: 2, gain: 34.2, tient: true, jetons: 6200, duree: 41.7, memoire: 3 },
    { id: "orfan/modele", variantes: 3, equivalentes: 1, gain: 28.9, tient: false, jetons: 11400, duree: 38.9, memoire: -2 },
    { id: "sedal", variantes: 9, equivalentes: 4, gain: 44.8, tient: true, jetons: 21300, duree: 94.3, memoire: 6 },
    { id: "gepa", variantes: 2, equivalentes: 0, gain: 0, tient: false, jetons: 8100, duree: 52.0, memoire: null },
    { id: "textgrad", variantes: 0, equivalentes: 0, gain: 0, tient: false, jetons: 0, duree: 3.2, memoire: null, saute: "il ne lui reste plus de jetons aujourd'hui (son plafond du jour est atteint)" }];

  const HISTO0 = [
    { fn: "affichage.disposition", quand: "hier, 17:42", qui: "Sedal", gain: 21.5, epingle: true },
    { fn: "affichage.idees", quand: "lundi, 09:10", qui: "personne", gain: 0, epingle: false },
    { fn: "jour.tuiles", quand: "le 02/11", qui: "Orfan (règles)", gain: 12.0, epingle: false }];

  const init = () => ({ fn: "planifie.decrire", q: "", tout: false, sel: { "orfan/deterministe": true, frugal: true, "orfan/modele": true, sedal: true, gepa: true, textgrad: true }, budget: "moyen", crit: "gain", mode: "jetons", lim: 20000,
                        phase: "prepare", lanes: [], res: null, ouvert: "", confirm: false, adopte: false, epingle: false, histo: JSON.parse(JSON.stringify(HISTO0)), msg: "" });
  let S = init();
  const ch = (id) => CH.find((c) => c.id === id);
  const fn = () => FN.find((f) => f.id === S.fn) || { id: S.fn, dit: "", appels: 0, ms: 0, valeur: 0, essais: 0 };
  const choisis = () => CH.filter((c) => c.actif && S.sel[c.id]);
  const coutMax = (c) => ({ gratuit: 0, sobre: 0.4, gourmand: 1 })[c.cout] * BUDGETS[S.budget][0];
  const estim = () => { const l = choisis(); return { jetons: Math.round(l.reduce((a, c) => a + coutMax(c), 0)), duree: Math.round(l.reduce((a, c) => a + (c.cout === "gratuit" ? 4 : c.cout === "sobre" ? 40 : 75), 0)) }; };
  const duree = (s) => (s < 90 ? Math.round(s) + " s" : Math.round(s / 60) + " min");

  /* ─── 1 · la fonction ─── */
  function etapeFonction() {
    const q = S.q.trim().toLowerCase(), tous = FN.filter((f) => !q || (f.id + " " + f.dit).toLowerCase().indexOf(q) >= 0), vis = (S.tout || q) ? tous : tous.slice(0, 5);
    const ligne = (f) => '<button class="cp-fn' + (f.id === S.fn ? " on" : "") + '" data-fn="' + esc(f.id) + '"><b>' + esc(f.id) + "</b><small>" + esc(f.dit) + '</small><span class="d"><i>' + (f.valeur >= 1000 ? "≈ " + k(f.valeur) + " ms perdues" : "≈ " + Math.round(f.valeur) + " ms perdues") + "</i><span>" + k(f.appels) + " appels" + (f.essais ? " · essayée " + f.essais + " fois" : " · jamais essayée") + "</span></span></button>";
    return '<div class="verre cp-bloc"><div class="cp-tete"><h3><span class="cp-num">1</span>Sur quelle fonction ?</h3><span class="cp-aide">Les plus utiles à améliorer d’abord : celles dont les appels font perdre le plus de temps.</span></div>' +
      '<input class="cp-rech" id="cp-q" type="text" placeholder="Chercher une fonction (nom ou ce qu’elle fait)…" value="' + esc(S.q) + '"><div class="cp-fns">' + (vis.map(ligne).join("") || '<div class="cp-aide">Aucune fonction ne correspond.</div>') + "</div>" +
      (!q ? '<div class="cp-actions"><button class="btn" data-tout="' + (S.tout ? "non" : "oui") + '">' + (S.tout ? "Voir moins" : "Voir les " + FN.length + " premières (sur " + NB_FONCTIONS + ")") + '</button><span class="cp-aide">' + NB_MUETTES + " fonctions n’ont jamais été appelées : on ne peut pas encore les comparer.</span></div>" : "") + "</div>";
  }
  /* ─── 2 · les chercheurs ─── */
  function etapeChercheurs() {
    const tuile = (c) => {
      const on = c.actif && S.sel[c.id], p = COUT[c.cout];
      return '<button class="cp-ch' + (on ? " on" : "") + (c.actif ? "" : " off") + '" data-ch="' + esc(c.id) + '"' + (c.actif ? "" : ' title="Il n’est pas actif : on l’active dans « Les chercheurs »"') + '><span class="nom">' + esc(c.nom) + '<span class="coche">✓</span></span><span class="sous">' + esc(c.sous) + '</span><span class="tags"><span class="puce ' + p[1] + '">' + p[0] + "</span>" + (c.actif ? "" : '<span class="puce mu">pas actif</span>') + "</span></button>";
    };
    const n = choisis().length;
    return '<div class="verre cp-bloc"><div class="cp-tete"><h3><span class="cp-num">2</span>Qui court ?</h3><span class="cp-aide">' + n + " chercheur" + (n > 1 ? "s" : "") + " au départ</span></div>" +
      '<div class="cp-pre"><span class="cp-aide">Raccourcis :</span><button class="cp-chip" data-pre="gratuits">Les gratuits et les sobres</button><button class="cp-chip" data-pre="tous">Tous les actifs</button><button class="cp-chip" data-pre="aucun">Aucun</button></div>' +
      '<div class="cp-tuiles">' + CH.map(tuile).join("") + '</div><div class="cp-aide">Les chercheurs qui ne sont pas actifs ne peuvent pas courir. <a href="#" data-vers="1">Les activer dans « Les chercheurs »</a>.</div></div>';
  }
  /* ─── 3 · jusqu'où ─── */
  function etapeBudget() {
      const budgets = Object.keys(BUDGETS).map((v) => '<button class="cp-opt' + (S.budget === v ? " on" : "") + '" data-budget="' + v + '"><b>' + BUDGETS[v][1] + "</b><small>" + BUDGETS[v][2] + "</small></button>").join("");
    const crits = Object.keys(CRITERES).map((v) => '<button class="cp-opt' + (S.crit === v ? " on" : "") + '" data-crit="' + v + '"><b>' + CRITERES[v][0] + "</b><small>" + CRITERES[v][1] + "</small></button>").join("");
    return '<div class="verre cp-bloc"><div class="cp-tete"><h3><span class="cp-num">3</span>Combien, et qu’est-ce qui compte ?</h3></div>' +
      '<div class="cp-aide">Chaque chercheur dépense au plus cette somme de jetons (les gratuits ne dépensent rien).</div><div class="cp-seg">' + budgets + "</div>" +
      '<div class="cp-aide" style="margin-top:4px">Pour désigner le gagnant, on regarde :</div><div class="cp-seg">' + crits + "</div>" +
      '<details class="cp-fin"><summary>Réglages fins (pour ceux qui veulent compter autrement)</summary><div class="champs"><label>Compter le budget en<select data-fin="mode"><option value="jetons"' + (S.mode === "jetons" ? " selected" : "") + '>jetons</option><option value="essais"' + (S.mode === "essais" ? " selected" : "") + '>essais</option><option value="temps"' + (S.mode === "temps" ? " selected" : "") + '>secondes</option></select></label><label>Limite exacte<input type="number" min="1" value="' + BUDGETS[S.budget][0] + '" data-fin="lim"></label></div></details></div>';
  }
  /* ─── le résumé qui lance ─── */
  function resume() {
    const e = estim(), f = fn(), l = choisis(), pct = Math.max(0.1, 100 * e.jetons / MOIS.budget), enCours = S.phase === "course";
    const pret = l.length >= 2 && f.appels > 0;
    return '<div class="verre cp-resume"><h3>Prêt à courir ?</h3><div><div class="cp-lig"><span>Fonction</span><b class="mono" style="font-size:12px">' + esc(f.id) + '</b></div><div class="cp-lig"><span>Chercheurs</span><b>' + l.length + ' au départ</b></div><div class="cp-lig"><span>Budget</span><b>' + BUDGETS[S.budget][1] + " · " + k(BUDGETS[S.budget][0]) + ' chacun</b></div>' +
      '<div class="cp-lig"><span>Jetons dépensés</span><b>au plus ≈ ' + k(e.jetons) + '</b></div><div class="cp-lig"><span>Durée</span><b>≈ ' + duree(e.duree) + '</b></div></div><div><div class="cp-jauge"><i style="width:' + Math.min(100, pct * 8) + '%"></i></div><div class="cp-aide" style="margin-top:5px">Soit au plus ' + (pct < 1 ? "moins de 1" : pct.toFixed(1).replace(".", ",")) + " % du budget du mois (" + k(MOIS.budget) + " jetons, déjà " + k(MOIS.depense) + " dépensés).</div></div>" +
      '<button class="btn prim cp-go" data-go' + (pret && !enCours ? "" : " disabled") + ">" + (enCours ? "Course en cours…" : "Lancer la course") + "</button>" + (pret ? "" : '<div class="cp-aide">' + (l.length < 2 ? "Choisis au moins deux chercheurs pour qu’il y ait une course." : "Cette fonction n’a jamais été appelée : rien à comparer.") + "</div>") +
      '<div class="cp-aide">Une course ne met rien en service : la variante gagnante n’est adoptée que sur ton geste.</div></div>';
  }
  /* ─── la course en direct ─── */
  function direct() {
    if (S.phase !== "course") return "";
    const total = S.lanes.reduce((a, l) => a + l.jet, 0);
    return '<div class="verre cp-bloc"><div class="cp-tete"><h3>La course est lancée</h3><span class="puce al">en cours · ' + k(total) + " jetons dépensés</span></div><div class=\"cp-direct\">" + S.lanes.map((l) => {
      const c = ch(l.id);
      return '<div class="cp-piste"><span class="nm"><b>' + esc(c.nom) + "</b><small>" + esc(c.sous) + '</small></span><span class="cp-barre ' + (l.fini ? "ok" : l.run ? "chauffe" : "") + '"><i style="width:' + l.pct + '%"></i></span><span class="etat">' + (l.saute ? "sauté" : l.fini ? "terminé" : l.run ? "cherche…" : "attend son tour") + "</span></div>";
    }).join("") + '</div><div class="cp-aide">Chaque chercheur cherche à son tour, sur les mêmes cas ; le même juge évalue tout à la fin.</div></div>';
  }
  /* ─── le résultat ─── */
  function classer() {
    const l = RES.filter((r) => S.sel[r.id] && ch(r.id).actif).map((r) => Object.assign({}, r, { c: ch(r.id) }));
    const ok = (r) => !r.saute && r.gain > 0 && r.tient;
    const score = { gain: (r) => (ok(r) ? r.gain : -1), econome: (r) => (ok(r) ? r.gain / (1 + r.jetons / 1000) : -1), rapide: (r) => (ok(r) ? 1000 - r.duree : -1) }[S.crit];
    l.sort((a, b) => score(b) - score(a) || b.gain - a.gain);
    return { l: l, gagnant: l.length && ok(l[0]) ? l[0] : null };
  }
  function resultat() {
    if (S.phase !== "fini") return "";
    const { l, gagnant } = classer(), f = fn(), max = Math.max(50, ...l.map((r) => r.gain));
    const phrase = gagnant
      ? "<b>" + esc(gagnant.c.nom) + "</b> gagne : sa variante rend <b>exactement le même résultat</b> et gagne <b>" + gagnant.gain.toFixed(1).replace(".", ",") + " % de temps</b> sur <span class=\"mono\">" + esc(f.id) + "</span>, " + (gagnant.jetons ? "pour " + k(gagnant.jetons) + " jetons" : "sans dépenser un seul jeton") + ", confirmée sur des cas jamais montrés au chercheur."
      : "<b>Aucun chercheur n’a trouvé de variante à la fois identique, plus rapide et confirmée.</b> Rien n’est à adopter. Tu peux refaire la course avec un budget plus large ou d’autres chercheurs.";
    const ligne = (r, i) => {
      const gagne = gagnant && r.id === gagnant.id, nul = r.saute || r.gain === 0, ouvert = S.ouvert === r.id;
      return '<div class="cp-lg' + (gagne ? " gagne" : "") + '" data-lg="' + esc(r.id) + '"><div class="haut"><span class="rg">' + (gagne ? "★" : i + 1) + '</span><span class="nm"><b>' + esc(r.c.nom) + "</b><small>" + esc(r.c.sous) + '</small></span><span class="cp-barre' + (r.tient && r.gain ? " ok" : "") + '"><i style="width:' + (nul ? 0 : Math.round(100 * r.gain / max)) + '%"></i></span><span class="gain' + (nul ? " nul" : "") + '">' + (r.saute ? "sauté" : r.gain ? "−" + r.gain.toFixed(1).replace(".", ",") + " %" : "rien") + "</span></div>" +
        '<div class="bas">' + (r.saute ? '<span class="puce al">sauté</span>' : r.gain ? (r.tient ? '<span class="puce ok">confirmé sur des cas gardés de côté</span>' : '<span class="puce al">à confirmer : pas tenu sur les cas gardés de côté</span>') : '<span class="puce mu">aucune variante sûre</span>') + '<span class="puce">' + (r.jetons ? k(r.jetons) + " jetons" : "0 jeton") + '</span><span class="puce">' + duree(r.duree) + "</span>" + (r.memoire != null && !nul ? '<span class="puce ' + (r.memoire >= 0 ? "ok" : "al") + '">mémoire ' + (r.memoire > 0 ? "−" : "+") + Math.abs(r.memoire) + " %</span>" : "") + "</div>" +
        (ouvert ? '<div class="cp-det"><span><b>Ce qu’il a trouvé</b>' + (r.saute ? esc(r.saute) : r.variantes + " variante" + (r.variantes > 1 ? "s" : "") + " proposée" + (r.variantes > 1 ? "s" : "") + ", dont " + r.equivalentes + " rendant exactement le même résultat") + "</span><span><b>Ce que ça coûte</b>" + (r.jetons ? k(r.jetons) + " jetons (≈ " + (100 * r.jetons / MOIS.budget).toFixed(2).replace(".", ",") + " % du mois)" : "rien") + "</span><span><b>Pourquoi « confirmé »</b>la variante est aussi essayée sur des cas que le chercheur n’a jamais vus</span></div>" : "") + "</div>";
    };
    const act = gagnant ? (S.adopte ? '<div class="cp-ok"><b>' + esc(gagnant.c.nom) + " est adopté en ombre pour " + esc(f.id) + ".</b> Il tourne à côté de l’originale, sans rien servir à personne. Tu le suis dans « Améliorations ».</div>"
      : S.confirm ? '<div class="cp-alerte"><b>Adopter la variante de ' + esc(gagnant.c.nom) + " pour " + esc(f.id) + " ?</b><span>Elle est d’abord <b>rejugée</b>, puis mise <b>à l’ombre</b> : elle tourne à côté de l’originale, ses résultats sont comparés, et rien n’est servi à personne tant que tu ne l’as pas mise en service.</span><div class=\"cp-actions\"><button class=\"btn prim\" data-adopter-ok>Oui, l’adopter à l’ombre</button><button class=\"btn\" data-adopter-non>Annuler</button></div></div>"
      : '<div class="cp-actions"><button class="btn prim" data-adopter>Adopter ' + esc(gagnant.c.nom) + " pour cette fonction</button>" + '<button class="btn" data-epingle>' + (S.epingle ? "✓ Épinglée" : "Épingler cette course") + '</button><button class="btn" data-refaire>Refaire avec un budget plus large</button></div>')
      : '<div class="cp-actions"><button class="btn" data-epingle>' + (S.epingle ? "✓ Épinglée" : "Épingler cette course") + '</button><button class="btn prim" data-refaire>Refaire avec un budget plus large</button></div>';
    return '<div class="verre cp-bloc" id="cp-res"><div class="cp-tete"><h3>Le résultat</h3><span class="cp-aide">classé par : ' + CRITERES[S.crit][0].toLowerCase() + ' <a href="#" data-vers="3">(changer)</a></span></div><div class="cp-verdict' + (gagnant ? "" : " rien") + '">' + phrase + '</div><div class="cp-rang">' + l.map(ligne).join("") + "</div>" + act + '<div class="cp-aide">Clique sur une ligne pour voir le détail. Même cas, même juge, même budget pour tous : la comparaison est équitable.</div></div>';
  }
  function histo() {
    return '<div class="verre cp-bloc"><details class="cp-sur" data-det="histo"' + (S.histoOuvert ? " open" : "") + '><summary>Les courses précédentes (' + S.histo.length + ') <span class="cp-aide">· pour comparer d’une fois sur l’autre</span></summary><div class="cp-hist" style="margin-top:8px">' + S.histo.map((h, i) => '<div class="cp-h"><span><b>' + esc(h.fn) + "</b><small>" + esc(h.quand) + " · " + (h.gain ? esc(h.qui) + " a gagné " + h.gain.toFixed(1).replace(".", ",") + " %" : "aucun gagnant") + '</small></span><button class="btn" data-hepingle="' + i + '" title="Épingler pour la garder">' + (h.epingle ? "✓ Épinglée" : "Épingler") + '</button><button class="btn" data-hrouvrir="' + i + '">Rouvrir</button></div>').join("") + "</div></details></div>";
  }
  const sur = () => '<div class="verre cp-bloc"><details class="cp-sur" data-det="sur"' + (S.surOuvert ? " open" : "") + '><summary>Pourquoi cette comparaison est équitable</summary><ul><li>Tous les chercheurs reçoivent <b>la même fonction, les mêmes cas, le même budget</b>.</li><li>Ils ne voient qu’une partie des cas ; <b>le reste est gardé de côté</b> et ne sert qu’au juge : c’est ce qui permet d’écrire « confirmé ».</li><li>Chacun tourne <b>dans son processus, sans réseau</b> ; ses appels de modèle passent par le relais, qui compte les jetons de la même façon pour tous.</li><li>Un chercheur qui a atteint son <b>plafond du jour</b> est sauté, et on le dit.</li><li>Une course <b>ne met rien en service</b> : adopter est un geste à part, la variante est rejugée d’abord.</li></ul></details></div>';

  function dessiner() {
    racine.innerHTML = (S.msg ? '<div class="cp-ok">' + esc(S.msg) + "</div>" : "") + '<div class="cp-ligne a">' + etapeFonction() + etapeChercheurs() + '</div><div class="cp-ligne b">' + etapeBudget() + resume() + "</div>" + direct() + resultat() + '<div class="cp-ligne c">' + histo() + sur() + "</div>";
    lier();
  }
  function lancer() {
    const l = choisis(); if (l.length < 2 || S.phase === "course") return;
    S.phase = "course"; S.res = null; S.ouvert = ""; S.confirm = false; S.adopte = false; S.epingle = false; S.msg = "";
    S.lanes = l.map((c) => { const r = RES.find((x) => x.id === c.id) || {}; return { id: c.id, pct: 0, run: false, fini: false, saute: !!r.saute, jet: 0, cible: r.jetons || 0 }; });
    dessiner();
    let i = 0;
    const suite = () => {
      if (i >= S.lanes.length) { S.phase = "fini"; dessiner(); const e = document.getElementById("cp-res"); if (e) e.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
      const L = S.lanes[i]; L.run = true; dessiner();
      if (L.saute) { L.run = false; L.fini = true; L.pct = 0; i++; return setTimeout(suite, 350); }
      let t = 0; const pas = setInterval(() => { t++; L.pct = Math.min(100, t * 14); L.jet = Math.round(L.cible * L.pct / 100); const z = racine.querySelectorAll(".cp-piste .cp-barre i")[i]; if (z) z.style.width = L.pct + "%"; if (L.pct >= 100) { clearInterval(pas); L.run = false; L.fini = true; i++; setTimeout(suite, 200); dessiner(); } }, 160);
    };
    setTimeout(suite, 300);
  }
  function lier() {
    const q = (s) => racine.querySelectorAll(s);
    const r = racine.querySelector("#cp-q"); if (r) r.addEventListener("input", () => { S.q = r.value; dessiner(); const n = racine.querySelector("#cp-q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
    q("[data-fn]").forEach((b) => b.addEventListener("click", () => { S.fn = b.dataset.fn; S.phase = "prepare"; S.res = null; dessiner(); }));
    q("[data-tout]").forEach((b) => b.addEventListener("click", () => { S.tout = b.dataset.tout === "oui"; dessiner(); }));
    q("[data-ch]").forEach((b) => b.addEventListener("click", () => { const c = ch(b.dataset.ch); if (!c.actif) return; S.sel[c.id] = !S.sel[c.id]; dessiner(); }));
    q("[data-pre]").forEach((b) => b.addEventListener("click", () => { const p = b.dataset.pre; CH.forEach((c) => { S.sel[c.id] = c.actif && (p === "tous" || (p === "gratuits" && c.cout !== "gourmand")); }); dessiner(); }));
    q("[data-budget]").forEach((b) => b.addEventListener("click", () => { S.budget = b.dataset.budget; dessiner(); }));
    q("[data-crit]").forEach((b) => b.addEventListener("click", () => { S.crit = b.dataset.crit; dessiner(); }));
    q("[data-go]").forEach((b) => b.addEventListener("click", lancer));
    q("[data-lg]").forEach((b) => b.addEventListener("click", () => { S.ouvert = S.ouvert === b.dataset.lg ? "" : b.dataset.lg; dessiner(); }));
    q("[data-adopter]").forEach((b) => b.addEventListener("click", () => { S.confirm = true; dessiner(); }));
    q("[data-adopter-non]").forEach((b) => b.addEventListener("click", () => { S.confirm = false; dessiner(); }));
    q("[data-adopter-ok]").forEach((b) => b.addEventListener("click", () => { S.confirm = false; S.adopte = true; dessiner(); }));
    q("[data-epingle]").forEach((b) => b.addEventListener("click", () => { S.epingle = !S.epingle; dessiner(); }));
    q("[data-refaire]").forEach((b) => b.addEventListener("click", () => { S.budget = "large"; S.phase = "prepare"; S.msg = "Budget passé à « Large » : relance la course quand tu veux."; dessiner(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
    q("[data-hepingle]").forEach((b) => b.addEventListener("click", () => { const h = S.histo[+b.dataset.hepingle]; h.epingle = !h.epingle; dessiner(); }));
    q("[data-hrouvrir]").forEach((b) => b.addEventListener("click", () => { const h = S.histo[+b.dataset.hrouvrir]; S.fn = FN.some((f) => f.id === h.fn) ? h.fn : S.fn; S.phase = "fini"; S.msg = "Course du " + h.quand + " rouverte (la maquette montre le même exemple de résultat)."; dessiner(); }));
    q("details[data-det]").forEach((d) => d.addEventListener("toggle", () => { S[d.dataset.det + "Ouvert"] = d.open; }));
    q("[data-vers]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); alert(b.dataset.vers === "1" ? "Maquette : ici, on ouvrirait « Les chercheurs »." : "Maquette : on remonte au choix « Ce qui compte »."); }));
  }
  document.getElementById("d-raz").addEventListener("click", () => { S = init(); dessiner(); });
  const MENU = [["Évolution", 0, "⚘"], ["Aujourd’hui", 1, "☼"], ["Améliorations", 1, "↗"], ["Réglages", 1, "◈"], ["Consignes et seuils", 1, "✎"], ["Sous le capot", 1, "⚙"], ["Les chercheurs", 2, "⊙"], ["Les fonctions", 2, "ƒ"], ["Les comparer", 2, "⇄"], ["Installer un chercheur", 2, "⤓"], ["Filet de sécurité", 2, "⛨"], ["Carnet", 2, "▤"], ["Versions écartées", 2, "⊘"], ["Ce qui est prévu", 2, "✦"], ["Vocabulaire", 2, "Aa"]];
  document.getElementById("mq-menu").innerHTML = MENU.map((m) => '<div class="t s' + m[1] + (m[0] === "Les comparer" ? " on" : "") + '"><span class="g">' + m[2] + "</span>" + m[0] + "</div>").join("");
  dessiner();
})();
</script>
</body>
</html>
