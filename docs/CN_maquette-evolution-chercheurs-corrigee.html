<title>Maquette · Évolution · Les chercheurs (version proposée)</title>
<!--
  VERSION PROPOSÉE de « Les chercheurs », à comparer avec CN_maquette-evolution-chercheurs-actuelle.html (la page d'aujourd'hui, à l'identique).
  Chiffres réels d'Argos du 05-11 : Orfan 28 essais, 1 amélioration, 176 k jetons ; Frugal 2 : 6 essais, 0 jeton ; Évolutif : 1 essai, 13 k jetons ;
  budget 189 k sur 2 000 k ; 36 recherches sur 60 aujourd'hui.
  Ce qui change, point par point :
   1. UNE phrase d'état en tête (qui cherche, ce que ça coûte), au lieu de sept cartes de statistiques ;
   2. l'ordre, l'interrupteur et ce que chaque étage a rapporté sont sur la MÊME ligne (avant : trois endroits, et deux façons d'éteindre) ;
   3. un tableau « Ce que chacun a rapporté » : essais, améliorations trouvées, jetons, jetons par amélioration, plafond du jour posé sur place ;
   4. le parcours d'une recherche est dit en une phrase, avec son coût mesuré ;
   5. « Installation » et « Relais de modèles » ne sont plus des onglets ici : un lien vers Installer un chercheur et vers Réglages › Quels modèles ;
   6. le détail technique devient une FICHE par chercheur, avec un sélecteur (Orfan, Frugal 2, Évolutif) : identité, chiffres, ses méthodes, ses vérifications, ses derniers appels ;
   7. vocabulaire simple : « étage », « cascade », « relais », « adaptateur », « EC » disparaissent.
  Les boutons sont vivants. Rien n'est envoyé nulle part.
-->

.ev .lien-c{display:flex;flex-direction:column;gap:4px;border:1px solid var(--e-filet);border-radius:13px;padding:12px 14px;background:var(--e-verre);cursor:pointer;text-align:left;color:inherit;font:inherit}
.ev .lien-c:hover{border-color:var(--accent)}.ev .lien-c b{font-size:14px}.ev .lien-c span{font-size:12.5px;color:var(--e-encre2)}
.ev details.tech summary{cursor:pointer;font:600 13.5px var(--font-sans,system-ui);color:var(--e-encre2);padding:2px 0}
.ev .preuves-m{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ev .appels{display:flex;flex-direction:column;gap:4px;margin-top:8px;font:12px ui-monospace,Menlo,Consolas,monospace}
.ev .appels div{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:5px 8px;border-radius:8px;background:var(--e-doux)}
.ev .msg{font-size:13px;color:var(--e-ok);min-height:18px}.ev .segs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--e-doux);flex-wrap:wrap}.ev .seg{border:0;background:transparent;border-radius:9px;padding:7px 14px;font:600 13px var(--font-sans,system-ui);color:var(--e-encre2);cursor:pointer}.ev .seg.on{background:var(--accent);color:var(--on-accent)}.ev .fiche-t{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.ev .fiche-t .act{display:flex;gap:6px;flex-wrap:wrap}.ev .chiffres4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.ev .chiffres4>div{border:1px solid var(--e-filet);border-radius:12px;padding:10px 12px;background:var(--e-verre);display:flex;flex-direction:column;gap:2px}.ev .chiffres4 .v{font:600 20px ui-monospace,Menlo,Consolas,monospace;color:var(--e-encre)}.ev .meth{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--e-filet);border-radius:11px;background:var(--e-verre);font-size:13.5px}.ev .meth .rg{font:700 13px ui-monospace,monospace;color:var(--accent);width:18px}
</style>
</head>
<body>
<div class="mq-bandeau"><b>Maquette · « Les chercheurs » proposée</b><span>Chiffres réels d'Argos du 05-11 · à comparer avec la page actuelle · rien n'est envoyé nulle part</span></div>
<div class="mq-cadre">
  <nav class="mq-menu" id="mq-menu" aria-label="Menu d'Évolution"></nav>
  <main class="mq-corps"><div class="ev" id="ev"></div></main>
</div>
<script>
(function () {
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString("fr-FR");
  const kj = (v) => v >= 10000 ? Math.round(v / 1000) + " k" : v >= 1000 ? (v / 1000).toFixed(1).replace(".", ",") + " k" : String(v);
  // les chercheurs (le moteur) : chiffres réels d'Argos
  const M = {
    orfan: { nom: "Orfan", essais: 28, trouvees: 1, jetons: 176000, appels: 42, jour: { jetons: 87000, essais: 16 }, refus: 2, plafond: 0, actif: true, source: "livré avec Cassandra · orfan/CN_orfan.py", genre: "natif", proc: "processus à part, dans la cage", verifs: [1, 1, 1, 1, 1, 0] },
    frugal: { nom: "Frugal 2", essais: 6, trouvees: 0, jetons: 0, appels: 0, jour: { jetons: 0, essais: 0 }, refus: 0, plafond: 0, actif: true, source: "livré avec Cassandra · orfan/CN_frugal.py", genre: "natif", proc: "processus à part, dans la cage", verifs: [1, 1, 0, 1, 1, 0] },
    evolutif: { nom: "Évolutif", essais: 1, trouvees: 0, jetons: 13337, appels: 2, jour: { jetons: 0, essais: 0 }, refus: 0, plafond: 0, actif: true, source: "livré avec Cassandra · orfan/CN_evolutif.py", genre: "natif", proc: "processus à part, dans la cage", verifs: [1, 1, 1, 1, 0, 0] },
  };
  const VERIFS = ["Il répond au contrat des chercheurs", "Il tourne dans un processus à part", "Il a déjà appelé un modèle", "Son installation est vérifiée", "Il a déjà couru contre un autre", "Un plafond du jour est posé"];
  let ETAGES = [
    { id: "orfan/deterministe", m: "orfan", nom: "Orfan · règles déterministes", ce: "Des recettes toutes faites, sans modèle : mémoïser, sortir un calcul d’une boucle, remplacer une liste par un ensemble…", cout: "Gratuit", cc: "ok", on: true },
    { id: "frugal", m: "frugal", nom: "Frugal 2", ce: "Cherche d’abord avec des recettes. Si rien ne marche et que la fonction est vraiment chaude, un modèle fort donne des idées et un modèle économe écrit le code.", cout: "Peu de jetons", cc: "ok", on: true },
    { id: "orfan/modele", m: "orfan", nom: "Orfan · modèle guidé par le profil", ce: "Un modèle écrit des versions à essayer, guidé par la façon dont la fonction est vraiment appelée.", cout: "Des jetons", cc: "al", on: true },
    { id: "evolutif", m: "evolutif", nom: "Évolutif", ce: "Plusieurs générations de versions qui se croisent et mutent, comme une sélection naturelle. Le plus lent et le plus cher.", cout: "Beaucoup de jetons", cc: "dg", on: true },
  ];
  const REGLES = [
    { id: "arret", t: "S’arrêter dès qu’une amélioration est prouvée", s: "Sinon tous les chercheurs essaient, tant que le budget le permet.", on: true },
    { id: "chaud", t: "Ne payer un modèle que sur les fonctions qui prennent du temps", s: "Une fonction qui porte au moins 40 % du travail et tourne au moins 50 fois.", on: true },
    { id: "course", t: "Faire courir deux chercheurs quand le premier a réussi", s: "Le suivant essaie aussi : la meilleure des deux versions est gardée.", on: false },
  ];
  const BUDGET = { mois: 2000000, depense: 189000 }, PROP = { fait: 36, plafond: 60 };
  const APPELS = [["orfan", "il y a 3 min", "gemini-2.5-flash", "5 330"], ["orfan", "il y a 9 min", "gemini-2.5-flash", "5 285"], ["evolutif", "hier", "gemini-2.5-flash", "2 280"], ["evolutif", "hier", "gemini-2.5-flash", "2 285"], ["orfan", "il y a 21 min", "gemini-2.5-flash", "7 855"]];
  const S = { msg: "", fiche: "orfan" };
  const racine = document.getElementById("ev");

  const actifs = () => ETAGES.filter((e) => e.on);
  const nomsMoteursActifs = () => { const set = {}; actifs().forEach((e) => { set[e.m] = 1; }); return Object.keys(set).length; };
  const coutEssai = () => Math.round(M.orfan.jetons / Math.max(1, M.orfan.essais) / 100) * 100;

  function phrase() {
    const n = actifs().length, partM = Math.round(100 * BUDGET.depense / BUDGET.mois);
    if (!n) return "Aucun chercheur n’est actif : Cassandra ne cherche plus d’améliorations.";
    const nm = nomsMoteursActifs(); return n + " méthode" + (n > 1 ? "s" : "") + " de recherche active" + (n > 1 ? "s" : "") + " sur " + ETAGES.length + ", portée" + (n > 1 ? "s" : "") + " par " + nm + " chercheur" + (nm > 1 ? "s" : "") + ". Ils ont trouvé " + (M.orfan.trouvees + M.frugal.trouvees + M.evolutif.trouvees) + " amélioration en " + (M.orfan.essais + M.frugal.essais + M.evolutif.essais) + " essais, pour " + kj(BUDGET.depense) + " jetons ce mois-ci (" + partM + " % du budget).";
  }
  function titreEtat() {
    const n = actifs().length, partM = Math.round(100 * BUDGET.depense / BUDGET.mois);
    if (!n) return "Rien ne cherche pour l’instant";
    if (partM >= 80) return "Les chercheurs approchent du budget du mois";
    return "Les chercheurs travaillent normalement";
  }
  function sousEtat() {
    const n = actifs().length; if (!n) return "Active au moins un chercheur pour que Cassandra cherche des améliorations.";
    const nm = nomsMoteursActifs(), tr = M.orfan.trouvees + M.frugal.trouvees + M.evolutif.trouvees, es = M.orfan.essais + M.frugal.essais + M.evolutif.essais;
    return n + " méthode" + (n > 1 ? "s" : "") + " de recherche (" + nm + " chercheur" + (nm > 1 ? "s" : "") + ") · " + tr + " amélioration trouvée en " + es + " essais";
  }
  function anneau(pct, centre, sous, lib) {
    const R = 26, C = 2 * Math.PI * R, d = Math.max(0, Math.min(100, pct)) / 100 * C;
    return '<div class="anneau"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="' + R + '" class="fond"/><circle cx="32" cy="32" r="' + R + '" class="val" stroke-dasharray="' + d.toFixed(1) + " " + C.toFixed(1) + '" transform="rotate(-90 32 32)"/></svg><b>' + esc(centre) + '</b><div class="a-t"><span>' + esc(lib) + "</span><small>" + esc(sous) + "</small></div></div>";
  }
  function parcours() {
    const l = actifs();
    if (!l.length) return "Rien ne cherche : active au moins un chercheur.";
    const reg = (id) => REGLES.find((r) => r.id === id).on;
    const pas = l.map((e, i) => (i ? " puis " : "") + '<span class="fl2">' + esc(e.nom) + "</span>").join("");
    const cher = l.some((e) => e.cc !== "ok");
    return "Pour une fonction, la recherche passe par : " + pas + ". " + (reg("arret") ? "Elle s’arrête à la première version prouvée." : "Tous essaient, même après un succès.") +
      (cher ? " Coût mesuré : gratuit si les recettes suffisent, sinon environ <b>" + fmt(coutEssai()) + " jetons</b> par essai de modèle." : " Coût : aucun jeton.") + (reg("chaud") && cher ? " Le modèle ne sert que sur les fonctions chaudes." : "");
  }
  function ligneStat(e) {
    const m = M[e.m];
    if (!m.actif) return '<span class="puce mu">éteint</span>';
    return "a fait " + m.essais + " essai" + (m.essais > 1 ? "s" : "") + " · " + (m.trouvees ? "<b>" + m.trouvees + " amélioration trouvée</b>" : "aucune amélioration trouvée") + (m.jetons ? " · " + kj(m.jetons) + " jetons" : " · 0 jeton");
  }
  function dessiner() {
    const partM = Math.round(100 * BUDGET.depense / BUDGET.mois), partJ = Math.round(100 * PROP.fait / PROP.plafond);
    racine.innerHTML =
      '<div class="entete"><div><h1>Les chercheurs</h1><div class="note" style="font-size:13.5px">Ceux qui cherchent comment rendre Cassandra plus rapide : dans quel ordre, combien ça coûte, ce que chacun a rapporté.</div></div></div>' +
      '<div class="verre etat"><div class="etat-t"><div class="etat-l"><span class="pt-e ' + (actifs().length ? (partM >= 80 ? "al" : "ok") : "dg") + '"></span><div><div class="etat-h">' + esc(titreEtat()) + '</div><div class="etat-s">' + esc(sousEtat()) + '</div></div></div>' +
      '<div class="anneaux">' + anneau(partJ, PROP.fait, "sur " + PROP.plafond, "Recherches aujourd’hui") + anneau(partM, partM + " %", kj(BUDGET.depense) + " sur " + kj(BUDGET.mois), "Budget du mois") + "</div></div></div>" +
      '<div class="deuxc"><div class="col">' + blocOrdre() + blocRegles() + '</div><div class="col">' + blocRapport() + blocLiens() + blocTech() + "</div></div>";
    lier();
  }
  function blocOrdre() {
    return '<div class="verre bloc"><h3>Dans quel ordre ils essaient</h3><div class="note">Le gratuit d’abord. Glisse l’ordre avec les flèches, éteins avec l’interrupteur : un chercheur éteint saute son tour sans rien perdre de ce qu’il avait en cours.</div>' +
      ETAGES.map((e, i) => '<div class="etage' + (e.on ? "" : " off") + '"><span class="rg">' + (i + 1) + '</span><div class="nom"><b>' + esc(e.nom) + "</b><span>" + esc(e.ce) + '</span></div><div class="act"><button class="fl" data-h="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="Monter">↑</button><button class="fl" data-b="' + i + '"' + (i === ETAGES.length - 1 ? " disabled" : "") + ' aria-label="Descendre">↓</button><button class="inter2' + (e.on ? " on" : "") + '" data-i="' + i + '" role="switch" aria-checked="' + e.on + '" aria-label="' + esc(e.nom) + '"></button></div>' +
        '<div class="ligne2"><span class="puce ' + e.cc + '">' + e.cout + "</span><span>" + ligneStat(e) + "</span></div></div>").join("") +
      '<div class="parcours">' + parcours() + "</div></div>";
  }
  function blocRegles() {
    return '<div class="verre bloc"><h3>Règles de la recherche</h3>' + REGLES.map((r, i) => '<div class="regle"><div class="t"><b>' + esc(r.t) + "</b><span>" + esc(r.s) + '</span></div><button class="inter2' + (r.on ? " on" : "") + '" data-r="' + i + '" role="switch" aria-checked="' + r.on + '" aria-label="' + esc(r.t) + '"></button></div>').join("") + "</div>";
  }
  function blocRapport() {
    const ids = ["orfan", "frugal", "evolutif"];
    return '<div class="verre bloc"><h3>Ce que chacun a rapporté</h3><div class="tw2"><table class="rapport"><thead><tr><th>Chercheur</th><th>Essais</th><th>Trouvées</th><th>Jetons</th><th>Par amélioration</th><th>Plafond / jour</th></tr></thead><tbody>' +
      ids.map((id) => { const m = M[id]; return '<tr><td>' + esc(m.nom) + "<small>" + (m.actif ? "actif" : "éteint") + " · " + (m.jour.essais ? m.jour.essais + " essais aujourd’hui (" + kj(m.jour.jetons) + " jetons)" : "rien aujourd’hui") + "</small></td><td>" + m.essais + "</td><td>" + m.trouvees + "</td><td>" + (m.jetons ? kj(m.jetons) : "0") + "</td><td>" + (m.trouvees ? kj(Math.round(m.jetons / m.trouvees)) : "—") + '</td><td><input type="number" min="0" data-p="' + id + '" value="' + (m.plafond || "") + '" placeholder="aucun"></td></tr>'; }).join("") + "</tbody></table></div>" +
      '<div class="note">« Par amélioration » = jetons dépensés pour chaque amélioration trouvée : plus c’est bas, mieux ça rend. Un plafond vide veut dire « aucun ». <span class="msg" id="msg">' + esc(S.msg) + "</span></div></div>";
  }
  function blocLiens() {
    return '<div class="liens"><button class="lien-c" data-vers="Quels modèles écrivent"><b>Quel modèle écrit les versions ?</b><span>Choisis l’exécutant et le stratège dans Réglages › Quels modèles.</span></button><button class="lien-c" data-vers="Installer un chercheur"><b>Ajouter un autre chercheur</b><span>Aujourd’hui : 3 livrés avec Cassandra, 0 installé. L’installation se fait dans Sous le capot › Installer un chercheur.</span></button></div>';
  }
  function blocTech() {
    const id = S.fiche, m = M[id], ok = m.verifs.filter(Boolean).length, mes = ETAGES.map((e, i) => ({ e, i })).filter((x) => x.e.m === id), ap = APPELS.filter((x) => x[0] === id);
    const selecteur = ["orfan", "frugal", "evolutif"].map((k) => '<button class="seg' + (S.fiche === k ? " on" : "") + '" data-fiche="' + k + '">' + esc(M[k].nom) + "</button>").join("");
    return '<div class="verre bloc"><div class="tete"><h3>Fiche d’un chercheur</h3><div class="segs" role="tablist">' + selecteur + "</div></div>" +
      '<div class="fiche-t"><div><b style="font-size:19px">' + esc(m.nom) + "</b><div class=\"note\">" + esc(m.genre) + " · " + esc(m.source) + '</div></div><div class="act"><span class="puce ' + (m.actif ? "ok" : "mu") + '">' + (m.actif ? "actif" : "éteint") + '</span><span class="puce ' + (ok === 6 ? "ok" : "al") + '">' + ok + " vérifications sur 6</span></div></div>" +
      '<div class="chiffres4"><div><span class="lib">Essais</span><span class="v">' + m.essais + '</span></div><div><span class="lib">Trouvées</span><span class="v">' + m.trouvees + '</span></div><div><span class="lib">Jetons</span><span class="v">' + (m.jetons ? kj(m.jetons) : "0") + '</span></div><div><span class="lib">Appels de modèle</span><span class="v">' + m.appels + '</span></div></div>' +
      '<div class="lib">Ses méthodes dans l’ordre de recherche</div>' + (mes.length ? mes.map((x) => '<div class="meth"><span class="rg">' + (x.i + 1) + "</span><span>" + esc(x.e.nom) + '</span><span class="puce ' + x.e.cc + '">' + x.e.cout + "</span>" + (x.e.on ? "" : '<span class="puce mu">éteinte</span>') + "</div>").join("") : '<div class="note">Aucune méthode dans l’ordre de recherche.</div>') +
      '<dl class="cle"><dt>Exécution</dt><dd>' + esc(m.proc) + "</dd><dt>Aujourd’hui</dt><dd>" + (m.jour.essais ? m.jour.essais + " essais · " + kj(m.jour.jetons) + " jetons" : "rien") + "</dd><dt>Plafond du jour</dt><dd>" + (m.plafond ? fmt(m.plafond) + " jetons" : "aucun") + "</dd>" + (m.refus ? "<dt>Refus</dt><dd>" + m.refus + " appel(s) refusé(s) au plafond</dd>" : "") + "</dl>" +
      '<div class="lib">Ses vérifications</div><div class="preuves-m">' + m.verifs.map((v, i) => '<div class="preuve ' + (v ? "" : "mu") + '"><span class="k">' + (v ? "✓" : "·") + "</span><div>" + esc(VERIFS[i]) + "</div></div>").join("") + "</div>" +
      '<div class="lib">Ses derniers appels de modèle</div>' + (ap.length ? '<div class="appels">' + ap.map((a) => "<div><span>" + esc(a[1]) + "</span><span>" + esc(a[2]) + "</span><span>" + a[3] + " jetons</span></div>").join("") + "</div>" : '<div class="note">Aucun appel de modèle : ce chercheur n’en a jamais eu besoin.</div>') + "</div>";
  }
  function lier() {
    racine.querySelectorAll("[data-h]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.h; [ETAGES[i - 1], ETAGES[i]] = [ETAGES[i], ETAGES[i - 1]]; dessiner(); }));
    racine.querySelectorAll("[data-b]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.b; [ETAGES[i + 1], ETAGES[i]] = [ETAGES[i], ETAGES[i + 1]]; dessiner(); }));
    racine.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => { const e = ETAGES[+b.dataset.i]; e.on = !e.on; M[e.m].actif = ETAGES.some((x) => x.m === e.m && x.on); dessiner(); }));
    racine.querySelectorAll("[data-r]").forEach((b) => b.addEventListener("click", () => { REGLES[+b.dataset.r].on = !REGLES[+b.dataset.r].on; dessiner(); }));
    racine.querySelectorAll("[data-p]").forEach((i) => i.addEventListener("change", () => { M[i.dataset.p].plafond = +i.value || 0; S.msg = M[i.dataset.p].nom + " : " + (+i.value ? "plafond de " + fmt(+i.value) + " jetons par jour posé." : "plus de plafond."); dessiner(); }));
    racine.querySelectorAll("[data-fiche]").forEach((b) => b.addEventListener("click", () => { S.fiche = b.dataset.fiche; dessiner(); }));
    racine.querySelectorAll("[data-vers]").forEach((b) => b.addEventListener("click", () => alert("Maquette : ici, on ouvrirait « " + b.dataset.vers + " » dans l’application.")));
  }
  const MENU = [["Évolution", 0, "⚘"], ["Aujourd’hui", 1, "☼"], ["Améliorations", 1, "↗"], ["Réglages", 1, "◈"], ["Consignes et seuils", 1, "✎"], ["Sous le capot", 1, "⚙"], ["Les chercheurs", 2, "⊙"], ["Les fonctions", 2, "ƒ"], ["Les comparer", 2, "⇄"], ["Installer un chercheur", 2, "⤓"], ["Filet de sécurité", 2, "⛨"], ["Carnet", 2, "▤"], ["Versions écartées", 2, "⊘"], ["Ce qui est prévu", 2, "✦"], ["Vocabulaire", 2, "Aa"]];
  document.getElementById("mq-menu").innerHTML = MENU.map((m) => '<div class="t s' + m[1] + (m[0] === "Les chercheurs" ? " on" : "") + '"><span class="g">' + m[2] + "</span>" + m[0] + "</div>").join("");
  dessiner();
})();
</script>
</body>
</html>
