<title>Maquette · Évolution · Les chercheurs (version proposée)</title>
<!--
  VERSION PROPOSÉE de « Les chercheurs », à comparer avec CN_maquette-evolution-chercheurs-actuelle.html (la page d'aujourd'hui, à l'identique).
  Chiffres réels d'Argos du 05-11 : Orfan 28 essais, 1 amélioration, 176 k jetons ; Frugal : 6 essais, 0 jeton ; Évolutif : 1 essai, 13 k jetons ;
  budget 189 k sur 2 000 k ; 36 recherches sur 60 aujourd'hui.
  Ce qui change, point par point :
   1. UNE phrase d'état en tête (qui cherche, ce que ça coûte), au lieu de sept cartes de statistiques ;
   2. l'ordre, l'interrupteur et ce que chaque étage a rapporté sont sur la MÊME ligne (avant : trois endroits, et deux façons d'éteindre) ;
   3. un tableau « Ce que chacun a rapporté » : essais, améliorations trouvées, jetons, jetons par amélioration, plafond du jour posé sur place ;
   4. le parcours d'une recherche est dit en une phrase, avec son coût mesuré ;
   6d. « Contrôler son intégrité » : passe en revue (programme intact, démarrage isolé, réponse à un test, modèle, plafond), trouve où est la panne et propose l'action (relancer, désactiver, retirer) ; bouton de démonstration « Simuler une défaillance » ;
   6c. la fiche est AGISSANTE : interrupteur (activé / désactivé), « Essayer maintenant » sur la fonction de son choix (le coût est ajouté aux chiffres), « Comparer avec un autre », « Vérifier de nouveau » ;
   6b. la fiche d'un chercheur ne répète plus les chiffres du tableau : sa santé (bague + points à regarder avec le conseil), sa dernière activité, ses méthodes ; l'identité reste repliée ;
   5d. au-delà de 4 chercheurs, « Ce que chacun a rapporté » ne montre que le diagramme (une barre de jetons par chercheur) ; la carte complète se déplie au clic ;
   5c. l'ordre de recherche est replié par défaut, quel que soit le nombre de méthodes (une ligne chacune, détail au clic, « Tout déplier ») ;
   5b. prêt pour les chercheurs externes : sélecteur qui devient liste au-delà de 4, pastille « externe », provenance et empreinte, retrait avec confirmation, état « refusé », coût par chercheur (boutons de démonstration en haut) ;
   5. « Installation » et « Relais de modèles » ne sont plus des onglets ici : deux boutons en haut à droite (Choisir les modèles, + Ajouter un chercheur) ;
   6. le détail technique devient une FICHE par chercheur, avec un sélecteur (Orfan, Frugal, Évolutif) : identité, chiffres, ses méthodes, ses vérifications, ses derniers appels ;
   7. vocabulaire simple : « étage », « cascade », « relais », « adaptateur », « EC » disparaissent.
  Les boutons sont vivants. Rien n'est envoyé nulle part.
-->

    const selecteur = ids().length > 4 ? '<select data-fichesel aria-label="Choisir un chercheur">' + ids().map((k) => '<option value="' + k + '"' + (S.fiche === k ? " selected" : "") + ">" + esc(M[k].nom) + (M[k].externe ? " (externe)" : "") + "</option>").join("") + "</select>" : '<div class="segs" role="tablist">' + ids().map((k) => '<button class="seg' + (S.fiche === k ? " on" : "") + '" data-fiche="' + k + '">' + esc(M[k].nom) + "</button>").join("") + "</div>";
    const resume = rf ? "Refusé : il ne cherche pas." : (m.essais ? m.essais + " essai" + (m.essais > 1 ? "s" : "") + " · " + m.trouvees + " trouvée" + (m.trouvees > 1 ? "s" : "") + " · " + (m.jetons ? kj(m.jetons) : "0") + " jeton" + (m.jetons > 1 ? "s" : "") : "Pas encore couru") + (m.appels ? " · " + m.appels + " appels de modèle" : "");
    const essentiels = [0, 1, 3, 5], a_faire = m.verifs.map((v, i) => (v || essentiels.indexOf(i) < 0 ? "" : '<div class="fi-t"><span>!</span><div>' + esc(VERIFS[i]) + "<small>" + esc(CONSEILS[i]) + "</small></div></div>")).join("") +
      (m.verifs.some((v, i) => !v && essentiels.indexOf(i) < 0) ? '<div class="fi-pas">Pas encore fait, sans urgence : ' + [2, 4].filter((i) => !m.verifs[i]).map((i) => i === 2 ? "avoir appelé un modèle" : "avoir couru contre un autre chercheur").join(" ; ") + ".</div>" : "");
    return '<div class="verre bloc fi"><div class="tete"><h3>Fiche d’un chercheur</h3>' + selecteur + "</div>" +
      '<div class="fi-top"><span class="fi-mono ' + (rf ? "dg" : m.actif ? "ok" : "mu") + '">' + esc(m.nom.charAt(0)) + '</span><div class="fi-ti"><div class="fi-nom"><b>' + esc(m.nom) + "</b>" + (m.externe ? '<span class="puce al">externe</span>' : '<span class="puce">livré</span>') + (rf ? '<span class="puce dg">refusé</span>' : '<span class="puce ' + (m.actif ? "ok" : "mu") + '">' + (m.actif ? "actif" : "éteint") + "</span>") + (panne(id) ? '<span class="puce dg">défaillant</span>' : "") + '</div><div class="fi-res">' + esc(resume) + "</div></div></div>" +
      (rf ? '<div class="alerte"><b>Ce chercheur est refusé.</b> ' + esc(m.raison) + ' Il ne cherche pas tant que la vérification échoue. <div class="lg" style="margin-top:8px"><button class="btn" data-vers="Vérifier de nouveau">Vérifier de nouveau</button></div></div>' : "") +
      actionsFiche(id) +
      '<div class="fi-grille"><div class="fi-carte"><div class="lib">Sa santé</div><div class="fi-sante">' + bague(ok, 6) + "<div><b>" + (ok === 6 ? "Tout est en ordre" : (6 - ok) + " point" + (6 - ok > 1 ? "s" : "") + " à regarder") + "</b><small>" + ok + " vérifications réussies sur 6</small></div></div>" + (a_faire ? '<div class="fi-ts">' + a_faire + "</div>" : "") + "</div>" +
      '<div class="fi-carte"><div class="lib">Sa dernière activité</div>' + (ap.length ? '<div class="fi-tl">' + ap.slice(0, 3).map((a) => "<div><i></i><span><b>" + esc(a[2]) + "</b> · " + a[3] + " jetons<small>" + esc(a[1]) + "</small></span></div>").join("") + "</div>" : '<div class="note">' + (m.essais ? "Aucun appel de modèle : il n’en a jamais eu besoin." : "Rien pour l’instant.") + "</div>") + (m.jour.essais ? '<div class="fi-j">Aujourd’hui : ' + m.jour.essais + " essais · " + kj(m.jour.jetons) + " jetons</div>" : "") + "</div></div>" +
      '<div class="fi-carte"><div class="lib">Ses méthodes dans l’ordre de recherche</div>' + (mes.length ? '<div class="fi-ms">' + mes.map((x) => '<span class="fi-m' + (x.e.on && !rf ? "" : " off") + '"><i>' + (x.i + 1) + "</i>" + esc(x.e.nom) + '<span class="puce ' + x.e.cc + '">' + x.e.cout + "</span></span>").join("") + "</div>" : '<div class="note">Aucune méthode dans l’ordre de recherche.</div>') + "</div>" +
      '<details class="tech"><summary>Identité et exécution</summary><dl class="cle" style="margin-top:8px"><dt>Origine</dt><dd>' + (m.externe ? "externe · " : "livré avec Cassandra · ") + esc(m.source) + "</dd>" + (m.externe ? "<dt>Provenance</dt><dd>" + esc(m.origine) + "</dd><dt>Empreinte</dt><dd class=\"mono\">" + esc(m.empreinte) + (rf ? " · ne correspond pas au catalogue" : " · correspond au catalogue scellé") + "</dd>" : "") + "<dt>Exécution</dt><dd>" + esc(m.proc) + "</dd>" + (m.refus ? "<dt>Refus</dt><dd>" + m.refus + " appel(s) refusé(s) au plafond</dd>" : "") + "</dl></details>" +
      (m.externe ? (S.retrait === id ? '<div class="alerte"><b>Retirer « ' + esc(m.nom) + ' » ?</b> Ses méthodes sortent de l’ordre de recherche. Ce qu’il a déjà trouvé et mis à l’essai reste en place.<div class="lg" style="margin-top:8px"><button class="btn dng" data-retirer-ok="' + id + '">Oui, retirer ce chercheur</button><button class="btn" data-annuler>Annuler</button></div></div>' : '<div class="lg"><button class="btn dng" data-retirer="' + id + '">Retirer ce chercheur</button><span class="note">Il peut être réinstallé depuis le catalogue.</span></div>') : '<div class="note">Un chercheur livré avec Cassandra ne se retire pas : on l’éteint avec l’interrupteur de l’ordre de recherche.</div>') + "</div>";
  }
  function lier() {
    racine.querySelectorAll("[data-h]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.h; [ETAGES[i - 1], ETAGES[i]] = [ETAGES[i], ETAGES[i - 1]]; dessiner(); }));
    racine.querySelectorAll("[data-b]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.b; [ETAGES[i + 1], ETAGES[i]] = [ETAGES[i], ETAGES[i + 1]]; dessiner(); }));
    racine.querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => { const e = ETAGES[+b.dataset.i]; if (refuse(e.m)) return; e.on = !e.on; M[e.m].actif = ETAGES.some((x) => x.m === e.m && x.on); dessiner(); }));
    racine.querySelectorAll("[data-r]").forEach((b) => b.addEventListener("click", () => { REGLES[+b.dataset.r].on = !REGLES[+b.dataset.r].on; dessiner(); }));
    racine.querySelectorAll("[data-p]").forEach((i) => i.addEventListener("change", () => { M[i.dataset.p].plafond = +i.value || 0; S.msg = M[i.dataset.p].nom + " : " + (+i.value ? "plafond de " + fmt(+i.value) + " jetons par jour posé." : "plus de plafond."); dessiner(); }));
    racine.querySelectorAll("[data-fiche]").forEach((b) => b.addEventListener("click", () => { S.fiche = b.dataset.fiche; S.retrait = ""; S.verif = ""; S.ctrl = null; S.essai.res = ""; S.essai.ouvert = false; dessiner(); }));
    racine.querySelectorAll("[data-fichesel]").forEach((x) => x.addEventListener("change", () => { S.fiche = x.value; S.retrait = ""; S.verif = ""; S.ctrl = null; S.essai.res = ""; S.essai.ouvert = false; dessiner(); }));
    racine.querySelectorAll("[data-ouv]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.ouv; if (S.ouv[k]) delete S.ouv[k]; else S.ouv[k] = 1; dessiner(); }));
    racine.querySelectorAll("[data-ouv-tout]").forEach((b) => b.addEventListener("click", () => { if (b.dataset.ouvTout === "oui") ETAGES.forEach((e) => { S.ouv[e.id] = 1; }); else S.ouv = {}; dessiner(); }));
    racine.querySelectorAll("[data-rap]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.rap; if (S.rap[k]) delete S.rap[k]; else S.rap[k] = 1; dessiner(); }));
    racine.querySelectorAll("[data-rap-tout]").forEach((b) => b.addEventListener("click", () => { if (b.dataset.rapTout === "oui") ids().forEach((k) => { S.rap[k] = 1; }); else S.rap = {}; dessiner(); }));
    racine.querySelectorAll("[data-fa-actif]").forEach((b) => b.addEventListener("click", () => { const id = b.dataset.faActif; if (refuse(id)) return; const on = !M[id].actif; M[id].actif = on; ETAGES.forEach((e) => { if (e.m === id) e.on = on; }); S.verif = ""; S.essai.res = ""; S.ctrl = null; S.msg = M[id].nom + (on ? " cherche de nouveau." : " est éteint."); dessiner(); }));
    racine.querySelectorAll("[data-fa-essai]").forEach((b) => b.addEventListener("click", () => { S.essai.ouvert = true; S.essai.res = ""; S.verif = ""; dessiner(); }));
    racine.querySelectorAll("[data-fa-ferme]").forEach((b) => b.addEventListener("click", () => { S.essai.ouvert = false; dessiner(); }));
    racine.querySelectorAll("[data-fa-fn]").forEach((x) => x.addEventListener("change", () => { S.essai.fn = x.value; }));
    racine.querySelectorAll("[data-fa-lancer]").forEach((b) => b.addEventListener("click", () => {
      const id = b.dataset.faLancer, m = M[id], fn = S.essai.fn, cout = m.nom.indexOf("Évolutif") === 0 || id === "evolutif" ? 13300 : id === "orfan" ? 6300 : 0;
      S.essai.occupe = true; dessiner();
      setTimeout(() => { m.essais++; m.jetons += cout; m.jour.essais++; m.jour.jetons += cout; BUDGET.depense += cout; PROP.fait++; S.essai.occupe = false; S.essai.ouvert = false; S.essai.res = m.nom + " sur " + fn + " : aucune version à la fois identique et plus rapide. Coût : " + (cout ? "≈ " + fmt(cout) + " jetons" : "0 jeton") + ". Rien n’a été changé."; dessiner(); }, 1400);
    }));
    racine.querySelectorAll("[data-fa-verif]").forEach((b) => b.addEventListener("click", () => { S.essai.res = ""; lancerControle(b.dataset.faVerif); }));
    racine.querySelectorAll("[data-fa-relancer]").forEach((b) => b.addEventListener("click", () => { const id = b.dataset.faRelancer; delete M[id].panne; S.ctrl = null; S.msg = M[id].nom + " relancé."; dessiner(); lancerControle(id); }));
    racine.querySelectorAll("[data-retirer]").forEach((b) => b.addEventListener("click", () => { S.retrait = b.dataset.retirer; dessiner(); }));
    racine.querySelectorAll("[data-annuler]").forEach((b) => b.addEventListener("click", () => { S.retrait = ""; dessiner(); }));
    racine.querySelectorAll("[data-retirer-ok]").forEach((b) => b.addEventListener("click", () => { const id = b.dataset.retirerOk; const nom = M[id].nom; delete M[id]; ETAGES = ETAGES.filter((e) => e.m !== id); S.retrait = ""; S.msg = nom + " retiré."; dessiner(); }));
    racine.querySelectorAll("[data-vers]").forEach((b) => b.addEventListener("click", () => alert("Maquette : ici, on ouvrirait « " + b.dataset.vers + " » dans l’application.")));
  }
  let nExt = 0;
  function ajouterExterne(ref) {
    nExt++; const id = "ext" + nExt, nom = (ref ? "Mutagène " : "Sculpteur ") + nExt + " (externe)";
    M[id] = { nom: nom, externe: true, origine: "catalogue des chercheurs · paquet épinglé par empreinte", empreinte: ref ? "sha256:4be1…c902" : "sha256:9f3c…a71d", statut: ref ? "refuse" : "ok", raison: ref ? "L’empreinte du paquet ne correspond pas à celle du catalogue scellé." : "", essais: 0, trouvees: 0, jetons: 0, appels: 0, jour: { jetons: 0, essais: 0 }, refus: 0, plafond: 0, actif: !ref, source: ref ? "paquet « mutagene » · version 0.3" : "paquet « sculpteur » · version 1.2", genre: "externe", proc: "processus à part, dans la cage", verifs: ref ? [1, 1, 0, 0, 0, 0] : [1, 1, 0, 1, 0, 0] };
    ETAGES.push({ id: id, m: id, nom: nom, ce: "Chercheur installé depuis le catalogue scellé. Il cherche à son tour, après les autres.", cout: "Coût pas encore mesuré", cc: "al", on: !ref });
    S.fiche = id; S.retrait = ""; dessiner();
  }
  document.getElementById("d-pan").addEventListener("click", () => { const id = S.fiche; if (!M[id] || refuse(id)) return; M[id].panne = id === "orfan" || id === "evolutif" ? { etape: 4, raison: "Le modèle de langage ne répond pas (délai dépassé après 120 s)." } : { etape: 3, raison: "Le chercheur ne répond plus à une demande de test (délai dépassé)." }; S.ctrl = null; dessiner(); });
  document.getElementById("d-add").addEventListener("click", () => ajouterExterne(false));
  document.getElementById("d-ref").addEventListener("click", () => ajouterExterne(true));
  document.getElementById("d-raz").addEventListener("click", () => { const o = JSON.parse(SNAP); Object.keys(M).forEach((k) => delete M[k]); Object.assign(M, o.M); ETAGES = o.E; S.fiche = "orfan"; S.retrait = ""; S.msg = ""; S.ctrl = null; dessiner(); });
  const MENU = [["Évolution", 0, "⚘"], ["Aujourd’hui", 1, "☼"], ["Améliorations", 1, "↗"], ["Réglages", 1, "◈"], ["Consignes et seuils", 1, "✎"], ["Sous le capot", 1, "⚙"], ["Les chercheurs", 2, "⊙"], ["Les fonctions", 2, "ƒ"], ["Les comparer", 2, "⇄"], ["Installer un chercheur", 2, "⤓"], ["Filet de sécurité", 2, "⛨"], ["Carnet", 2, "▤"], ["Versions écartées", 2, "⊘"], ["Ce qui est prévu", 2, "✦"], ["Vocabulaire", 2, "Aa"]];
  document.getElementById("mq-menu").innerHTML = MENU.map((m) => '<div class="t s' + m[1] + (m[0] === "Les chercheurs" ? " on" : "") + '"><span class="g">' + m[2] + "</span>" + m[0] + "</div>").join("");
  dessiner();
})();
</script>
