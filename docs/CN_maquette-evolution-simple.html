/* Ce que la maquette ajoute, avec les mêmes jetons. */
body{overflow:auto}
.app-container{height:auto;min-height:100vh}
.app-body{overflow:visible}
.app-main{overflow:visible}
.maq-scene{padding:20px 24px 60px;display:block}
.ev .vues{flex-wrap:wrap}
.ev .bandeau{display:flex;flex-wrap:wrap}.ev .bandeau>div{flex:1 1 190px}
.ev .vues button .n{margin-left:6px;font:600 10px var(--mono,monospace);color:var(--e-encre3)}
.ev .code{font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--ov-06);border:1px solid var(--e-filet);border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:pre;color:var(--txt)}
.ev .code .k{color:var(--accent)}.ev .code .c{color:var(--e-encre3)}.ev .code .s{color:var(--e-al)}
.ev .tw{overflow-x:auto;border:1px solid var(--e-filet);border-radius:12px}
.ev .tw table{min-width:560px}
.ev td.num,.ev th.num{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.ev .coul{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.ev .inter{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--e-filet);border-radius:12px;background:var(--e-verre)}
.ev .inter input{margin-top:3px;accent-color:var(--accent)}
.ev .inter .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev .liste{display:flex;flex-direction:column;gap:8px}
.ev .champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ev .champ{display:flex;flex-direction:column;gap:5px;min-width:0}
.ev .etapes{display:flex;gap:6px;flex-wrap:wrap}
.ev .etape{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--e-filet);font:600 11px ui-monospace,Menlo,Consolas,monospace;color:var(--e-encre3);background:var(--e-verre);cursor:pointer}
.ev .etape.on{color:var(--accent);border-color:var(--accent);background:var(--e-doux)}.ev .etape.fait{color:var(--e-ok)}
.ev .verif{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:8px 11px;border:1px solid var(--e-filet);border-radius:12px;background:var(--e-verre);font-size:12.5px}
.ev .verif .k{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px ui-monospace,Menlo,Consolas,monospace;background:var(--e-doux);color:var(--e-encre3)}
.ev .verif.ok .k{background:var(--e-okd);color:var(--e-ok)}.ev .verif.al .k{background:var(--e-ald);color:var(--e-al)}.ev .verif.dg .k{background:var(--e-dgd);color:var(--e-dg)}.ev .verif.cours .k{background:var(--e-doux);color:var(--accent);animation:evbat 1s infinite}
.ev .verif small{display:block;color:var(--e-encre3);font-size:11.5px}
.ev .col5{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.ev .col5>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev .piece{padding:10px 12px;border:1px solid var(--e-filet);border-radius:12px;background:var(--e-verre);display:flex;flex-direction:column;gap:6px}
.ev .piece .pr{display:flex;justify-content:space-between;gap:6px;align-items:center}
.ev .ordre{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--e-filet);border-radius:12px;background:var(--e-verre)}
.ev .ordre .rg{font:700 13px ui-monospace,Menlo,Consolas,monospace;color:var(--accent);width:20px}
.ev .flux{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:stretch}
.ev .flux>div{border:1px solid var(--e-filet);border-radius:12px;padding:10px;background:var(--e-verre);display:flex;flex-direction:column;gap:4px;position:relative}
.ev .flux>div+div:before{content:"→";position:absolute;left:-13px;top:50%;transform:translateY(-50%);color:var(--e-encre3);font-weight:700}
.ev .frontiere{border-style:dashed;border-color:var(--accent)}
.ev .vide{padding:20px;text-align:center;color:var(--e-encre3)}

.ev .cle dt{color:var(--e-encre3);font:600 10.5px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}.ev .cle dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ev textarea{border:1px solid var(--line-strong);background:var(--e-verre);color:var(--txt);border-radius:10px;padding:9px 11px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;width:100%;min-height:120px;resize:vertical}
.ev .rc{font-weight:600}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--txt-strong);color:var(--bg);padding:10px 16px;border-radius:12px;font:600 12px ui-monospace,Menlo,Consolas,monospace;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ev svg.sp{width:100%;height:34px;display:block}
.ev .cap .n{word-break:normal}
.ev .legende{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:9px 14px;border-left:3px solid var(--e-al)}
@media(max-width:1100px){.ev .col5{grid-template-columns:repeat(6,210px)}}
@media(max-width:768px){.maq-scene{padding:14px 12px 60px}.sidebar{display:none}.ev .flux>div+div:before{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.ev .phrase{font:600 19px/1.4 var(--font-sans,system-ui);color:var(--e-encre);padding:2px 2px 0}
.ev .stat{gap:6px}
.ev .gros{font:600 32px/1.1 ui-monospace,Menlo,Consolas,monospace;color:var(--e-encre)}.ev .gros.ok{color:var(--e-ok)}
.ev .trois3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.ev .grand{padding:18px 20px}
.ev .ligne2{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--e-filet);border-radius:12px;background:var(--e-verre)}
.ev .ligne2 .t{display:flex;flex-direction:column;gap:2px;min-width:0}

function plan(f) {

    const ch = CH(c.ch);
    if (force < 0 && !c.on) { lignes.push(c.nom + " : non utilisé par le style choisi."); continue; }
    if (ch.etat !== "actif") { lignes.push(c.nom + " : " + ch.nom + " est éteint, on passe."); continue; }
    if (c.eur > 0) {
      if (S.plafondAtteint) { lignes.push(c.nom + " : le plafond de dépense de la maison est atteint, cet étage est sauté."); continue; }
      if (S.usage[c.ch] + (util[c.ch] || 0) + c.jet > S.plafonds[c.ch]) { lignes.push(c.nom + " : le plafond de " + ch.nom + " (" + nbr(S.plafonds[c.ch]) + " jetons par jour) serait dépassé, étage sauté."); continue; }
      if (S.opt.chaud && !f.chaud) { lignes.push(c.nom + " : aucune partie de la fonction ne travaille assez pour justifier un modèle. Rien n'est dépensé."); continue; }
    }
    if (reussi) deuxFait = true;
    ran = true;
    const gain = f.g[c.e];
    tok += c.jet; euros += c.eur; util[c.ch] = (util[c.ch] || 0) + c.jet;
    const res = gain > 0 ? "version écrite" : "refusée : résultat différent";
    if (c.e === 1) { relais.push(["à l'instant", "Frugal", "stratège", "forte-1", "1 120 / 380", "idées proposées"]); relais.push(["à l'instant", "Frugal", "exécutant", "petit-1", "640 / 210", res]); }
    if (c.e === 2) relais.push(["à l'instant", "Orfan", "exécutant", "petit-1", "900 / 260", res]);
    if (c.e === 3) relais.push(["à l'instant", "Évolutif", "exécutant", "petit-1", "4 100 / 1 100", res]);
    if (gain > 0) {
      lignes.push(c.nom + " : une version sûre, " + gain + " % plus rapide" + (c.eur ? " (≈ " + nbr(c.jet) + " jetons)." : ", gratuite."));
      reussi = true;

  if (meilleur) etapes.push("Le contrôleur compare la meilleure version (" + meilleur.c.nom.split(" ·")[0] + ") à l'originale sur tous les exemples" + (S.objectifG === "memoire" ? " et vérifie qu'elle ne consomme pas plus de mémoire." : S.objectifG === "equilibre" ? " et vérifie qu'elle ne régresse ni en mémoire ni en taille." : ".") + " Mêmes résultats partout.");

}

}

  const suite = a.etat === "retiree" ? ["Retirée", a.raison] : a.etat === "service" ? ["En service", "Elle est revérifiée tous les 30 jours : si son gain n'a pas tenu, elle est retirée."] : a.attend ? ["Prochaine étape", "Elle attend ton accord pour passer en service : l'autonomie gagnée n'est pas encore branchée."] : ["Prochaine étape", "Elle prendra une part plus grande du travail dès qu'elle aura tourné sans écart sur assez d'appels."];
  return `<div class="histoire"><div class="chrono">${[["Trouvée", trouve], ["Contrôlée", controle], ["Mise à l'essai", "Elle a d'abord tourné à côté de l'originale, sans rien changer, pendant 200 appels."], suite].map(e => `<div><time>${esc(e[0])}</time>${esc(e[1])}</div>`).join("")}</div><div class="preuves"><span>✓ Identique à l'originale</span><span>✓ Gain confirmé hors des exemples vus</span><span>✓ Annulable en un clic</span></div></div>`;
}
function ligneAmelio(a) {
  const ouvert = S.ouvert === a.id;
  const etat = a.etat === "service" ? puce("En service", "ok") : a.etat === "essai" ? (a.attend ? puce("Attend ton accord", "al") : puce("À l'essai", "al")) : puce("Retirée", "dg");
  const phrase = a.etat === "essai" ? `À l'essai depuis ${a.jours} jour${a.jours > 1 ? "s" : ""} : ${ETAPES[a.etape].toLowerCase()}, ${a.gain} % ${mesure(a)}, ${a.ecart ? a.ecart + " écart" : "aucun écart"}.`
    : a.etat === "service" ? `En service depuis ${a.jours} jours : ${a.gain} % ${mesure(a)}.` : `Retirée ${a.par === "toi" ? "par toi" : "toute seule"} : ${a.raison.split(".")[0]}.`;
  return `<div class="verre ame"><div class="rang"><div class="t"><b>${esc(a.nom)}</b><span class="note">${esc(phrase)}</span></div>${etat}</div>${barreEtapes(a)}
    <div class="lg"><button class="btn" data-a="histoire" data-id="${a.id}">${ouvert ? "Masquer" : "Voir l'histoire"}</button>${a.attend ? `<button class="btn prim" data-a="valider-service" data-id="${a.id}"${S.gel ? " disabled" : ""}>Valider la mise en service</button>` : ""}${a.etat !== "retiree" ? `<button class="btn dng" data-a="retirer" data-id="${a.id}">Retirer</button>` : ""}</div>${ouvert ? histoireDe(a) : ""}</div>`;
}
function avancerJour() {
  if (S.gel) { toast("Le frein d'urgence est posé : rien n'avance tant qu'il est là"); return; }
  let bouge = false;
  AMELIO.forEach(a => {
    if (a.etat === "essai" && !a.attend) {
      a.jours++; a.appels += 900; bouge = true;
      if (a.etape < 2) a.etape++;
      else if (S.autoBranchee) { a.etape = 3; a.etat = "service"; log("Mise en service", a.nom + " : en service, " + a.gain + " % " + mesure(a) + "."); toast("« " + a.nom + " » est maintenant en service"); }
      else { a.attend = true; log("À valider", a.nom + " : a tenu l'essai, elle attend ton accord pour passer en service."); toast("« " + a.nom + " » attend ton accord"); }
    } else if (a.etat === "service") { a.jours++; if (a.jours % 30 === 0) log("Visite", a.nom + " : à " + a.jours + " jours, le gain a tenu (" + a.gain + " %)."); }
  });
  if (!bouge) toast("Aucune amélioration à l'essai pour l'instant");
}
function retirerAmelio(a, par, raison) {
  a.etat = "retiree"; a.par = par; a.ts = Date.now(); a.attend = false; a.raison = raison;
  ECARTEES.unshift({ code: a.code, type: a.type, nom: a.nom, quand: "à l'instant", par: a.chercheur, raison: par === "toi" ? "Retirée par toi." : raison });
  const f = FN(a.code); if (f) f.etat = "candidate";
  log("Retrait", a.nom + " : retirée " + (par === "toi" ? "par toi." : "toute seule (" + raison.toLowerCase().replace(/\.$/, "") + ")."));
}

      <div class="ligne2"><div class="t"><b>Qui peut valider, retirer ou installer un chercheur ?</b><span class="note">Cela se règle dans Droits, comme pour tous les modules.</span></div><button class="btn" data-a="ailleurs" data-id="Droits">Ouvrir Droits</button></div></div>
    <div class="verre carte"><h2>Combien ça peut coûter</h2><div class="note">Évolution n'a pas de budget à elle : ses appels de modèle comptent dans le plafond de dépense de toute la maison, qui se règle à un seul endroit, dans Agents IA.</div>
      <div class="ligne2"><div class="t"><b>Plafond de la maison : ${eur(S.plafondJour)} par jour</b><span class="note">${S.plafondAtteint ? "Il est atteint : Évolution n'appelle plus de modèle jusqu'à demain. Les recettes gratuites continuent de chercher." : "Évolution a utilisé " + nbr(S.jetonsJour) + " jetons aujourd'hui (≈ " + eur(S.depenseJour) + "). Un modèle qui tourne sur ta machine ne coûte rien."}</span></div><button class="btn" data-a="ailleurs" data-id="Agents IA">Ouvrir Agents IA</button></div>
      <div class="note">Le gratuit passe toujours d'abord : c'est l'ordre de la cascade (Sous le capot › Les chercheurs).</div></div></section>
    <div class="verre carte"><h2>Qui cherche</h2><div class="note">Choisis un style : il allume ou éteint des étages de la cascade. Tu peux ensuite affiner dans « Sous le capot ».</div><div class="profils">${PROFILS.map(p => `<button class="profil${S.profil === p[0] ? " sel" : ""}" data-profil="${p[0]}"><b>${p[1]}</b><span>${esc(p[2])}</span><em>${p[3]}</em></button>`).join("")}${S.profil === "mesure" ? `<div class="profil sel"><b>Sur mesure</b><span>Tu as modifié le détail dans Sous le capot. Choisis un style pour revenir à un réglage prêt à l'emploi.</span><em>à ton idée</em></div>` : ""}</div></div>
    <div class="verre carte"><h2>Ce qui compte le plus</h2><div class="note">Un seul réglage pour toute la maison : quand une version gagne en vitesse mais prend plus de mémoire, le contrôleur le dit au lieu de choisir pour toi. Une version qui régresse sur ce qui compte n'est pas retenue, même plus rapide.</div><div class="liste">${[["vitesse", "La vitesse", "Une version plus rapide, même un peu plus gourmande."], ["equilibre", "Un équilibre", "Vitesse, mémoire et taille du code pèsent à peu près pareil."], ["memoire", "La mémoire", "Une version plus sobre, même un peu moins rapide."]].map(o => `<label class="inter"><input type="radio" name="obj" value="${o[0]}" ${S.objectifG === o[0] ? "checked" : ""}><span class="t"><b>${o[1]}</b><span class="note">${o[2]}</span></span></label>`).join("")}</div></div>

/* ══ 4 · Consignes et seuils ══ */
function consignes() {
  const c = CONSIGNES.filter(x => x.id === S.sel)[0], p = c.prop;
  const off = S.gel || c.enCours ? " disabled" : "";
  const verif = p ? `<div class="liste">${p.controles.map(v => `<div class="verif ${v[0] ? "ok" : "dg"}"><span class="k">${v[0] ? "✓" : "✕"}</span><div>${esc(v[1])}<small>${esc(v[2])}</small></div><span></span></div>`).join("")}</div><div class="verdict ${p.ok ? "" : "dg"}">${esc(p.texte)}</div>${p.ok ? `<div class="lg"><button class="btn prim" data-a="adopter-consigne"${S.gel ? " disabled" : ""}>La mettre à l'essai</button></div>` : ""}` : "";
  const total = ALERTE.filter(a => !a[1]).length;
  const fausses = ALERTE.filter(a => !a[1] && a[0] >= S.seuil).length;
  const ratees = ALERTE.filter(a => a[1] && a[0] < S.seuil).length;
  return `<section class="cgrid"><div class="verre carte"><h2>Améliorer une consigne d'agent</h2><div class="note">Cassandra réécrit une consigne (le texte qui guide un agent). Un contrôleur vérifie qu'elle garde tes protections et qu'elle ne se laisse pas manipuler par un message piégé. La consigne appartient au module Agents : Évolution ne la modifie jamais directement, la meilleure version passe par la mise à l'essai comme tout le reste.</div>
    <label class="champ"><span class="lib">Quelle consigne ?</span><select id="consel">${CONSIGNES.map(x => `<option value="${x.id}"${x.id === S.sel ? " selected" : ""}>${esc(x.nom)} (${x.code})</option>`).join("")}</select></label>
    <label class="champ"><span class="lib">Consigne actuelle (celle d'Agents, en lecture seule)</span><textarea rows="5" readonly>${esc(c.ref)}</textarea></label>
    <div class="lg"><button class="btn prim" data-a="proposer-consigne"${off}>${c.enCours ? "Réflexion…" : "Proposer une meilleure version"}</button></div>${S.plafondAtteint ? `<div class="note">Le plafond de dépense de la maison est atteint : pas d'appel de modèle jusqu'à demain.</div>` : ""}${verif}</div>
    <div class="verre carte"><h2>Améliorer le seuil d'une alerte</h2><div class="note">Exemple : le seuil du processeur de Sensorium. En rouge, les alertes que tu as suivies d'une action ; en gris, celles que tu as acquittées sans rien faire (fausses alertes). Le glisseur est un essai : la vraie valeur reste chez Sensorium.</div>
    <div class="points">${ALERTE.map(a => `<span class="pt ${a[1] ? "vrai" : "faux"}${a[0] >= S.seuil ? " part" : ""}" title="mesure ${a[0]}">${a[0]}</span>`).join("")}</div>
    <label class="champ"><span class="lib">L'alerte part à partir de : <b id="sval">${S.seuil}</b></span><input type="range" id="seuil" min="50" max="95" step="1" value="${S.seuil}"></label>
    <div class="verdict ${ratees ? "dg" : fausses ? "al" : ""}" id="sres">${ratees ? "Attention : tu raterais " + ratees + " alerte(s) qui méritaient une action." : fausses ? fausses + " fausse(s) alerte(s) sur les " + total + " passées. Aucune vraie alerte ratée." : "Plus aucune fausse alerte, et aucune vraie alerte ratée."}</div>${S.seuilVerdict ? `<div class="note">${esc(S.seuilVerdict)}</div>` : ""}
    <div class="lg"><button class="btn" data-a="suggerer-seuil">Que suggère Cassandra ?</button><button class="btn prim" data-a="appliquer-seuil"${S.gel ? " disabled" : ""}>Proposer à Sensorium</button></div><div class="note">Évolution ne règle rien chez un autre module : elle propose, Sensorium applique seul quand la proposition est prouvée. Quand l'alerte part, elle arrive dans Notifications.</div></div></section>`;
}
async function proposerConsigne() {
  const c = CONSIGNES.filter(x => x.id === S.sel)[0];
  if (S.gel || c.enCours) return;
  if (S.plafondAtteint) { c.prop = { ok: false, texte: "Le plafond de dépense de la maison est atteint : Évolution n'appelle plus de modèle jusqu'à demain, et le dit.", controles: [] }; rendre(); return; }
  c.enCours = true; c.prop = null; rendre(); await pause(1400);
  const piege = S.piege;
  c.prop = { ok: !piege, texte: piege ? "Refusée : elle a perdu une protection ou s'est laissé manipuler. Elle ne sera pas utilisée." : "Acceptée : elle est plus courte et garde toutes tes protections.",
    controles: [[true, "Les mêmes éléments variables", "Rien d'inventé, rien de perdu"], [!piege, "Tes interdictions sont gardées", piege ? "La phrase « " + c.interdit + " » a disparu" : "1 interdiction sur 1 conservée"], [true, "Plus courte", "31 % de moins que l'ancienne"], [!piege, "Résiste aux messages piégés", piege ? "Elle a obéi à un ordre caché dans 2 cas sur 5" : "5 pièges sur 5 déjoués (ordre caché, secret, droits, envoi, frein)"]] };
  c.enCours = false;
  depenser(1500, 0.02, { orfan: 1500 });
  RELAIS.unshift(["à l'instant", "Orfan", "exécutant", "petit-1", "1 100 / 400", piege ? "refusée par le contrôleur" : "réécriture acceptée"]);
  log("Consigne", piege ? "Une réécriture de « " + c.nom + " » a été refusée par le contrôleur (elle se laissait manipuler)." : "Une réécriture plus courte de « " + c.nom + " » a été acceptée par le contrôleur.");
  rendre();
}

/* ══ 5 · Sous le capot ══ */
const SOUS = [["chercheurs", "Les chercheurs", "☉"], ["points", "Les fonctions", "ƒ"], ["comparer", "Les comparer", "⇄"], ["securite", "Filet de sécurité", "⛨"], ["carnet", "Carnet", "▤"], ["ecartees", "Versions écartées", "⊘"], ["vocab", "Vocabulaire", "Aa"]];
function capot() {
  return (S.capot === "chercheurs" || S.capot === "securite" ? sante() : "") + `<div class="verre carte grand">${({ chercheurs: pChercheurs, points: pPoints, comparer: pComparer, securite: pSecurite, carnet: pCarnet, ecartees: pEcartees, vocab: pVocab }[S.capot])()}</div>`;
}
function sante() {
  const on = CHERCHEURS.filter(c => c.etat === "actif");
  const eteints = CHERCHEURS.filter(c => c.etat === "installe");
  const L = [];
  L.push([S.bac ? "ok" : "al", "Le filet de sécurité a été testé " + S.dernierTest + (S.bac ? " : tout tient." : " : les processus tiennent, mais le bac du système est absent."), null]);
  L.push(["ok", on.length + " chercheur" + (on.length > 1 ? "s" : "") + " allumé" + (on.length > 1 ? "s" : "") + ", tous répondent (" + on.map(c => c.nom).join(", ") + ").", null]);
  L.push(["ok", "Aucun chercheur n'a planté ces 7 derniers jours.", null]);
  if (!S.bac) L.push(["al", "Le bac du système n'enveloppe pas les chercheurs (hôte sans bubblewrap) : ils restent isolés, mais sans cette seconde barrière.", "le bac du système n'enveloppe pas les chercheurs"]);
  if (S.chaineRompue) L.push(["dg", "La chaîne scellée est rompue au maillon 214 : ce qu'Évolution a fait ne peut plus être garanti.", "la chaîne scellée est rompue"]);
  if (S.plafondAtteint) L.push(["al", "Le plafond de dépense de la maison est atteint : plus d'appel de modèle jusqu'à demain.", "le plafond de dépense est atteint"]);
  if (S.gel) L.push(["al", "Le frein d'urgence est posé : Évolution observe, elle ne cherche rien.", "le frein d'urgence est posé"]);
  eteints.forEach(c => L.push(["mu", c.nom + " est installé mais éteint : il ne cherche rien.", null]));
  const pb = L.filter(l => l[0] === "al" || l[0] === "dg");
  const crit = pb.some(l => l[0] === "dg");
  const ligne = `<div class="verre ligne2"><div class="lg">${puce(pb.length ? pb.length + (pb.length > 1 ? " points à regarder" : " point à regarder") : "tout va bien", crit ? "dg" : pb.length ? "al" : "ok")}<span class="note" style="font-size:13px">${pb.length ? esc(pb.map(l => l[2]).filter(Boolean).join(" · ").replace(/^./, c => c.toUpperCase()) + ".") : "Les chercheurs répondent, rien n'a planté."}</span></div><button class="btn" data-a="sante">${S.santeOuverte ? "Masquer" : "Détail"}</button></div>`;
  if (!S.santeOuverte) return ligne;
  const ailleurs = [["Notifications", "Un chercheur qui plante t'y prévient."], ["Mesures", "Les courbes des jetons, des essais et des retraits."], ["Sensorium", "L'état de la machine elle-même."], ["Agents IA", "Le plafond de dépense."]];
  return ligne + `<div class="verre carte"><div class="liste">${L.map(l => `<div class="verif ${l[0]}"><span class="k">${l[0] === "ok" ? "✓" : l[0] === "mu" ? "·" : "!"}</span><div>${esc(l[1])}</div><span></span></div>`).join("")}</div><div class="note">Quand quelque chose de ce genre apparaît, il arrive aussi dans Notifications (la cloche en haut) et, pour la chaîne rompue et les retraits, dans Aujourd'hui. Le reste se lit dans les modules qui le tiennent :</div><div class="lg">${ailleurs.map(x => `<button class="btn" data-a="ailleurs" data-id="${x[0]}" title="${esc(x[1])}">${x[0]}</button>`).join("")}</div></div>`;
}

}

function gainsPar(f, id) {

  const lib = S.plafondAtteint;
  if (id === "orfan") { const c0 = { c: CASCADE[0], gain: f.g[0] }, c2 = lib ? null : { c: CASCADE.filter(c => c.e === 2)[0], gain: f.g[2] }; const m = c2 && c2.gain > c0.gain ? c2 : c0; return { gain: m.gain, cout: m.c.eur, exclu: false }; }
  if (id === "frugal") return lib ? { exclu: true } : { gain: f.g[1], cout: 0.06, exclu: false };
  if (id === "evolutif") return lib ? { exclu: true } : { gain: f.g[3], cout: 0.38, exclu: false };
  return lib ? { exclu: true } : { gain: f.g[3] > 6 ? f.g[3] - 6 : 0, cout: 0.21, exclu: false };
}

async function comparer() {
  const cp = S.comparer, choisis = CHERCHEURS.filter(c => cp.actifs[c.id] && c.etat !== "prevu"), f = FN(cp.fn);

  cp.enCours = true; cp.res = null; rendre(); await pause(1500);
  cp.res = choisis.map(c => { const g = gainsPar(f, c.id); return g.exclu ? { nom: c.nom, exclu: true } : { nom: c.nom, id: c.id, versions: g.gain ? 2 : 0, gain: g.gain, cout: g.cout }; });
  const bons = cp.res.filter(r => r.gain);
  const meilleur = bons.sort((a, b) => (b.gain / (b.cout + 0.05)) - (a.gain / (a.cout + 0.05)))[0] || null;
  cp.meilleur = meilleur;
  const brut = cp.res.filter(r => !r.exclu).sort((a, b) => b.gain - a.gain)[0];
  cp.phrase = meilleur ? "Le plus intéressant pour toi : " + meilleur.nom + " (" + meilleur.gain + " % plus rapide, " + (!meilleur.cout ? "gratuit" : meilleur.cout < 0.3 ? "coût faible" : "coût moyen") + "). Le plus rapide en valeur brute : " + brut.nom + "." : "Aucun chercheur n'a trouvé de version sûre pour « " + f.nom + " ».";

}

function rendre() {
  const corps = { aujourdhui, amelio, reglages, consignes, capot }[S.vue]();
  const y = window.scrollY;
  $("#ev").innerHTML = entete() + corps;
  const cote = $("#d19-side");
  if (cote) {
    cote.innerHTML = menu();
    $$("[data-sec]", cote).forEach(b => { b.onclick = () => { S.vue = b.dataset.sec; S.cloche = false; rendre(); window.scrollTo(0, 0); }; });
    $$("[data-sous]", cote).forEach(b => { b.onclick = () => { S.vue = "capot"; S.capot = b.dataset.sous; S.cloche = false; rendre(); window.scrollTo(0, 0); }; });
    $$("[data-autre]", cote).forEach(b => { b.onclick = () => toast("Maquette : seule la partie Évolution est interactive"); });
  }
  cloche(); scen();
  window.scrollTo(0, y);
}
function clic(e) {
  const b = e.target.closest("[data-a],[data-vue],[data-filtre],[data-type],[data-carnet],[data-profil]");
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.vue) { S.vue = d.vue; if (d.capot) S.capot = d.capot; if (d.f) S.filtre = d.f; rendre(); window.scrollTo(0, 0); return; }
  if (d.filtre) { S.filtre = d.filtre; return rendre(); }
  if (d.type) { S.type = d.type; return rendre(); }
  if (d.carnet) { S.carnetF = d.carnet; return rendre(); }
  if (d.profil) return appliquerProfil(d.profil);
  if (d.a) acte(d.a, b);
}
function appliquerProfil(p) {
  const pr = PROFILS.filter(x => x[0] === p)[0];
  S.profil = p; CASCADE.forEach(c => { c.on = pr[4][c.e]; }); S.opt.deux = pr[4][4];
  log("Réglage", "Style de recherche : " + pr[1] + ".");
  toast("Style « " + pr[1] + " » : " + CASCADE.filter(c => c.on).length + " étage(s) de la cascade utilisés"); rendre();
}
function chg(e) {
  const t = e.target, d = t.dataset;
  if (d.opt) { S.opt[d.opt] = t.checked; surMesure(); toast("Enregistré"); return rendre(); }
  if (d.etage !== undefined) { CASCADE.filter(c => c.e === +d.etage)[0].on = t.checked; surMesure(); log("Réglage", "Étage « " + CASCADE.filter(c => c.e === +d.etage)[0].nom + " » " + (t.checked ? "utilisé." : "éteint.")); return rendre(); }
  if (d.plaf) { S.plafonds[d.plaf] = Math.max(0, +t.value || 0); log("Réglage", "Plafond de " + CH(d.plaf).nom + " : " + nbr(S.plafonds[d.plaf]) + " jetons par jour."); toast("Enregistré"); return rendre(); }
  if (d.pt) { FN(d.pt).force = t.value; log("Réglage", FN(d.pt).nom + " : confiée à « " + t.value + " »."); toast("Enregistré : la prochaine recherche sur cette fonction suivra ce choix"); return; }
  if (d.cc) { S.comparer.actifs[d.cc] = t.checked; return; }
  if (t.name === "obj") { S.objectifG = t.value; log("Réglage", "Ce qui compte le plus : " + t.parentNode.querySelector("b").textContent.toLowerCase() + "."); toast("Enregistré : le contrôleur jugera avec ce critère"); return; }
  if (t.id === "cfn") { S.comparer.fn = t.value; S.comparer.res = null; return rendre(); }
  if (t.id === "consel") { S.sel = t.value; return rendre(); }
}
function inp(e) {
  const t = e.target;
  if (t.id === "seuil") {
    S.seuil = +t.value; S.seuilVerdict = "";
    $$(".points .pt").forEach((p, i) => p.classList.toggle("part", ALERTE[i][0] >= S.seuil)); $("#sval").textContent = S.seuil;
    const fausses = ALERTE.filter(a => !a[1] && a[0] >= S.seuil).length, ratees = ALERTE.filter(a => a[1] && a[0] < S.seuil).length, tot = ALERTE.filter(a => !a[1]).length, v = $("#sres");
    v.className = "verdict" + (ratees ? " dg" : fausses ? " al" : ""); v.textContent = ratees ? "Attention : tu raterais " + ratees + " alerte(s) qui méritaient une action." : fausses ? fausses + " fausse(s) alerte(s) sur les " + tot + " passées. Aucune vraie alerte ratée." : "Plus aucune fausse alerte, et aucune vraie alerte ratée.";
  }
  if (t.id === "vq") { const q = t.value.toLowerCase(); $$("#vtab tr").forEach(tr => { tr.style.display = tr.textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none"; }); }
}
function acte(a, b) {
  const id = b.dataset.id;
  if (a === "agents" || a === "ailleurs") { toast("Maquette : cela ouvre " + (id || "Agents IA") + ", qui tient cela pour tous les modules"); return; }
  if (a === "chercher") { const f = b.dataset.code ? FN(b.dataset.code) : candidates()[0]; if (!f) { toast("Rien à chercher : tout est déjà suivi"); return; } return chercher(f); }
  if (a === "chercher-ici") { S.vue = "aujourdhui"; window.scrollTo(0, 0); return chercher(FN(b.dataset.code)); }
  if (a === "intention") {
    const v = (($("#intention") || {}).value || "").trim(); if (!v) { toast("Écris d'abord ce que tu veux"); return; }
    const f = fonctionDe(v) || candidates()[0];
    if (!f) { toast("Rien à chercher"); return; }
    log("Recherche", "Objectif donné : « " + v.slice(0, 80) + " » → " + f.nom + ".");
    toast(fonctionDe(v) ? "Compris : « " + f.nom + " »" : "Pas de correspondance exacte : je prends la fonction qui coûte le plus"); return chercher(f);
  }
  if (a === "valider") { const r = S.recherche; mettreEssai(r.f, r.p.meilleur); r.fin = { ok: true, texte: "Mise à l'essai. Rien ne change pour personne pour l'instant." }; toast("Mise à l'essai"); return rendre(); }
  if (a === "refuser") { S.recherche = null; return rendre(); }
  if (a === "compris") { AMELIO.filter(x => x.id === +id)[0].vu = true; return rendre(); }
  if (a === "histoire") { S.ouvert = S.ouvert === +id ? null : +id; return rendre(); }
  if (a === "valider-service") { const x = AMELIO.filter(z => z.id === +id)[0]; x.attend = false; x.etape = 3; x.etat = "service"; log("Mise en service", x.nom + " : en service, validée par toi."); toast("« " + x.nom + " » est en service"); return rendre(); }
  if (a === "retirer") { const x = AMELIO.filter(z => z.id === +id)[0]; if (!confirm("Retirer « " + x.nom + " » ? Tout revient à l'originale, tout de suite.")) return; retirerAmelio(x, "toi", "Tu l'as retirée toi-même : tout est revenu à l'originale, et cette version ne sera plus reproposée."); toast("Retirée : retour à l'originale"); return rendre(); }
  if (a === "proposer-consigne") return proposerConsigne();
  if (a === "adopter-consigne") {
    const c = CONSIGNES.filter(x => x.id === S.sel)[0];
    if (AMELIO.some(x => x.code === c.code && x.etat === "essai")) { toast("Une version de cette consigne est déjà à l'essai"); c.prop = null; return rendre(); }
    AMELIO.unshift({ id: ++SEQ, code: c.code, nom: c.nom, type: "consigne", mesure: "plus courte", etat: "essai", etape: 0, gain: 31, jours: 0, appels: 0, ecart: 0, chercheur: "Orfan", cout: 0.02, ts: Date.now() });
    log("Consigne", c.nom + " : meilleure version mise à l'essai."); toast("Mise à l'essai : voir Améliorations"); c.prop = null; return rendre();
  }
  if (a === "suggerer-seuil") { S.seuil = 81; S.seuilVerdict = ""; toast("Cassandra suggère 81 : aucune vraie alerte ratée, plus aucune fausse alerte"); return rendre(); }
  if (a === "appliquer-seuil") {
    const ratees = ALERTE.filter(x => x[1] && x[0] < S.seuil).length, fausses = ALERTE.filter(x => !x[1] && x[0] >= S.seuil).length, tot = ALERTE.filter(x => !x[1]).length;
    if (ratees) { S.seuilVerdict = "Refusé par le contrôleur : avec " + S.seuil + ", " + ratees + " vraie(s) alerte(s) passée(s) serai(en)t ratée(s). Rien n'est proposé à Sensorium."; log("Alerte", "Seuil de " + S.seuil + " refusé par le contrôleur (il raterait une vraie alerte)."); return rendre(); }
    if (S.seuil === 60) { S.seuilVerdict = "C'est la valeur actuelle : rien à proposer."; return rendre(); }
    if (AMELIO.some(x => x.code === "sensorium.seuil_cpu" && x.etat === "essai")) { S.seuilVerdict = "Une proposition de seuil est déjà à l'essai chez Sensorium."; return rendre(); }
    const gain = Math.round(100 * (tot - fausses) / tot);
    AMELIO.unshift({ id: ++SEQ, code: "sensorium.seuil_cpu", nom: "Seuil d'alerte du processeur (proposition : " + S.seuil + ")", type: "politique", mesure: "de fausses alertes en moins", etat: "essai", etape: 0, gain: gain, jours: 0, appels: 0, ecart: 0, chercheur: "Orfan", cout: 0, ts: Date.now() });
    S.seuilVerdict = "Proposé à Sensorium : il l'applique seul quand la proposition a tenu l'essai."; log("Alerte", "Seuil de " + S.seuil + " proposé à Sensorium, qui l'applique seul s'il est prouvé."); toast("Proposé à Sensorium : voir Améliorations"); return rendre();
  }
  if (a === "installer") return installer(id);
  if (a === "desinstaller") { const ch = CH(id); ch.etat = "prevu"; S.installation = null; S.comparer.actifs[id] = false; log("Chercheur", ch.nom + " désinstallé."); toast(ch.nom + " désinstallé"); return rendre(); }
  if (a === "bascule") { const ch = CH(id); ch.etat = ch.etat === "actif" ? "installe" : "actif"; log("Chercheur", ch.nom + (ch.etat === "actif" ? " allumé." : " éteint.")); return rendre(); }
  if (a === "comparer") return comparer();
  if (a === "adopter-course") { const f = FN(S.comparer.fn), m = S.comparer.meilleur; const c = CASCADE.filter(x => x.ch === m.id).sort((x, y) => y.eur - x.eur)[0] || CASCADE[0]; mettreEssai(f, { c: { nom: m.nom + " ·", eur: m.cout }, gain: m.gain }); toast("Mise à l'essai : voir Améliorations"); S.vue = "amelio"; return rendre(); }
  if (a === "sante") { S.santeOuverte = !S.santeOuverte; return rendre(); }
  if (a === "tester-filet") return testerFilet();
  if (a === "monter" || a === "descendre") { const k = +id, j = a === "monter" ? k - 1 : k + 1; if (j >= 0 && j < CASCADE.length) { const tmp = CASCADE[k]; CASCADE[k] = CASCADE[j]; CASCADE[j] = tmp; surMesure(); log("Réglage", "Ordre des étages changé."); } return rendre(); }
  if (a === "verifier-carnet") return verifierCarnet();
  if (a === "rouvrir") {
    const e = ECARTEES[+id]; if (!confirm("Rouvrir « " + e.nom + " » ? Elle sera rejugée comme une idée neuve. Elle ne passe jamais en service sans toutes ses preuves.")) return;
    ECARTEES.splice(+id, 1); log("Version écartée", e.nom + " : idée rouverte par toi, elle sera rejugée.");
    const f = FN(e.code);
    if (e.type) toast("Idée rouverte : elle réapparaît dans Consignes et seuils");
    else if (f) { if (AMELIO.some(x => x.code === e.code && x.etat !== "retiree")) toast("Idée rouverte, mais une amélioration de cette fonction est déjà en cours : elle passe d'abord"); else { f.etat = "candidate"; toast("Idée rouverte : elle réapparaît dans Aujourd'hui › Ce qui mérite d'être accéléré"); } }
    else { FONCTIONS.push({ code: e.code, nom: e.nom, appels: 3100, ms: 0.8, mots: [], chaud: true, g: [22, 22, 22, 26], etat: "candidate", force: "cascade" }); toast("Idée rouverte : elle réapparaît dans Aujourd'hui › Ce qui mérite d'être accéléré"); }
    return rendre();
  }
}
$("#ev").addEventListener("click", clic);
$("#ev").addEventListener("change", chg);
$("#ev").addEventListener("input", inp);
document.addEventListener("click", e => { if (S.cloche && !e.target.closest("#bellpanel") && !e.target.closest("#cloche")) { S.cloche = false; cloche(); } });
$("#theme").onclick = function () { const r = document.documentElement, t = r.getAttribute("data-theme"), n = !t ? "creme" : t === "creme" ? "dark" : null; if (n) r.setAttribute("data-theme", n); else r.removeAttribute("data-theme"); $("#theme").textContent = "Thème : " + (n === "creme" ? "crème" : n === "dark" ? "sombre" : "clair"); try { localStorage.setItem("ev-theme", n || ""); } catch (e) {} };
try { const t0 = localStorage.getItem("ev-theme"); if (t0) { document.documentElement.setAttribute("data-theme", t0); $("#theme").textContent = "Thème : " + (t0 === "creme" ? "crème" : "sombre"); } } catch (e) {}
rendre();
})();
