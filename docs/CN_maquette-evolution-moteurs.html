  '<div class="tete"><button class="btn" id="wpre"'+(w.etape===0?' disabled':'')+'>Précédent</button><button class="btn prim" id="wsui">'+(w.etape===4?'Activer le moteur':'Suivant')+'</button></div></section>';
}

/* ═════ 9 · journal ═════ */
function vueJournal(){
 var f=ETAT.filtre,verbes=['tous','proposee','palier','retiree','visite','course','moteur'];
 var L=JOURNAL.filter(function(j){return f==='tous'||j[1].indexOf(f)===0});
 return entete('Journal','Tout ce que les moteurs et le noyau ont fait, dans l’ordre. Les événements de la chaîne sont scellés.','<span class="puce ok">chaîne : construit</span><span class="puce gr">événements de moteur : à construire</span>')+
  '<section class="verre cadre"><div class="onglets" role="tablist">'+verbes.map(function(v){return '<button role="tab" aria-selected="'+(v===f)+'" data-filtre="'+v+'">'+v+'</button>'}).join('')+'</div>'+
  '<div class="tw"><table><thead><tr><th>Quand</th><th>Type</th><th>Détail</th></tr></thead><tbody>'+(L.length?L.map(function(j){return '<tr><td class="mono">'+j[0]+'</td><td><span class="puce">'+j[1]+'</span></td><td>'+esc(j[2])+'</td></tr>'}).join(''):'<tr><td colspan="3" class="vide">Rien pour ce filtre.</td></tr>')+'</tbody></table></div></section>';
}

/* ═════ tiroir (note d'un moteur à l'étude) ═════ */
function ouvrirTiroir(html){$('#tiroir').innerHTML=html;$('#tiroir').classList.add('on');$('#voile').classList.add('on');var b=$('#tiroir button');if(b)b.focus()}
function fermerTiroir(){$('#tiroir').classList.remove('on');$('#voile').classList.remove('on')}

/* ═════ rendu et événements ═════ */
function rendre(){
 rail();
 var f={parc:vueParc,fiche:vueFiche,course:vueCourse,aff:vueAff,budget:vueBudget,pieces:vuePieces,preuves:vuePreuves,brancher:vueBrancher,journal:vueJournal}[ETAT.vue];
 $('#scene').innerHTML=f();
 liens();
}
function liens(){
 var s=$('#scene');
 $$('[data-ouvrir]',s).forEach(function(e){e.onclick=function(ev){if(ev.target.closest('[data-stop]')&&!ev.target.closest('[data-ouvrir].btn'))return;var m=M(e.dataset.ouvrir);if(m.etat==='etude'){ouvrirTiroir('<div style="display:flex;justify-content:space-between;align-items:center"><h3>'+m.nom+'</h3><button class="btn" id="tfer">Fermer</button></div><p class="note" style="margin:0">'+esc(m.desc)+'</p><div class="verif"><span class="ic">i</span><span class="note" style="color:var(--encre)">Pas de code publié : rien à brancher aujourd’hui. Si un dépôt paraît, il suivra le chemin habituel (contrat, cage, banc).</span></div>');$('#tfer').onclick=fermerTiroir;return}ouvrir('fiche',{moteur:m.id,onglet:'apercu'})};e.onkeydown=function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target===e){ev.preventDefault();e.onclick(ev)}}});
 $$('[data-ouvrir-vue]',s).forEach(function(b){b.onclick=function(){ouvrir(b.dataset.ouvrirVue)}});
 $$('[data-act]',s).forEach(function(b){b.onclick=function(ev){ev.stopPropagation();var m=M(b.dataset.act);m.etat=m.etat==='actif'?'installe':'actif';journal('moteur',m.nom+(m.etat==='actif'?' activé':' désactivé'));toast(m.nom+(m.etat==='actif'?' activé':' désactivé : ses points reviennent à la cascade'));rendre()}});
 $$('[data-brancher]',s).forEach(function(b){b.onclick=function(ev){ev.stopPropagation();ouvrir('brancher',{wiz:{etape:0,choix:b.dataset.brancher,verifs:[]}})}});
 $$('[data-conf]',s).forEach(function(b){b.onclick=function(ev){ev.stopPropagation();ouvrir('fiche',{moteur:b.dataset.conf,onglet:'conformite'})}});
 $$('[data-tab]',s).forEach(function(b){b.onclick=function(){ETAT.onglet=b.dataset.tab;rendre()}});
 $$('[data-enreg]',s).forEach(function(b){b.onclick=function(){journal('moteur','réglages enregistrés');toast('Enregistré. Le noyau garde ses seuils.')}});
 $$('[data-retirer]',s).forEach(function(b){b.onclick=function(){var m=M(b.dataset.retirer);m.etat='prevu';m.existe=false;journal('moteur',m.nom+' retiré');toast(m.nom+' retiré : ses pièces en vol sont retirées, ses tombes restent');ouvrir('parc')}});
 var vr=$('#vrun',s);if(vr&&!vr.disabled){vr.onclick=lancerBanc;if(ETAT.vue==='brancher')lancerBanc()}
 if(vr&&ETAT.vue==='brancher'){vr.onclick=lancerBanc}
 var ch=$('#vch',s);if(ch)ch.onclick=function(){toast('Chaîne vérifiée : 1 284 mailles, tête conforme')};
 $$('[data-cm]',s).forEach(function(i){i.onchange=function(){ETAT.course.actifs[i.dataset.cm]=i.checked}});
 var cp=$('#cpoint',s);if(cp)cp.onchange=function(){ETAT.course.points=cp.value};
 var cb=$('#cbud',s);if(cb)cb.onchange=function(){ETAT.course.budget=cb.value};
 var cc=$('#ccrit',s);if(cc)cc.onchange=function(){ETAT.course.crit=cc.value};
 var cl=$('#clim',s);if(cl)cl.onchange=function(){ETAT.course.limite=+cl.value};
 var cr=$('#clancer',s);if(cr)cr.onclick=function(){if(!Object.keys(ETAT.course.actifs).some(function(k){return ETAT.course.actifs[k]})){toast('Choisis au moins un moteur');return}lancerCourse()};
 $$('[data-adopter]',s).forEach(function(b){b.onclick=function(){var nom=b.dataset.adopter,m=MOTEURS.filter(function(x){return x.nom===nom})[0];AFF[ETAT.course.points]=m.id;var gagnant=ETAT.course.resultat.filter(function(r){return r.nom===nom})[0];ETAT.course.historique.unshift([ETAT.course.points,nom+' · '+{rendement:'rendement',brut:'gain brut',duree:'durée'}[ETAT.course.crit],gagnant.g,String(gagnant.gpk).replace('.',',')]);journal('course',ETAT.course.points+' : '+nom+' adopté');toast(nom+' adopté pour '+ETAT.course.points);ETAT.course.resultat=null;ouvrir('aff')}});
 $$('[data-garder]',s).forEach(function(b){b.onclick=function(){toast('Résultat gardé dans le journal')}});
 $$('[data-aff]',s).forEach(function(sel){sel.onchange=function(){AFF[sel.dataset.aff]=sel.value;journal('moteur',sel.dataset.aff+' → '+sel.value);rendre()}});
 $$('[data-mon]',s).forEach(function(b){b.onclick=function(){var i=+b.dataset.mon,t=CASCADE[i];CASCADE[i]=CASCADE[i-1];CASCADE[i-1]=t;rendre()}});
 $$('[data-desc]',s).forEach(function(b){b.onclick=function(){var i=+b.dataset.desc,t=CASCADE[i];CASCADE[i]=CASCADE[i+1];CASCADE[i+1]=t;rendre()}});
 $$('[data-cas]',s).forEach(function(c){c.onchange=function(){CASCADE.filter(function(e){return e.id===c.dataset.cas})[0].on=c.checked}});
 $$('[data-retour]',s).forEach(function(b){b.onclick=function(){var p=PIECES.filter(function(x){return x.gid===b.dataset.retour})[0];p.etat='retiree';p.raison='retour demandé · tombe gravée';journal('retiree',p.gid+' '+p.ec+' · retour demandé');toast('Retour : la référence répond, la pièce est retirée');rendre()}});
 $$('[data-purge]',s).forEach(function(b){b.onclick=function(){journal('moteur','corpus purgé pour '+b.dataset.purge);toast('Entrées de '+b.dataset.purge+' effacées du corpus')}});
 $$('[data-filtre]',s).forEach(function(b){b.onclick=function(){ETAT.filtre=b.dataset.filtre;rendre()}});
 $$('[name=mch]',s).forEach(function(r){r.onchange=function(){ETAT.wiz.choix=r.value}});
 var pre=$('#wpre',s),sui=$('#wsui',s);
 if(pre)pre.onclick=function(){ETAT.wiz.etape=Math.max(0,ETAT.wiz.etape-1);rendre()};
 if(sui)sui.onclick=function(){if(ETAT.wiz.etape===4){var m=M(ETAT.wiz.choix);if(m){m.existe=true;m.etat='actif'}journal('moteur',(m?m.nom:'moteur maison')+' branché et activé');toast((m?m.nom:'Moteur')+' branché');ETAT.wiz={etape:0,choix:'openevolve',verifs:[]};ouvrir('parc')}else{ETAT.wiz.etape++;rendre()}};
}
$('#voile').onclick=fermerTiroir;
document.addEventListener('keydown',function(e){if(e.key==='Escape')fermerTiroir()});
$('#theme').onclick=function(){var r=document.documentElement,s=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',s);$('#theme').textContent=s==='dark'?'Thème clair':'Thème sombre';try{localStorage.setItem('ev-theme',s)}catch(e){}};
try{var t=localStorage.getItem('ev-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');$('#theme').textContent='Thème clair'}}catch(e){}
rendre();
</script>
