<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Utilisateurs et groupes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
--bg:#eef2f4;--halo:#dfeceb;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.92);--surface:#fff;--sunk:#f4f7f8;
--txt:#0f1b26;--txt2:#4a5866;--txt3:#8794a1;--line:rgba(15,27,38,.09);--line2:rgba(15,27,38,.16);
--accent:#0b7c74;--acc10:rgba(11,124,116,.10);--acc20:rgba(11,124,116,.2);--on-accent:#fff;
--ok:#047857;--ok10:rgba(4,120,87,.11);--warn:#b45309;--warn10:rgba(180,83,9,.12);--danger:#be123c;--danger10:rgba(190,18,60,.10);--info:#2f5fd0;--info10:rgba(47,95,208,.10);
--shadow:0 1px 2px rgba(15,27,38,.05),0 10px 28px -10px rgba(15,27,38,.14);
--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0c1318;--halo:#0f2a2a;--glass:rgba(24,33,41,.74);--glass2:rgba(28,38,47,.94);--surface:#16212a;--sunk:#101a21;
--txt:#e6edf2;--txt2:#a9b6c2;--txt3:#6f7d8b;--line:rgba(230,237,242,.09);--line2:rgba(230,237,242,.18);
--accent:#38b9ae;--acc10:rgba(56,185,174,.13);--acc20:rgba(56,185,174,.26);--on-accent:#04201d;
--ok:#3ecf9a;--ok10:rgba(62,207,154,.13);--warn:#e7a14c;--warn10:rgba(231,161,76,.14);--danger:#ff6b8b;--danger10:rgba(255,107,139,.13);--info:#7ea3ff;--info10:rgba(126,163,255,.13);
--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -10px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0c1318;--halo:#0f2a2a;--glass:rgba(24,33,41,.74);--glass2:rgba(28,38,47,.94);--surface:#16212a;--sunk:#101a21;
--txt:#e6edf2;--txt2:#a9b6c2;--txt3:#6f7d8b;--line:rgba(230,237,242,.09);--line2:rgba(230,237,242,.18);
--accent:#38b9ae;--acc10:rgba(56,185,174,.13);--acc20:rgba(56,185,174,.26);--on-accent:#04201d;
--ok:#3ecf9a;--ok10:rgba(62,207,154,.13);--warn:#e7a14c;--warn10:rgba(231,161,76,.14);--danger:#ff6b8b;--danger10:rgba(255,107,139,.13);--info:#7ea3ff;--info10:rgba(126,163,255,.13);
--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -10px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 15% -10%,var(--halo),transparent 70%),var(--bg);color:var(--txt);font:14px/1.45 var(--sans);padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app>*,.split>*{min-width:0}.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:248px minmax(0,1fr);gap:16px;align-items:start}
.note{max-width:1280px;margin:0 auto 14px;font-size:12.5px;color:var(--txt2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.note .th{margin-left:auto;border:1px solid var(--line2);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:12px}

/* colonne */
.side{background:var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 8px 14px;position:sticky;top:12px;backdrop-filter:blur(14px)}
.side .head{display:flex;gap:10px;align-items:center;padding:6px 8px 12px}
.side .head .ic{width:32px;height:32px;border-radius:10px;background:var(--acc10);color:var(--accent);display:grid;place-items:center}
.side .head b{display:block;font-size:13.5px}.side .head small{color:var(--txt3);font-size:11.5px}
.side h2{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);opacity:.85;margin:0;padding:12px 10px 6px;display:flex;gap:8px;align-items:center}
.side h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.si{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:10px;color:var(--txt2);font-size:13.5px}
.si:hover{background:var(--acc10)}.si.on{background:var(--surface);color:var(--txt);font-weight:600;box-shadow:var(--shadow)}
.si.sub{padding-left:36px;font-size:13px}.si .car{margin-left:auto;transition:transform .15s}.si.open .car{transform:rotate(90deg)}
.si.sep-top{margin-top:2px}
.si .nb{margin-left:auto;font:600 10.5px var(--mono);color:var(--txt3)}
.dim{opacity:.55}

/* page */
.page{display:none}.page.on{display:block}
.crumbs{font-size:12px;color:var(--txt3);display:flex;gap:6px;align-items:center;margin-bottom:10px}
.crumbs b{color:var(--txt2);font-weight:600}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}h1+.lead{color:var(--txt2);margin:0 0 16px;max-width:70ch}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1;min-width:120px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;display:inline-flex;gap:7px;align-items:center;font-weight:500}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.dng{color:var(--danger)}.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
input[type=text],input[type=email],input[type=password],select{font:inherit;color:var(--txt);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;width:100%}
input:focus,select:focus{outline:2px solid var(--acc20);border-color:var(--accent)}
label.f{display:block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:0 0 5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--txt2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok10);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn10);color:var(--warn);border-color:transparent}
.chip.dng{background:var(--danger10);color:var(--danger);border-color:transparent}.chip.acc{background:var(--acc10);color:var(--accent);border-color:transparent}.chip.info{background:var(--info10);color:var(--info);border-color:transparent}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);background:var(--acc10);color:var(--accent);flex:none}
.av.big{width:64px;height:64px;font-size:20px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.2px}
th{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);text-align:left;padding:10px 12px;background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.rowlink{cursor:pointer}tr.rowlink:hover td{background:var(--acc10)}
.who{display:flex;gap:10px;align-items:center;min-width:0}.who b{display:block}.who small{color:var(--txt3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;color:var(--txt2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.pane{display:none}.pane.on{display:block}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero .meta{flex:1;min-width:200px}.hero h2{margin:0;font-size:20px}.hero p{margin:2px 0 0;color:var(--txt2)}

/* droits */
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:104px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface)}
.kpi b{font:600 20px var(--mono);display:block}.kpi span{font-size:11.5px;color:var(--txt3)}
.kpi.ok b{color:var(--ok)}.kpi.dng b{color:var(--danger)}.kpi.warn b{color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;font-weight:500;color:var(--txt2);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--sunk);color:var(--txt);font-weight:600}
.seg button.on[data-v=accorde]{background:var(--ok10);color:var(--ok)}
.seg button.on[data-v=refuse]{background:var(--danger10);color:var(--danger)}
.seg button.on[data-v=herite]{background:var(--info10);color:var(--info)}
.seg.lock{opacity:.45;pointer-events:none}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fl{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:500}
.fl.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mod{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.modh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--sunk);cursor:pointer;flex-wrap:wrap}
.modh .nm{display:flex;gap:8px;align-items:center;font-weight:600;min-width:200px}.modh .nm .car{transition:transform .15s}
.mod.open .car{transform:rotate(90deg)}
.modh .cnt{font:600 11px var(--mono);color:var(--txt3)}
.modh .acts{margin-left:auto;display:flex;gap:6px}
.bulk{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:3px 6px;border-radius:6px}.bulk:hover{background:var(--acc10)}
.mbar{height:5px;border-radius:99px;background:var(--line);width:90px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%;background:var(--ok)}.mbar i.d{background:var(--danger)}
.rights{display:none}.mod.open .rights{display:block}
.rt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.rt:hover{background:var(--acc10)}
.rt.chg{background:var(--warn10)}
.rt .lb b{font-weight:500}.rt .lb small{display:block;color:var(--txt3);font-size:11.8px}
.rt .eff{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.why{font-size:11.5px;color:var(--txt3)}
.sens{color:var(--warn)}
.savebar{position:sticky;bottom:12px;display:none;gap:12px;align-items:center;flex-wrap:wrap;background:var(--txt);color:var(--bg);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-top:12px;z-index:5}
.savebar.on{display:flex}.savebar b{font-weight:600}.savebar .grow{flex:1}
.savebar .btn{color:var(--txt)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;display:none;gap:12px;align-items:center;z-index:30}
.toast.on{display:flex}.toast button{background:none;border:0;color:var(--accent);font-weight:700;filter:brightness(1.6)}
.adm{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px dashed var(--warn);background:var(--warn10);border-radius:12px;padding:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line2);border:0;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on:after{left:19px}
.side-r .card{margin-bottom:12px}.side-r .card h3{font-size:13px}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lst li{display:flex;gap:8px;align-items:center;font-size:13px}
.idea{border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--txt2);background:var(--sunk)}
.idea b{color:var(--accent)}
/* matrice */
.mx td,.mx th{text-align:center;padding:8px 6px}.mx td:first-child,.mx th:first-child{text-align:left;padding-left:12px;white-space:nowrap}
.dot{display:inline-block;width:22px;height:22px;border-radius:7px;font:600 10.5px/22px var(--mono);text-align:center;background:var(--sunk);color:var(--txt3)}
.dot.a{background:var(--ok10);color:var(--ok)}.dot.p{background:var(--warn10);color:var(--warn)}.dot.r{background:var(--danger10);color:var(--danger)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.tl li:first-child{border-top:0}.tl time{font:500 11.5px var(--mono);color:var(--txt3);min-width:84px}
.guide{max-width:1280px;margin:0 auto 14px;border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow)}.guide b{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-right:4px}.guide button{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}.guide button:hover{border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(10,18,24,.55);display:none;place-items:center;z-index:40;padding:16px}.modal.on{display:grid}.mbox{background:var(--glass2);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);width:min(720px,100%);max-height:88vh;overflow:auto;padding:18px}
.mbox h3{margin:0 0 4px;font-size:16px}.menu-sim{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}.ms{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;background:var(--surface)}.ms.no{opacity:.45;filter:grayscale(1)}.ms small{display:block;color:var(--txt3)}
.lnk{color:var(--accent);cursor:pointer;font-weight:600;background:none;border:0;padding:0}.lnk:hover{text-decoration:underline}
.req{color:var(--danger)}.bad{outline:2px solid var(--danger)!important}
@media (max-width:980px){.app{grid-template-columns:1fr}.side{position:static}.split{grid-template-columns:1fr}.rt{grid-template-columns:1fr}.rt .eff{justify-content:flex-start}}
</style>
</head>
<body>
<div class="note"><b>Maquette</b><span>Données fictives, mais tout fonctionne : créez, réglez, retirez, défaites. Les droits se recalculent en direct comme dans le moteur.</span><button class="th" id="theme">Clair / sombre</button></div>
<div class="guide"><b>Essayez</b>
  <button data-demo="refus">Refuser un droit à Julien</button>
  <button data-demo="groupe">Accorder un droit à tout un groupe</button>
  <button data-demo="creer">Créer un utilisateur</button>
  <button data-demo="groupenew">Créer un groupe</button>
  <button data-demo="comme">Voir comme Sarah</button>
  <button data-demo="qui">Qui peut supprimer un site ?</button></div>
<div class="app">
<aside class="side">
  <div class="head"><div class="ic"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3 2.9-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><path d="M16 6.5a3.2 3.2 0 0 1 0 6M17.5 14.7c2 .6 3.3 2.1 3.7 4.3"/></svg></div><div><b>Paramètres</b><small>Utilisateurs et groupes</small></div></div>
  <h2>Personnel</h2>
  <button class="si dim" data-away="Mon compte"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="3.5" width="15" height="17" rx="2"/><circle cx="11.5" cy="10.5" r="2.3"/></svg>Mon compte</button>
  <button class="si dim" data-away="Mon coffre-fort"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Mon coffre-fort</button>
  <h2>Institutionnel</h2>
  <button class="si dim" data-away="Société / Organisation"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2"/></svg>Société / Organisation</button>
  <button class="si open" data-open="u"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3 2.9-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/></svg>Utilisateurs<svg class="i car" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <div id="g-u">
    <button class="si sub" data-go="u-new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nouvel utilisateur</button>
    <button class="si sub on" data-go="u-list"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Liste des utilisateurs<span class="nb" id="nb-u"></span></button>
  </div>
  <button class="si open" data-open="g"><svg class="i" viewBox="0 0 24 24"><circle cx="8" cy="9" r="2.6"/><circle cx="16.5" cy="9" r="2.6"/><path d="M2.5 18c.5-2.6 2.6-4 5.5-4M21.5 18c-.5-2.6-2.6-4-5.5-4M8 18c.6-3 2.3-4.2 4-4.2s3.4 1.2 4 4.2"/></svg>Groupes<svg class="i car" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <div id="g-g">
    <button class="si sub" data-go="g-new"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nouveau groupe</button>
    <button class="si sub" data-go="g-list"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Liste des groupes<span class="nb" id="nb-g"></span></button>
    <button class="si sub" data-go="matrice"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Matrice des droits</button>
    <button class="si sub" data-go="qui"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Qui peut… ?</button>

function decide(user,did,prop,adminForce,depth){
  const d=DR(did);prop=prop||user.prop;const adm=adminForce==null?user.admin:adminForce;
  if(adm)return{ok:true,why:"administrateur"};
  if(prop[did]==="accorde")return{ok:true,why:"accordé au compte"};
  if(prop[did]==="refuse")return{ok:false,why:"refusé au compte"};
  if(user.type==="agent"&&user.inv&&!(depth>3)){const r=decide(U(user.inv),did,null,null,(depth||0)+1);return{ok:r.ok,why:"agent invité par "+U(user.inv).nom+" : "+r.why}}
  const gs=user.grp.map(G).filter(Boolean);
  const ref=gs.find(x=>x.d[did]==="refuse");if(ref)return{ok:false,why:"refusé par le groupe "+ref.nom};
  const oct=gs.find(x=>x.d[did]==="accorde");if(oct)return{ok:true,why:"accordé par le groupe "+oct.nom};
  return d.def?{ok:true,why:"accordé à tous par défaut"}:{ok:false,why:"non attribué"};
}

function filtresHtml(){return'<div class="bar"><input type="text" id="r-q" class="grow" value="'+esc(q)+'" placeholder="Chercher un droit : « supprimer », « pare-feu », « factures »…" style="max-width:380px"><div class="filters" id="r-f">'+[["tous","Tous"],["accorde","Autorisés"],["refuse","Refusés"],["sens","Sensibles"],["chg","Modifiés"]].map(([v,l])=>'<button class="fl'+(filtre===v?" on":"")+'" data-rf="'+v+'">'+l+'</button>').join("")+'</div><button class="bulk" data-open-all="1">Tout dérouler</button><button class="bulk" data-open-all="0">Tout replier</button></div>'}
/* la liste des droits, pour un compte (ou, si grp=true, pour un groupe) */
function listeDroits(u,clean,adm,grp){
  const ref=grp?drG:draft;let html="";
  MODS.forEach((m,mi)=>{
    let rows="",nm=0,ok=0;
    m.d.forEach(([id,lib,sens,note])=>{
      const e=grp?(id in drG?drG[id]:(G(ctx.id).d[id]||"herite")):(id in draft?draft[id]:(u.prop[id]||"herite"));
      const r=grp?{ok:e==="accorde",why:""}:decide(u,id,clean,adm);
      const base=grp?(G(ctx.id).d[id]||"herite"):(u.prop[id]||"herite"),chg=(id in ref)&&ref[id]!==base;
      if(r.ok)ok++;
      if(q&&!(lib+" "+note+" "+m.nom).toLowerCase().includes(q))return;
      if(filtre==="accorde"&&!r.ok)return;if(filtre==="refuse"&&r.ok)return;if(filtre==="sens"&&!sens)return;if(filtre==="chg"&&!chg)return;
      nm++;
      let eff;
      if(grp){const g=G(ctx.id),mem=S.users.filter(x=>x.grp.includes(g.id)),gain=mem.filter(x=>decide(x,id,null,null,0).ok).length,perso=mem.filter(x=>x.prop[id]==="refuse").length;
        eff='<span class="chip '+(gain===mem.length&&mem.length?"ok":gain?"warn":"")+'">'+gain+' / '+mem.length+' membres</span>'+(perso?'<span class="why">'+perso+' refus personnel</span>':"")}
      else eff='<span class="chip '+(r.ok?"ok":"dng")+'">'+(r.ok?"✓ Autorisé":"✕ Refusé")+'</span><span class="why">'+esc(r.why)+'</span>';
      rows+='<div class="rt'+(chg?" chg":"")+'" data-id="'+id+'"><span class="seg'+(adm&&!grp?" lock":"")+'">'+[["herite","Hérité"],["accorde","Accordé"],["refuse","Refusé"]].map(([v,l])=>'<button data-v="'+v+'"'+(e===v?' class="on"':"")+'>'+l+'</button>').join("")+'</span><div class="lb"><b>'+esc(lib)+'</b>'+(sens?" "+SH:"")+(note?'<small>'+esc(note)+'</small>':"")+'</div><div class="eff">'+eff+'</div></div>';
    });
    if(!nm&&(q||filtre!=="tous"))return;
    const tot=m.d.length,pct=ok/tot*100;
    html+='<div class="mod'+((ouvert===null?mi<2:ouvert)||q||filtre!=="tous"?" open":"")+'" data-m="'+m.id+'"><div class="modh"><span class="nm"><svg class="i car" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'+ic(m.ic)+esc(m.nom)+'</span><span class="mbar"><i style="width:'+pct+'%"></i></span><span class="cnt">'+ok+' / '+tot+'</span><span class="acts"><button class="bulk" data-b="accorde">Tout</button><button class="bulk" data-b="refuse">Aucun</button><button class="bulk" data-b="herite">Hériter</button></span></div><div class="rights">'+rows+'</div></div>';
  });
  return html||'<div class="card why">Aucun droit ne correspond.</div>';
}

function appliquerUtilisateur(){

  if(x=c("[data-rm]")){const u=U(x.dataset.rm),g=ctx.id;u.grp=u.grp.filter(y=>y!==g);journal('<b>Vous</b> avez retiré <b>'+esc(u.nom)+'</b> du groupe <b>'+esc(G(g).nom)+'</b>',()=>{u.grp.push(g)});toast(u.nom+" retiré du groupe.",true);render();return}
  if(c("#add-ok")){const v=$("#add-m").value;if(!v)return;const u=U(v),g=ctx.id;u.grp.push(g);journal('<b>Vous</b> avez ajouté <b>'+esc(u.nom)+'</b> au groupe <b>'+esc(G(g).nom)+'</b>',()=>{u.grp=u.grp.filter(y=>y!==g)});toast(u.nom+" reçoit désormais les droits du groupe : "+compte(u)+" droits.",true);render();return}
  if(c("[data-dup]")){const g=G(ctx.id),n={id:g.id+"-2",nom:g.nom+" (copie)",desc:g.desc,mod:"à l'instant",d:clone(g.d)};S.groupes.push(n);journal('<b>Vous</b> avez dupliqué le groupe <b>'+esc(g.nom)+'</b>',()=>{S.groupes=S.groupes.filter(y=>y!==n)});go("g-fiche",{id:n.id,tab:"droits"});toast("Groupe dupliqué.");return}
  if(c("[data-delg]")){const g=G(ctx.id),mem=S.users.filter(u=>u.grp.includes(g.id));S.groupes=S.groupes.filter(y=>y!==g);mem.forEach(u=>u.grp=u.grp.filter(y=>y!==g.id));journal('<b>Vous</b> avez supprimé le groupe <b>'+esc(g.nom)+'</b>',()=>{S.groupes.push(g);mem.forEach(u=>u.grp.push(g.id))});toast("Groupe supprimé ("+mem.length+" membre(s) en perdent les droits).",true);go("g-list");return}
  if(x=c("[data-ng]")){const g=x.dataset.ng;nu.groupes=nu.groupes.includes(g)?nu.groupes.filter(y=>y!==g):nu.groupes.concat(g);x.classList.toggle("on");$("#nu-apercu").innerHTML="<b>Aperçu des droits obtenus</b> — "+aperçuNu();return}
  if(x=c("[data-nm]")){const g=x.dataset.nm;ng.membres=ng.membres.includes(g)?ng.membres.filter(y=>y!==g):ng.membres.concat(g);x.classList.toggle("on");return}
  if(c("#nu-ok")){const id=$("#nu-id").value.trim(),nom=$("#nu-nom").value.trim();$("#nu-id").classList.toggle("bad",!id);$("#nu-nom").classList.toggle("bad",!nom);if(!id||!nom){toast("L'identifiant et le nom sont obligatoires.");return}
    if(S.users.some(u=>u.id===id)){toast("Cet identifiant existe déjà.");$("#nu-id").classList.add("bad");return}
    const u={id,nom,fn:$("#nu-fn").value||"—",mail:$("#nu-mail").value||"—",grp:nu.groupes.slice(),admin:nu.modele==="Administrateur délégué",type:nu.type,co:"jamais",off:false,prop:{}};(MODELES[nu.modele]||[]).forEach(k=>u.prop[k]="accorde");
    S.users.push(u);journal('<b>Vous</b> avez créé l\'utilisateur <b>'+esc(nom)+'</b> (modèle '+esc(nu.modele)+')',()=>{S.users=S.users.filter(y=>y!==u)});nu={groupes:[],modele:"Opérateur",type:"interne"};
    go("u-fiche",{id:u.id,tab:"droits"});toast(nom+" est créé : "+compte(u)+" droits. Affinez-les ci-dessous.",true);return}
  if(c("#ng-ok")){const nom=$("#ng-nom").value.trim();$("#ng-nom").classList.toggle("bad",!nom);if(!nom){toast("Le nom du groupe est obligatoire.");return}
    const g={id:slug(nom)||"g"+Date.now(),nom,desc:$("#ng-desc").value||"Sans description",mod:"à l'instant",d:{}};const cp=$("#ng-cp").value,md=$("#ng-mod").value;
    if(cp)g.d=clone(G(cp).d);else if(MODELES[md])MODELES[md].forEach(k=>g.d[k]="accorde");
    S.groupes.push(g);ng.membres.forEach(i=>U(i).grp.push(g.id));const mem=ng.membres.slice();journal('<b>Vous</b> avez créé le groupe <b>'+esc(nom)+'</b> ('+mem.length+' membre(s))',()=>{S.groupes=S.groupes.filter(y=>y!==g);mem.forEach(i=>U(i).grp=U(i).grp.filter(y=>y!==g.id))});
    ng={membres:[],modele:"— vide —"};go("g-fiche",{id:g.id,tab:"droits"});toast("Groupe « "+nom+" » créé. Réglez ses droits.",true);return}
  if(x=c("[data-mx]")){ctx.mode=x.dataset.mx;render();return}
  if(x=c("[data-cell]")){const[m,i,mode]=x.dataset.cell.split("|");q=MODS.find(k=>k.id===m).nom.toLowerCase();filtre="tous";ouvert=true;go(mode==="g"?"g-fiche":"u-fiche",{id:i,tab:"droits"});return}
  if(c("#undo-last")){const f=S.pile.pop();f&&f();S.log.shift();toast("Dernier changement défait.");render();return}
  if(c("#toast-undo")){const f=S.pile.pop();if(f){f();S.log.unshift({t:new Date(),txt:"<b>Vous</b> avez défait le dernier changement",undo:false});toast("Défait.");render()}return}
  if(c("#theme")){const r=document.documentElement;const d=getComputedStyle(r).colorScheme==="dark"||r.dataset.theme==="dark";r.dataset.theme=d?"light":"dark";return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="r-q"){q=e.target.value.toLowerCase();const p=e.target.selectionStart;render();const n=$("#r-q");n.focus();n.setSelectionRange(p,p)}
  if(e.target.id==="u-q")filtrerListe();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="tpl"&&t.selectedIndex>0){const r=MODELES[t.value];DROITS.forEach(d=>draft[d.id]=r.includes(d.id)?"accorde":"herite");toast("Modèle « "+t.value+" » préparé : rien n'est appliqué avant validation.");render()}
  if(t.id==="cpy"&&t.selectedIndex>0){const s=U(t.value);DROITS.forEach(d=>draft[d.id]=s.prop[d.id]||"herite");toast("Droits de "+s.nom+" préparés : rien n'est appliqué avant validation.");render()}
  if(t.id==="nu-mod"){nu.modele=t.value;$("#nu-apercu").innerHTML="<b>Aperçu des droits obtenus</b> — "+aperçuNu()}
  if(t.id==="nu-type"){nu.type=t.value;$("#nu-apercu").innerHTML="<b>Aperçu des droits obtenus</b> — "+aperçuNu()}
  if(t.id==="qui-d"){ctx.droit=t.value;render()}
});
function demo(k){
  draft={};drG={};admDraft=null;filtre="tous";q="";
  if(k==="refus"){go("u-fiche",{id:"julien",tab:"droits"});draft["fac.valider"]="refuse";render();setTimeout(()=>{$(".mod[data-m=fac]").classList.add("open")},0);toast("Julien : « Valider les paiements » refusé, alors que Comptabilité l'accorde. Cliquez Appliquer.")}
  if(k==="groupe"){go("g-fiche",{id:"support",tab:"droits"});drG["fac.lire"]="accorde";render();$(".mod[data-m=fac]").classList.add("open");toast("Support reçoit « Consulter les factures » : voyez combien de membres en profitent. Appliquez, puis ouvrez Sarah.")}
  if(k==="creer"){go("u-new")}
  if(k==="groupenew"){go("g-new")}
  if(k==="comme")voirComme("sarah");
  if(k==="qui")go("qui",{droit:"sit.suppr"});
}
render();
</script>
</body>
