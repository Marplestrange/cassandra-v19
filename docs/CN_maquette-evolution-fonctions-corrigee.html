<title>Maquette · Évolution · Les fonctions (version corrigée)</title>
<!--
  VERSION CORRIGÉE de « Les fonctions », à comparer avec CN_maquette-evolution-fonctions-actuelle.html (la page d'aujourd'hui, à l'identique).
  Mêmes données réelles d'Argos (05-11), mêmes feuilles de style, même vocabulaire simple que la maquette validée (CN_maquette-evolution-simple.html).
  Ce qui change, point par point :
   1. une liste qui se filtre et se cherche, triée par ce qu'il y a à gagner ;
   2. les 56 fonctions jamais appelées sont repliées : elles ne servent à rien ici ;
   3. un vrai retour après une recherche : ce qui a été essayé, ce que ça a coûté, où trouver le résultat ;
   4. les cartes « non branché » et l'argumentaire sont retirés de la page (une ligne renvoie vers « Ce qui est prévu ») ;
   5. le vocabulaire interne (pièce, EC, tombe, lignée, contrat de rejeu, mutateur…) devient des mots simples ; le détail technique reste, replié.
  Les boutons sont vivants. « Chercher une amélioration » simule une recherche (aucun serveur) : sur planifie.decrire avec un modèle, elle en « trouve » une pour montrer l'écran de réussite.
-->

    racine.querySelectorAll("[data-part]").forEach((b) => b.addEventListener("click", () => { S.part = +b.dataset.part; dessiner(); }));

    racine.querySelectorAll("[data-vers]").forEach((b) => b.addEventListener("click", () => alert("Maquette : ici, on ouvrirait « " + b.dataset.vers + " » dans le menu de gauche.")));
    const d = racine.querySelector("details.repli"); if (d) d.addEventListener("toggle", () => { S.ouvertMuets = d.open; });
  }

  const MENU = [["Évolution", 0, "⚘"], ["Aujourd’hui", 1, "☼"], ["Améliorations", 1, "↗"], ["Réglages", 1, "◈"], ["Consignes et seuils", 1, "✎"], ["Sous le capot", 1, "⚙"], ["Les chercheurs", 2, "⊙"], ["Les fonctions", 2, "ƒ"], ["Les comparer", 2, "⇄"], ["Installer un chercheur", 2, "⤓"], ["Filet de sécurité", 2, "⛨"], ["Carnet", 2, "▤"], ["Versions écartées", 2, "⊘"], ["Ce qui est prévu", 2, "✦"], ["Vocabulaire", 2, "Aa"]];
  document.getElementById("mq-menu").innerHTML = MENU.map((m) => '<div class="t s' + m[1] + (m[0] === "Les fonctions" ? " on" : "") + '"><span class="g">' + m[2] + "</span>" + m[0] + "</div>").join("");
  dessiner();
})();
</script>
