<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cassandra V19 · Billetterie</title>
<style>
:root{
  --sol:#eef1f5; --halo:#e3eaf2; --verre:rgba(255,255,255,.68); --verre-fort:rgba(255,255,255,.9);
  --encre:#101828; --encre-2:#475467; --encre-3:#7a8594; --filet:rgba(16,24,40,.09);
  --accent:#0b7c74; --accent-doux:rgba(11,124,116,.10); --accent-encre:#ffffff;
  --ok:#047857; --ok-doux:rgba(4,120,87,.10); --alerte:#b45309; --alerte-doux:rgba(180,83,9,.11); --danger:#be123c; --danger-doux:rgba(190,18,60,.10);
  --ombre:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --mono:ui-monospace,Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sol:#0d1117; --halo:#12202c; --verre:rgba(26,33,44,.68); --verre-fort:rgba(30,38,50,.92);
  --encre:#e6ebf2; --encre-2:#aab4c3; --encre-3:#7c889a; --filet:rgba(230,235,242,.10);
  --accent:#34b3a8; --accent-doux:rgba(52,179,168,.14); --accent-encre:#06201d;
  --ok:#3ecf9a; --ok-doux:rgba(62,207,154,.12); --alerte:#e7a14c; --alerte-doux:rgba(231,161,76,.13); --danger:#ff6b8b; --danger-doux:rgba(255,107,139,.12);
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --sol:#0d1117; --halo:#12202c; --verre:rgba(26,33,44,.68); --verre-fort:rgba(30,38,50,.92);
  --encre:#e6ebf2; --encre-2:#aab4c3; --encre-3:#7c889a; --filet:rgba(230,235,242,.10);
  --accent:#34b3a8; --accent-doux:rgba(52,179,168,.14); --accent-encre:#06201d;
  --ok:#3ecf9a; --ok-doux:rgba(62,207,154,.12); --alerte:#e7a14c; --alerte-doux:rgba(231,161,76,.13); --danger:#ff6b8b; --danger-doux:rgba(255,107,139,.12);
  --ombre:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 var(--sans);color:var(--encre);background:radial-gradient(1100px 560px at 85% -8%,var(--halo),transparent),var(--sol);min-height:100vh}
.page{max-width:1120px;margin:0 auto;padding:16px 16px 72px}
.verre{background:var(--verre);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-radius:16px;box-shadow:var(--ombre);border:1px solid var(--filet)}
h1,h2,h3{margin:0}
h2{font-size:16px} h3{font-size:14px}
.sous{color:var(--encre-3);font-size:13px;margin:2px 0 14px}
.sp{flex:1}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barre haute */
.haut{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
.marque{font-weight:700}
.marque small{display:block;font-weight:500;color:var(--encre-3);font-size:11px;line-height:1.1}
.roles{display:flex;gap:4px;background:var(--filet);padding:4px;border-radius:12px;overflow-x:auto}
.roles button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--encre-2);white-space:nowrap;font-weight:600;font-size:14px}
.roles button[aria-selected="true"]{background:var(--verre-fort);color:var(--encre);box-shadow:var(--ombre)}
.roles button i{font-style:normal;opacity:.65;font-weight:500;font-size:11px;display:block;line-height:1}

/* éléments communs */
.pastille{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--accent-doux);color:var(--accent);font-weight:600;white-space:nowrap}
.pastille.ok{background:var(--ok-doux);color:var(--ok)} .pastille.al{background:var(--alerte-doux);color:var(--alerte)} .pastille.da{background:var(--danger-doux);color:var(--danger)} .pastille.gr{background:var(--filet);color:var(--encre-2)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 var(--ok)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}*{transition:none!important}}
.btn{border:1px solid var(--filet);background:var(--verre-fort);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-encre);border-color:transparent}
.btn.da{color:var(--danger)}
.btn.pt{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.onglets{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}
.onglets button{flex:none;border:1px solid var(--filet);background:var(--verre);color:var(--encre-2);padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14px}
.onglets button[aria-selected="true"]{background:var(--verre-fort);border-color:var(--accent);color:var(--encre);box-shadow:var(--ombre)}
.onglets button b{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;margin-left:6px}
.tuiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tuile{padding:15px}
.tuile .l{font-size:11px;color:var(--encre-3);text-transform:uppercase;letter-spacing:.6px}
.tuile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tuile .n{font-size:12px;color:var(--encre-2)}
.tuile.fort{background:var(--accent);color:var(--accent-encre)} .tuile.fort .l,.tuile.fort .n{color:inherit;opacity:.85}
.grille{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
.pile{display:grid;gap:14px}
.bloc{padding:18px}
.barre{height:9px;background:var(--filet);border-radius:99px;overflow:hidden;margin:6px 0 3px}
.barre i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.rangee{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--encre-2)}
.rangee b{color:var(--encre)}
.tab{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-align:left;color:var(--encre-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--filet);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--filet);vertical-align:middle}
.m{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.flux{list-style:none;margin:0;padding:0;max-height:250px;overflow:auto}
.flux li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--filet);font-size:14px}
.flux time{color:var(--encre-3);font-size:12px;min-width:42px}
.flux .plus{margin-left:auto;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.aide{font-size:13px;color:var(--encre-2);background:var(--alerte-doux);border-radius:10px;padding:10px 12px;margin-top:12px}
.aide.info{background:var(--accent-doux)}
.champ{display:grid;gap:4px;margin-bottom:12px}
.champ label{font-size:12px;color:var(--encre-3);font-weight:600}
.champ input,.champ select{border:1px solid var(--filet);background:var(--verre-fort);padding:9px 10px;border-radius:10px;width:100%}
.champ input[readonly]{background:var(--filet);color:var(--encre-2)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.inter{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--filet)}
.inter:last-child{border-bottom:0}
.inter .t{flex:1;min-width:0} .inter .t small{display:block;color:var(--encre-3);font-size:12px}
.bascule{width:42px;height:24px;border-radius:99px;background:var(--filet);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.bascule::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.bascule[aria-checked="true"]{background:var(--accent)} .bascule[aria-checked="true"]::after{transform:translateX(18px)}
.sch{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}
.sch i{flex:1;background:var(--accent);opacity:.75;border-radius:5px 5px 2px 2px;min-height:4px}
.sch i:last-child{opacity:1}
.evt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--filet)}
.evt:last-child{border-bottom:0}
.evt small{color:var(--encre-3)}

/* QR factice */
.qr{display:block;border-radius:8px;background:#fff;padding:5px;border:1px solid var(--filet)}

/* boutique */
.hero{padding:26px 22px;border-radius:18px;background:linear-gradient(135deg,var(--accent),#17406b);color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:28px;line-height:1.15;max-width:520px}
.hero p{margin:6px 0 0;opacity:.9}
.hero .vend{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);padding:5px 12px;border-radius:99px;font-size:12px}
.etapes{display:flex;gap:8px;margin:16px 0 14px;font-size:13px;color:var(--encre-3);flex-wrap:wrap}
.etapes span{display:flex;align-items:center;gap:6px}
.etapes em{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--filet);font-weight:700;font-size:12px}
.etapes .ici{color:var(--encre);font-weight:600} .etapes .ici em{background:var(--accent);color:var(--accent-encre)} .etapes .fait em{background:var(--ok);color:#fff}
.billet{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--filet)}
.billet:last-child{border-bottom:0}
.billet .t{flex:1;min-width:0} .billet .t small{display:block;color:var(--encre-3);font-size:12px}
.pas{display:flex;align-items:center;gap:2px;background:var(--filet);border-radius:10px;padding:2px}
.pas button{width:32px;height:32px;border:0;border-radius:8px;background:var(--verre-fort);cursor:pointer;font-size:18px;line-height:1}
.pas output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.choix{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choix label{display:flex;align-items:center;gap:10px;border:1px solid var(--filet);background:var(--verre-fort);border-radius:12px;padding:11px 12px;cursor:pointer}
.choix label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choix input{accent-color:var(--accent)}
.choix small{display:block;color:var(--encre-3);font-size:12px}
.total{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.don{display:flex;gap:12px;align-items:center;background:var(--ok-doux);border-radius:12px;padding:12px;margin-top:12px}
.don .t{flex:1;font-size:13px}
.ok-gros{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:28px;margin:0 auto 10px}

/* client */
.carte-billet{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;align-items:center}
.carte-billet h3{font-size:15px}
.carte-billet .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pied{margin-top:26px;font-size:12px;color:var(--encre-3);text-align:center}
.cartouche{font-size:12px;color:var(--encre-2);background:var(--accent-doux);border-radius:12px;padding:8px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dialog{border:0;padding:0;background:transparent;width:min(580px,calc(100vw - 24px));max-width:none;color:var(--encre)}
dialog::backdrop{background:rgba(10,15,25,.5);backdrop-filter:blur(3px)}
.dlg{background:var(--sol);border:1px solid var(--filet);border-radius:18px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);max-height:88vh;overflow:auto}
.pied-dlg{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.papier{background:#fff;color:#101828;border-radius:10px;padding:20px;font-size:13px;line-height:1.5;border:1px solid #d6dbe3;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.papier table{width:100%;border-collapse:collapse;margin:10px 0}.papier th{color:#586274;border-bottom:1px solid #d6dbe3}.papier td{border-bottom:1px solid #eceff4;padding:6px 8px}
.papier hr{border:0;border-top:1px solid #d6dbe3;margin:12px 0}
.papier .bandeau{background:#101828;color:#fff;border-radius:8px;padding:10px 14px;margin:-6px -6px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#101828;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:calc(100vw - 32px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;text-transform:uppercase;color:var(--encre-3);text-align:center;padding:2px 0}
.cal .j{min-height:70px;border:1px solid var(--filet);border-radius:10px;padding:4px;font-size:12px;background:var(--verre-fort);min-width:0}
.cal .j.vide{background:transparent;border-color:transparent}
.cal .j.auj{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .ev{display:block;width:100%;text-align:left;margin-top:3px;padding:3px 6px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-encre);font-size:11px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.passe{background:var(--filet);color:var(--encre-2)}
.avat{width:40px;height:40px;border-radius:50%;background:var(--accent-doux);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.datebadge{width:56px;flex:none;text-align:center;border-radius:12px;background:var(--accent-doux);color:var(--accent);padding:6px 0;line-height:1.1}
.datebadge b{display:block;font-size:22px}
.page{max-width:none;padding:0}
.nav-fleches{display:flex;gap:2px}.nav-f{width:26px;height:30px;border:0;background:transparent;color:var(--encre-3);font-size:20px;cursor:pointer;border-radius:8px}.nav-f:disabled{opacity:.35;cursor:default}
.sb-hors{opacity:.55}
.it-fab{position:fixed;right:18px;bottom:18px;z-index:40;display:none;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-encre);font-weight:600;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.28);cursor:pointer}
body.role-titulaire .it-fab{display:flex}body.it-ouvert .it-fab{display:none}
.it-fab .nb{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.it-dr{position:fixed;top:52px;right:0;bottom:0;width:420px;max-width:100vw;z-index:35;background:var(--sol);border-left:1px solid var(--filet);box-shadow:-14px 0 40px rgba(0,0,0,.18);display:none;flex-direction:column}
body.role-titulaire.it-ouvert .it-dr{display:flex}
@media (min-width:1100px){body.role-titulaire.it-ouvert .corps{padding-right:420px}}
@media (max-width:700px){.it-dr{top:0;width:100%;border-left:0}}
.it-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--filet)}
.it-h b{font-size:15px}
.it-pal{display:inline-flex;background:var(--filet);border-radius:10px;padding:2px;margin-left:6px}.it-pal button{border:0;background:transparent;padding:4px 8px;border-radius:8px;font-size:11px;cursor:pointer;color:var(--encre-2)}.it-pal button.on{background:var(--verre-fort);color:var(--encre);box-shadow:var(--ombre);font-weight:600}
.it-fil{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.itm{display:flex;flex-direction:column;max-width:94%}.itm.me{align-self:flex-end;align-items:flex-end}.itm.it{align-self:flex-start}
.itb{padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;background:var(--filet)}.itm.me .itb{background:var(--accent);color:var(--accent-encre)}
.ith{font:10px var(--mono);color:var(--encre-3);margin:2px 6px 0}
.it-card{margin-top:8px;display:grid;gap:6px;background:var(--sol);border:1px solid var(--filet);border-radius:12px;padding:8px 10px;color:var(--encre)}
.it-row{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:12.5px}.it-row b{font-family:var(--mono)}
.it-av{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px}.it-av s{color:var(--encre-3)}
.it-step{border-top:1px dashed var(--filet);padding-top:6px}.it-step:first-child{border-top:0;padding-top:0}
.it-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.it-chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 0}.it-chips button,.itm .it-chips button{font-size:12px;padding:5px 10px}
.it-comp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--filet)}
.it-comp textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--filet);background:var(--verre-fort);padding:9px 11px;border-radius:12px;color:inherit;font:inherit;font-size:14px}
.it-typing{display:flex;gap:4px;padding:12px 14px}.it-typing i{width:7px;height:7px;border-radius:50%;background:var(--encre-3);animation:itb 1s infinite}.it-typing i:nth-child(2){animation-delay:.15s}.it-typing i:nth-child(3){animation-delay:.3s}
body.it-ouvert .ens-2,body.it-ouvert .ens-2b{grid-template-columns:minmax(0,1fr)}
#itare-q{min-width:0}
@media (max-width:700px){.header{gap:6px;padding:6px 8px}.header .marque{gap:6px;min-width:0}.header .status{gap:6px}.nav-fleches,.logo-badge,#theme,.sr-etat{display:none!important}.logo{letter-spacing:.06em;font-size:14px}.marque-toit svg{width:20px;height:20px}.av-btn{padding:2px 6px 2px 2px}}
.grille>*,.pile>*,.deux>*,.ens>*,.pile,.bloc{min-width:0}.bloc{max-width:100%}.bloc h2,.bloc h3{overflow-wrap:anywhere}
.tablo{overflow-x:auto;max-width:100%}.tablo table{width:100%;border-collapse:collapse}.tablo th,.tablo td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--filet);vertical-align:top;font-size:13px}
@keyframes itb{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ens{display:grid;gap:14px}.ens>*{min-width:0}
.ens-2{display:grid;gap:14px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.ens-2b{display:grid;gap:14px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:980px){.ens-2,.ens-2b{grid-template-columns:minmax(0,1fr)}}

/* ---- formules ---- */
function formule(id){var f=S.fo.filter(function(x){return x.id==id})[0];return f||{id:"",ref:"",nom:"Aucune formule",role:"aucune",forfait:0,com:0,cachet:0,palier:false,palierN:0,palierCom:0,note:""}}
function formuleDe(e,id){return (e&&e.fsnap&&e.fsnap[id])||formule(id)}
function comParPlaces(f,n){return (f.palier?f.com*Math.min(n,f.palierN)+f.palierCom*Math.max(0,n-f.palierN):f.com*n)+(n>0&&f.role=="independant"?(f.fixe||0):0)}
function condTxt(f){if(f.role=="artiste")return "Forfait "+eur(f.forfait)+" + "+eur(f.com)+" par place";if(f.role=="independant")return "Cachet artiste "+eur(f.cachet)+" · revendeur "+eur(f.com)+" par place"+(f.palier?", "+eur(f.palierCom)+" au-delà de "+f.palierN:"");return "Aucune rémunération"}
function remArt(a){return condTxt(formule(a.formule))}
function usesIn(e,id){return e.art.some(function(x){return x.f==id})||e.vend.some(function(v){return v.f==id})}
function figer(id){S.events.forEach(function(e){if((e.vendus>0||e.passe)&&usesIn(e,id)){e.fsnap=e.fsnap||{};if(!e.fsnap[id])e.fsnap[id]=JSON.parse(JSON.stringify(formule(id)))}})}
function usage(id){var u={art:S.artistes.filter(function(a){return a.formule==id}),rows:0,aff:0,evts:[],figes:0};S.events.forEach(function(e){var r=e.art.filter(function(x){return x.f==id}).length,a=e.vend.filter(function(v){return v.f==id}).length;u.rows+=r;u.aff+=a;if(r||a){u.evts.push(e);if(e.vendus>0||e.passe)u.figes++}});return u}
function fPast(id){var f=formule(id);return f.role=="artiste"?pastille(f.nom+" · vendeur",1):f.role=="independant"?pastille(f.nom+" · ne vend pas",3):pastille("aucune formule",2)}
function optsFormules(role){return S.fo.filter(function(f){return !role||f.role==role}).map(function(f){return [f.id,f.nom]})}
function formulesDe(v){if(v.type=="artiste")return esc(formule(v.art.formule).nom);var ids=[];S.events.forEach(function(e){e.vend.forEach(function(x){if(x.r==v.nom&&ids.indexOf(x.f)<0)ids.push(x.f)})});return ids.length?ids.map(function(i){return esc(formule(i).nom)}).join(", "):"aucune pour l’instant"}
function leaComN(id,n){var e=ev(id),rest=n,tot=0;e.vend.filter(function(v){return v.r==S.lea.nom}).forEach(function(v){var take=Math.min(rest,v.quota);if(take>0){tot+=comParPlaces(formuleDe(e,v.f),take);rest-=take}});return tot}
function leaCom(id){return leaComN(id,S.lea.vendus[id]||0)}
function comMarg(id,k){var n=S.lea.vendus[id]||0;return leaComN(id,n+k)-leaComN(id,n)}
function leaDispo(){return S.events.filter(function(e){return e.passe}).reduce(function(a,e){return a+leaCom(e.id)},0)-S.lea.retraitPris|0}
function leaAtt(){return S.events.filter(function(e){return !e.passe}).reduce(function(a,e){return a+leaCom(e.id)},0)}
function leaFormules(id){return ev(id).vend.filter(function(v){return v.r==S.lea.nom})}
function estRemun(e){var vend=e.art.filter(function(x){return formuleDe(e,x.f).role=="artiste"}).length+e.vend.length,n=vend?e.quota/vend:0,tot=0;
  e.art.forEach(function(x){var f=formuleDe(e,x.f);tot+=f.role=="artiste"?f.forfait+f.com*n:f.role=="cachet"?f.forfait:0});
  e.vend.forEach(function(v){tot+=comParPlaces(formuleDe(e,v.f),Math.min(v.quota,n))});return Math.round(tot)}

function dolPayload(ref){
  var o,c,r;
  if(ref.indexOf("EVT")==0){var ev1=S.events.filter(function(x){return x.ref==ref})[0];o=projPayload(ev1)}
  else if(ref.indexOf("ART")==0){var a0=S.artistes.filter(function(x){return x.ref==ref})[0],mor=a0.statut=="Association"||a0.statut=="Société",sup=S.dol[a0.revRef];
    o={login:ref.toLowerCase(),morphy:mor?"mor":"phy",typeid:"Artiste",firstname:a0.prenom,lastname:a0.famille||a0.scene,societe:mor?a0.legal:"",email:a0.mail,phone:a0.tel,address:a0.adresse,zip:a0.cp,town:a0.ville,country_code:a0.pays,datefin:a0.datefin||null,statut:1,public:0,fk_soc:sup?sup.id:null,ref_ext:ref}}
  else if(ref.indexOf("CLI")==0){c=S.clients.filter(function(x){return x.ref==ref})[0];
    o={name:c.nom,client:1,fournisseur:0,code_client:"auto",email:c.mail,phone:c.tel,address:c.adresse,zip:c.cp,town:c.ville,country_code:c.pays,typent_code:c.type=="particulier"?"TE_PRIVATE":"TE_SMALL",idprof1:siren(c.siret),idprof2:nett(c.siret),idprof3:c.ape||"",tva_intra:c.tva,default_lang:c.lang,no_email:c.consent=="oui"?0:1,ref_ext:ref,status:1}}
  else if(rpDe(ref)){o=supplierPayload(rpDe(ref))}
  else{var nom="",mail="";
    if(ref==S.lea.ref){nom=S.lea.nom;mail=S.lea.mail}
    S.vendeurs.forEach(function(v){if(v.ref==ref){nom=v.nom;mail=(S.vm[v.nom]||{}).mail||""}});
    S.artistes.forEach(function(a){if(a.ref==ref||a.revRef==ref){nom=a.legal||a.scene;mail=a.mail}});
    o={name:nom,client:0,fournisseur:1,code_fournisseur:"auto",email:mail,country_code:"FR",typent_code:"TE_PRIVATE",ref_ext:ref,status:1}}
  return JSON.stringify(o,null,2);
}

/* =================== PRÉREQUIS RÉELS DE DOLIBARR (LUS SUR L'INSTANCE ET DANS SON CODE) =================== */
/* Instance (18-10-2026): société en France et assujettie à la TVA; SOCIETE_IDPROF1/2/3_MANDATORY = 1 (SIREN, SIRET, APE exigés pour une société du même pays);

   projets: référence automatique, tiers non exigé. */
function nett(v){return String(v||"").replace(/\s+/g,"")}
function siren(s){return nett(s).slice(0,9)}
function siretOk(s){return /^\d{14}$/.test(nett(s))}
function mailOk(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim())}
function estPro(o){return o.type?o.type!="particulier":o.statut?o.statut!="Particulier":false}
function prereqTiers(o){var nom=o.nom||o.scene||(o.famille!==undefined?rpNom(o):""),b=[],r=[];
  if(!String(nom||"").trim())b.push("nom");
  if(estPro(o)||nett(o.tva)){if(!siretOk(o.siret))b.push("SIRET (14 chiffres)");if(!nett(o.ape))b.push("code APE/NAF")}
  if(!o.mail)r.push("courriel");if(!o.adresse)r.push("adresse");if(!o.pays)r.push("pays");
  return {bloc:b,reco:r}}
function prereqAdh(a){var b=[],r=[];if(!mailOk(a.mail))b.push("courriel valide");if(!(a.famille||a.legal||a.scene))b.push("nom ou société");if(!a.adresse)r.push("adresse");if(!a.datefin)r.push("fin d’adhésion");return {bloc:b,reco:r,info:"le type de membre « Artiste » est créé à la première association"}}
function prereqProjet(e){var b=[];if(!String(e.nom||"").trim())b.push("titre");return {bloc:b,reco:e.iso?[]:["date exacte"]}}
function prereqPour(ref,kind){ref=String(ref||"");
  if(ref.indexOf("CLI")==0)return prereqTiers(S.clients.filter(function(x){return x.ref==ref})[0]||{});
  if(ref.indexOf("EVT")==0)return prereqProjet(S.events.filter(function(x){return x.ref==ref})[0]||{});
  if(ref.indexOf("ART")==0){var a=S.artistes.filter(function(x){return x.ref==ref})[0]||{};return kind=="adherents"?prereqAdh(a):prereqTiers(a)}
  if(ref.indexOf("REV")==0){var r=rpDe(ref);if(r)return prereqTiers(r);var a2=S.artistes.filter(function(x){return x.revRef==ref})[0];return a2?prereqTiers(a2):{bloc:[],reco:[]}}
  return {bloc:[],reco:[]}}
function bannerPrereq(ref){var k=ref.indexOf("ART")==0?"adherents":ref.indexOf("EVT")==0?"projets":"tiers",p=prereqPour(ref,k);
  return p.bloc.length?'<div class="aide" style="background:var(--danger-doux);margin-bottom:10px"><b>Dolibarr refuserait cette création</b> (règles lues sur l’instance Dolibarr): manque <b>'+p.bloc.join(", ")+'</b>.</div>':'<div class="aide info" style="margin-bottom:10px">Cette fiche respecte les règles lues sur l’instance Dolibarr Dolibarr.'+(p.reco.length?' Recommandé: '+p.reco.join(", ")+'.':'')+'</div>'}
function rpManque(r){var p=prereqTiers(r),m=p.bloc.slice();if(!r.adresse)m.push("adresse");if(!r.pays)m.push("pays");if(r.tvaAssuj=="oui"&&!r.tva)m.push("n° de TVA");if(!r.iban)m.push("IBAN");return m}
function dolBloc(ref,kind){
  if(!dolOk(kind))return '<div class="aide info">Mode autonome pour ce domaine: aucune association Dolibarr. L’identifiant <b>'+ref+'</b> reste la référence.</div>';
