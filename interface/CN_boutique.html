<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Billetterie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f766e' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 9a2 2 0 002-2h14a2 2 0 002 2v1.5a1.5 1.5 0 000 3V15a2 2 0 00-2 2H5a2 2 0 00-2-2v-1.5a1.5 1.5 0 000-3z'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f7f6;--carte:#fff;--ligne:#d9e3e0;--ligne-forte:#b4c6c1;--txt:#16302c;--doux:#4b6661;--pale:#6f8782;--accent:#0f766e;--sur-accent:#fff;--ok:#15803d;--alerte:#b45309;--danger:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0d1917;--carte:#152623;--ligne:#2a403c;--ligne-forte:#3b5650;--txt:#dbe9e6;--doux:#9db8b3;--pale:#7a948f;--accent:#2dd4bf;--sur-accent:#06201c;--ok:#4ade80;--alerte:#fbbf24;--danger:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
a{color:var(--accent)}
header.haut{padding:14px 16px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.haut a.marque{font-weight:700;font-size:18px;color:var(--txt);text-decoration:none}
header.haut nav{margin-left:auto;display:flex;gap:14px;font-size:14px}
main{max-width:860px;margin:0 auto;padding:16px 16px 56px;display:grid;gap:16px}
h1{font-size:26px;line-height:1.2;margin:4px 0 0}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
p{margin:0}.doux{color:var(--doux)}.pale{color:var(--pale);font-size:13px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:16px}
.grille{display:grid;gap:12px}
.evt{display:grid;gap:6px;text-decoration:none;color:inherit}.evt:hover,.evt:focus-visible{border-color:var(--accent)}
.evt .titre{font-size:19px;font-weight:700}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ligne .ext{flex:1;min-width:0}
.puce{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;border:1px solid var(--ligne-forte);color:var(--doux);white-space:nowrap}
.puce.ok{color:var(--ok);border-color:var(--ok)}.puce.alerte{color:var(--alerte);border-color:var(--alerte)}.puce.danger{color:var(--danger);border-color:var(--danger)}
button,.bouton{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--ligne-forte);background:var(--carte);color:var(--txt);padding:11px 18px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
button.principal,.bouton.principal{background:var(--accent);color:var(--sur-accent);border-color:transparent;font-size:17px;padding:14px 20px}
button[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:grid;gap:4px;font-size:14px;color:var(--doux)}
input[type=text],input[type=email],input[type=number],select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--ligne-forte);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:80px}
.champs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.coche{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--doux)}.coche input{margin-top:4px;width:20px;height:20px;flex:none}
.billet{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ligne)}.billet:first-of-type{border-top:0}
.qte{display:flex;align-items:center;gap:6px}.qte button{width:46px;height:46px;padding:0;font-size:22px}.qte output{min-width:32px;text-align:center;font-weight:700;font-size:19px}
.total{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.erreur{color:var(--danger);font-size:14px}.info{border-left:4px solid var(--accent);padding:10px 14px;background:var(--carte);border-radius:8px}
.info.alerte{border-left-color:var(--alerte)}.info.danger{border-left-color:var(--danger)}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:baseline}.prog b{font-variant-numeric:tabular-nums}
.tickets{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ticket{background:#fff;color:#111;border:1px solid #ccd;border-radius:16px;padding:14px;text-align:center;display:grid;gap:4px;justify-items:center}
.ticket svg{width:200px;height:200px;max-width:100%}.ticket .num{font:700 22px ui-monospace,Menlo,monospace}.ticket .code{font:13px ui-monospace,Menlo,monospace;color:#444}
.vide{padding:28px 8px;text-align:center;color:var(--doux)}
footer{max-width:860px;margin:0 auto;padding:0 16px 40px;color:var(--pale);font-size:13px}
.ariane{font-size:14px}
@media print{header.haut,footer,.noprint{display:none!important}body{background:#fff}.carte{border:0;padding:0}.ticket{break-inside:avoid;page-break-inside:avoid;border:1px solid #888}main{max-width:none}}
</style>
</head>
<body>
<header class="haut"><a class="marque" href="#/" id="marque">Billetterie</a><nav><a href="#/">Programmation</a><a href="#/compte" id="lien-compte">Mon compte</a></nav></header>
<main id="app" aria-live="polite"><div class="vide">Chargement…</div></main>
<footer id="pied"></footer>
<script src="/qr.js"></script>
<script src="/boutique.js"></script>
</body>
</html>
